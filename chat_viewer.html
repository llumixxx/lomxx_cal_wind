<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>WIND 알림 및 채팅뷰어</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Nunito:wght@700;800;900&display=swap');

:root {
  --bg:     #faf9ff;
  --bg2:    #f3f0ff;
  --white:  #ffffff;
  --s1:     #f8f7ff;
  --s2:     #f0eeff;
  --border: #e8e3ff;
  --border2:#d4cbff;
  --a1:     #9b87f5;
  --a2:     #f587b8;
  --a3:     #87d4f5;
  --a4:     #f5c887;
  --a5:     #87f5c0;
  --t1:     #3d3560;
  --t2:     #7b72a8;
  --t3:     #b0a8d4;
  --t4:     #d4cff0;
  --ok:     #6dd5a0;
  --err:    #f57878;
  --shadow: 0 4px 24px rgba(155,135,245,.12);
  --shadow2:0 8px 32px rgba(155,135,245,.18);
}

*{box-sizing:border-box;margin:0;padding:0;}

body {
  font-family:'Noto Sans KR',sans-serif;
  background: var(--bg);
  color: var(--t1);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 15px;
}

/* ── 헤더 ── */
.hdr {
  background: var(--white);
  border-bottom: 2px solid var(--border);
  padding: 0 16px;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  box-shadow: var(--shadow);
  position: relative;
}
.hdr::after {
  content:'';
  position:absolute; bottom:-2px; left:0; right:0; height:2px;
  background: linear-gradient(90deg,var(--a1),var(--a2),var(--a3));
}
.hdr-logo {
  font-family:'Nunito',sans-serif;
  font-size:15px; font-weight: 900;
  background: linear-gradient(135deg,var(--a1),var(--a2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  white-space:nowrap;
}
.live-chip {
  display:flex; align-items:center; gap:6px;
  background:var(--s1); border:1.5px solid var(--border);
  border-radius:99px; padding:4px 12px;
  font-size:12px; color:var(--t2); font-weight:700;
}
.ldot {
  width:7px; height:7px; border-radius:50%;
  background:var(--t4); flex-shrink:0;
}
.ldot.on { background:var(--ok); box-shadow:0 0 6px var(--ok); animation:blink 2s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-file {
  font-size:12px; color:var(--t3); flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  cursor:pointer;
}
.hdr-file:hover { color:var(--a1); }
.hdr-cnt {
  font-family:'Nunito',sans-serif;
  font-size:13px; font-weight:800; color:var(--a1);
  white-space:nowrap;
}

/* ── 카드 섹션 ── */
.section {
  background: var(--white);
  border-bottom: 1.5px solid var(--border);
  padding: 7px 14px;
  display: flex; align-items:center; gap:8px;
  flex-shrink:0; flex-wrap:wrap;
  box-shadow: 0 2px 8px rgba(155,135,245,.06);
}

/* ── 버튼 ── */
.btn {
  background: var(--s1);
  border: 1.5px solid var(--border2);
  border-radius: 99px;
  color: var(--t2);
  font-size: 12px; font-weight: 700;
  padding: 5px 13px;
  cursor: pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition: all .15s;
  white-space: nowrap;
  line-height: 1;
}
.btn:hover { background:var(--s2); border-color:var(--a1); color:var(--a1); }
.btn.primary {
  background: linear-gradient(135deg,var(--a1),var(--a2));
  border: none; color:#fff;
  box-shadow: 0 3px 12px rgba(155,135,245,.3);
}
.btn.primary:hover { opacity:.9; box-shadow:0 4px 16px rgba(155,135,245,.4); }

/* 알림 버튼 */
.notif-btn {
  font-size: 12px; padding: 5px 11px;
  border-radius: 99px;
  border: 1.5px solid var(--border2);
  background: var(--s1); color: var(--t3);
  cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  font-weight:700; transition:all .15s; white-space:nowrap;
}
.notif-btn:hover { border-color:var(--a1); color:var(--a1); }
/* 카드/큐브 알림 버튼 색상 */
.notif-btn.card.on { background:linear-gradient(135deg,var(--a1),#8b5cf6); }
.notif-btn.cube.on { background:linear-gradient(135deg,var(--a4),#f59e0b); }
/* 알림 래퍼 */
.notif-wrap { display:inline-flex; align-items:center; gap:0; position:relative; }
/* 카운트 버튼 */
.count-btn {
  min-width:18px; height:18px; padding:0 4px;
  border-radius:99px;
  background:rgba(155,135,245,.15);
  border:1.5px solid rgba(155,135,245,.25);
  color:var(--a1); font-size:11px; font-weight:800;
  cursor:pointer; margin-left:3px;
  font-family:'Noto Sans KR',sans-serif;
  transition:all .15s;
  display:none;
  white-space:nowrap; align-items:center; justify-content:center;
}
.count-btn.active { display:inline-flex; border-color:var(--a1); }
.count-btn.active:not(:empty) { background:var(--a1); color:#fff; }
.notif-btn.on { color:#fff; border:none; }
.notif-btn.on.world { background:linear-gradient(135deg,var(--a1),var(--a3)); box-shadow:0 2px 10px rgba(135,212,245,.4); }
.notif-btn.on.sale  { background:linear-gradient(135deg,var(--a2),var(--a4)); box-shadow:0 2px 10px rgba(245,135,184,.4); }
.notif-btn.on.pet   { background:linear-gradient(135deg,var(--a5),var(--a3)); box-shadow:0 2px 10px rgba(135,245,192,.4); }

.sep { width:1.5px; height:20px; background:var(--border); flex-shrink:0; }

/* 폰트 크기 */
.fs-wrap { display:flex; align-items:center; gap:6px; }
.fs-val {
  font-family:'Nunito',sans-serif; font-weight:900;
  font-size:14px; color:var(--a1);
  min-width:24px; text-align:center;
}
.fs-btn {
  width:24px; height:24px;
  background:var(--s2); border:1.5px solid var(--border2);
  border-radius:50%; cursor:pointer;
  font-size:13px; font-weight:800; color:var(--t2);
  display:flex; align-items:center; justify-content:center;
  transition:all .15s; font-family:'Nunito',sans-serif;
}
.fs-btn:hover { background:var(--a1); border-color:var(--a1); color:#fff; }

/* 입력 */
.input-field {
  background: var(--s1);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 5px 11px;
  display:flex; align-items:center; gap:5px;
  transition:border-color .15s;
}
.input-field:focus-within { border-color:var(--a1); background:var(--white); }
.input-field input {
  background:none; border:none; outline:none;
  color:var(--t1); font-size:13px; width:100%;
  font-family:'Noto Sans KR',sans-serif;
}
.input-field input::placeholder { color:var(--t3); }
.input-field .icon { font-size:14px; flex-shrink:0; }

/* ── 탭 ── */
.tabs {
  background:var(--white);
  border-bottom:1.5px solid var(--border);
  padding:0 14px;
  display:flex; gap:4px;
  flex-shrink:0;
  align-items:flex-end;
}
.tab {
  padding:7px 14px;
  font-size:12px; font-weight:700;
  color:var(--t3); cursor:pointer;
  border-bottom:2.5px solid transparent;
  transition:all .15s; white-space:nowrap;
  border-radius:10px 10px 0 0;
  margin-bottom:-1.5px;
}
.tab:hover { color:var(--t2); background:var(--s1); }
.tab.active {
  color:var(--a1);
  border-bottom-color:var(--a1);
  background:var(--s1);
}

/* 시스템 필터 버튼 */
.sys-toggle {
  margin-left:auto;
  font-size:12px; padding:5px 12px;
  border-radius:99px;
  border:1.5px solid var(--border2);
  background:var(--s1); color:var(--t3);
  cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  font-weight:700; transition:all .15s;
  align-self:center;
}
.sys-toggle.on { background:var(--a1); border-color:var(--a1); color:#fff; }
.sys-toggle:hover { border-color:var(--a1); color:var(--a1); }
.sys-toggle.on:hover { opacity:.85; }

/* ── 채팅 ── */
.chat {
  flex:1; overflow-y:auto;
  padding:12px 12px;
  display:flex; flex-direction:column; gap:3px;
  background:var(--bg);
}
.chat::-webkit-scrollbar { width:5px; }
.chat::-webkit-scrollbar-track { background:transparent; }
.chat::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* ── 메시지 ── */
.msg {
  display:flex; align-items:flex-start;
  padding:3px 8px;
  border-radius:8px;
  transition:background .1s;
  line-height:1.55;
}
.msg:hover { background:transparent; }

.nick {
  font-weight:800; font-size:var(--fsize,15px);
  flex-shrink:0; padding-top:1px;
  min-width:70px; max-width:110px;
  text-align:right;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:'Nunito',sans-serif;
}
.colon { display:none; /* 말풍선모드 */  color:var(--t4); flex-shrink:0; font-size:var(--fsize,15px); margin-top:1px; }
.text  { color:var(--t1); flex:1; word-break:break-all; font-size:var(--fsize,15px); }

/* 타입별 */
.t-wout { background:linear-gradient(90deg,rgba(245,135,184,.06),transparent); border-left-color:rgba(245,135,184,.5); }
.t-wout .nick { color:var(--a2); }
.t-wout .text { color:#c05080; font-style:italic; }

/* ── 인스타 DM 스타일 말풍선 ── */
.t-other, .t-me, .t-win, .t-wout, .t-npc {
  border-left:none; padding:2px 10px; display:flex;
}
/* 상대방 채팅 - 오른쪽 */
.t-other, .t-win, .t-npc { justify-content:flex-end; }
/* 내 채팅 - 왼쪽 */
.t-me, .t-wout { justify-content:flex-start; }

/* 말풍선 래퍼 */
.bubble-wrap {
  display:flex; flex-direction:column; max-width:75%;
}
.bubble-wrap-me { align-items:flex-start; }
.t-other .bubble-wrap, .t-win .bubble-wrap, .t-npc .bubble-wrap { align-items:flex-end; }

/* 닉네임 레이블 */
.nick-label {
  font-size:13px; font-weight:800;
  margin-bottom:4px; padding:0 4px;
  display:inline-block;
  letter-spacing:0.2px;
}
.nick-label.hidden { display:none; }
/* 기본 닉 색상 - 박스 없음 */
.t-other .nick-label { color:var(--t2); }
.t-me    .nick-label { color:var(--a1); }
.t-win   .nick-label { color:var(--a2); }
.t-wout  .nick-label { color:#e84d8a; }
.t-npc   .nick-label { color:var(--a4); }

/* 말풍선 본체 */
.bubble {
  padding:8px 13px;
  font-size:var(--fsize,15px);
  word-break:break-word; line-height:1.5;
}
/* 상대방 - 연보라 배경 */
.t-other .bubble {
  background:linear-gradient(135deg,#e8e4ff,#ede9ff);
  color:var(--t1);
  border-radius:18px 4px 18px 18px;
  box-shadow:0 1px 4px rgba(120,100,200,.15);
}
/* 내 채팅 - 보라 그라데이션 */
.t-me .bubble {
  background:linear-gradient(135deg,var(--a1),#b470f5);
  color:#fff;
  border-radius:4px 18px 18px 18px;
}
/* NPC */
.t-npc .bubble {
  background:#fff3d6;
  color:#7a5a00;
  border-radius:18px 4px 18px 18px;
}
/* 귓속말 받기 - 분홍, 오른쪽 */
.t-win .bubble {
  background:linear-gradient(135deg,#ffd6e8,#ffc2d9);
  color:#a0184a;
  border-radius:18px 4px 18px 18px;
  font-style:italic;
}
/* 귓속말 보내기 - 보라, 왼쪽 */
.t-wout .bubble {
  background:linear-gradient(135deg,#f56ea0,#e84d8a);
  color:#fff;
  border-radius:4px 18px 18px 18px;
  font-style:italic;
}

/* 시스템 */
.t-sys {
  padding:2px 10px 2px 10px;
  border-left:none; border-radius:6px;
  margin:1px 0;
  background:rgba(255,255,255,.03);
}
.t-sys .nick,.t-sys .colon { display:none; /* 말풍선모드 */  display:none; }
.t-sys .text {
  color:rgba(100,90,140,.55);
  font-size:calc(var(--fsize,15px) - 2px);
  font-style:italic;
}
/* 알림성 시스템 - 월경 */
.t-sys-world {
  background:linear-gradient(90deg,rgba(135,212,245,.12),rgba(135,212,245,.03));
  border-left:3px solid var(--a3);
  margin:3px 0; border-radius:8px;
}
.t-sys-world .text { color:#50b8d8; font-style:normal; font-weight:700; font-size:var(--fsize,15px); }
/* 알림성 시스템 - 판매 */
.t-sys-sale {
  background:linear-gradient(90deg,rgba(245,135,184,.12),rgba(245,135,184,.03));
  border-left:3px solid var(--a2);
  margin:3px 0; border-radius:8px;
}
.t-sys-sale .text { color:#e060a0; font-style:normal; font-weight:700; font-size:var(--fsize,15px); }
/* 알림성 시스템 - 정석 포획 */
.t-sys-pstok {
  background:linear-gradient(90deg,rgba(245,200,135,.15),rgba(245,200,135,.03));
  border-left:3px solid var(--a4);
  margin:3px 0; border-radius:8px;
}
.t-sys-pstok .text { color:#c08030; font-style:normal; font-weight:700; font-size:var(--fsize,15px); }
/* 정석 이상 포획 - 특별 강조 */
.t-sys-pstok-above {
  background:linear-gradient(90deg,rgba(255,215,0,.2),rgba(255,180,0,.08),transparent);
  border-left:3px solid #f5a800;
  animation: pstok-shine 1.5s ease infinite alternate;
}
.t-sys-pstok-above .text { color:#a06000; font-size:calc(var(--fsize,15px) + 1px); }
@keyframes pstok-shine {
  from { box-shadow: 0 0 4px rgba(255,200,0,.3); }
  to   { box-shadow: 0 0 10px rgba(255,200,0,.6); }
}
/* 포획 (일반) */
.t-sys-catch {
  background:rgba(135,245,192,.04);
  border-left:2px solid rgba(135,245,192,.3);
  border-radius:6px;
}
.t-sys-catch .text { color:rgba(135,245,192,.55); font-style:italic; font-size:calc(var(--fsize,15px) - 1px); }
/* 찢카 */
.t-sys-card { background:rgba(192,132,245,.04); border-left:2px solid rgba(192,132,245,.25); border-radius:6px; }
.t-sys-card .text { color:rgba(140,100,210,.5); font-size:calc(var(--fsize,15px) - 3px); font-style:italic; }  /* ok */
/* 수큐 */
.t-sys-cube { background:rgba(245,200,135,.04); border-left:2px solid rgba(245,200,135,.25); border-radius:6px; }
.t-sys-cube .text { color:rgba(180,140,50,.5); font-size:calc(var(--fsize,15px) - 3px); font-style:italic; }

.t-alert { background:linear-gradient(90deg,rgba(245,200,135,.15),transparent) !important; border-left-color:var(--a4) !important; }
.t-alert .text { color:#906020 !important; font-weight:800 !important; }

mark { background:rgba(245,200,135,.4); color:#806010; border-radius:3px; padding:0 2px; }

/* ── 빈 상태 ── */
.empty {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:16px; padding:40px; text-align:center;
}
.empty-icon { font-size:52px; }
.empty-title { font-size:18px; font-weight:800; color:var(--t1); }
.empty-sub   { font-size:13px; color:var(--t3); line-height:1.8; }

/* ── 하단 ── */
.footer {
  background:var(--white);
  border-top:1.5px solid var(--border);
  padding:8px 20px;
  display:flex; align-items:center; gap:12px;
  font-size:12px; color:var(--t3);
  flex-shrink:0;
}
.footer-file { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.footer-file:hover { color:var(--a1); }
.footer-cnt { font-family:'Nunito',sans-serif; font-weight:800; color:var(--a1); }

/* ── 닉 색상 모달 ── */
.modal-bg {
  position:fixed; inset:0;
  background:rgba(61,53,96,.4);
  backdrop-filter:blur(4px);
  z-index:9000;
  display:flex; align-items:center; justify-content:center;
}
.modal {
  background:var(--white);
  border:1.5px solid var(--border);
  border-radius:24px;
  padding:24px;
  width:380px; max-height:80vh; overflow-y:auto;
  box-shadow:var(--shadow2);
}
.modal-title {
  font-size:16px; font-weight:800; color:var(--t1);
  margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.nick-row {
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
}
.nick-row input[type=text] {
  flex:1; background:var(--s1); border:1.5px solid var(--border);
  border-radius:10px; color:var(--t1); font-size:13px;
  padding:7px 12px; outline:none; font-family:'Noto Sans KR',sans-serif;
  transition:border-color .15s;
}
.nick-row input[type=text]:focus { border-color:var(--a1); }
.nick-row input[type=color] {
  width:34px; height:34px; border:2px solid var(--border2);
  border-radius:10px; cursor:pointer; padding:2px; background:var(--s1);
}
.nick-row .del { background:var(--s1); border:1.5px solid var(--border);
  border-radius:50%; width:28px; height:28px;
  cursor:pointer; color:var(--t3); font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s; flex-shrink:0; }
.nick-row .del:hover { background:var(--err); border-color:var(--err); color:#fff; }
.modal-add {
  background:var(--s2); border:1.5px dashed var(--border2);
  border-radius:12px; color:var(--a1); font-size:13px; font-weight:700;
  padding:9px; cursor:pointer; text-align:center; margin-top:4px;
  transition:all .15s; font-family:'Noto Sans KR',sans-serif;
}
.modal-add:hover { background:var(--a1); color:#fff; border-style:solid; }
.modal-btns { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }

/* 에러 */
.errbar {
  background:rgba(245,120,120,.08); border-bottom:1.5px solid rgba(245,120,120,.2);
  padding:5px 20px; font-size:12px; color:var(--err);
  display:none; flex-shrink:0;
}

/* ── 토스트 ── */
.toast-wrap {
  position:fixed; top:20px; right:20px;
  display:flex; flex-direction:column; gap:8px;
  z-index:9999; pointer-events:none;
}
.toast {
  background:var(--white);
  border:1.5px solid var(--border2);
  border-radius:14px;
  padding:10px 16px;
  font-size:13px; font-weight:700; color:var(--t1);
  box-shadow:var(--shadow2);
  animation:tIn .3s ease;
  max-width:300px;
}
.toast.world { border-color:var(--a3); color:#3090b0; }
.toast.sale  { border-color:var(--a2); color:#c05080; }
.toast.pet   { border-color:var(--a5); color:#208060; }
.toast.alert { border-color:var(--a4); color:#906020; }
@keyframes tIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ── 카운터 아이템 ── */
.counter-item {
  display:inline-flex; align-items:center; gap:0;
  border-radius:99px; overflow:hidden;
  border:1.5px solid var(--border2);
  background:var(--s1);
  height:30px;
}
.counter-toggle {
  font-size:13px; font-weight:700;
  padding:0 12px; height:100%;
  border:none; background:transparent;
  color:var(--t2); cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all .15s; white-space:nowrap;
}
.counter-toggle:hover { color:var(--a1); background:var(--s2); }
.counter-toggle.on { background:linear-gradient(135deg,var(--a1),#b470f5); color:#fff; }
.counter-num {
  min-width:32px; text-align:center;
  font-size:13px; font-weight:900; color:var(--a1);
  font-family:'Noto Sans KR',sans-serif;
  padding:0 8px;
  border-left:1.5px solid var(--border2);
}
.counter-reset {
  font-size:12px; background:transparent; border:none;
  border-left:1.5px solid var(--border2);
  color:var(--t3); cursor:pointer;
  padding:0 10px; height:100%;
  transition:all .15s;
}
.counter-reset:hover { color:var(--a2); background:rgba(245,135,184,.08); }

/* ── 패널 토글 ── */
#ctrl-panel {
  display:block;
}
#ctrl-panel.collapsed {
  display:none;
}
.hdr-toggle {
  margin-left:auto;
  background:transparent; border:1.5px solid var(--border2);
  color:var(--t2); border-radius:8px;
  padding:3px 10px; font-size:12px; cursor:pointer;
  transition:all .15s; font-family:'Noto Sans KR',sans-serif;
  font-weight:700; white-space:nowrap;
}
.hdr-toggle:hover { border-color:var(--a1); color:var(--a1); }
.hdr-lock {
  background:transparent; border:1.5px solid var(--border2);
  color:var(--t2); border-radius:8px;
  padding:3px 8px; font-size:13px; cursor:pointer;
  transition:all .15s;
}
.hdr-lock:hover { border-color:var(--a4); }
.hdr-lock.locked { border-color:var(--a1); background:var(--s2); }
.hdr-author {
  font-size:10px; color:var(--t3); font-weight:600;
  white-space:nowrap; letter-spacing:0.3px;
  opacity:.7;
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="hdr">
  <div class="hdr-logo">🔔 WIND 채팅뷰어</div>
  <div class="hdr-author">만든이 : 새벽부족 루믹스</div>
  <div class="live-chip">
    <div class="ldot" id="ldot"></div>
    <span id="ltxt">대기중</span>
  </div>
  <div class="hdr-file" id="hfile" onclick="selFolder()" title="클릭하여 폴더 변경">폴더 미지정</div>
  <div class="hdr-cnt" id="hcnt">0줄</div>
  <button class="hdr-toggle" id="panel-toggle" onclick="togglePanel()" title="설정 메뉴 접기/펼치기">▼</button>
</div>

<div id="ctrl-panel">
<!-- 컨트롤 1: 폴더/닉/색상/폰트 -->
<div class="section">
  <button class="btn primary" onclick="selFolder()">📂 폴더 선택</button>
  <div class="sep"></div>

  <div class="input-field" style="min-width:160px;">
    <span class="icon">👤</span>
    <input type="text" id="mynick" placeholder="내 닉네임" onkeydown="if(event.key==='Enter')applyNick()">
    <button onclick="applyNick()" style="background:var(--a1);color:#fff;border:none;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">✓</button>
  </div>

  <button class="btn" onclick="openNickModal()">🎨 닉네임별 색상 지정</button>
  <div class="sep"></div>

  <div class="fs-wrap">
    <div class="fs-btn" onclick="changeFs(-1)">−</div>
    <div class="fs-val" id="fs-val">15</div>
    <div class="fs-btn" onclick="changeFs(1)">+</div>
  </div>
</div>

<!-- 컨트롤 2: 알림 설정 -->
<div class="section" style="flex-wrap:wrap;gap:6px;">
  <span style="font-size:13px;font-weight:700;color:var(--t2);white-space:nowrap;">🔔 알림</span>
  <button class="notif-btn on world" id="btn-world" onclick="toggleNotif('world')">🌐 월경알림</button>
  <button class="notif-btn on sale"  id="btn-sale"  onclick="toggleNotif('sale')">💰 판매알림</button>
  <button class="notif-btn on pet"   id="btn-pet"   onclick="toggleNotif('pet')">🦕 정석알림</button>

  <div class="sep"></div>

  <span style="font-size:13px;font-weight:700;color:var(--t2);white-space:nowrap;">📊 카운팅</span>
  <div class="counter-item">
    <button class="counter-toggle" id="ctog-card" onclick="toggleCounter('card')">🃏 찢카</button>
    <span class="counter-num" id="cnum-card">0</span>
    <button class="counter-reset" onclick="resetCounter('card')" title="초기화">↺</button>
  </div>
  <div class="counter-item">
    <button class="counter-toggle" id="ctog-cube" onclick="toggleCounter('cube')">🎲 수큐</button>
    <span class="counter-num" id="cnum-cube">0</span>
    <button class="counter-reset" onclick="resetCounter('cube')" title="초기화">↺</button>
  </div>

  <div class="sep"></div>
  <div class="input-field" style="flex:1;min-width:160px;">
    <span class="icon">🔔</span>
    <input type="text" id="aw" placeholder="추가 알림단어 (쉼표 구분)" oninput="saveAlert()">
  </div>

  <div class="sep"></div>
  <button onclick="toggleSoundPreview()" id="sound-preview-toggle" style="font-size:12px;font-weight:700;color:var(--t2);white-space:nowrap;background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;">🔊 알람 미리듣기 <span id="sound-preview-arrow">▶</span></button>
  <div id="sound-preview-panel" style="display:none;width:100%;gap:6px;flex-wrap:wrap;align-items:center;">
    <button class="btn" onclick="testBeep('world')"  style="font-size:11px;padding:4px 10px;color:#2a90c0;">🌐 월경</button>
    <button class="btn" onclick="testBeep('sale')"   style="font-size:11px;padding:4px 10px;color:#c0507a;">💰 판매</button>
    <button class="btn" onclick="testBeep('pet')"    style="font-size:11px;padding:4px 10px;color:#c08030;">🦕 정석</button>
    <button class="btn" onclick="testBeep('pet_above')" style="font-size:11px;padding:4px 10px;color:#a06000;">🌟 정석이상</button>
  </div>
</div>
</div>

<!-- 검색 -->
<div class="section" style="padding:6px 14px;">
  <div class="input-field" style="flex:1;">
    <span class="icon">🔍</span>
    <input type="text" id="sq" placeholder="채팅 검색..." oninput="doSearch()">
  </div>
  <button class="notif-btn on world" id="as-btn" onclick="toggleAS()" style="white-space:nowrap;">자동 스크롤 ON</button>
  <button class="btn" id="bottom-btn" onclick="scrollToBottom()" style="white-space:nowrap;">⬇ 최하단</button>
</div>

<!-- 탭 -->
<div class="tabs">
  <div class="tab active" data-f="all"     onclick="setTab(this)">전체</div>
  <div class="tab"        data-f="whisper" onclick="setTab(this)">귓속말</div>
  <div class="tab"        data-f="sys"     onclick="setTab(this)">시스템</div>
  <button class="sys-toggle on" id="sys-toggle" onclick="toggleSys()">시스템 표시</button>
</div>

<div class="errbar" id="errbar"></div>

<!-- 채팅 -->
<div class="chat" id="chat">
  <div class="empty" id="emp">
    <div class="empty-icon">🌸</div>
    <div class="empty-title">채팅 로그 폴더를 선택하세요</div>
    <div class="empty-sub">
      chat 폴더를 선택하면<br>
      가장 최신 TXT 파일을 자동으로 읽어와요<br>
      <span style="color:var(--t4);font-size:12px;">Chrome / Edge 전용 · 1초 갱신</span>
    </div>
    <button class="btn primary" onclick="selFolder()">📂 폴더 선택</button>
  </div>
</div>

<!-- 하단 -->
<div class="footer">
  <div class="footer-file" id="ffile" onclick="selFolder()">폴더 미지정</div>
  <span>표시 <span class="footer-cnt" id="scnt">0</span> / 전체 <span style="color:var(--t2);font-family:'Nunito',sans-serif;font-weight:800;" id="tcnt">0</span></span>
</div>

<!-- 닉 색상 모달 -->
<div class="modal-bg" id="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">🎨 닉네임 색상 설정</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(155,135,245,.2);">
      <span style="font-size:12px;color:var(--a1);font-weight:700;">내 닉네임 색상</span>
      <input type="color" id="my-nick-color" style="width:36px;height:28px;border:none;background:transparent;cursor:pointer;">
      <span style="font-size:11px;color:var(--t3);">다른 사람은 자동 배정</span>
    </div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:8px;">특정 닉네임 색상 고정 (자동배정 덮어씀)</div>
    <div id="nick-list"></div>
    <div class="modal-add" onclick="addNickRow()">+ 닉네임 추가</div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveNickColors()">저장</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast-wrap" id="toast-wrap"></div>

const actx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur, vol=0.3, type='sine', freq2, delay2) {
  try {
    audioCtx_resume();
    const play = (f, d, t) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+d);
      o.start(t); o.stop(t+d);
    };
    const now = actx.currentTime;
    play(freq, dur, now);
    if(freq2) play(freq2, dur, now+(delay2||0.12));
  } catch(e){}
}
function audioCtx_resume() { if(actx.state==='suspended') actx.resume(); }

function beepAlert()  { beep(1046,.08,.3,'sine',1318,.12); }
function playSound(key) {
  try {
    const src = AUDIO_DATA[key];
    if(!src) return;
    const audio = new Audio(src);
    audio.volume = 0.8;
    audio.play().catch(()=>{});
  } catch(e) {}
}

function toggleSoundPreview() {
  const panel = document.getElementById('sound-preview-panel');
  const arrow = document.getElementById('sound-preview-arrow');
  const isOpen = panel.style.display === 'flex';
  panel.style.display = isOpen ? 'none' : 'flex';
  arrow.textContent = isOpen ? '▶' : '▼';
}

const autoNickColorCache = {};
function getAutoNickColor(nick) {
  if(autoNickColorCache[nick]) return autoNickColorCache[nick];
  let hash = 0;
  for(let i=0; i<nick.length; i++) hash = (hash*31 + nick.charCodeAt(i)) >>> 0;
  const c = AUTO_NICK_PALETTE[hash % AUTO_NICK_PALETTE.length];
  autoNickColorCache[nick] = c;
  return c;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function applyMyBubbleColor(color) {
  // 선택 색 기반으로 그라데이션 생성 (조금 밝게)
  const c = hexToRgb(color);
  const light = `rgb(${Math.min(c.r+40,255)},${Math.min(c.g+30,255)},${Math.min(c.b+50,255)})`;
  let styleEl = document.getElementById('my-bubble-style');
  if(!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'my-bubble-style';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = `.t-me .bubble { background: linear-gradient(135deg, ${color}, ${light}) !important; }`;
}

    if(m.type === 'me' || m.type === 'other') {
      const rawNick = m.nick;
      if(myNick && rawNick === myNick) return {...m, type:'me'};
      if(m.type === 'me') return {...m, type:'other'};
    }
    return m;
  });
  rerender();
}

// ── 폴더 ──
// ── IndexedDB 폴더 핸들 저장/복원 ──
function idbOpen() {
  return new Promise((res,rej)=>{
    const r = indexedDB.open('sa-chat',1);
    r.onupgradeneeded = e => e.target.result.createObjectStore('handles');
    r.onsuccess = e => res(e.target.result);
    r.onerror = rej;
  });
}
async function idbSaveFh(handle) {
  try {
    const db = await idbOpen();
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle,'folder');
  } catch(e) {}
}
async function idbLoadFh() {
  try {
    const db = await idbOpen();
    return await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get('folder');
      req.onsuccess = e => res(e.target.result||null);
      req.onerror = rej;
    });
  } catch(e) { return null; }
}
async function tryRestoreFolder() {
  const handle = await idbLoadFh();
  if(!handle) return;
  try {
    // 권한 확인/요청
    const perm = await handle.queryPermission({mode:'read'});
    if(perm === 'granted') {
      fh = handle;
      setErr(''); lastCnt=0; allMsgs=[]; curFile='';
      document.getElementById('hfile').textContent = handle.name;
      startPoll();
    } else {
      // 권한 없으면 버튼에 안내
      document.getElementById('hfile').textContent = '📂 클릭하여 재연결: '+handle.name;
      document.getElementById('hfile').onclick = async ()=>{ await selFolderWithHandle(handle); };
      document.querySelector('.btn.primary[onclick="selFolder()"]').textContent = '📂 재연결: '+handle.name;
    }
  } catch(e) {}
}
async function selFolderWithHandle(handle) {
  try {
    const perm = await handle.requestPermission({mode:'read'});
    if(perm === 'granted') {
      fh = handle;
      document.getElementById('hfile').textContent = handle.name;
      document.getElementById('hfile').onclick = ()=>selFolder();
      document.querySelector('.btn.primary').textContent = '📂 폴더 선택';
      setErr(''); lastCnt=0; allMsgs=[]; curFile='';
      startPoll();
    }
  } catch(e) {}
}
async function selFolder() {
  if(!window.showDirectoryPicker) { alert('Chrome/Edge에서만 동작해요.'); return; }
  try {
    fh = await window.showDirectoryPicker({mode:'read'});
    await idbSaveFh(fh);
    document.getElementById('hfile').textContent = fh.name;
    document.getElementById('emp').style.display='none';
    setErr(''); lastCnt=0; allMsgs=[]; curFile='';
    startPoll();
  } catch(e) { if(e.name!=='AbortError') setErr(e.message); }
}

function startPoll() {
  if(pollTimer) clearInterval(pollTimer);
  readLatest(); pollTimer = setInterval(readLatest, 1000);
  setLive(true);
}

async function readLatest() {
  if(!fh) return;
  try {
    let latest=null, latestName='';
    for await(const [name,handle] of fh.entries()) {
      if(handle.kind==='file' && name.toUpperCase().endsWith('.TXT')) {
        if(name.toUpperCase() > latestName.toUpperCase()) { latestName=name; latest=handle; }
      }
    }
    if(!latest) { setErr('TXT 파일 없음'); return; }
    setErr('');
    if(latestName!==curFile) { curFile=latestName; lastCnt=0; allMsgs=[]; }

    const file = await latest.getFile();
    const buf  = await file.arrayBuffer();
    const text = new TextDecoder('euc-kr').decode(buf);
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length <= lastCnt) return;

    const newMsgs = lines.slice(lastCnt).map(parseLine).filter(Boolean);
    lastCnt = lines.length;
    allMsgs = allMsgs.concat(newMsgs);

    document.getElementById('hcnt').textContent = lastCnt+'줄';
    document.getElementById('hfile').textContent = `${fh.name} / ${curFile}`;
    document.getElementById('ffile').textContent = `${fh.name} / ${curFile} (${lastCnt}줄)`;
    document.getElementById('tcnt').textContent = allMsgs.length;

    appendMsgs(newMsgs);
    checkAlerts(newMsgs);
  } catch(e) { setErr('읽기 오류: '+e.message); }
}

// ── 파싱 ──
const NPC_KW = ['수호짐승','정령','마을 소녀','카탄의 청년','/Muteall','리더봇','상인'];

function parseLine(raw) {
  const l = raw.trim(); if(!l) return null;

  // 귓속말 발신/수신 - 최우선
  const wO = l.match(/^\[귓\]\[(.+?)\]에게：(.*)$/);
  if(wO) return {type:'wout', nick:`▶ ${myNick||'나'}`, text:`→ ${wO[1]}: ${wO[2]}`, raw:l};
  const wI = l.match(/^\[귓\]\[(.+?)\]부터：(.*)$/);
  if(wI) return {type:'win', nick:`◀ ${wI[1]}`, text:wI[2], raw:l};

  // 시스템 키워드 - 일반채팅 파싱보다 먼저 체크
  if(l.includes('월드 경험치') && (l.includes('추가')||l.includes('!')))
    return {type:'sys-world', nick:'', text:l, raw:l};
  if(l.includes('옥션에 등록한') && l.includes('판매되었습니다'))
    return {type:'sys-sale', nick:'', text:l, raw:l};
  // 페트 포획 관련 (일반 시스템 처리)
  if(l.includes('페트를 포획에 성공') || l.includes('포획에 성공했습니다') ||
     l.includes('남은 페트 가방') || l.includes('페트 가방') || l.includes('페트를 포획'))
    return {type:'sys', nick:'', text:l, raw:l};
  // 정석 포획 - 이상/일반 타입 구분
  if((l.includes('플레이어가 정석') || l.includes('정석 이상의')) && l.includes('포획했습니다')) {
    const firstBracket = l.match(/^\[\s*(.+?)\s*\]/);
    const isMyCapture = myNick && firstBracket && firstBracket[1].trim()===myNick;
    if(!isMyCapture) return {type:'sys', nick:'', text:l, raw:l};
    const isAbove = l.includes('정석 이상의');
    return {type: isAbove ? 'sys-pstok-above' : 'sys-pstok', nick:'', text:l, raw:l};
  }
  // 찢어진 카드
  if(l.includes('찢어진 카드') && (l.includes('획득') || l.includes('습니다')))
    return {type:'sys-card', nick:'', text:l, raw:l};
  // 수상한 큐브
  if(l.includes('수상한 큐브') && (l.includes('획득') || l.includes('습니다')))
    return {type:'sys-cube', nick:'', text:l, raw:l};
  // 일반 아이템 획득 (시스템)
  if(l.includes('을(를) 획득했습니다') || l.includes('을 획득했습니다') || l.includes('를 획득했습니다'))
    return {type:'sys', nick:'', text:l, raw:l};

  // 일반 채팅 (：이 있는 경우만)
  const ch = l.match(/^(.+?)：(.*)$/);
  if(ch) {
    const nick=ch[1], text=ch[2];
    if(NPC_KW.some(k=>nick.includes(k))) return {type:'npc',nick,text,raw:l};
    if(myNick && nick===myNick) return {type:'me', nick, text, raw:l};
    return {type:'other', nick, text, raw:l};
  }

  return {type:'sys', nick:'', text:l, raw:l};
}

// ── 알림 체크 ──
function checkAlerts(msgs) {
  for(const m of msgs) {
    if(m.type==='sys-world' && notifs.world) {
      if(countActive.world) { counts.world++; updateCountBtns(); }
      showToast('🌐 월드 경험치 추가!','world'); playSound('world'); continue;
    }
    if(m.type==='sys-sale' && notifs.sale) {
      if(countActive.sale) { counts.sale++; updateCountBtns(); }
      showToast('💰 '+m.text.slice(0,35),'sale'); playSound('sale'); continue;
    }
    if((m.type==='sys-pstok' || m.type==='sys-pstok-above') && notifs.pet) {
      if(countActive.pet) { counts.pet++; updateCountBtns(); }
      if(m.type==='sys-pstok-above') {
        showToast('🌟 정석 이상 포획! '+m.text.slice(0,25),'pet'); playSound('pet_above');
      } else {
        showToast('🦕 정석 포획! '+m.text.slice(0,28),'pet'); playSound('pet');
      }
      continue;
    }
    if(m.type==='sys-card' && countActive.card) { counts.card++; updateCounterUI('card'); }
    if(m.type==='sys-cube' && countActive.cube) { counts.cube++; updateCounterUI('cube'); }
    if(alertWords.some(w=>m.raw.includes(w))) {
      showToast('🔔 '+m.raw.slice(0,32),'alert'); beepAlert();
    }
  }
}
function updateCountBtns() {
  // card/cube는 counter-num으로 표시
  ['card','cube'].forEach(k=>{ if(countActive[k]) updateCounterUI(k); });
}

// ── 렌더 ──
function typeCls(m) {
  if(m.type==='sys-world') return 't-sys t-sys-world';
  if(m.type==='sys-sale')  return 't-sys t-sys-sale';
  if(m.type==='sys-catch') return 't-sys t-sys-catch';
  if(m.type==='sys-pstok') return 't-sys t-sys-pstok';
  if(m.type==='sys-pstok-above') return 't-sys t-sys-pstok t-sys-pstok-above';
  if(m.type==='sys-card')  return 't-sys t-sys-card';
  if(m.type==='sys-cube')  return 't-sys t-sys-cube';
  if(m.type.startsWith('sys')) return 't-sys';
  if(m.type==='me') return 't-me';
  return 't-'+m.type;
}

function renderMsg(m, sq) {
  if(!m) return '';
  const isSys = m.type.startsWith('sys');
  if(isSys && !showSys && filter!=='sys') return '';
  const isAlert = alertWords.length>0 && alertWords.some(w=>m.raw.includes(w));
  let cls = typeCls(m) + (isAlert?' t-alert':'');

  let th = esc(m.text);
  if(sq) { const r=new RegExp(escRe(sq),'gi'); th=th.replace(r,s=>`<mark>${s}</mark>`); }

  // 닉네임 커스텀 색상
  let nStyle='', bubbleStyle='';
  if(!isSys) {
    const rawNick = m.nick.replace(/^[◀▶]\s*/, '').replace(/^나$/, myNick||'나');
    const isMyNick = m.type==='me' || m.type==='wout' ||
      (myNick && (m.nick===myNick || m.nick===`▶ ${myNick||'나'}` || m.nick===`▶ 나`));
    if(nickColors[rawNick]) {
      nStyle=`style="color:${nickColors[rawNick]};font-weight:700;"`;
    } else if(isMyNick) {
      nStyle=`style="color:${myNickColor};font-weight:700;"`;
    } else if(m.type==='other' || m.type==='win') {
      // 닉별 자동 색상
      const ac = getAutoNickColor(rawNick);
      nStyle=`style="color:${ac.nick};font-weight:700;"`;
      bubbleStyle=`style="background:${ac.bubble};"`;
    }
  }

  if(isSys) return `<div class="msg ${cls}"><span class="text">${th}</span></div>`;
  // 말풍선 렌더 (인스타 DM 스타일)
  const displayNick = esc(m.nick);
  // me 타입이면 오른쪽 정렬
  const isMe = m.type==='me' || m.type==='wout';
  const wrapCls = isMe ? 'bubble-wrap bubble-wrap-me' : 'bubble-wrap';
  return `<div class="msg ${cls}" data-nick="${esc(m.nick)}">
    <div class="${wrapCls}">
      <span class="nick-label" ${nStyle}>${displayNick}</span>
      <div class="bubble" ${bubbleStyle}>${th}</div>
    </div>
  </div>`;
}

function esc(s)   { return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// ── 필터 ──
function passFilter(m, sq) {
  if(!m) return false;
  const isSys = m.type.startsWith('sys');
  if(filter==='whisper') { if(!['win','wout'].includes(m.type)) return false; }
  else if(filter==='sys') { if(!isSys) return false; }
  else { // all
    if(isSys && !showSys) return false;
  }
  if(sq && !m.raw.includes(sq)) return false;
  return true;
}

function appendMsgs(msgs) {
  const sq = document.getElementById('sq').value.trim();
  const area = document.getElementById('chat');
  const filtered = msgs.filter(m=>passFilter(m,sq));
  if(!filtered.length) return;
  area.insertAdjacentHTML('beforeend', filtered.map(m=>renderMsg(m,sq)).join(''));
  applyConsecutiveNick(area);
  updateCounts();
  if(autoScroll) scrollToBottom();
}
function applyConsecutiveNick(area) {
  // 연속된 같은 닉네임의 닉 레이블 숨김 (인스타 스타일)
  const rows = area.querySelectorAll('.msg[data-nick]');
  let lastNick = '', lastType = '';
  rows.forEach(row => {
    const nick = row.dataset.nick;
    const type = row.className;
    const label = row.querySelector('.nick-label');
    if(!label) return;
    // 연속 같은 닉 숨김
    if(nick === lastNick && type === lastType) {
      label.classList.add('hidden');
    } else {
      label.classList.remove('hidden');
    }
    lastNick = nick; lastType = type;
  });
}

function rerender() {
  const sq = document.getElementById('sq').value.trim();
  const area = document.getElementById('chat');
  const emp = document.getElementById('emp');
  if(!allMsgs.length) return;
  emp.style.display='none';
  const filtered = allMsgs.filter(m=>passFilter(m,sq));
  // 기존 메시지만 지우고 emp는 유지
  Array.from(area.children).forEach(c=>{ if(c.id!=='emp') c.remove(); });
  area.insertAdjacentHTML('beforeend', filtered.map(m=>renderMsg(m,sq)).join(''));
  updateCounts();
  if(autoScroll) scrollToBottom();
}

function updateCounts() {
  const sq = document.getElementById('sq').value.trim();
  document.getElementById('scnt').textContent = allMsgs.filter(m=>passFilter(m,sq)).length;
}

function setTab(el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  filter = el.dataset.f;
  // 전체 탭일 때만 시스템 토글 표시
  document.getElementById('sys-toggle').style.display = (filter==='all') ? '' : 'none';
  rerender();
}

function toggleSys() {
  showSys = !showSys;
  updateSysBtn();
  rerender();
}
function updateSysBtn() {
  const btn = document.getElementById('sys-toggle');
  btn.classList.toggle('on', showSys);
  btn.textContent = showSys ? '시스템 표시 ON' : '시스템 표시 OFF';
}

function doSearch() { rerender(); }

function scrollToBottom() {
  const el = document.getElementById('chat');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight + 9999; });
}
function toggleAS() {
  autoScroll = !autoScroll;
  const btn = document.getElementById('as-btn');

  btn.classList.toggle('world', autoScroll);
  btn.textContent = autoScroll ? '자동 스크롤 ON' : '자동 스크롤 OFF';

    const btn = document.getElementById('btn-'+t);

function toggleCount(type) {} // 구버전 호환용 빈 함수
function toggleCounter(type) {
  countActive[type] = !countActive[type];
  const tog = document.getElementById('ctog-'+type);

function resetCounter(type) {

function updateCounterUI(type) {
  const el = document.getElementById('cnum-'+type);

// ── 닉 색상 모달 ──

function closeModal() { document.getElementById('modal-bg').style.display='none'; }

function setLive(on) {
  document.getElementById('ldot').className='ldot'+(on?' on':'');

// ── 창 크기 고정 (700×850) ──
let sizeLocked = false;
const LOCK_W = 700, LOCK_H = 850;
let lockTimer = null;
function enforceLock() {
  if(!sizeLocked) return;
  clearTimeout(lockTimer);
  lockTimer = setTimeout(()=>{
    try { window.resizeTo(LOCK_W, LOCK_H); } catch(e) {}
  }, 50);
}
function isPopupWindow() {
  try { return window.opener !== null && window.opener !== undefined; } catch(e) { return false; }
}
function toggleSizeLock() {
  if(!isPopupWindow()) {
    showToast('🔒 계산기/도감 버튼으로 열린 창에서만 크기 고정 가능해요','alert');
    return;
  }
  sizeLocked = !sizeLocked;
  const btn = document.getElementById('size-lock');
  btn.textContent = sizeLocked ? '🔒' : '🔓';
  btn.classList.toggle('locked', sizeLocked);
  if(sizeLocked) {
    try { window.resizeTo(LOCK_W, LOCK_H); } catch(e) {}
    window.addEventListener('resize', enforceLock);
  } else {
    window.removeEventListener('resize', enforceLock);
  }
  localStorage.setItem('sa-locked', sizeLocked ? '1' : '0');
}

// ── 상태 복원 (함수 선언 이후 실행) ──
(function(){
  const ps = localStorage.getItem('sa-panel');
  if(ps === '0') { panelOpen = true; togglePanel(); }
  const ls = localStorage.getItem('sa-locked');
  if(ls === '1') { sizeLocked = false; toggleSizeLock(); }
})();
