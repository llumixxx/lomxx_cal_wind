<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>WIND 펫 도감</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#faf9ff; --bg2:#f3f0ff; --white:#ffffff;
      --s1:#f8f7ff; --s2:#f0eeff;
      --border:#e8e3ff; --border2:#d4cbff;
      --a1:#9b87f5; --a2:#f587b8; --a3:#87d4f5; --a4:#f5c887; --a5:#87f5c0;
      --t1:#3d3560; --t2:#7b72a8; --t3:#b0a8d4; --t4:#d4cff0;
      --ok:#6dd5a0; --err:#f57878;
      --shadow:0 4px 24px rgba(155,135,245,0.12);
      --shadow2:0 8px 32px rgba(155,135,245,0.18);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--t1); min-height:100vh;
      background-image:
        radial-gradient(circle at 15% 20%,rgba(155,135,245,0.08) 0%,transparent 50%),
        radial-gradient(circle at 85% 80%,rgba(245,135,184,0.07) 0%,transparent 50%);
    }

    /* ── Header ── */
    .page-header {
      background:var(--white); border-bottom:1.5px solid var(--border);
      padding:16px 20px; position:sticky; top:0; z-index:100;
      box-shadow:var(--shadow);
    }
    .header-inner {
      max-width:1280px; margin:0 auto;
      display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    }
    .back-btn {
      display:flex; align-items:center; gap:5px;
      padding:7px 14px; border:1.5px solid var(--border2);
      border-radius:10px; background:var(--s1); color:var(--a1);
      font-size:12px; font-weight:700; font-family:'Noto Sans KR',sans-serif;
      cursor:pointer; text-decoration:none; transition:all .15s;
    }
    .back-btn:hover { background:var(--a1); color:#fff; border-color:var(--a1); }
    .header-title {
      font-family:'Nunito',sans-serif; font-weight:900; font-size:20px;
      background:linear-gradient(135deg,var(--a1),var(--a2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header-count {
      font-size:11px; color:var(--t3); font-weight:600;
      margin-left:auto;
    }

    /* ── Filters ── */
    .filter-bar {
      max-width:1280px; margin:16px auto 0; padding:0 16px; width:100%;
    }
    .filter-row {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; align-items:center; width:100%;
    }
    .filter-label {
      font-size:10px; font-weight:700; color:var(--t3);
      letter-spacing:1.5px; font-family:'Nunito',sans-serif;
      min-width:36px;
    }
    .filter-btn {
      padding:5px 12px; font-size:11px; font-weight:700;
      font-family:'Noto Sans KR',sans-serif;
      border:1.5px solid var(--border); border-radius:99px;
      background:var(--white); color:var(--t2);
      cursor:pointer; transition:all .15s;
    }
    .filter-btn:hover { border-color:var(--a1); color:var(--a1); }
    .filter-btn.active { background:var(--a1); color:#fff; border-color:var(--a1); }
    .filter-btn.active-수 { background:#1976d2; color:#fff; border-color:#1976d2; }
    .filter-btn.active-지 { background:#388e3c; color:#fff; border-color:#388e3c; }
    .filter-btn.active-화 { background:#e65100; color:#fff; border-color:#e65100; }
    .filter-btn.active-풍 { background:#7b1fa2; color:#fff; border-color:#7b1fa2; }

    .search-input {
      flex:1; min-width:160px; max-width:260px;
      padding:6px 14px; border:1.5px solid var(--border);
      border-radius:99px; font-size:12px; color:var(--t1);
      font-family:'Noto Sans KR',sans-serif; background:var(--white);
      transition:border-color .15s;
    }
    .search-input:focus { outline:none; border-color:var(--a1); }

    /* ── Table ── */
    .table-wrap {
      max-width:1280px; margin:12px auto 40px; padding:0 16px;
      overflow-x:auto;
    }
    table {
      width:100%; border-collapse:collapse;
      background:var(--white); border-radius:16px;
      overflow:hidden; box-shadow:var(--shadow);
    }
    thead tr {
      background:linear-gradient(135deg,var(--s2),var(--s1));
      border-bottom:2px solid var(--border);
    }
    th {
      padding:10px 12px; font-size:11px; letter-spacing:1px;
      color:var(--t2); font-family:'Nunito',sans-serif; font-weight:800;
      text-align:center; white-space:nowrap; cursor:pointer; user-select:none;
      transition:color .15s;
    }
    th:hover { color:var(--a1); }
    th:first-child, th:nth-child(2), th:nth-child(3), th:last-child { text-align:left; }
    th.sorted { color:var(--a1); }
    th .sort-icon { display:inline-block; margin-left:3px; opacity:.5; font-size:9px; }
    th.sorted .sort-icon { opacity:1; }

    tbody tr {
      border-bottom:1px solid var(--border);
      transition:background .12s;
    }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--s1); }

    td {
      padding:9px 12px; font-size:14px; color:var(--t1); vertical-align:middle;
    }
    .td-name { font-weight:700; font-size:15px; }
    .td-num {
      font-family:'Nunito',sans-serif; font-weight:700;
      text-align:center; color:var(--t1);
    }
    .td-num.highlight { color:var(--a1); font-weight:900; }

    /* 등급 배지 */
    .grade-badge {
      font-size:9px; font-weight:800; padding:2px 6px; border-radius:5px;
      font-family:'Nunito',sans-serif; white-space:nowrap;
    }
    .grade-1등급 { background:#fff0f6; color:#e0508a; border:1px solid #f5c8de; }
    .grade-2등급   { background:#f0eeff; color:#9b87f5; border:1px solid #d4cbff; }
    .grade-2등급  { background:#f0f9ff; color:#5ab5e0; border:1px solid #c5e8f7; }
    .grade-일반   { background:#f5f5f5; color:#999;    border:1px solid #e0e0e0; }

    /* 속성 바 */
    .attr-bar { display:flex; gap:2px; align-items:center; }
    .attr-pip {
      font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px;
      font-family:'Nunito',sans-serif; white-space:nowrap;
    }
    .attr-지 { background:#e8f5e9; color:#388e3c; border:1px solid #c8e6c9; }
    .attr-수 { background:#e3f2fd; color:#1976d2; border:1px solid #bbdefb; }
    .attr-화 { background:#ffebee; color:#c62828; border:1px solid #ef9a9a; }
    .attr-풍 { background:#fffde7; color:#f57f17; border:1px solid #fff176; }

    /* 획득방법 */
    .obtain-badge {
      font-size:10px; padding:2px 7px; border-radius:5px;
      background:var(--s1); color:var(--t2); border:1px solid var(--border);
      white-space:nowrap; max-width:160px; overflow:hidden; text-overflow:ellipsis;
      display:inline-block;
    }

    .no-result {
      text-align:center; padding:40px; color:var(--t3); font-size:14px;
    }

    /* 정렬 강조 열 */
    td.col-highlight { background:rgba(155,135,245,0.04); }

    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

    /* ── 상세 모달 ── */
    .modal-overlay {
      position:fixed; inset:0; z-index:500;
      background:rgba(61,53,96,0.45); backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center;
      padding:20px; animation:fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal-card {
      background:var(--white); border-radius:24px;
      box-shadow:0 20px 60px rgba(155,135,245,0.25);
      width:100%; max-width:480px; max-height:90vh;
      overflow-y:auto; animation:slideUp .25s ease;
      position:relative;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .modal-card::-webkit-scrollbar { width:4px; }
    .modal-card::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

    .modal-close {
      position:absolute; top:14px; right:14px;
      width:32px; height:32px; border-radius:50%;
      background:var(--s2); border:none; cursor:pointer;
      font-size:14px; color:var(--t2); transition:all .15s;
      display:flex; align-items:center; justify-content:center;
    }
    .modal-close:hover { background:var(--err); color:#fff; }

    .modal-hero {
      background:linear-gradient(135deg,var(--s1),var(--s2));
      border-radius:24px 24px 0 0;
      padding:28px 24px 20px;
      display:flex; align-items:center; gap:20px;
      border-bottom:1.5px solid var(--border);
    }
    .modal-img-box {
      width:90px; height:90px; flex-shrink:0;
      background:var(--white); border:2px solid var(--border2);
      border-radius:18px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 16px rgba(155,135,245,0.15);
      overflow:hidden;
    }
    .modal-img-box img {
      width:80px; height:80px;
      object-fit:contain; image-rendering:pixelated;
    }
    .modal-hero-info { flex:1; min-width:0; }
    .modal-name {
      font-size:22px; font-weight:900;
      font-family:'Nunito',sans-serif;
      color:var(--t1); margin-bottom:6px;
    }
    .modal-badges { display:flex; gap:5px; flex-wrap:wrap; }

    .modal-body { padding:20px 24px 24px; }
    .modal-section {
      margin-bottom:16px;
    }
    .modal-section-title {
      font-size:9px; letter-spacing:2px; color:var(--t3);
      text-transform:uppercase; font-family:'Nunito',sans-serif;
      font-weight:800; margin-bottom:8px;
      display:flex; align-items:center; gap:6px;
    }
    .modal-section-title::before {
      content:''; display:block; width:3px; height:12px;
      background:linear-gradient(135deg,var(--a1),var(--a2));
      border-radius:2px;
    }
    .modal-obtain {
      font-size:13px; color:var(--t2); line-height:1.6;
      background:var(--s1); border:1.5px solid var(--border);
      border-radius:10px; padding:10px 14px;
    }

    .modal-attr-row { display:flex; gap:6px; flex-wrap:wrap; }
    .modal-attr-chip {
      display:flex; align-items:center; gap:4px;
      padding:5px 10px; border-radius:8px;
      font-size:12px; font-weight:700;
      font-family:'Noto Sans KR',sans-serif;
    }
    .modal-attr-chip .chip-num {
      font-family:'Nunito',sans-serif; font-weight:900;
      font-size:14px;
    }

    .modal-stat-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .modal-stat-box {
      background:var(--s1); border:1.5px solid var(--border);
      border-radius:12px; padding:10px 14px;
      display:flex; flex-direction:column; gap:2px;
    }
    .modal-stat-label {
      font-size:9px; letter-spacing:1px; color:var(--t3);
      font-family:'Nunito',sans-serif; font-weight:700;
      text-transform:uppercase;
    }
    .modal-stat-val {
      font-size:18px; font-weight:900;
      font-family:'Nunito',sans-serif; color:var(--t1);
    }
    .modal-stat-sg {
      font-size:11px; color:var(--t3); font-family:'Nunito',sans-serif;
    }
    .stat-atk .modal-stat-val { color:var(--a2); }
    .stat-def .modal-stat-val { color:var(--a1); }
    .stat-agi .modal-stat-val { color:#5acba8; }
    .stat-hp  .modal-stat-val { color:#d4943a; }

    @media(max-width:600px) {
      th, td { padding:7px 8px; font-size:11px; }
      .td-name { font-size:12px; }
    }
  
    .page-nav-pd {
      display: flex; justify-content: center; gap: 8px;
      padding: 10px 16px 12px; flex-wrap: wrap;
      background: var(--white); border-bottom: 1.5px solid var(--border);
    }
    .pnav-tab-pd {
      text-decoration: none;
      background: var(--s1); border: 1.5px solid var(--border2);
      border-radius: 99px; padding: 6px 14px;
      font-size: 12px; font-weight: 700;
      color: var(--t2); transition: all .15s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .pnav-tab-pd:hover { background: var(--s2); color: var(--a1); border-color: var(--a1); }
    .pnav-active-pd { background: linear-gradient(135deg,var(--s2),#ffeef6); color: var(--a1); border-color: var(--a1); font-weight: 800; }
    .nav-sep-pd { width:1.5px; height:20px; background:var(--border2); border-radius:2px; display:inline-block; vertical-align:middle; }
    .dawn-label-pd { font-size:10px; font-weight:800; color:#5b4fcf; letter-spacing:.5px; background:rgba(91,79,207,0.08); border:1px solid rgba(91,79,207,0.2); border-radius:99px; padding:3px 10px; }
    .pnav-tab-pd.dawn { border-color:rgba(91,79,207,0.35); color:#5b4fcf; background:rgba(91,79,207,0.06); }
    .pnav-tab-pd.dawn:hover { background:rgba(91,79,207,0.14); }

    .family-btn {
      white-space: nowrap;
    }
    .family-btn.active {
      background: linear-gradient(135deg, var(--s2), #ffeef6);
      border-color: var(--a1); color: var(--a1); font-weight: 800;
    }

    /* ── 계열 보기 ── */
    .family-view-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 18px; border-radius: 99px;
      border: 1.5px solid var(--border2);
      background: linear-gradient(135deg, var(--s2), #ffeef6);
      color: var(--a1); font-size: 13px; font-weight: 800;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; transition: all .15s;
    }
    .family-view-btn:hover, .family-view-btn.active {
      background: var(--a1); color: #fff; border-color: var(--a1);
    }
    .family-view-btn.active::before { content: "✕ "; }

    .family-panel-inner {
      max-width: 1280px; margin: 0 auto; padding: 16px 16px 0;
    }

    /* 검색/헤더 */
    .family-search-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .family-search-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--white); border: 1.5px solid var(--border2);
      border-radius: 99px; padding: 7px 16px; flex: 1; min-width: 160px;
    }
    .family-search-wrap input {
      border: none; outline: none; background: transparent;
      font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
      color: var(--t1); width: 100%;
    }
    .family-expand-btn {
      padding: 7px 14px; border-radius: 99px;
      border: 1.5px solid var(--border2); background: var(--white);
      font-size: 12px; font-weight: 700; color: var(--t2);
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .family-expand-btn:hover { border-color: var(--a1); color: var(--a1); }
    .family-count-badge {
      font-size: 12px; font-weight: 800; color: var(--t3);
      font-family: 'Nunito', sans-serif; white-space: nowrap;
    }

    /* 계열 카드 그리드 */
    .family-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      padding-bottom: 20px;
    }
    .family-card {
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 22px 16px 16px;
      text-align: center; cursor: pointer;
      transition: all .18s; position: relative;
    }
    .family-card:hover {
      border-color: var(--a1); box-shadow: var(--shadow2);
      transform: translateY(-2px);
    }
    .family-card-img {
      width: 110px; height: 110px; margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .family-card-img img {
      width: 110px; height: 110px; object-fit: contain; image-rendering: pixelated;
    }
    .family-card-name {
      font-size: 15px; font-weight: 800; color: var(--t1);
      margin-bottom: 5px;
    }
    .family-card-count {
      font-size: 12px; color: var(--t3); font-family: 'Nunito', sans-serif; font-weight: 700;
    }
    /* 펼쳐진 상태 */
    .family-card.expanded {
      grid-column: 1 / -1;
      border-color: var(--a1);
      background: linear-gradient(135deg, var(--s1), #ffeef9);
    }
    .family-card-members {
      display: none; margin-top: 10px;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    }
    .family-member-chip {
      background: var(--white); border: 1.5px solid var(--border2);
      border-radius: 8px; padding: 4px 10px;
      font-size: 11px; font-weight: 700; color: var(--t1);
      cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px;
    }
    .family-member-chip:hover { border-color: var(--a1); color: var(--a1); background: var(--s2); }
    .family-member-chip img {
      width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated;
    }

    /* 계열 상세 */
    .family-back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 99px;
      border: 1.5px solid var(--border2); background: var(--white);
      font-size: 12px; font-weight: 700; color: var(--t2);
      cursor: pointer; transition: all .15s; margin-bottom: 14px;
    }
    .family-back-btn:hover { border-color: var(--a1); color: var(--a1); }
    .family-detail-header {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
    }
    .family-detail-name {
      font-size: 20px; font-weight: 900;
      font-family: 'Nunito', sans-serif; color: var(--t1);
    }
    .family-detail-count {
      font-size: 12px; color: var(--t3); font-weight: 700;
    }
    .family-pet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px; padding-bottom: 20px;
    }
    .family-pet-card {
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 16px 10px 10px;
      text-align: center; cursor: pointer; transition: all .18s;
    }
    .family-pet-card:hover {
      border-color: var(--a1); box-shadow: var(--shadow);
      transform: translateY(-2px);
    }
    .family-pet-card img {
      width: 84px; height: 84px; object-fit: contain; image-rendering: pixelated;
      margin-bottom: 8px;
    }
    .family-pet-card .fpc-name {
      font-size: 13px; font-weight: 800; color: var(--t1);
    }
    .family-pet-card .fpc-grade {
      font-size: 10px; font-weight: 700; margin-top: 3px;
    }
    .grade-1등급 { color: var(--legendary); }
    .grade-2등급 { color: var(--unique); }
    .grade-일반  { color: var(--t3); }

    /* ── 속성 수치 필터 ── */
    .attr-val-row { flex-wrap: wrap; }
    .attr-val-inputs {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .attr-val-item {
      display: flex; align-items: center; gap: 5px;
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 4px 10px;
    }
    .attr-val-lbl { font-size: 12px; font-weight: 700; color: var(--t2); white-space: nowrap; }
    .attr-val-input {
      width: 40px; border: none; outline: none; background: transparent;
      font-size: 13px; font-weight: 800; font-family: 'Nunito', sans-serif;
      color: var(--a1); text-align: center;
      -moz-appearance: textfield;
    }
    .attr-val-input::-webkit-outer-spin-button,
    .attr-val-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .attr-val-item:focus-within { border-color: var(--a1); }
    .attr-val-reset {
      padding: 5px 12px; border-radius: 99px;
      border: 1.5px solid var(--border2); background: var(--white);
      font-size: 11px; font-weight: 700; color: var(--t3);
      cursor: pointer; transition: all .15s;
    }
    .attr-val-reset:hover { border-color: var(--err); color: var(--err); }

    /* ── 통합 속성 필터 ── */
    .attr-combined {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    .attr-combined-item {
      display: flex; align-items: center; gap: 4px;
    }
    .attr-combined-item .filter-btn {
      border-radius: 99px;
    }
    .attr-combined-item:first-child .filter-btn {
      border-radius: 99px;
    }
    .attr-combined-item .attr-val-input {
      width: 38px; height: 30px;
      border: 1.5px solid var(--border2);
      border-radius: 8px;
      background: var(--white); outline: none;
      font-size: 12px; font-weight: 800; font-family: 'Nunito', sans-serif;
      color: var(--a1); text-align: center; padding: 0 4px;
      -moz-appearance: textfield;
    }
    .attr-combined-item .attr-val-input:focus { border-color: var(--a1); background: var(--s1); }
    .attr-combined-item .attr-val-input::-webkit-outer-spin-button,
    .attr-combined-item .attr-val-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .family-back-to-list {
      padding: 7px 14px; border-radius: 99px;
      border: 1.5px solid var(--border2); background: var(--white);
      font-size: 12px; font-weight: 700; color: var(--t2);
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .family-back-to-list:hover { border-color: var(--a1); color: var(--a1); background: var(--s2); }

    /* ── 속성 슬라이더 ── */
    .attr-slider-row { align-items: flex-start !important; flex-wrap: wrap; gap: 10px; }
    .attr-sliders {
      display: flex; gap: 10px 20px; flex-wrap: wrap; flex: 1; align-items: flex-end;
    }
    /* 각 속성 아이템: 배경 카드 */
    .asl-item {
      display: flex; flex-direction: column; gap: 6px;
      flex: 1; min-width: 170px; max-width: 300px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 14px; padding: 8px 10px;
      transition: opacity .2s, border-color .15s, box-shadow .15s;
      box-shadow: var(--shadow);
    }
    .asl-item:hover { border-color: var(--border2); box-shadow: var(--shadow2); }
    .asl-item.asl-disabled {
      opacity: 0.35; pointer-events: none;
      filter: grayscale(0.4);
    }
    /* 각 속성별 카드 테두리 색 (수치>0일 때) */
    .asl-item.active-지 { border-color: #81c784; background: #f1faf1; }
    .asl-item.active-수 { border-color: #64b5f6; background: #f0f7ff; }
    .asl-item.active-화 { border-color: #ef9a9a; background: #fff5f5; }
    .asl-item.active-풍 { border-color: #fff176; background: #fffef0; }
    .asl-header {
      display: flex; align-items: center; gap: 5px;
    }
    .asl-emoji { font-size: 15px; }
    .asl-name  { font-size: 12px; font-weight: 800; color: var(--t1); letter-spacing: 0.5px; }
    .asl-val {
      font-size: 15px; font-weight: 900;
      font-family: 'Nunito', sans-serif;
      margin-left: auto; min-width: 20px; text-align: right;
    }
    .asl-val-지 { color: #388e3c; }
    .asl-val-수 { color: #1565c0; }
    .asl-val-화 { color: #c62828; }
    .asl-val-풍 { color: #f57f17; }
    /* 트랙 */
    .asl-track {
      position: relative; height: 18px;
      background: #efefef;
      border-radius: 99px;
      cursor: pointer; user-select: none;
      overflow: hidden;
    }
    .asl-track:active { transform: scaleY(1.1); }
    /* 채워진 부분 */
    .asl-fill-bar {
      position: absolute; left: 0; top: 0; bottom: 0;
      border-radius: 0; pointer-events: none;
      transition: width .1s ease;
    }
    .asl-fill-지 { background: linear-gradient(90deg,#66bb6a,#a5d6a7); }
    .asl-fill-수 { background: linear-gradient(90deg,#42a5f5,#90caf9); }
    .asl-fill-화 { background: linear-gradient(90deg,#ef5350,#ff8a80); }
    .asl-fill-풍 { background: linear-gradient(90deg,#ffca28,#fff176); }
    /* 내부 구분선 */
    .asl-dividers {
      position: absolute; inset: 0;
      display: flex; pointer-events: none;
    }
    .asl-div {
      flex: 1;
      border-right: 1.5px solid rgba(255,255,255,0.6);
    }
    .asl-div:last-child { border-right: none; }
    /* 클릭 영역 */
    .asl-seg {
      position: absolute; top: 0; bottom: 0;
      cursor: pointer;
    }
    /* 푸터 */
    .asl-footer {
      display: flex; align-items: center; gap: 6px;
      flex-basis: 100%; padding: 2px 0;
    }
    .asl-total-label { font-size: 11px; font-weight: 700; color: var(--t3); }
    .asl-total-val {
      font-size: 14px; font-weight: 900;
      font-family: 'Nunito', sans-serif; color: var(--a1);
    }
    .asl-total-val.full { color: var(--a2); }
    .asl-total-max { font-size: 11px; color: var(--t4); font-family: 'Nunito', sans-serif; }

    /* ── 속성 슬라이더 ── */
    .attr-slider-row { align-items: flex-start; }
    .attr-slider-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 20px;
      flex: 1;
    }
    @media(max-width:600px){ .attr-slider-wrap{ grid-template-columns:1fr; } }
    .attr-slider-item { display: flex; flex-direction: column; gap: 4px; }
    .attr-slider-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .attr-slider-lbl { font-size: 12px; font-weight: 700; color: var(--t2); }
    .attr-slider-val {
      font-size: 13px; font-weight: 900;
      font-family: 'Nunito', sans-serif; color: var(--a1);
      min-width: 16px; text-align: right;
    }
    .attr-slider-track {
      position: relative; height: 20px;
      background: var(--s1); border-radius: 99px;
      border: 1.5px solid var(--border2);
      cursor: pointer; overflow: hidden;
      user-select: none;
    }
    .attr-slider-track:hover { border-color: var(--a1); }
    .attr-slider-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      border-radius: 99px; transition: width .1s;
      pointer-events: none;
    }
    .attr-fill-지 { background: linear-gradient(90deg, #6ab56a, #90d490); }
    .attr-fill-수 { background: linear-gradient(90deg, #5aabdf, #87d0f5); }
    .attr-fill-화 { background: linear-gradient(90deg, #e53935, #ef5350); }
    .attr-fill-풍 { background: linear-gradient(90deg, #fdd835, #ffee58); }
    .attr-slider-segments {
      position: absolute; inset: 0;
      display: flex; pointer-events: none;
    }
    .asg {
      flex: 1; border-right: 1px solid rgba(255,255,255,0.25);
    }
    .asg:last-child { border-right: none; }

let sortCol = "sg_atk";
let sortAsc = false;
let filterGrade = "";
let filterAttr = "";
let searchQ = "";

function getVal(pet, col) {
  if (col === "name")    return "";
  if (col === "grade")   return ["1등급","2등급","일반"].indexOf(pet.grade);
  if (col === "sg_atk")  return pet.sg?.atk ?? 0;
  if (col === "sg_def")  return pet.sg?.def ?? 0;
  if (col === "sg_hp")   return pet.sg?.hp  ?? 0;
  if (col === "sg_agi")  return pet.sg?.agi ?? 0;
  if (col === "obtain")  return pet.obtain ?? "";
  return 0;
}

function renderTable() {
  let entries = Object.entries(PET_DATA);

  // 검색 필터
  if (searchQ) {
    const q = searchQ.toLowerCase();
    entries = entries.filter(([n,p]) =>
      n.includes(searchQ) || (p.obtain||"").includes(searchQ)
    );
  }

  // 등급 필터
  if (filterGrade) entries = entries.filter(([n,p]) => p.grade === filterGrade);

  // 속성 필터
  if (filterAttr) entries = entries.filter(([n,p]) => (p.attr?.[filterAttr] ?? 0) > 0);

  // 속성 수치 필터 (슬라이더 기반)
  const hasAttrFilter = ATTRS.some(a => attrVals[a] > 0);
  if (hasAttrFilter) {
    entries = entries.filter(([n,p]) => {
      const attr = p.attr || {};
      return ATTRS.every(a => attrVals[a] === 0 || (attr[a] ?? 0) >= attrVals[a]);
    });
  }

  // 정렬
  entries.sort(([na,a],[nb,b]) => {
    let va, vb;
    if (sortCol === "name") { va=na; vb=nb; }
    else { va=getVal(a,sortCol); vb=getVal(b,sortCol); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return na.localeCompare(nb, 'ko-KR');
  });

  const tbody = document.getElementById("pet-tbody");
  tbody.innerHTML = "";

  const highlightCols = {"sg_atk":4,"sg_def":5,"sg_hp":6,"sg_agi":7};
  const hlIdx = highlightCols[sortCol] ?? -1;

  entries.forEach(([name, pet]) => {
    const tr = document.createElement("tr");

    // 이미지
    const tdImg = document.createElement("td");
    tdImg.style.cssText = "text-align:center;padding:4px 8px;width:96px;";
    const imgUrl = PET_IMAGES[name];
    if (imgUrl) {
      const img = document.createElement("img");
      img.src = imgUrl;
      img.alt = name;
      img.style.cssText = "width:80px;height:80px;object-fit:contain;image-rendering:pixelated;";
      img.onerror = function(){ this.onerror=null; this.src=LOGO_URL; };
      tdImg.appendChild(img);
    } else {
      const nimg = document.createElement("img");
      nimg.src = LOGO_URL;
      nimg.style.cssText = "width:36px;height:36px;object-fit:contain;opacity:0.75;";
      tdImg.appendChild(nimg);
    }
    tr.appendChild(tdImg);

    // 이름
    const tdName = document.createElement("td");
    tdName.className = "td-name";
    tdName.textContent = name;
    tr.appendChild(tdName);

    // 등급
    const tdGrade = document.createElement("td");
    tdGrade.innerHTML = `<span class="grade-badge grade-${pet.grade}">${pet.grade}</span>`;
    tr.appendChild(tdGrade);

    // 속성
    const tdAttr = document.createElement("td");
    const attrBar = document.createElement("div");
    attrBar.className = "attr-bar";
    ["지","수","화","풍"].forEach(a => {
      const v = pet.attr?.[a] ?? 0;
      if (v > 0) {
        const pip = document.createElement("span");
        pip.className = `attr-pip attr-${a}`;
        pip.textContent = `${a}${v}`;
        attrBar.appendChild(pip);
      }
    });
    tdAttr.appendChild(attrBar);
    tr.appendChild(tdAttr);

    // 성장률 4개
    ["sg_atk","sg_def","sg_hp","sg_agi"].forEach((col,i) => {
      const td = document.createElement("td");
      td.className = "td-num" + (col === sortCol ? " highlight" : "");
      const v = getVal(pet, col);
      td.textContent = v > 0 ? v.toFixed(3) : "-";
      tr.appendChild(td);
    });

    // 획득방법
    const tdObtain = document.createElement("td");
    tdObtain.innerHTML = `<span class="obtain-badge" title="${pet.obtain}">${pet.obtain||"-"}</span>`;
    tr.appendChild(tdObtain);

    tr.style.cursor = "pointer";
    tr.addEventListener("click", () => openModal(name));
    tbody.appendChild(tr);
  });

  document.getElementById("count-label").textContent = `${entries.length} / 312마리`;
  document.getElementById("no-result").style.display = entries.length === 0 ? "block" : "none";
  document.getElementById("pet-table").style.display = entries.length === 0 ? "none" : "";

  // 정렬 헤더 표시
  document.querySelectorAll("th[data-col]").forEach(th => {
    const col = th.dataset.col;
    const icon = th.querySelector(".sort-icon");
    if (!icon) return;
    if (col === sortCol) {
      th.classList.add("sorted");
      icon.textContent = sortAsc ? "↑" : "↓";
    } else {
      th.classList.remove("sorted");
      icon.textContent = "↕";
    }
  });
}

// 헤더 정렬 클릭
document.querySelectorAll("th[data-col]").forEach(th => {
  if (th.dataset.col === "attr") return;
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = col === "name" || col === "grade"; }
    renderTable();
  });
});

/* ── 속성 슬라이더 ── */
const ATTRS = ["지","수","화","풍"];
const attrVals = {"지":0,"수":0,"화":0,"풍":0};

function getActiveAttrs() {
  return ATTRS.filter(a => attrVals[a] > 0);
}

function updateSliderUI(attr) {
  const v = attrVals[attr];
  // 수치 표시
  const valEl = document.getElementById("asl-v-" + attr);
  if (valEl) valEl.textContent = v;
  // fill-bar 너비
  const fillBar = document.getElementById("asl-f-" + attr);
  if (fillBar) fillBar.style.width = (v / 10 * 100) + "%";
  // 합계
  const total = ATTRS.reduce((s,a) => s + attrVals[a], 0);
  const totEl = document.getElementById("asl-total");
  if (totEl) {
    totEl.textContent = total;
    totEl.className = "asl-total-val" + (total >= 10 ? " full" : "");
  }
  // 2속성 제한 + active 스타일
  const active = getActiveAttrs();
  ATTRS.forEach(a => {
    const item = document.getElementById("asl-item-" + a);
    if (!item) return;
    const disabled = active.length >= 2 && !active.includes(a);
    item.classList.toggle("asl-disabled", disabled);
    item.classList.toggle("active-" + a, attrVals[a] > 0);
  });
}

function setAttrVal(attr, newVal) {
  newVal = Math.max(0, Math.min(10, Math.round(newVal)));
  // 2속성 제한 체크
  const active = getActiveAttrs();
  if (attrVals[attr] === 0 && newVal > 0 && active.length >= 2) return;
  const others = ATTRS.filter(a => a !== attr);
  const otherSum = others.reduce((s,a) => s + attrVals[a], 0);
  if (newVal + otherSum > 10) {
    const over = newVal + otherSum - 10;
    let toReduce = over;
    for (let i = others.length - 1; i >= 0 && toReduce > 0; i--) {
      const a = others[i];
      const reduce = Math.min(attrVals[a], toReduce);
      attrVals[a] -= reduce;
      toReduce -= reduce;
      updateSliderUI(a);
    }
  }
  attrVals[attr] = newVal;
  updateSliderUI(attr);
  renderTable();
}

function getValFromEvent(track, clientX) {
  const rect = track.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  return Math.round(ratio * 10);
}

// 슬라이더 이벤트 등록
ATTRS.forEach(attr => {
  const track = document.getElementById("asl-t-" + attr);
  if (!track) return;
  let dragging = false;
  track.addEventListener("mousedown", e => {
    dragging = true;
    setAttrVal(attr, getValFromEvent(track, e.clientX));
    e.preventDefault();
  });
  track.addEventListener("touchstart", e => {
    dragging = true;
    setAttrVal(attr, getValFromEvent(track, e.touches[0].clientX));
    e.preventDefault();
  }, {passive: false});
  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    setAttrVal(attr, getValFromEvent(track, e.clientX));
  });
  document.addEventListener("touchmove", e => {
    if (!dragging) return;
    setAttrVal(attr, getValFromEvent(track, e.touches[0].clientX));
  }, {passive: false});
  document.addEventListener("mouseup",  () => { dragging = false; });
  document.addEventListener("touchend", () => { dragging = false; });
});

function resetAttrSliders() {
  ATTRS.forEach(a => { attrVals[a] = 0; updateSliderUI(a); });
  renderTable();
}

function openModal(name) {
  const pet = PET_DATA[name];
  if (!pet) return;

  // 이미지
  const imgBox = document.getElementById("modal-img-box");
  const imgUrl = PET_IMAGES[name];
  imgBox.innerHTML = imgUrl
    ? `<img src="${imgUrl}" alt="${name}" style="width:64px;height:64px;object-fit:contain;image-rendering:pixelated;" onerror="this.onerror=null;this.src=LOGO_URL">`
    : `<img src="${LOGO_URL}" style="width:64px;height:64px;object-fit:contain;opacity:0.75;">`;

  // 이름
  document.getElementById("modal-name").textContent = name;

  // 배지 (등급 + 탑승여부)
  const badges = document.getElementById("modal-badges");
  badges.innerHTML = '';
  if (pet.grade) {
    const gb = document.createElement("span");
    gb.className = `grade-badge grade-${pet.grade}`;
    gb.textContent = pet.grade;
    badges.appendChild(gb);
  }
  if (pet.mount) {
    const mb = document.createElement("span");
    mb.style.cssText = "font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;background:#f0fff4;color:#38a169;border:1px solid #c6f6d5;font-family:'Nunito',sans-serif;";
    mb.textContent = "🐴 탑승";
    badges.appendChild(mb);
  }

  // 속성
  const attrsEl = document.getElementById("modal-attrs");
  attrsEl.innerHTML = '';
  const attrColors = {
    지: {bg:"#e8f5e9",color:"#388e3c",border:"#c8e6c9",emoji:"🌿"},
    수: {bg:"#e3f2fd",color:"#1976d2",border:"#bbdefb",emoji:"💧"},
    화: {bg:"#fff3e0",color:"#e65100",border:"#ffe0b2",emoji:"🔥"},
    풍: {bg:"#f3e5f5",color:"#7b1fa2",border:"#e1bee7",emoji:"🌀"},
  };
  const attrObj = pet.attr || {};
  let hasAttr = false;
  ["지","수","화","풍"].forEach(a => {
    const v = attrObj[a] ?? 0;
    if (v > 0) {
      hasAttr = true;
      const c = attrColors[a];
      const chip = document.createElement("div");
      chip.className = "modal-attr-chip";
      chip.style.cssText = `background:${c.bg};color:${c.color};border:1.5px solid ${c.border};`;
      chip.innerHTML = `${c.emoji} ${a} <span class="chip-num">${v}</span>`;
      attrsEl.appendChild(chip);
    }
  });
  if (!hasAttr) attrsEl.innerHTML = '<span style="color:var(--t3);font-size:12px;">정보 없음</span>';

  // 획득방법
  document.getElementById("modal-obtain").textContent = pet.obtain || "정보 없음";

  // 성장률
  const sg = pet.sg || {};
  const sgKeys = ["atk","def","agi","hp"];
  const ic = pet.ic || {};
  sgKeys.forEach(key => {
    const sgVal = sg[key];
    const icVal = ic[key];
    const sgEl = document.getElementById(`modal-sg-${key}`);
    const icEl = document.getElementById(`modal-ic-${key}`);
    if (sgEl) sgEl.textContent = sgVal != null ? sgVal.toFixed(3) : "—";
    if (icEl) icEl.textContent = icVal != null ? icVal : "—";
  });

  document.getElementById("pet-modal").style.display = "flex";
  document.body.style.overflow = "hidden";
  document.documentElement.style.overflow = "hidden";
}

function hideModal() {
  document.getElementById("pet-modal").style.display = "none";
  document.documentElement.style.overflow = "";
  // 계열 팝업에서 들어온 경우 계열 팝업으로 복귀
  if (currentFamily) {
    const modal = document.getElementById("family-detail-modal");
    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
    document.documentElement.style.overflow = "hidden";
  } else {
    document.body.style.overflow = "";
  }
}
function closeModal(e) {
  if (e.target === document.getElementById("pet-modal")) hideModal();
  if (e.target === document.getElementById("family-detail-modal")) closeFamilyDetailModal();
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeFamilyDetailModal();
    hideModal();
  }
});

let familyViewOpen = false;
let expandAllMode = false;
let currentFamily = null;

function toggleFamilyView() {
  familyViewOpen = !familyViewOpen;
  const panel = document.getElementById('family-view-panel');
  const btn = document.getElementById('family-view-toggle');
  const filterBar = document.querySelector('.filter-bar');
  const tableWrap = document.querySelector('.table-wrap');

  panel.style.display = familyViewOpen ? 'block' : 'none';
  btn.classList.toggle('active', familyViewOpen);

  // 계열뷰 열리면 필터바+테이블 숨기기
  if (filterBar) filterBar.style.display = familyViewOpen ? 'none' : '';
  if (tableWrap) tableWrap.style.display = familyViewOpen ? 'none' : '';

  if (familyViewOpen && document.getElementById('family-cards-grid').children.length === 0) {
    renderFamilyGrid();
  }
}

function renderFamilyGrid(filter) {
  const grid = document.getElementById('family-cards-grid');
  grid.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();
  let count = 0;

  for (const [fname, members] of Object.entries(PET_FAMILIES)) {
    // 검색 필터
    if (q) {
      const matchName = fname.toLowerCase().includes(q);
      const matchMember = members.some(m => m.toLowerCase().includes(q));
      if (!matchName && !matchMember) continue;
    }
    count++;

    const repImg = PET_IMAGES[members[0]] || '';
    const card = document.createElement('div');
    card.className = 'family-card' + (expandAllMode ? ' expanded' : '');
    card.dataset.family = fname;

    const membersHtml = members.map(m => {
      const img = PET_IMAGES[m] ? `<img src="${PET_IMAGES[m]}" onerror="this.style.display='none'">` : '<span style="font-size:18px;">🐾</span>';
      return `<span class="family-member-chip" onclick="event.stopPropagation();openModalByName('${m}')">${img}${m}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="family-card-img">
        ${repImg ? `<img src="${repImg}" onerror="this.onerror=null;this.src=LOGO_URL">` : `<img src="${LOGO_URL}" style="width:60px;height:60px;object-fit:contain;opacity:0.75;">`}
      </div>
      <div class="family-card-name">${fname}</div>
      <div class="family-card-count">${members.length}마리</div>
      ${expandAllMode ? `<div class="family-card-members">${membersHtml}</div>` : ''}
    `;
    if (!expandAllMode) {
      card.addEventListener('click', () => showFamilyDetail(fname));
    }
    grid.appendChild(card);
  }
  document.getElementById('family-count-badge').textContent = count + '개 계열';
}

function filterFamilyGrid() {
  const q = document.getElementById('family-search').value;
  renderFamilyGrid(q);
}

function toggleExpandAll() {
  expandAllMode = !expandAllMode;
  const btn = document.getElementById('family-expand-btn');
  btn.textContent = expandAllMode ? '전체 접기' : '전체 펼치기';
  const q = document.getElementById('family-search').value;
  renderFamilyGrid(q);
}

function showFamilyDetail(fname) {
  currentFamily = fname;
  const members = PET_FAMILIES[fname];
  document.getElementById('fdm-name').textContent = fname;
  document.getElementById('fdm-count').textContent = members.length + '마리';

  const grid = document.getElementById('fdm-pet-grid');
  grid.innerHTML = '';
  members.forEach(name => {
    const pet = PET_DATA[name];
    const img = PET_IMAGES[name] || '';
    const card = document.createElement('div');
    card.className = 'family-pet-card';
    const grade = pet ? pet.grade || '' : '';
    card.innerHTML = `
      ${img ? `<img src="${img}" onerror="this.style.display='none'">` : '<img src="'+LOGO_URL+'" style="width:60px;height:60px;object-fit:contain;opacity:0.75;">'}
      <div class="fpc-name">${name}</div>
      <div class="fpc-grade grade-${grade}">${grade}</div>
    `;
    card.addEventListener('click', () => {
      // 계열 팝업 숨기기 (currentFamily 유지 - 복귀용)
      document.getElementById('family-detail-modal').style.display = 'none';
      openModalByName(name);
    });
    grid.appendChild(card);
  });

  const modal = document.getElementById('family-detail-modal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeFamilyDetailModal() {
  document.getElementById('family-detail-modal').style.display = 'none';
  document.body.style.overflow = '';
  document.documentElement.style.overflow = '';
  currentFamily = null;
}

function goToCalc() {
  const name = document.getElementById("modal-name")?.textContent?.trim();
  if (name) {
    window.location.href = "index.html?pet=" + encodeURIComponent(name);
  }
}

function goToRanking() {
  const name = document.getElementById("modal-name")?.textContent?.trim();
  if (name) {
    window.location.href = "pet_ranking.html?pet=" + encodeURIComponent(name);
  }
}

function openModalByName(name) {
  if (PET_DATA[name]) openModal(name);
}
