<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>WIND 펫 도감</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#faf9ff; --bg2:#f3f0ff; --white:#ffffff;
      --s1:#f8f7ff; --s2:#f0eeff;
      --border:#e8e3ff; --border2:#d4cbff;
      --a1:#9b87f5; --a2:#f587b8; --a3:#87d4f5; --a4:#f5c887; --a5:#87f5c0;
      --t1:#3d3560; --t2:#7b72a8; --t3:#b0a8d4; --t4:#d4cff0;
      --ok:#6dd5a0; --err:#f57878;
      --shadow:0 4px 24px rgba(155,135,245,0.12);
      --shadow2:0 8px 32px rgba(155,135,245,0.18);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--t1); min-height:100vh;
      background-image:
        radial-gradient(circle at 15% 20%,rgba(155,135,245,0.08) 0%,transparent 50%),
        radial-gradient(circle at 85% 80%,rgba(245,135,184,0.07) 0%,transparent 50%);
    }

    /* ── Header ── */
    .page-header {
      background:var(--white); border-bottom:1.5px solid var(--border);
      padding:16px 20px; position:sticky; top:0; z-index:100;
      box-shadow:var(--shadow);
    }
    .header-inner {
      max-width:960px; margin:0 auto;
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }
    .back-btn {
      display:flex; align-items:center; gap:5px;
      padding:7px 14px; border:1.5px solid var(--border2);
      border-radius:10px; background:var(--s1); color:var(--a1);
      font-size:12px; font-weight:700; font-family:'Noto Sans KR',sans-serif;
      cursor:pointer; text-decoration:none; transition:all .15s;
    }
    .back-btn:hover { background:var(--a1); color:#fff; border-color:var(--a1); }
    .header-title {
      font-family:'Nunito',sans-serif; font-weight:900; font-size:20px;
      background:linear-gradient(135deg,var(--a1),var(--a2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header-count {
      font-size:11px; color:var(--t3); font-weight:600;
      margin-left:auto;
    }

    /* ── Filters ── */
    .filter-bar {
      max-width:960px; margin:16px auto 0; padding:0 16px;
    }
    .filter-row {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; align-items:center;
    }
    .filter-label {
      font-size:10px; font-weight:700; color:var(--t3);
      letter-spacing:1.5px; font-family:'Nunito',sans-serif;
      min-width:36px;
    }
    .filter-btn {
      padding:5px 12px; font-size:11px; font-weight:700;
      font-family:'Noto Sans KR',sans-serif;
      border:1.5px solid var(--border); border-radius:99px;
      background:var(--white); color:var(--t2);
      cursor:pointer; transition:all .15s;
    }
    .filter-btn:hover { border-color:var(--a1); color:var(--a1); }
    .filter-btn.active { background:var(--a1); color:#fff; border-color:var(--a1); }
    .filter-btn.active-수 { background:#1976d2; color:#fff; border-color:#1976d2; }
    .filter-btn.active-지 { background:#388e3c; color:#fff; border-color:#388e3c; }
    .filter-btn.active-화 { background:#e65100; color:#fff; border-color:#e65100; }
    .filter-btn.active-풍 { background:#7b1fa2; color:#fff; border-color:#7b1fa2; }

    .search-input {
      flex:1; min-width:160px; max-width:260px;
      padding:6px 14px; border:1.5px solid var(--border);
      border-radius:99px; font-size:12px; color:var(--t1);
      font-family:'Noto Sans KR',sans-serif; background:var(--white);
      transition:border-color .15s;
    }
    .search-input:focus { outline:none; border-color:var(--a1); }

    /* ── Table ── */
    .table-wrap {
      max-width:960px; margin:12px auto 40px; padding:0 16px;
      overflow-x:auto;
    }
    table {
      width:100%; border-collapse:collapse;
      background:var(--white); border-radius:16px;
      overflow:hidden; box-shadow:var(--shadow);
    }
    thead tr {
      background:linear-gradient(135deg,var(--s2),var(--s1));
      border-bottom:2px solid var(--border);
    }
    th {
      padding:10px 12px; font-size:10px; letter-spacing:1.5px;
      color:var(--t2); font-family:'Nunito',sans-serif; font-weight:800;
      text-align:left; white-space:nowrap; cursor:pointer; user-select:none;
      transition:color .15s;
    }
    th:hover { color:var(--a1); }
    th.sorted { color:var(--a1); }
    th .sort-icon { display:inline-block; margin-left:3px; opacity:.5; font-size:9px; }
    th.sorted .sort-icon { opacity:1; }

    tbody tr {
      border-bottom:1px solid var(--border);
      transition:background .12s;
    }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--s1); }

    td {
      padding:9px 12px; font-size:12px; color:var(--t1); vertical-align:middle;
    }
    .td-name { font-weight:700; font-size:13px; }
    .td-num {
      font-family:'Nunito',sans-serif; font-weight:700;
      text-align:right; color:var(--t1);
    }
    .td-num.highlight { color:var(--a1); font-weight:900; }

    /* 등급 배지 */
    .grade-badge {
      font-size:9px; font-weight:800; padding:2px 6px; border-radius:5px;
      font-family:'Nunito',sans-serif; white-space:nowrap;
    }
    .grade-최상급 { background:#fff0f6; color:#e0508a; border:1px solid #f5c8de; }
    .grade-상급   { background:#f0eeff; color:#9b87f5; border:1px solid #d4cbff; }
    .grade-2등급  { background:#f0f9ff; color:#5ab5e0; border:1px solid #c5e8f7; }
    .grade-일반   { background:#f5f5f5; color:#999;    border:1px solid #e0e0e0; }

    /* 속성 바 */
    .attr-bar { display:flex; gap:2px; align-items:center; }
    .attr-pip {
      font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px;
      font-family:'Nunito',sans-serif; white-space:nowrap;
    }
    .attr-지 { background:#e8f5e9; color:#388e3c; border:1px solid #c8e6c9; }
    .attr-수 { background:#e3f2fd; color:#1976d2; border:1px solid #bbdefb; }
    .attr-화 { background:#fff3e0; color:#e65100; border:1px solid #ffe0b2; }
    .attr-풍 { background:#f3e5f5; color:#7b1fa2; border:1px solid #e1bee7; }

    /* 획득방법 */
    .obtain-badge {
      font-size:10px; padding:2px 7px; border-radius:5px;
      background:var(--s1); color:var(--t2); border:1px solid var(--border);
      white-space:nowrap; max-width:160px; overflow:hidden; text-overflow:ellipsis;
      display:inline-block;
    }

    .no-result {
      text-align:center; padding:40px; color:var(--t3); font-size:14px;
    }

    /* 정렬 강조 열 */
    td.col-highlight { background:rgba(155,135,245,0.04); }

    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

    @media(max-width:600px) {
      th, td { padding:7px 8px; font-size:11px; }
      .td-name { font-size:12px; }
    }
  </style>
</head>
<body>

<div class="page-header">

</div>

<div class="table-wrap">

      </tr>
    </thead>
    <tbody id="pet-tbody"></tbody>
  </table>
  <div class="no-result" id="no-result" style="display:none">검색 결과가 없어요 🌸</div>
</div>

  let entries = Object.entries(PET_DATA);

  // 검색 필터
  if (searchQ) {
    const q = searchQ.toLowerCase();
    entries = entries.filter(([n,p]) =>
      n.includes(searchQ) || (p.obtain||"").includes(searchQ)
    );
  }

  // 등급 필터
  if (filterGrade) entries = entries.filter(([n,p]) => p.grade === filterGrade);

  // 속성 필터
  if (filterAttr) entries = entries.filter(([n,p]) => (p.attr?.[filterAttr] ?? 0) > 0);

  // 정렬
  entries.sort(([na,a],[nb,b]) => {
    let va, vb;
    if (sortCol === "name") { va=na; vb=nb; }
    else { va=getVal(a,sortCol); vb=getVal(b,sortCol); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return na.localeCompare(nb, 'ko-KR');
  });

  const tbody = document.getElementById("pet-tbody");
  tbody.innerHTML = "";

  const highlightCols = {"sg_atk":4,"sg_def":5,"sg_hp":6,"sg_agi":7};
  const hlIdx = highlightCols[sortCol] ?? -1;

  entries.forEach(([name, pet]) => {
    const tr = document.createElement("tr");

    // 이름
    const tdName = document.createElement("td");
    tdName.className = "td-name";
    tdName.textContent = name;
    tr.appendChild(tdName);

    // 등급
    const tdGrade = document.createElement("td");
    tdGrade.innerHTML = `<span class="grade-badge grade-${pet.grade}">${pet.grade}</span>`;
    tr.appendChild(tdGrade);

    // 속성
    const tdAttr = document.createElement("td");
    const attrBar = document.createElement("div");
    attrBar.className = "attr-bar";
    ["지","수","화","풍"].forEach(a => {
      const v = pet.attr?.[a] ?? 0;
      if (v > 0) {
        const pip = document.createElement("span");
        pip.className = `attr-pip attr-${a}`;
        pip.textContent = `${a}${v}`;
        attrBar.appendChild(pip);
      }
    });
    tdAttr.appendChild(attrBar);
    tr.appendChild(tdAttr);

    // 성장률 4개
    ["sg_atk","sg_def","sg_hp","sg_agi"].forEach((col,i) => {
      const td = document.createElement("td");
      td.className = "td-num" + (col === sortCol ? " highlight" : "");
      const v = getVal(pet, col);
      td.textContent = v > 0 ? v.toFixed(3) : "-";
      tr.appendChild(td);
    });

    // 획득방법
    const tdObtain = document.createElement("td");
    tdObtain.innerHTML = `<span class="obtain-badge" title="${pet.obtain}">${pet.obtain||"-"}</span>`;
    tr.appendChild(tdObtain);

    tbody.appendChild(tr);
  });

  document.getElementById("count-label").textContent = `${entries.length} / 305마리`;
  document.getElementById("no-result").style.display = entries.length === 0 ? "block" : "none";
  document.getElementById("pet-table").style.display = entries.length === 0 ? "none" : "";

  // 정렬 헤더 표시
  document.querySelectorAll("th[data-col]").forEach(th => {
    const col = th.dataset.col;
    const icon = th.querySelector(".sort-icon");
    if (!icon) return;
    if (col === sortCol) {
      th.classList.add("sorted");
      icon.textContent = sortAsc ? "↑" : "↓";
    } else {
      th.classList.remove("sorted");
      icon.textContent = "↕";
    }
  });
}

// 헤더 정렬 클릭
document.querySelectorAll("th[data-col]").forEach(th => {
  if (th.dataset.col === "attr") return;
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = col === "name" || col === "grade"; }
    renderTable();
  });
});

// 등급 필터
document.querySelectorAll("[data-grade]").forEach(btn => {
  btn.addEventListener("click", () => {
    filterGrade = btn.dataset.grade;
    document.querySelectorAll("[data-grade]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderTable();
  });
});

// 속성 필터
document.querySelectorAll("[data-attr]").forEach(btn => {
  btn.addEventListener("click", () => {
    filterAttr = btn.dataset.attr;
    document.querySelectorAll("[data-attr]").forEach(b => {
      b.classList.remove("active","active-지","active-수","active-화","active-풍");
    });
    btn.classList.add("active" + (filterAttr ? `-${filterAttr}` : ""));
    renderTable();
  });
});

// 검색
document.getElementById("search-input").addEventListener("input", e => {
  searchQ = e.target.value.trim();
  renderTable();
});

renderTable();
</script>
</body>
</html>
