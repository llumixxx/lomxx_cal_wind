<title>🐾 WIND 펫 이상형 월드컵</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#faf9ff;min-height:100vh;color:#3d3560;background-image:radial-gradient(circle at 15% 20%,rgba(155,135,245,.1) 0%,transparent 50%),radial-gradient(circle at 85% 80%,rgba(245,135,184,.08) 0%,transparent 50%)}
.wrap{max-width:760px;margin:0 auto;padding:1.2rem 1rem 3rem}
.header{text-align:center;margin-bottom:1.2rem;padding-top:.8rem;position:relative}
.home-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:1.5px solid #d4cbff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:#6c5ce7;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.home-btn:hover{background:#f3f0ff}
.title{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;background:linear-gradient(135deg,#9b87f5,#f587b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:3px}
.sub{font-size:13px;color:#7b72a8}
.badges{display:flex;gap:7px;justify-content:center;margin-bottom:.9rem;flex-wrap:wrap}
.badge{font-size:12px;padding:3px 11px;border-radius:8px;background:#f0eeff;color:#7b72a8;border:.5px solid #e8e3ff}
.badge.round{background:#ede9ff;color:#6c5ce7;font-weight:700;border-color:#c5beff}
.progress-wrap{height:6px;background:#e8e3ff;border-radius:3px;margin-bottom:1.2rem;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#9b87f5,#f587b8);border-radius:3px;transition:width .4s}

/* VS 아레나 */
.arena{display:flex;align-items:stretch;gap:12px;margin-bottom:1.2rem}
.card{flex:1;background:#fff;border:1.5px solid #e8e3ff;border-radius:18px;padding:1rem .9rem .9rem;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;box-shadow:0 2px 12px rgba(155,135,245,.07)}
.card:hover{border-color:#9b87f5;transform:translateY(-3px);box-shadow:0 8px 28px rgba(155,135,245,.18)}
.card:active{transform:scale(.97)}
.pet-img-wrap{width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:#f7f5ff;border-radius:12px;overflow:hidden;flex-shrink:0}
.pet-img-wrap img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
.pet-name{font-size:16px;font-weight:700;color:#3d3560;text-align:center;line-height:1.2}
.pet-grade{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.grade-일반{background:#f0eeff;color:#7b72a8}
.grade-1등급{background:#fff8e1;color:#f59e0b}
.grade-2등급{background:#fce7f3;color:#ec4899}
.attrs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.attr-badge{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.attr-지{background:#e8f5e9;color:#2e7d32}
.attr-수{background:#e3f2fd;color:#1565c0}
.attr-화{background:#fce4ec;color:#c62828}
.attr-풍{background:#e8eaf6;color:#283593}
.mount-badge{font-size:11px;padding:2px 9px;border-radius:6px;font-weight:600}
.mount-yes{background:#e8f5e9;color:#2e7d32}
.mount-no{background:#fafafa;color:#bbb;border:.5px solid #e0e0e0}
.obtain-row{width:100%;font-size:10.5px;color:#9e97c8;text-align:center;line-height:1.4;background:#f7f5ff;border-radius:8px;padding:4px 7px}
.stats-section{width:100%;font-size:11px}
.stats-title{color:#b0a8d4;font-size:10px;letter-spacing:.5px;margin-bottom:4px;text-align:center}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:.5px solid #f0eeff}
.stat-label{color:#b0a8d4;font-size:10px}
.stat-val{color:#6c5ce7;font-weight:700;font-size:11px}
.pick-btn{display:block;width:100%;margin-top:auto;padding:9px;border-radius:10px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:#f3f0ff;border:1.5px solid #d4cbff;color:#6c5ce7;transition:all .15s}
.pick-btn:hover{background:#9b87f5;color:#fff;border-color:#9b87f5}
.vs-sep{display:flex;align-items:center;justify-content:center;width:34px;flex-shrink:0}
.vs-text{font-family:'Nunito',sans-serif;font-size:18px;font-weight:900;color:#c5beff}

/* 설정 화면 */
.config-box{background:#fff;border:1.5px solid #e8e3ff;border-radius:18px;padding:1.4rem;margin-bottom:1rem;box-shadow:0 2px 12px rgba(155,135,245,.07)}
.config-title{font-size:13px;font-weight:700;color:#7b72a8;letter-spacing:.8px;margin-bottom:.9rem}
.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:440px){.size-grid{grid-template-columns:repeat(3,1fr)}}
.size-btn{padding:12px 4px;border-radius:12px;border:1.5px solid #e8e3ff;background:#faf9ff;cursor:pointer;text-align:center;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.size-btn:hover{border-color:#9b87f5;background:#f3f0ff}
.size-btn.active{border:2px solid #9b87f5;background:#ede9ff}
.size-num{font-size:18px;font-weight:700;color:#3d3560;display:block;margin-bottom:1px}
.size-label{font-size:10px;color:#b0a8d4;display:block}
.start-btn{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#9b87f5,#f587b8);color:#fff;border:none;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:opacity .15s}
.start-btn:hover{opacity:.88}

/* 결과 화면 */
.result-wrap{text-align:center;padding:.5rem}
.trophy{font-size:50px;display:block;margin-bottom:.4rem}
.champ-img-wrap{width:120px;height:120px;display:flex;align-items:center;justify-content:center;background:#f7f5ff;border-radius:20px;margin:0 auto .6rem;overflow:hidden}
.champ-img-wrap img{width:110px;height:110px;object-fit:contain;image-rendering:pixelated}
.champ-name{font-size:26px;font-weight:700;color:#3d3560;margin-bottom:3px}
.champ-sub{font-size:12px;color:#9b87f5;font-weight:600;margin-bottom:1.2rem}
.result-list{background:#fff;border:1.5px solid #e8e3ff;border-radius:16px;padding:.4rem .9rem;margin-bottom:1.4rem;box-shadow:0 2px 12px rgba(155,135,245,.07)}
.result-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid #f0eeff;font-size:13px}
.result-item:last-child{border-bottom:none}
.result-rank{font-weight:700;width:26px;font-size:17px}
.result-img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated;background:#f7f5ff;border-radius:8px;padding:2px}
.result-name{color:#3d3560;font-weight:500;flex:1;text-align:left}
.result-grade{font-size:10px;color:#b0a8d4}
.restart-btn{padding:10px 28px;border-radius:10px;background:#f3f0ff;border:1.5px solid #d4cbff;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#6c5ce7;transition:all .15s}
.restart-btn:hover{background:#9b87f5;color:#fff;border-color:#9b87f5}

/* 라운드 시작 오버레이 */
@keyframes toastIn {
  0%   { opacity:0; transform:translateY(-20px) scale(.95); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes toastOut {
  0%   { opacity:1; transform:translateY(0) scale(1); }
  100% { opacity:0; transform:translateY(-16px) scale(.95); }
}
.round-overlay {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  z-index:999; pointer-events:none;
}
.round-banner {
  background:linear-gradient(135deg,#9b87f5,#f587b8);
  border-radius:40px;
  padding:10px 28px;
  display:flex; align-items:center; gap:10px;
  box-shadow:0 4px 20px rgba(155,135,245,.4);
  animation: toastIn .28s cubic-bezier(.34,1.56,.64,1) forwards;
  white-space:nowrap;
}
.round-banner.out {
  animation: toastOut .22s ease-in forwards;
}
.round-banner-main {
  font-family:'Nunito',sans-serif;
  font-size:18px;font-weight:900;color:#fff;
}
.round-banner-sub {
  font-size:11px;color:rgba(255,255,255,.75);
}
.round-banner-count { display:none; }
</style>

let history = [];

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function startGame(size) {
  // size는 "강" 수 (경기 수). 출전 마리 수 = size * 2. 0이면 전체.
  var petCount = size === 0 ? ALL_PETS.length : size * 2;
  var picked = shuffle(ALL_PETS).slice(0, petCount);
  var total = picked.length;

  // 홀수면 마지막 1마리 부전승 (winners에 미리 넣기)
  var preWinners = [];
  if (total % 2 === 1) {
    preWinners.push(picked.pop());
  }

  state.size = total;
  state.round = picked;       // 짝수 배열 → 1:1 대결
  state.pair = 0;
  state.winners = preWinners; // 부전승 펫 미리 포함
  state.results = [];
  state.done = preWinners.length;
  state.roundNum = 1;
  state.screen = 'game';
  state.originalCount = total;
  // 총 라운드 수: ceil(log2(total))
  state.totalRounds = Math.ceil(Math.log2(total));

  showRoundBanner(state.roundNum, total, state.totalRounds, function() {
    render();
  });
}

// count = 이번 라운드 참가 펫 수, 경기 수(강) = count/2
function roundName(count) {
  var matches = Math.floor(count / 2);
  if (matches <= 1)  return '🏆 결승';
  if (matches <= 2)  return '준결승';
  if (matches <= 4)  return '4강';
  if (matches <= 8)  return '8강';
  if (matches <= 16) return '16강';
  if (matches <= 32) return '32강';
  if (matches <= 64) return '64강';
  return matches + '강';
}

function showRoundBanner(roundNum, total, totalRounds, cb) {
  var petCount = Math.ceil(total / Math.pow(2, roundNum - 1));
  var name = roundName(petCount);
  const overlay = document.createElement('div');
  overlay.className = 'round-overlay';
  overlay.innerHTML =
    '<div class="round-banner" id="rb">' +
    '<div class="round-banner-main">' + name + '</div>' +
    '<div class="round-banner-sub">' + petCount + '마리 참가</div>' +
    '</div>';
  document.body.appendChild(overlay);
  if (cb) cb();
  setTimeout(function() {
    const rb = document.getElementById('rb');
    if (rb) rb.classList.add('out');
    setTimeout(function() {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }, 240);
  }, 900);
}

function choose(idx) {
  // 히스토리 저장 (뒤로가기용)
  history.push(JSON.parse(JSON.stringify(state)));

  const a = state.round[state.pair*2], b = state.round[state.pair*2+1];
  const win = idx===0 ? a : b, lose = idx===0 ? b : a;
  // 통계 저장 (주별 / 월별 / 전체)
  var _now = new Date();
  var _yr  = _now.getFullYear();
  var _mo  = String(_now.getMonth()+1).padStart(2,'0');
  // ISO 주차 계산
  var _d   = new Date(Date.UTC(_yr, _now.getMonth(), _now.getDate()));
  var _day = _d.getUTCDay() || 7;
  _d.setUTCDate(_d.getUTCDate() + 4 - _day);
  var _wk  = String(Math.ceil(((_d - new Date(Date.UTC(_d.getUTCFullYear(),0,1)))/86400000+1)/7)).padStart(2,'0');
  var _weekKey = _yr + '-W' + _wk;
  var _monthKey = _yr + '-' + _mo;
  var _petName = win.n;
  db.ref('stats/week/' + _weekKey + '/' + _petName).transaction(function(c){ return (c||0)+1; });
  db.ref('stats/month/' + _monthKey + '/' + _petName).transaction(function(c){ return (c||0)+1; });
  db.ref('stats/total/' + _petName).transaction(function(c){ return (c||0)+1; });
  state.winners.push(win);
  state.results.push({win, lose});
  state.done++;
  state.pair++;

  if (state.pair*2 >= state.round.length) {
    // 이번 라운드 끝
    const allWinners = state.winners;
    if (allWinners.length === 1) {
      state.screen = 'result';
      render();
      return;
    }
    // 다음 라운드 준비
    var nextPets = shuffle(allWinners);
    var preW = [];
    if (nextPets.length % 2 === 1) {
      preW.push(nextPets.pop());
    }
    state.roundNum++;
    state.round = nextPets;
    state.pair = 0;
    state.winners = preW;
    state.done += preW.length;

    showRoundBanner(state.roundNum, state.originalCount, state.totalRounds, function() {
      render();
    });
    return;
  }
  render();
}

function pct() {
  const total = state.originalCount - 1;
  return total > 0 ? Math.round(state.done / total * 100) : 0;
}

function attrBadges(a) {
  return Object.entries(a)
    .filter(function(kv) { return kv[1] > 0; })
    .map(function(kv) { return '<span class="attr-badge attr-' + kv[0] + '">' + kv[0] + ' ' + kv[1] + '</span>'; })
    .join('');
}

function statsHtml(pet) {
  var ic = pet.ic, sg = pet.sg;
  return '<div class="stats-section">' +
    '<div class="stats-title">초기치 / 성장률</div>' +
    '<div class="stats-grid">' +
    '<div class="stat-row"><span class="stat-label">내구력</span><span class="stat-val">' + ic.hp + ' / <span style="color:#f587b8">' + sg.hp + '</span></span></div>' +
    '<div class="stat-row"><span class="stat-label">공격력</span><span class="stat-val">' + ic.atk + ' / <span style="color:#f587b8">' + sg.atk + '</span></span></div>' +
    '<div class="stat-row"><span class="stat-label">방어력</span><span class="stat-val">' + ic.def + ' / <span style="color:#f587b8">' + sg.def + '</span></span></div>' +
    '<div class="stat-row"><span class="stat-label">순발력</span><span class="stat-val">' + ic.agi + ' / <span style="color:#f587b8">' + sg.agi + '</span></span></div>' +
    '</div></div>';
}

function cardHtml(pet, idx) {
  var mountBadge = pet.m
    ? '<span class="mount-badge mount-yes">🐴 탑승 가능</span>'
    : '<span class="mount-badge mount-no">탑승 불가</span>';
  var img = '<div class="pet-img-wrap"><img src="' + pet.i + '" alt="' + pet.n + '" onerror="this.style.opacity=\'0.3\'"></div>';
  return '<div class="card" onclick="choose(' + idx + ')">' +
    img +
    '<div class="pet-name">' + pet.n + '</div>' +
    '<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center">' +
    '<span class="pet-grade grade-' + pet.g + '">' + pet.g + '</span>' +
    mountBadge + '</div>' +
    '<div class="attrs">' + attrBadges(pet.a) + '</div>' +
    statsHtml(pet) +
    '<div class="obtain-row">📍 ' + pet.o + '</div>' +
    '<button class="pick-btn" onclick="event.stopPropagation();choose(' + idx + ')">선택 ✓</button>' +
    '</div>';
}

var app = document.getElementById('app');

function renderConfig() {
  var sizes = [8,16,32,64,0];
  var sizeBtns = sizes.map(function(n) {
    var label = n === 0 ? '전체' : n + '강';
    var sub = n === 0 ? ALL_PETS.length + '마리' : (n * 2) + '마리';
    return '<button class="size-btn' + (state.size===n ? ' active' : '') + '" onclick="selectSize(' + n + ')">' +
      '<span class="size-num">' + label + '</span>' +
      '<span class="size-label">' + sub + '</span></button>';
  }).join('');
  app.innerHTML =
    '<div class="header"><div class="title">🐾 펫 이상형 월드컵</div>' +
    '<div class="sub">WIND 온라인 펫 ' + ALL_PETS.length + '마리 · 나만의 최애를 뽑아보세요</div></div>' +
    '<div class="config-box"><div class="config-title">참가 규모 선택</div>' +
    '<div class="size-grid">' + sizeBtns + '</div></div>' +
    '<button class="start-btn" onclick="startGame(' + state.size + ')">월드컵 시작! 🚀</button>';
}

function selectSize(n) { state.size = n; renderConfig(); }

function renderGame() {
  var a = state.round[state.pair*2], b = state.round[state.pair*2+1];
  var rn = roundName(Math.ceil(state.originalCount / Math.pow(2, state.roundNum - 1)));
  var p = pct();
  app.innerHTML =
    '<div class="header">' +
    '<div class="title">🐾 펫 이상형 월드컵</div>' +
    '<button class="home-btn" onclick="restart()" title="처음부터 다시하기">🏠 처음으로</button>' +
    '</div>' +
    '<div class="badges">' +
    '<span class="badge round">' + rn + '</span>' +
    '<span class="badge">' + (state.pair+1) + ' / ' + (state.round.length/2) + ' 경기</span>' +
    '<span class="badge">진행 ' + p + '%</span></div>' +
    '<div class="progress-wrap"><div class="progress-bar" style="width:' + p + '%"></div></div>' +
    '<div class="arena">' + cardHtml(a,0) +
    '<div class="vs-sep"><span class="vs-text">VS</span></div>' +
    cardHtml(b,1) + '</div>';
}

function renderResult() {
  var champ = state.results[state.results.length-1].win;
  var top4 = []; var seen = {};
  for (var i = state.results.length-1; i >= 0 && top4.length < 4; i--) {
    var r = state.results[i];
    if (!seen[r.win.n]) { seen[r.win.n]=1; top4.push(r.win); }
    if (top4.length < 4 && !seen[r.lose.n]) { seen[r.lose.n]=1; top4.push(r.lose); }
  }
  var medals = ['🥇','🥈','🥉','4위'];
  var list = top4.map(function(p,i) {
    return '<div class="result-item">' +
      '<span class="result-rank">' + medals[i] + '</span>' +
      '<img class="result-img" src="' + p.i + '" alt="' + p.n + '" onerror="this.style.opacity=\'0.3\'">' +
      '<span class="result-name">' + p.n + '</span>' +
      '<span class="result-grade">' + p.g + '</span></div>';
  }).join('');
  app.innerHTML =
    '<div class="result-wrap">' +
    '<span class="trophy">🏆</span>' +
    '<div class="champ-img-wrap"><img src="' + champ.i + '" alt="' + champ.n + '" onerror="this.style.opacity=\'0.3\'"></div>' +
    '<div class="champ-name">' + champ.n + '</div>' +
    '<div class="champ-sub">' + champ.g + ' · ' + (champ.m ? '🐴 탑승 가능' : '탑승 불가') + '</div>' +
    '<div class="result-list">' + list + '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
    '<button class="restart-btn" onclick="restart()">🔄 다시 하기</button>' +
    '<button class="restart-btn" style="background:#f3f0ff" onclick="showStats()">📊 통계 보기</button>' +
    '</div></div>';
}

function restart() {
  history = [];
  state = {screen:'config', size:state.size, round:[], pair:0, winners:[], results:[], done:0, roundNum:1, totalRounds:0, originalCount:0};
  render();
}

function goBack() {
  if (history.length === 0) {
    restart();
    return;
  }
  state = history.pop();
  render();
}

function render() {
  if (state.screen === 'config') renderConfig();
  else if (state.screen === 'game') renderGame();
  else renderResult();
}

function showStats() {
  // 로딩 표시
  app.innerHTML =
    '<div class="header"><div class="title">📊 선택 통계</div>' +
    '<div class="sub">데이터 불러오는 중...</div></div>';

  var now = new Date();
  var yr  = now.getFullYear();
  var mo  = String(now.getMonth()+1).padStart(2,'0');
  var d   = new Date(Date.UTC(yr, now.getMonth(), now.getDate()));
  var day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  var wk  = String(Math.ceil(((d - new Date(Date.UTC(d.getUTCFullYear(),0,1)))/86400000+1)/7)).padStart(2,'0');
  var weekKey  = yr + '-W' + wk;
  var monthKey = yr + '-' + mo;

  var loaded = 0;
  function tryRender() {
    loaded++;
    if (loaded === 3) _renderStats('week');
  }

  db.ref('stats/week/'  + weekKey ).once('value').then(function(s){ statsData.week  = s.val() || {}; tryRender(); });
  db.ref('stats/month/' + monthKey).once('value').then(function(s){ statsData.month = s.val() || {}; tryRender(); });
  db.ref('stats/total'            ).once('value').then(function(s){ statsData.total = s.val() || {}; tryRender(); });
}
function _renderStats(tab) {
  tab = tab || 'week';
  var tabLabels = { week: '이번 주', month: '이번 달', total: '전체' };
  var data = statsData[tab] || {};
  var entries = Object.entries(data);

  var petMap = {};
  ALL_PETS.forEach(function(p){ petMap[p.n] = p; });

  // 탭 버튼
  var tabList = ['week','month','total'];
  var tabs = tabList.map(function(t) {
    var isActive = t === tab;
    var btn = document.createElement('button');
    btn.textContent = tabLabels[t];
    btn.setAttribute('onclick', 'switchStatsTab("' + t + '")');
    btn.style.cssText = (isActive
      ? 'background:linear-gradient(135deg,#9b87f5,#f587b8);color:#fff;border-color:transparent'
      : 'background:#f3f0ff;color:#6c5ce7;border-color:#d4cbff') +
      ';border:1.5px solid;border-radius:20px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer';
    return btn.outerHTML;
  }).join('');

  var content;
  if (entries.length === 0) {
    content = '<div style="text-align:center;padding:2rem;color:#b0a8d4;font-size:14px">아직 기록이 없어요 🐾</div>';
  } else {
    entries.sort(function(a,b){ return b[1]-a[1]; });
    var top = entries.slice(0, 20);
    var maxVal = top[0][1];
    var total = entries.reduce(function(s,e){ return s+e[1]; }, 0);
    content = '<div style="font-size:11px;color:#b0a8d4;margin-bottom:8px">총 ' + total + '번 선택됨</div>';
    content += top.map(function(e, i) {
      var p = petMap[e[0]];
      var img = p ? '<img src="' + p.i + '" style="width:28px;height:28px;object-fit:contain;image-rendering:pixelated;background:#f7f5ff;border-radius:6px;padding:2px;flex-shrink:0" onerror="this.style.opacity=0.3">' : '';
      var barW = Math.round(e[1] / maxVal * 100);
      return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid #f0eeff">' +
        '<span style="font-size:13px;font-weight:700;width:20px;color:#9b87f5">' + (i+1) + '</span>' +
        img +
        '<span style="flex:1;font-size:13px;font-weight:500;color:#3d3560">' + e[0] + '</span>' +
        '<div style="width:80px;height:6px;background:#f0eeff;border-radius:3px;overflow:hidden">' +
          '<div style="width:' + barW + '%;height:100%;background:linear-gradient(90deg,#9b87f5,#f587b8);border-radius:3px"></div>' +
        '</div>' +
        '<span style="font-size:12px;font-weight:700;color:#6c5ce7;width:28px;text-align:right">' + e[1] + '</span>' +
        '</div>';
    }).join('');
  }

  app.innerHTML =
    '<div class="header"><div class="title">📊 선택 통계</div></div>' +
    '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:1rem">' + tabs + '</div>' +
    '<div class="config-box" style="padding:1rem 1.2rem">' +
    '<div class="config-title">' + tabLabels[tab] + ' 많이 선택된 펫 TOP 20</div>' +
    content +
    '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:1rem">' +
    '<button class="restart-btn" onclick="restart()">🔄 다시 하기</button>' +
    '</div>';
}

function switchStatsTab(tab) {
  _renderStats(tab);
}

window.choose = choose;
window.selectSize = selectSize;
window.startGame = startGame;
window.restart = restart;
window.goBack = goBack;
window.showStats = showStats;
window.switchStatsTab = switchStatsTab;
render();
</script>
</body>
</html>
