/* ===== 상점 =====
   고기 3종(랜덤 2~3개) + 스킬(배우지 않은 것 중 1~2개 랜덤) + 엘릭서(확률) */
function rollShop() {
  const meatKeys = ['meat_berga', 'meat_manmo', 'meat_kaku'];
  const skillKeys = Object.keys(SKILLS);
  const stock = [];

  // 고기 2~3개
  const meatShuf = [...meatKeys].sort(() => Math.random() - 0.5);
  const meatCount = 2 + (Math.random() < 0.5 ? 1 : 0);
  meatShuf.slice(0, meatCount).forEach(k => stock.push({ type: 'item', id: k }));

  // 엘릭서 30% 확률
  if (Math.random() < 0.3) stock.push({ type: 'item', id: 'elixir' });

  // 스킬 1~2개 (현재 출전 펫이 안 배운 것 우선)
  const me = state.party[state.activeIndex];
  const learned = new Set(me.skills || []);
  const unlearned = skillKeys.filter(k => !learned.has(k));
  const skillShuf = unlearned.sort(() => Math.random() - 0.5);
  const skillCount = Math.min(1 + (Math.random() < 0.5 ? 1 : 0), skillShuf.length);
  skillShuf.slice(0, skillCount).forEach(k => stock.push({ type: 'skill', id: k }));

  return stock;
}

function buyItem(itemId, stockIdx) {
  const it = ITEMS[itemId];
  if (!it) return;
  if (state.stones < it.price) return;
  state.stones -= it.price;
  state.inventory[itemId] = (state.inventory[itemId] || 0) + 1;
  state.shopStock.splice(stockIdx, 1);
  playSfx('capture_success');
  render();
}

function buySkill(skillId, stockIdx) {
  const s = SKILLS[skillId];
  if (!s) return;
  if (state.stones < s.price) return;
  // 펫 선택 UI 띄우기
  state.shopPicker = { skillId, stockIdx };
  render();
}

function confirmSkillLearn(petIdx) {
  const pick = state.shopPicker;
  if (!pick) return;
  const s = SKILLS[pick.skillId];
  const pet = state.party[petIdx];
  if (!pet || !s) return;
  if (state.stones < s.price) { state.shopPicker = null; render(); return; }
  if (!pet.skills) pet.skills = [];
  if (pet.skills.includes(pick.skillId)) {
    // 이미 배운 기술 - 환불 없이 취소만
    state.shopPicker = null;
    render();
    return;
  }
  pet.skills.push(pick.skillId);
  state.stones -= s.price;
  state.shopStock.splice(pick.stockIdx, 1);
  state.shopPicker = null;
  playSfx('crit');
  render();
}

function cancelSkillPicker() {
  state.shopPicker = null;
  render();
}

function leaveShop() {
  state.scene = 'reward';
  state.pendingRewards = rollRewards();
  state.mode = 'action';
  render();
}

/* ===== 저장 ===== */
async function saveStats() {
  try {
    if (window.storage) {
      await window.storage.set('windrogue:stats', JSON.stringify({
        totalRuns: state.stats.totalRuns,
        bestWave: state.stats.bestWave,
        totalCaptures: state.stats.totalCaptures,
        victories: state.stats.victories || 0,
        captured: [...state.captured],
      }));
    }
  } catch(e) { /* storage 없으면 무시 */ }
}

async function loadStats() {
  try {
    if (window.storage) {
      const r = await window.storage.get('windrogue:stats');
      if (r && r.value) {
        const data = JSON.parse(r.value);
        state.stats = {
          totalRuns: data.totalRuns || 0,
          bestWave: data.bestWave || 0,
          totalCaptures: data.totalCaptures || 0,
          victories: data.victories || 0,
        };
        state.captured = new Set(data.captured || []);
      }
    }
  } catch(e) { /* no saved data */ }
}

/* ===== 오디오 시스템 (Tone.js) ===== */
const audio = {
  ready: false,
  muted: false,
  ctx: null,       // Tone 전역
  master: null,
  bgmLoop: null,
  currentBiome: null,
};

async function initAudio() {
  if (audio.ready) return;
  if (typeof Tone === 'undefined') return;
  try {
    await Tone.start();
    audio.master = new Tone.Volume(-8).toDestination();
    audio.ready = true;
  } catch(e) { /* 실패해도 게임은 돌아감 */ }
}

function playSfx(name) {
  if (!audio.ready || audio.muted || typeof Tone === 'undefined') return;
  try {
    const now = Tone.now();
    if (name === 'hit' || name === 'hit_effective') {
      const s = new Tone.MembraneSynth({
        pitchDecay: 0.02, octaves: 4,
        envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.05 }
      }).connect(audio.master);
      s.triggerAttackRelease(name === 'hit_effective' ? 'C3' : 'G2', 0.12, now);
      setTimeout(() => s.dispose(), 400);
    } else if (name === 'crit') {
      const s = new Tone.Synth({
        oscillator: { type: 'sawtooth' },
        envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      s.triggerAttackRelease('A4', 0.05, now);
      s.triggerAttackRelease('E5', 0.08, now + 0.05);
      s.triggerAttackRelease('A5', 0.15, now + 0.13);
      setTimeout(() => s.dispose(), 600);
    } else if (name === 'faint') {
      const s = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.3 }
      }).connect(audio.master);
      s.triggerAttackRelease('E4', 0.1, now);
      s.triggerAttackRelease('C4', 0.15, now + 0.1);
      s.triggerAttackRelease('G3', 0.3, now + 0.25);
      setTimeout(() => s.dispose(), 800);
    } else if (name === 'victory') {
      const s = new Tone.Synth({
        oscillator: { type: 'square' },
        envelope: { attack: 0.005, decay: 0.2, sustain: 0.1, release: 0.15 }
      }).connect(audio.master);
      ['C5','E5','G5','C6'].forEach((n, i) => s.triggerAttackRelease(n, 0.12, now + i*0.1));
      setTimeout(() => s.dispose(), 900);
    } else if (name === 'swap') {
      const s = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      s.triggerAttackRelease('G4', 0.08, now);
      s.triggerAttackRelease('D5', 0.08, now + 0.08);
      setTimeout(() => s.dispose(), 400);
    } else if (name === 'capture') {
      const s = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.15 }
      }).connect(audio.master);
      s.triggerAttackRelease('A4', 0.1, now);
      s.triggerAttackRelease('A4', 0.1, now + 0.18);
      s.triggerAttackRelease('A4', 0.1, now + 0.36);
      setTimeout(() => s.dispose(), 700);
    } else if (name === 'capture_success') {
      const s = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
      }).connect(audio.master);
      s.triggerAttackRelease(['C5','E5','G5'], 0.4, now);
      s.triggerAttackRelease(['D5','F5','A5'], 0.4, now + 0.2);
      s.triggerAttackRelease(['C6','E6','G6'], 0.5, now + 0.4);
      setTimeout(() => s.dispose(), 1200);
    } else if (name === 'miss') {
      const s = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      s.triggerAttackRelease('D4', 0.15, now);
      s.triggerAttackRelease('A3', 0.2, now + 0.15);
      setTimeout(() => s.dispose(), 500);
    } else if (name === 'flee') {
      const s = new Tone.Synth({
        oscillator: { type: 'triangle' },
        envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
      }).connect(audio.master);
      ['E5','C5','A4','F4'].forEach((n, i) => s.triggerAttackRelease(n, 0.08, now + i*0.06));
      setTimeout(() => s.dispose(), 500);
    } else if (name === 'select') {
      const s = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 }
      }).connect(audio.master);
      s.triggerAttackRelease('E5', 0.04, now);
      setTimeout(() => s.dispose(), 200);
    }
  } catch(e) { /* ignore */ }
}

/* BGM - 바이옴별 MP3 파일 로드 */
const BGM_FILES = {
  title:   'bgm/bgm_title.mp3',
  meadow:  'bgm/bgm_meadow.mp3',
  cave:    'bgm/bgm_cave.mp3',
  coast:   'bgm/bgm_coast.mp3',
  island:  'bgm/bgm_island.mp3',
  volcano: 'bgm/bgm_volcano.mp3',
  frozen:  'bgm/bgm_frozen.mp3',
  boss:    'bgm/bgm_boss.mp3',
  ending:  'bgm/bgm_ending.mp3',
};

let currentBgmAudio = null;  // 현재 재생 중인 Audio 객체

async function startBgm(bgmId) {
  if (audio.muted) return;
  if (audio.currentBiome === bgmId && currentBgmAudio && !currentBgmAudio.paused) return;
  stopBgm();
  const src = BGM_FILES[bgmId];
  if (!src) return;
  try {
    const a = new Audio(src);
    a.loop = true;
    a.volume = 0.35; // 기본 볼륨
    // 약간의 페이드인
    a.volume = 0;
    const playPromise = a.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(() => { /* autoplay 막힘 */ });
    }
    // 페이드인 (0 → 0.35, 1초)
    let vol = 0;
    const fadeIn = setInterval(() => {
      vol += 0.035;
      if (vol >= 0.35) { vol = 0.35; clearInterval(fadeIn); }
      if (a && !a.paused) a.volume = vol;
    }, 100);

    currentBgmAudio = a;
    audio.currentBiome = bgmId;
  } catch(e) { /* ignore */ }
}

function stopBgm() {
  if (currentBgmAudio) {
    try {
      // 짧은 페이드아웃
      const a = currentBgmAudio;
      let vol = a.volume;
      const fadeOut = setInterval(() => {
        vol -= 0.07;
        if (vol <= 0) {
          vol = 0;
          clearInterval(fadeOut);
          a.pause();
          a.src = '';
        }
        try { a.volume = Math.max(0, vol); } catch(e) {}
      }, 40);
    } catch(e) {}
    currentBgmAudio = null;
  }
  audio.currentBiome = null;
}

function toggleMute() {
  audio.muted = !audio.muted;
  if (audio.muted) {
    stopBgm();
  } else {
    // 현재 씬에 맞는 BGM 재개
    if (state.scene === 'battle' || state.scene === 'reward') {
      if (state.enemy && state.enemy.isBoss) startBgm('boss');
      else startBgm(getCurrentBiome().id);
    } else if (state.scene === 'starter') {
      startBgm('title');
    } else if (state.scene === 'victory') {
      startBgm('ending');
    }
  }
  const btn = document.getElementById('mute-btn');
  if (btn) btn.textContent = audio.muted ? '🔇' : '🔊';
}

/* 런 종료 시 랭킹 제출 (웨이브 ≥ 5만) */
async function submitRanking() {
  if (!wrDb || !state.nickname) return;
  if (state.wave < 5) return; // 너무 짧은 런은 제외
  const record = {
    nickname: state.nickname,
    wave: state.wave,
    victory: state.scene === 'victory',
    timeMs: (state.runEndTime || Date.now()) - (state.runStartTime || Date.now()),
    captures: state.party.filter(p => p.isCaptured && p.level > 5).length,
    partySize: state.party.length,
    timestamp: Date.now(),
    date: new Date().toISOString().slice(0, 10),
  };
  try {
    await wrDb.ref('windrogue_rankings').push(record);
  } catch(e) { console.warn('랭킹 제출 실패', e); }
}

/* 랭킹 불러오기 - 도달 웨이브 내림차순, 같으면 클리어타임 오름차순 */
async function fetchRanking() {
  if (!wrDb) return [];
  try {
    const snap = await wrDb.ref('windrogue_rankings').once('value');
    const data = snap.val() || {};
    const list = Object.values(data);
    // 정렬: wave ↓, 같으면 timeMs ↑
    list.sort((a, b) => {
      if (b.wave !== a.wave) return b.wave - a.wave;
      return (a.timeMs || 0) - (b.timeMs || 0);
    });
    return list.slice(0, 10);
  } catch(e) {
    console.warn('랭킹 로드 실패', e);
    return [];
  }
}

/* 저장: 현재 진행 상황을 클라우드에 저장 (닉네임별 덮어쓰기) */
async function saveToCloud() {
  if (!wrDb || !state.nickname) {
    pushLog('⚠ 저장 실패: 닉네임 또는 서버 연결 없음', 'crit');
    return false;
  }
  const saveData = {
    nickname: state.nickname,
    scene: state.scene,
    wave: state.wave,
    party: state.party.map(u => ({
      name: u.petData.name,
      level: u.level,
      iv: u.iv,
      hp: u.hp,
      maxHp: u.maxHp,
      atk: u.atk,
      def: u.def,
      agi: u.agi,
      isCaptured: u.isCaptured,
      skills: u.skills || [],
    })),
    activeIndex: state.activeIndex,
    stones: state.stones,
    inventory: state.inventory,
    runStartTime: state.runStartTime,
    captured: [...state.captured],
    savedAt: Date.now(),
  };
  try {
    const key = state.nickname.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
    await wrDb.ref('windrogue_saves/' + key).set(saveData);
    return true;
  } catch(e) {
    console.warn('저장 실패', e);
    return false;
  }
}

/* 불러오기: 닉네임으로 저장된 런 복원 */
async function loadFromCloud(nickname) {
  if (!wrDb || !nickname) return null;
  try {
    const key = nickname.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
    const snap = await wrDb.ref('windrogue_saves/' + key).once('value');
    return snap.val();
  } catch(e) {
    console.warn('불러오기 실패', e);
    return null;
  }
}

/* 로드된 데이터로 state 복원 */
function restoreFromSave(save) {
  if (!save || !save.party) return false;
  state.nickname = save.nickname;
  state.scene = 'battle';
  state.wave = save.wave;
  state.stones = save.stones || 0;
  state.inventory = save.inventory || {};
  state.runStartTime = save.runStartTime || Date.now();
  state.captured = new Set(save.captured || []);
  state.party = save.party.map(p => {
    const pd = PET_DATA.find(x => x.name === p.name);
    if (!pd) return null;
    const u = createUnit(pd, p.level, { isCaptured: p.isCaptured, iv: p.iv, skills: p.skills });
    u.hp = p.hp; u.maxHp = p.maxHp; u.atk = p.atk; u.def = p.def; u.agi = p.agi;
    return u;
  }).filter(Boolean);
  state.activeIndex = Math.min(save.activeIndex || 0, state.party.length - 1);
  state.busy = false;
  state.mode = 'action';
  // 불러온 시점부터 웨이브 시작
  beginBattle();
  return true;
}

/* 시간 포맷 mm:ss */
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}
