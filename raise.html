<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>👑 프린세스 펫 메이커 - wind01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=Jersey+15&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0f08;
    --bg2: #2a1810;
    --panel: #3a2418;
    --panel2: #4a2e1f;
    --border: #5a3b28;
    --border-hi: #8b5a3c;
    --fg: #f5e6d3;
    --fg2: #c9b4a0;
    --muted: #8b7868;
    --accent: #ffd866;
    --accent2: #ff9a50;
    --danger: #e74c3c;
    --ok: #5acba8;
    --water: #4ad9ff;
    --fire: #ff5a5a;
    --earth: #8cd462;
    --wind: #ffca55;
    --pink: #ff6b9f;
    --purple: #9a6fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--fg);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: #1a0f08;
    transition: background 1.5s;
  }

  /* ═══════════════════════════════════════════════════
     계절별 배경 (body에 class 추가하여 전환)
  ═══════════════════════════════════════════════════ */
  body.season-spring {
    background: linear-gradient(180deg, #ffc4e0 0%, #ffe6d9 40%, #ffd4c0 100%);
  }
  body.season-summer {
    background: linear-gradient(180deg, #9ae0ff 0%, #c8f0a8 60%, #ffe4a0 100%);
  }
  body.season-autumn {
    background: linear-gradient(180deg, #ffa070 0%, #ffcc66 50%, #d49050 100%);
  }
  body.season-winter {
    background: linear-gradient(180deg, #a8c8f0 0%, #dce8ff 50%, #e8f0ff 100%);
  }

  /* 계절 파티클 (꽃잎, 잎, 눈) */
  .season-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .particle {
    position: absolute;
    top: -20px;
    font-size: 20px;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0.7;
    user-select: none;
  }
  @keyframes fall {
    0% {
      transform: translateY(-20px) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% {
      transform: translateY(110vh) translateX(var(--drift)) rotate(720deg);
      opacity: 0;
    }
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 10;
  }

  /* ═══════════════════════════════════════════════════
     타이틀 바
  ═══════════════════════════════════════════════════ */
  .title-bar {
    text-align: center;
    padding: 10px 0;
    margin-bottom: 10px;
  }
  .title-bar h1 {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    color: var(--accent);
    margin: 0;
    text-shadow:
      2px 2px 0 #000,
      3px 3px 8px rgba(0,0,0,0.5);
    letter-spacing: 2px;
    font-weight: 900;
  }
  .title-bar .sub {
    font-size: 12px;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    margin-top: 4px;
  }

  /* ═══════════════════════════════════════════════════
     공통 패널
  ═══════════════════════════════════════════════════ */
  .panel {
    background: rgba(58, 36, 24, 0.92);
    backdrop-filter: blur(8px);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow:
      0 6px 0 rgba(0,0,0,0.4),
      0 10px 20px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .panel-title {
    font-family: 'Jersey 15';
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  /* ═══════════════════════════════════════════════════
     버튼 스타일
  ═══════════════════════════════════════════════════ */
  .btn {
    background: linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
    border: 2px solid var(--border-hi);
    color: var(--fg);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    transition: all .15s;
    letter-spacing: 0.5px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left .4s;
  }
  .btn:hover:not(:disabled)::before { left: 100%; }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #3a1a0a;
    border-color: #000;
    box-shadow: 0 3px 0 #000, 0 0 12px rgba(255, 216, 102, 0.4);
  }
  .btn.primary:hover:not(:disabled) {
    filter: brightness(1.1);
    box-shadow: 0 5px 0 #000, 0 0 20px rgba(255, 216, 102, 0.6);
    color: #3a1a0a;
  }
  .btn.danger {
    background: linear-gradient(135deg, var(--danger), #b33a30);
    border-color: #000;
    color: #fff;
  }
  .btn.ok {
    background: linear-gradient(135deg, var(--ok), #3a9a78);
    border-color: #000;
    color: #fff;
  }
  .btn.full { width: 100%; }

  /* ═══════════════════════════════════════════════════
     타이틀 화면
  ═══════════════════════════════════════════════════ */
  .title-screen {
    text-align: center;
    padding: 40px 20px;
    position: relative;
  }
  .title-screen .big-title {
    font-family: 'Cinzel', serif;
    font-size: 52px;
    color: var(--accent);
    text-shadow:
      3px 3px 0 #8b4513,
      6px 6px 0 #000,
      9px 9px 15px rgba(0,0,0,0.5);
    letter-spacing: 3px;
    margin-bottom: 10px;
    line-height: 1.1;
    font-weight: 900;
    animation: titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 216, 102, 0.4)); }
    50% { filter: drop-shadow(0 0 20px rgba(255, 216, 102, 0.8)); }
  }
  @media (max-width: 500px) {
    .title-screen .big-title { font-size: 32px; letter-spacing: 2px; }
  }
  .title-screen .tagline {
    font-size: 14px;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    margin-bottom: 30px;
    line-height: 1.8;
    font-weight: 700;
  }
  .title-screen .menu-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 300px;
    margin: 0 auto;
  }
  .title-screen .menu-btns .btn {
    padding: 14px;
    font-size: 18px;
  }
  .title-screen .stats-row {
    margin-top: 30px;
    font-size: 11px;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  }

  /* 큰 로고 아래 펫 장식 (ornament) */
  .title-decorations {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    font-size: 40px;
  }
  .title-decorations span {
    animation: float 3s ease-in-out infinite;
    display: inline-block;
  }
  .title-decorations span:nth-child(2) { animation-delay: 0.5s; }
  .title-decorations span:nth-child(3) { animation-delay: 1s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }

  /* ═══════════════════════════════════════════════════
     스타터 선택 화면
  ═══════════════════════════════════════════════════ */
  .starter-screen h2 {
    font-family: 'Cinzel', serif;
    color: var(--accent);
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 #000;
  }
  .starter-screen .hint {
    text-align: center;
    color: var(--fg2);
    font-size: 12px;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .starter-card {
    background: linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: all .2s cubic-bezier(.3,.7,.4,1);
    position: relative;
    overflow: hidden;
  }
  .starter-card:hover {
    border-color: var(--accent);
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .starter-card.selected {
    border-color: var(--accent);
    background: linear-gradient(180deg, #6a4230 0%, #5a3824 100%);
    box-shadow:
      0 0 20px var(--accent),
      0 4px 0 #000;
    animation: selectedPulse 1.5s ease-in-out infinite;
  }
  @keyframes selectedPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 216, 102, 0.6), 0 4px 0 #000; }
    50% { box-shadow: 0 0 30px rgba(255, 216, 102, 1), 0 4px 0 #000; }
  }
  .starter-card img {
    width: 80px; height: 80px;
    object-fit: contain;
    image-rendering: pixelated;
    display: block;
    margin: 0 auto 4px;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
    transition: transform .2s;
  }
  .starter-card:hover img {
    transform: scale(1.1) rotate(-5deg);
  }
  .starter-card.selected img {
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .starter-card .name {
    font-family: 'Jersey 15';
    font-size: 18px;
    color: var(--accent);
    margin-top: 4px;
  }
  .starter-card .attrs {
    display: flex;
    gap: 3px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .attr-tag {
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    font-family: 'Jersey 15';
  }
  .attr-tag.earth { background: var(--earth); color: #000; }
  .attr-tag.water { background: var(--water); color: #000; }
  .attr-tag.fire { background: var(--fire); }
  .attr-tag.wind { background: var(--wind); color: #000; }
  .attr-tag.neutral { background: var(--muted); }
  .starter-card .stats-mini {
    font-size: 10px;
    color: var(--fg2);
    margin-top: 4px;
  }

  .name-input-wrap {
    text-align: center;
    padding: 20px;
  }
  .name-input-wrap img {
    width: 120px;
    height: 120px;
    image-rendering: pixelated;
    object-fit: contain;
    animation: nameFloat 3s ease-in-out infinite;
    filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.4));
  }
  @keyframes nameFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  .name-input {
    padding: 10px 14px;
    background: var(--bg2);
    border: 2px solid var(--border-hi);
    color: var(--fg);
    border-radius: 8px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    width: 240px;
    max-width: 80%;
  }
  .name-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 216, 102, 0.4); }

  /* ═══════════════════════════════════════════════════
     메인 게임 UI
  ═══════════════════════════════════════════════════ */
  .game-grid {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 12px;
  }
  @media (max-width: 720px) {
    .game-grid { grid-template-columns: 1fr; }
  }

  /* 펫 패널 */
  .pet-panel {
    background: linear-gradient(180deg,
      rgba(74, 46, 31, 0.92) 0%,
      rgba(42, 24, 16, 0.92) 100%);
    backdrop-filter: blur(8px);
    border: 2px solid var(--border-hi);
    border-radius: 12px;
    padding: 16px;
    box-shadow:
      0 6px 0 rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }

  /* 패널 상단 장식 (월 표시) */
  .pet-panel .month-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--accent);
    color: #3a1a0a;
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'Jersey 15';
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 0 #000;
    z-index: 2;
  }

  /* 주 진행 바 */
  .week-progress {
    margin-top: 10px;
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    height: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .week-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width .5s;
    box-shadow: 0 0 8px rgba(255, 216, 102, 0.5);
  }

  /* 펫 중앙 스프라이트 (크고 멋지게) */
  .pet-stage {
    width: 100%;
    height: 200px;
    background:
      radial-gradient(ellipse at center bottom, rgba(0,0,0,0.3) 0%, transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.2) 100%);
    border: 2px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
  }

  /* 스테이지 바닥 (그림자 효과) */
  .pet-stage::before {
    content: '';
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 14px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
  }

  .pet-big-sprite {
    width: 160px;
    height: 160px;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.6));
    position: relative;
    z-index: 2;
    transition: filter .3s;
    /* 기본: 가벼운 숨쉬기 */
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.02); }
  }

  /* 감정 상태별 스프라이트 애니메이션 */
  .pet-big-sprite.mood-happy {
    animation: moodHappy 0.8s ease-in-out infinite;
  }
  @keyframes moodHappy {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-15px) rotate(-4deg); }
    75% { transform: translateY(-15px) rotate(4deg); }
  }
  .pet-big-sprite.mood-tired {
    animation: moodTired 4s ease-in-out infinite;
    filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.6)) saturate(0.7);
  }
  @keyframes moodTired {
    0%, 100% { transform: rotate(-8deg) translateY(6px); }
    50% { transform: rotate(-10deg) translateY(8px); }
  }
  .pet-big-sprite.mood-stress {
    animation: moodStress 0.2s linear infinite;
    filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.6)) hue-rotate(-20deg);
  }
  @keyframes moodStress {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  .pet-big-sprite.action-train {
    animation: actionTrain 0.5s ease-in-out;
  }
  @keyframes actionTrain {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-30px) scale(1.1); }
    60% { transform: translateY(5px) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }
  .pet-big-sprite.action-run {
    animation: actionRun 0.6s ease-in-out;
  }
  @keyframes actionRun {
    0% { transform: translateX(-30px); }
    50% { transform: translateX(30px); }
    100% { transform: translateX(0); }
  }
  .pet-big-sprite.action-eat {
    animation: actionEat 0.8s ease-in-out;
  }
  @keyframes actionEat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15) rotate(-3deg); }
    50% { transform: scale(1.1) rotate(3deg); }
    75% { transform: scale(1.15) rotate(-3deg); }
  }
  .pet-big-sprite.action-spirit {
    animation: actionSpirit 1s ease-in-out;
  }
  @keyframes actionSpirit {
    0%, 100% { transform: scale(1); filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.6)); }
    50% { transform: scale(1.1); filter: drop-shadow(0 0 20px var(--purple)) drop-shadow(4px 6px 10px rgba(0,0,0,0.6)); }
  }

  /* 파티클 영역 (스프라이트 주변에서 튀는 이펙트) */
  .effect-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .effect {
    position: absolute;
    font-size: 24px;
    pointer-events: none;
    animation: effectPop 1.2s ease-out forwards;
  }
  @keyframes effectPop {
    0% {
      opacity: 0;
      transform: translate(var(--startX, 0), var(--startY, 0)) scale(0.3);
    }
    20% {
      opacity: 1;
      transform: translate(var(--startX, 0), var(--startY, 0)) scale(1.3);
    }
    100% {
      opacity: 0;
      transform: translate(var(--endX, 0), var(--endY, -60px)) scale(0.8);
    }
  }

  /* 스탯 상승 팝업 */
  .stat-popup {
    position: absolute;
    font-family: 'Jersey 15';
    font-size: 20px;
    font-weight: 800;
    pointer-events: none;
    z-index: 10;
    text-shadow: 2px 2px 0 #000, 0 0 8px currentColor;
    animation: statPopup 1.5s ease-out forwards;
  }
  @keyframes statPopup {
    0% {
      opacity: 0;
      transform: translate(-50%, 0) scale(0.5);
    }
    15% {
      opacity: 1;
      transform: translate(-50%, -10px) scale(1.2);
    }
    40% {
      transform: translate(-50%, -20px) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -70px) scale(0.9);
    }
  }
  .stat-popup.up { color: #5acba8; }
  .stat-popup.down { color: #ff7070; }
  .stat-popup.gold { color: var(--accent); }

  /* 펫 정보 상단 */
  .pet-info-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .pet-name-box {
    flex: 1;
    min-width: 0;
  }
  .pet-name-box .pname {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    color: var(--accent);
    font-weight: 900;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 1px;
    word-break: break-all;
  }
  .pet-name-box .pspecies {
    font-size: 11px;
    color: var(--fg2);
    margin-top: -2px;
  }
  .pet-name-box .pattrs {
    display: flex;
    gap: 3px;
    margin-top: 4px;
  }
  .stones-big {
    font-family: 'Jersey 15';
    font-size: 22px;
    color: var(--accent);
    background: rgba(0,0,0,0.4);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border-hi);
    white-space: nowrap;
    animation: stonesShine 2s ease-in-out infinite;
  }
  @keyframes stonesShine {
    0%, 100% { box-shadow: 0 0 0 rgba(255, 216, 102, 0); }
    50% { box-shadow: 0 0 12px rgba(255, 216, 102, 0.5); }
  }

  /* 스탯 그리드 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px 10px;
    margin-top: 12px;
  }
  @media (max-width: 500px) {
    .stats-grid { grid-template-columns: 1fr; }
  }
  .stat-row {

function decideEnding(p) {
  if (p.hp <= 0) return { id: 'death', emoji: '☠️', name: '요절', desc: `${p.name}은(는) 너무 지쳐 쓰러졌다.\n모든 것이 끝났다... 다음엔 더 잘 돌보자.`, color: '#666' };
  if (p.happy <= 10 && p.bond <= 20) return { id: 'runaway', emoji: '😱', name: '가출 엔딩', desc: `${p.name}은(는) 어느 날 조용히 떠났다.\n돌아오지 않았다. 부디 잘 지내길...`, color: '#886' };
  if (p.stress >= 90) return { id: 'broken', emoji: '💔', name: '지친 펫', desc: `${p.name}은(는) 극도의 스트레스로 마음을 닫았다.\n이제 더 이상 예전의 그 펫이 아니다.`, color: '#a66' };

  if (p.bond >= 90 && p.happy >= 70) return { id: 'soulmate', emoji: '💕', name: '영혼의 동반자', desc: `${p.name}은(는) 너와 평생을 함께하기로 했다.\n최고의 유대! 부족에서 가장 행복한 펫으로 기록될 것이다.`, color: '#ff6b9f' };
  if (p.wild >= 80 && p.bond < 30) return { id: 'wildbeast', emoji: '👹', name: '포악한 야수', desc: `${p.name}은(는) 야생의 본능에 완전히 지배됐다.\n숲으로 사라졌다... 때때로 부족 근처에 나타난다는 소문이 돈다.`, color: '#d84040' };
  if (p.elem >= 80) return { id: 'spirit', emoji: '🔮', name: '정령수', desc: `${p.name}은(는) 정령과 하나가 되었다.\n부족의 무당마저 고개를 숙이는 신비로운 존재가 되었다.`, color: '#9a6fff' };
  if (p.str >= 60 && p.agi >= 60 && p.hp >= 60 && p.cute >= 60) return { id: 'champion', emoji: '🏆', name: '전설의 챔피언', desc: `${p.name}은(는) 모든 면에서 완벽한 펫이 되었다.\n부족 역사에 길이 남을 전설이다!`, color: '#ffd866' };
  if (p.cute >= 80) return { id: 'star', emoji: '🎪', name: '부족의 스타', desc: `${p.name}은(는) 부족의 연예인이 되었다.\n공연마다 관중이 몰려들고 모두가 사랑한다.`, color: '#ffca55' };
  if (p.int >= 70) return { id: 'sage', emoji: '📚', name: '현자의 펫', desc: `${p.name}은(는) 부족의 지혜로운 조언자가 되었다.\n어려운 결정 앞에서 너를 돕는다.`, color: '#7fd47f' };
  if (p.str >= 70 && p.hp >= 70) return { id: 'warrior', emoji: '⚔️', name: '부족 수호펫', desc: `${p.name}은(는) 부족의 전설적인 수호자가 되었다.\n아이들은 그 용맹을 이야기로 들려준다.`, color: '#d4943a' };
  if (p.str >= 60 && p.agi >= 60) return { id: 'hunter', emoji: '🏹', name: '맹수 사냥꾼', desc: `${p.name}은(는) 최고의 사냥 파트너가 되었다.\n어떤 먹잇감도 놓치지 않는다.`, color: '#c4743a' };
  if (p.bond >= 60) return { id: 'family', emoji: '🐾', name: '가족', desc: `${p.name}은(는) 너의 진정한 가족이 되었다.\n평범하지만 따뜻한 일상이 이어진다.`, color: '#a0d4a0' };
  return { id: 'normal', emoji: '🏠', name: '평범한 부족펫', desc: `${p.name}은(는) 평범한 부족의 일원으로 살아간다.\n특별하진 않지만, 누구보다 네 곁에 있다.`, color: '#b0a080' };
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function pushLog(msg, cls = '') {
  state.log.push({ msg, cls });
  if (state.log.length > 40) state.log.shift();
}

function getMonth(week) { return Math.min(12, Math.ceil(week / 4.33)); }
function getSeason(week) {
  const m = getMonth(week);
  if (m <= 2) return 'winter';
  if (m <= 5) return 'spring';
  if (m <= 8) return 'summer';
  if (m <= 11) return 'autumn';
  return 'winter';
}

function getAttrTags(pet) {
  if (!pet || !pet.attr) return '';
  const tagMap = { '지':'earth', '수':'water', '화':'fire', '풍':'wind' };
  return Object.entries(pet.attr)
    .filter(([k, v]) => v > 0)
    .map(([k, v]) => `<span class="attr-tag ${tagMap[k]||'neutral'}">${k}${v}</span>`)
    .join('');
}

function loadLocalStats() {
  try { const s = localStorage.getItem('raise_stats'); if (s) state.stats = { ...state.stats, ...JSON.parse(s) }; } catch(e) {}
}
function saveLocalStats() { localStorage.setItem('raise_stats', JSON.stringify(state.stats)); }

function statLabel(k) {
  return { str:'💪근력', agi:'🏃민첩', hp:'❤️체력', int:'🧠지능', elem:'🔥속성', cute:'😊애교', wild:'🎭야생', bond:'💕친밀', happy:'🌈행복' }[k] || k;
}
function statEmoji(k) {
  return { str:'💪', agi:'🏃', hp:'❤️', int:'🧠', elem:'🔥', cute:'😊', wild:'🎭', bond:'💕', happy:'🌈', stress:'😰', fatigue:'😫' }[k] || k;
}

   계절 파티클
============================================================ */
function updateSeasonBackground(season) {
  document.body.className = 'season-' + season;
  generateSeasonParticles(season);
}

function generateSeasonParticles(season) {
  const layer = document.getElementById('season-particles');
  layer.innerHTML = '';
  const emoji = {
    spring: ['🌸', '🌺', '💮', '🌷'],
    summer: ['☀️', '🌿', '💧', '🍃'],
    autumn: ['🍂', '🍁', '🌰', '🍄'],
    winter: ['❄️', '❄', '✨', '⛄'],
  }[season] || ['✨'];

  const count = 20;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = randChoice(emoji);
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (rand(8, 20)) + 's';
    p.style.animationDelay = (Math.random() * -20) + 's';
    p.style.setProperty('--drift', (rand(-80, 80)) + 'px');
    p.style.fontSize = rand(16, 28) + 'px';
    p.style.opacity = (0.4 + Math.random() * 0.4);
    layer.appendChild(p);
  }
}

      <div style="color: var(--fg2); font-size: 12px; margin-bottom: 16px;">너의 펫에게 이름을 지어주자.</div>
      <input type="text" id="pet-name-input" class="name-input" maxlength="12" placeholder="펫의 이름" value="${escapeHtml(pet.name)}">
      <div style="margin-top: 16px;">
        <button class="btn" id="btn-back">← 다시 선택</button>
        <button class="btn primary" id="btn-begin">🎬 모험 시작!</button>
      </div>
    </div>
  `;
  app.appendChild(screen);
  const input = document.getElementById('pet-name-input');
  input.focus();
  input.select();
  document.getElementById('btn-back').addEventListener('click', () => { state.scene = 'starter'; render(); });
  document.getElementById('btn-begin').addEventListener('click', () => {
    const name = input.value.trim();
    if (name.length < 1) { alert('이름을 입력해주세요'); return; }
    beginGame(pet, name);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-begin').click();
  });
}

function beginGame(petData, customName) {
  state.pet = {
    data: petData,
    name: customName,
    species: petData.name,
    image: petData.image,
    attr: petData.attr,
    str:  Math.round(petData.ic.atk * 1.5),
    agi:  Math.round(petData.ic.agi * 1.8),
    hp:   Math.round(petData.ic.hp * 0.8),
    int:  10 + rand(0, 5),
    elem: Object.values(petData.attr).reduce((s,v)=>s+v, 0) + rand(0, 5),
    cute: 20 + rand(0, 10),
    wild: 30 + rand(0, 15),
    bond: 30,
    happy: 50,
    stress: 0,
    fatigue: 0,
    stones: 50,
  };
  state.week = 1;
  state.log = [];
  state.scene = 'playing';
  pushLog(`${customName}과(와)의 1년이 시작되었다!`, 'info');
  render();
}

function getMood(p) {
  if (p.hp <= 20) return 'mood-tired';
  if (p.fatigue >= 70) return 'mood-tired';
  if (p.stress >= 70) return 'mood-stress';
  if (p.happy >= 70 && p.bond >= 60) return 'mood-happy';
  return '';
}

function statBar(label, key, val, max, cls = '') {
  val = clamp(Math.round(val), 0, 999);
  const pct = Math.min(100, (val / max) * 100);
  return `
    <div class="stat-row">
      <div class="stat-label">${label}</div>
      <div class="stat-bar"><div class="stat-fill ${cls}" data-key="${key}" style="width:${pct}%"></div></div>
      <div class="stat-value" data-key="${key}">${val}</div>
    </div>
  `;
}

function renderActionList() {
  const list = document.getElementById('action-list');
  if (!list) return;
  list.innerHTML = '';
  let actions;
  if (currentActionTab === 'train') actions = TRAININGS;
  else if (currentActionTab === 'job') actions = JOBS;
  else actions = RESTS;

  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    const p = state.pet;
    let reqFail = null;
    if (a.req) {
      for (const [k, v] of Object.entries(a.req)) {
        if (k === 'stones') { if (p.stones < v) { reqFail = `💎 ${v} 필요`; break; } }
        else if (k === 'wildMax') { if (p.wild > v) { reqFail = `🎭 야생 ${v}↓ 필요`; break; } }
        else { if ((p[k]||0) < v) { reqFail = `${statLabel(k)} ${v} 필요`; break; } }
      }
    }
    if (a.cost && p.stones < a.cost) { if (!reqFail) reqFail = `💎 ${a.cost} 부족`; }
    if (p.fatigue >= 80 && a.id !== 'sleep') { if (!reqFail) reqFail = `⚠ 너무 피곤함`; }

    const costLine = a.cost ? `<div class="ab-cost">💎 ${a.cost}</div>`
                    : a.gain ? `<div class="ab-cost">💎 +${a.gain[0]}~${a.gain[1]}</div>`
                    : '';

    btn.innerHTML = `
      <div class="ab-name">${a.name}</div>
      <div class="ab-desc">${a.desc}</div>
      ${costLine}
      ${reqFail ? `<div class="ab-req">${reqFail}</div>` : ''}
    `;
    if (reqFail) btn.disabled = true;
    btn.addEventListener('click', () => doAction(a));
    list.appendChild(btn);
  });
}

/* ============================================================
   액션 실행 + 이펙트
============================================================ */
let actionInProgress = false;

async function doAction(action) {
  if (actionInProgress) return;
  actionInProgress = true;

  const p = state.pet;
  if (action.cost) p.stones -= action.cost;
  let gained = 0;
  if (action.gain) {
    gained = rand(action.gain[0], action.gain[1]);
    p.stones += gained;
  }

  // 스프라이트 애니
  const sprite = document.getElementById('pet-sprite');
  if (sprite && action.anim) {
    sprite.classList.remove('mood-happy', 'mood-tired', 'mood-stress');
    sprite.classList.remove('action-train', 'action-run', 'action-eat', 'action-spirit');
    void sprite.offsetWidth;
    sprite.classList.add(action.anim);
    setTimeout(() => sprite.classList.remove(action.anim), 1200);
  }

  // 파티클
  if (action.particles) {
    spawnParticles(action.particles, 8);
  }

  // 스탯 변화
  const deltas = {};
  const eff = action.effects || {};
  for (const [k, range] of Object.entries(eff)) {
    const d = rand(range[0], range[1]);
    deltas[k] = d;
    applyDelta(p, k, d);
  }

  // 스탯 팝업
  showStatPopups(deltas, gained);

  // 로그
  let msg = action.name;
  if (gained > 0) msg += ` (💎+${gained})`;
  const deltaStr = Object.entries(deltas)
    .filter(([k, v]) => v !== 0)
    .map(([k, v]) => `${statEmoji(k)}${v>0?'+':''}${v}`)
    .join(' ');
  if (deltaStr) msg += ` → ${deltaStr}`;
  pushLog(msg, 'info');

  // 스탯 바 애니메이션용 잠깐 대기
  await sleep(600);

  // 랜덤 이벤트
  let eventChance = 0.12;
  if (action.event) eventChance = 0.55;
  if (Math.random() < eventChance) {
    actionInProgress = false;
    triggerEvent();
    return;
  }

  // 대회
  const tourney = TOURNAMENTS.find(t => t.week === state.week);
  if (tourney) {
    applyTournament(tourney);
    await sleep(400);
  }

  advanceWeek();
  actionInProgress = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function spawnParticles(emojis, count = 6) {
  const layer = document.getElementById('effect-layer');
  if (!layer) return;
  const rect = layer.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'effect';
    p.textContent = randChoice(emojis);
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const dist = rand(40, 80);
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--startX', '0px');
    p.style.setProperty('--startY', '0px');
    p.style.setProperty('--endX', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--endY', (Math.sin(angle) * dist - 20) + 'px');
    p.style.animationDelay = (i * 40) + 'ms';
    layer.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

function showStatPopups(deltas, stonesDelta) {
  const stage = document.getElementById('pet-stage');
  if (!stage) return;
  const rect = stage.getBoundingClientRect();

  const items = [];
  for (const [k, v] of Object.entries(deltas)) {
    if (!v || v === 0) continue;
    items.push({ text: `${statEmoji(k)}${v > 0 ? '+' : ''}${v}`, cls: v > 0 ? 'up' : 'down' });
  }
  if (stonesDelta > 0) items.push({ text: `💎+${stonesDelta}`, cls: 'gold' });

  items.forEach((it, i) => {
    const popup = document.createElement('div');
    popup.className = 'stat-popup ' + it.cls;
    popup.textContent = it.text;
    popup.style.left = '50%';
    popup.style.top = (30 + i * 22) + 'px';
    popup.style.animationDelay = (i * 120) + 'ms';
    stage.appendChild(popup);
    setTimeout(() => popup.remove(), 2000);
  });
}

function applyDelta(p, k, d) {
  if (k === 'stones') { p.stones = Math.max(0, p.stones + d); return; }
  p[k] = clamp((p[k]||0) + d, 0, 100);
}

function advanceWeek() {
  const p = state.pet;
  p.fatigue = Math.max(0, p.fatigue - 2);
  p.happy = Math.max(0, p.happy - 1);
  if (p.fatigue >= 70) { p.hp = Math.max(0, p.hp - 2); pushLog(`😫 피곤해서 체력이 떨어진다!`, 'hurt'); }
  if (p.stress >= 70) { p.bond = Math.max(0, p.bond - 2); pushLog(`😰 스트레스로 친밀도 감소`, 'hurt'); }
  if (p.happy >= 70) { p.stress = Math.max(0, p.stress - 1); }

  state.week++;
  if (state.week > 52) {
    state.scene = 'ending';
    state.stats.playCount++;
    const ending = decideEnding(p);
    if (!state.stats.bestRun || ['champion','soulmate','spirit'].includes(ending.id)) {
      state.stats.bestRun = { ending: ending.name, pet: p.name };
    }
    saveLocalStats();
    render();
    return;
  }
  render();
}

/* ============================================================
   이벤트 모달
============================================================ */
function triggerEvent() {
  const ev = randChoice(EVENTS);
  state.currentEvent = ev;
  renderEventModal(ev);
}

function renderEventModal(ev) {
  // 화면 플래시
  const flash = document.createElement('div');
  flash.className = 'flash-overlay';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);

  const overlay = document.createElement('div');
  overlay.className = 'event-overlay open';
  const choicesHtml = ev.choices.map((c, i) => {
    let disabled = false, hint = '';
    if (c.req) {
      for (const [k, v] of Object.entries(c.req)) {
        if (k === 'stones' && state.pet.stones < v) { disabled = true; hint = `💎 ${v} 필요`; break; }
        else if (k !== 'stones' && (state.pet[k]||0) < v) { disabled = true; hint = `${statLabel(k)} ${v} 필요`; break; }
      }
    }
    return `<button class="ev-choice" data-idx="${i}" ${disabled?'disabled':''}>
      ${escapeHtml(c.text)}
      ${hint ? `<div class="hint" style="color:#ff7070;">${hint}</div>` : ''}
    </button>`;
  }).join('');

  overlay.innerHTML = `
    <div class="event-panel">
      <div class="ev-icon">${ev.icon}</div>
      <div class="ev-title">${escapeHtml(ev.title)}</div>
      <div class="ev-desc">${escapeHtml(ev.desc)}</div>
      <div class="ev-choices">${choicesHtml}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.ev-choice').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      showEventResult(ev, idx, overlay);
    });
  });
}

function showEventResult(ev, choiceIdx, overlay) {
  const choice = ev.choices[choiceIdx];
  const p = state.pet;
  const deltas = {};
  for (const [k, v] of Object.entries(choice.effect || {})) {
    applyDelta(p, k, v);
    deltas[k] = v;
  }
  pushLog(`📜 ${ev.title}: ${choice.msg}`, 'event');

  // 결과 표시
  const panel = overlay.querySelector('.event-panel');
  const deltasHtml = Object.entries(deltas).filter(([k,v]) => v !== 0).map(([k,v]) => {
    const cls = k === 'stones' ? 'gold' : (v > 0 ? 'up' : 'down');
    const label = k === 'stones' ? `💎 ${v>0?'+':''}${v}` : `${statEmoji(k)} ${v>0?'+':''}${v}`;
    return `<span class="ev-delta ${cls}">${label}</span>`;
  }).join('');

  panel.innerHTML = `
    <div class="ev-icon">${ev.icon}</div>
    <div class="ev-title event-result">${escapeHtml(ev.title)}</div>
    <div class="ev-msg">${escapeHtml(choice.msg)}</div>
    ${deltasHtml ? `<div class="ev-deltas">${deltasHtml}</div>` : ''}
    <button class="btn primary full" id="ev-continue">▶ 계속</button>
  `;

  document.getElementById('ev-continue').addEventListener('click', () => {
    overlay.remove();
    const tourney = TOURNAMENTS.find(t => t.week === state.week);
    if (tourney) applyTournament(tourney);
    advanceWeek();
  });
}

/* ============================================================
   분기 대회
============================================================ */
function applyTournament(t) {
  const p = state.pet;
  let score;
  let thresholds;
  if (t.stat === 'overall') {
    score = p.str + p.agi + p.hp + p.cute + p.int + p.elem;
    thresholds = [240, 180, 120];
  } else {
    score = p[t.stat];
    thresholds = [60, 40, 25];
  }
  let rank, prize, bondDelta;
  if (score >= thresholds[0]) { rank = '🥇 1등!'; prize = 100; bondDelta = 8; }
  else if (score >= thresholds[1]) { rank = '🥈 2등'; prize = 50; bondDelta = 4; }
  else if (score >= thresholds[2]) { rank = '🥉 3등'; prize = 20; bondDelta = 2; }
  else { rank = '참가상'; prize = 5; bondDelta = -1; }

  p.stones += prize;
  applyDelta(p, 'bond', bondDelta);
  applyDelta(p, 'happy', bondDelta > 0 ? 5 : -3);
  pushLog(`🎪 ${t.name} ${rank} (💎+${prize}, 💕${bondDelta>0?'+':''}${bondDelta})`, 'event');
}

function spawnEndingParticles() {
  const layer = document.createElement('div');
  layer.className = 'ending-particles';
  document.body.appendChild(layer);
  const emojis = ['🎉', '✨', '⭐', '💫', '🌟', '💖'];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = randChoice(emojis);
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (rand(5, 10)) + 's';
    p.style.animationDelay = (Math.random() * -10) + 's';
    p.style.setProperty('--drift', (rand(-80, 80)) + 'px');
    p.style.fontSize = rand(20, 36) + 'px';
    layer.appendChild(p);
  }
}

async function submitRanking(ending) {
  const nick = prompt('랭킹에 등록할 닉네임 (2~10자)');
  if (!nick || nick.length < 2 || nick.length > 10) return;
  const p = state.pet;
  try {
    await db.ref('raise_rankings').push({
      nickname: nick,
      pet: p.name,
      species: p.species,
      ending: ending.name,
      endingId: ending.id,
      stones: p.stones,
      stats: { str: p.str, agi: p.agi, hp: p.hp, int: p.int, elem: p.elem, cute: p.cute, wild: p.wild, bond: p.bond, happy: p.happy },
      timestamp: Date.now(),
    });
    alert('랭킹 등록 완료!');
  } catch(e) {
    alert('등록 실패: ' + e.message);
  }
}

   저장/불러오기
============================================================ */
function saveGame() {
  const nick = prompt('저장할 닉네임 (2~10자)', localStorage.getItem('raise_nick') || '');
  if (!nick || nick.length < 2) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  db.ref('raise_saves/' + key).set({
    pet: state.pet, week: state.week, log: state.log.slice(-20), timestamp: Date.now(),
  }).then(() => alert('저장 완료!')).catch(e => alert('저장 실패: ' + e.message));
}

async function loadGame() {
  const nick = prompt('불러올 닉네임', localStorage.getItem('raise_nick') || '');
  if (!nick) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  try {
    const snap = await db.ref('raise_saves/' + key).once('value');
    const data = snap.val();
    if (!data) { alert('저장된 데이터가 없습니다.'); return; }
    state.pet = data.pet;
    state.week = data.week;
    state.log = data.log || [];
    state.scene = 'playing';
    render();
  } catch(e) { alert('불러오기 실패: ' + e.message); }
}

/* ============================================================
   초기화
============================================================ */
loadLocalStats();
(async () => {
  await loadPetData();
  render();
})();
</script>
