<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>👑 프린세스 펫 메이커 - wind01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-pink: #ffe0ec;
    --bg-mint: #e4fff5;
    --bg-cream: #fff5e4;
    --pink-light: #ffd4e5;
    --pink: #ff9ec7;
    --pink-deep: #ff6b9f;
    --lavender: #c9a6ff;
    --lavender-deep: #9a6fff;
    --mint: #a0e8d0;
    --mint-deep: #5acba8;
    --cream: #ffe8b8;
    --gold: #ffc640;
    --gold-deep: #ff9a30;
    --red: #ff7070;
    --text: #5a3a4a;
    --text-muted: #8e6a7c;
    --white: #fff5fa;
    --panel-bg: rgba(255, 245, 250, 0.92);
    --border-pink: #ffb8d4;
    --shadow-pink: rgba(255, 107, 159, 0.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--text);
    font-family: 'Jua', 'Gaegu', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(180deg, #ffe0ec 0%, #ffd4e5 100%);
    transition: background 1.5s;
  }

  /* ═══════════════════════════════════════════════
     계절별 배경
  ═══════════════════════════════════════════════ */
  body.season-spring {
    background: linear-gradient(180deg, #ffd4e5 0%, #ffe8f0 50%, #ffc4d8 100%);
  }
  body.season-summer {
    background: linear-gradient(180deg, #b8e8ff 0%, #d4f4ff 50%, #ffe8a0 100%);
  }
  body.season-autumn {
    background: linear-gradient(180deg, #ffb894 0%, #ffd4a0 50%, #ffc48c 100%);
  }
  body.season-winter {
    background: linear-gradient(180deg, #c4d4ff 0%, #e0e8ff 50%, #f0f4ff 100%);
  }

  /* 반짝이는 배경 장식 */
  .bg-sparkles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .bg-sparkle {
    position: absolute;
    opacity: 0.5;
    animation: sparkleFloat infinite ease-in-out;
    font-size: 24px;
  }
  @keyframes sparkleFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-20px) scale(1.2); opacity: 0.7; }
  }

  /* 계절 파티클 */
  .season-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }
  .particle {
    position: absolute;
    top: -30px;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    user-select: none;
    filter: drop-shadow(0 2px 4px rgba(255,107,159,0.3));
  }
  @keyframes fall {
    0% { transform: translateY(-30px) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% { transform: translateY(110vh) translateX(var(--drift)) rotate(720deg); opacity: 0; }
  }

  /* ═══════════════════════════════════════════════
     레이아웃
  ═══════════════════════════════════════════════ */
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 10;
  }

  .title-bar {
    text-align: center;
    padding: 14px 0 8px;
  }
  .title-bar h1 {
    font-family: 'Jua', sans-serif;
    font-size: 32px;
    color: var(--pink-deep);
    margin: 0;
    text-shadow:
      2px 2px 0 #fff,
      3px 3px 0 var(--lavender),
      4px 4px 10px rgba(154, 111, 255, 0.4);
    letter-spacing: 2px;
    font-weight: 900;
  }
  .title-bar .sub {
    font-size: 13px;
    color: var(--text);
    margin-top: 4px;
    font-weight: 700;
  }

  /* ═══════════════════════════════════════════════
     패널
  ═══════════════════════════════════════════════ */
  .panel {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 3px solid var(--border-pink);
    border-radius: 24px;
    padding: 18px;
    box-shadow:
      0 6px 0 var(--pink),
      0 12px 30px rgba(255,107,159,0.25),
      inset 0 1px 0 rgba(255,255,255,0.8);
    position: relative;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 30px;
    width: 40px;
    height: 16px;
    background: var(--pink);
    border-radius: 50%;
    opacity: 0.6;
    filter: blur(8px);
  }

  /* 하트 장식 코너 */
  .panel-deco {
    position: absolute;
    font-size: 20px;
    animation: decoSpin 8s linear infinite;
  }
  .panel-deco.tl { top: -12px; left: -12px; }
  .panel-deco.tr { top: -12px; right: -12px; animation-direction: reverse; }
  .panel-deco.bl { bottom: -12px; left: -12px; animation-direction: reverse; }
  .panel-deco.br { bottom: -12px; right: -12px; }
  @keyframes decoSpin {
    0%, 100% { transform: rotate(-15deg) scale(1); }
    50% { transform: rotate(15deg) scale(1.1); }
  }

  /* ═══════════════════════════════════════════════
     버튼
  ═══════════════════════════════════════════════ */
  .btn {
    background: linear-gradient(180deg, #fff 0%, var(--pink-light) 100%);
    border: 3px solid var(--pink);
    color: var(--pink-deep);
    padding: 12px 20px;
    border-radius: 24px;
    cursor: pointer;
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    font-weight: 700;
    transition: all .15s;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 0 var(--pink), 0 6px 10px rgba(255,107,159,0.2);
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    transition: left .5s;
  }
  .btn:hover:not(:disabled)::before { left: 100%; }
  .btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 7px 0 var(--pink), 0 10px 16px rgba(255,107,159,0.3);
  }
  .btn:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 0 var(--pink), 0 3px 6px rgba(255,107,159,0.2);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn.primary {
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff;
    border-color: var(--pink-deep);
    box-shadow: 0 4px 0 #c04870, 0 6px 16px rgba(255,107,159,0.5);
  }
  .btn.primary:hover:not(:disabled) {
    box-shadow: 0 7px 0 #c04870, 0 10px 20px rgba(255,107,159,0.6);
  }
  .btn.lavender {
    background: linear-gradient(180deg, #d9bdff 0%, var(--lavender-deep) 100%);
    color: #fff;
    border-color: var(--lavender-deep);
    box-shadow: 0 4px 0 #6a4aaa;
  }
  .btn.mint {
    background: linear-gradient(180deg, var(--mint) 0%, var(--mint-deep) 100%);
    color: #fff;
    border-color: var(--mint-deep);
    box-shadow: 0 4px 0 #3a9a78;
  }
  .btn.gold {
    background: linear-gradient(180deg, var(--cream) 0%, var(--gold) 100%);
    color: #8a5a10;
    border-color: var(--gold-deep);
    box-shadow: 0 4px 0 #c07020;
  }
  .btn.danger {
    background: linear-gradient(180deg, #ffb0b0 0%, var(--red) 100%);
    color: #fff;
    border-color: #c04040;
    box-shadow: 0 4px 0 #803030;
  }
  .btn.full { width: 100%; }

  /* ═══════════════════════════════════════════════
     타이틀 화면
  ═══════════════════════════════════════════════ */
  .title-screen {
    text-align: center;
    padding: 20px;
    position: relative;
  }
  .title-screen .big-title {
    font-family: 'Jua', sans-serif;
    font-size: 56px;
    color: var(--pink-deep);
    text-shadow:
      3px 3px 0 #fff,
      6px 6px 0 var(--lavender),
      9px 9px 20px rgba(154,111,255,0.5);
    letter-spacing: 3px;
    margin-bottom: 10px;
    line-height: 1.1;
    animation: titleBounce 2s ease-in-out infinite;
  }
  @keyframes titleBounce {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-8px) rotate(1deg); }
  }
  @media (max-width: 500px) {
    .title-screen .big-title { font-size: 38px; letter-spacing: 2px; }
  }
  .title-screen .tagline {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 25px;
    line-height: 1.8;
    font-weight: 700;
  }
  .title-screen .menu-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 300px;
    margin: 0 auto;
  }
  .title-screen .menu-btns .btn { padding: 14px; font-size: 18px; }

  .title-decorations {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 24px 0;
  }
  .title-decorations .char {
    font-size: 50px;
    animation: floatChar 3s ease-in-out infinite;
    display: inline-block;
    filter: drop-shadow(3px 5px 8px rgba(255,107,159,0.4));
  }
  .title-decorations .char:nth-child(2) { animation-delay: 0.5s; }
  .title-decorations .char:nth-child(3) { animation-delay: 1s; }
  @keyframes floatChar {
    0%, 100% { transform: translateY(0) rotate(-8deg) scale(1); }
    50% { transform: translateY(-15px) rotate(8deg) scale(1.1); }
  }

  .title-screen .stats-row {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 700;
  }

  /* ═══════════════════════════════════════════════
     스타터 선택
  ═══════════════════════════════════════════════ */
  .starter-screen h2 {
    font-family: 'Jua', sans-serif;
    color: var(--pink-deep);
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: 1px;
    font-size: 28px;
    text-shadow: 2px 2px 0 #fff, 3px 3px 0 var(--lavender);
  }
  .starter-screen .hint {
    text-align: center;
    color: var(--text);
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.6;
    font-weight: 700;
  }
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .starter-card {
    background: linear-gradient(180deg, #fff 0%, var(--bg-pink) 100%);
    border: 3px solid var(--border-pink);
    border-radius: 18px;
    padding: 14px 10px;
    cursor: pointer;
    text-align: center;
    transition: all .25s cubic-bezier(.3,.7,.4,1.3);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 0 var(--pink), 0 8px 16px rgba(255,107,159,0.2);
  }
  .starter-card::before {
    content: '💖';
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .2s;
  }
  .starter-card:hover::before { opacity: 0.6; animation: heartPop 1s infinite; }
  @keyframes heartPop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }
  .starter-card:hover {
    border-color: var(--pink-deep);
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 10px 0 var(--pink), 0 14px 28px rgba(255,107,159,0.35);
  }
  .starter-card.selected {
    border-color: var(--pink-deep);
    background: linear-gradient(180deg, #fff 0%, var(--pink-light) 100%);
    box-shadow:
      0 0 0 4px var(--pink),
      0 0 25px var(--pink-deep),
      0 8px 0 var(--pink-deep);
    animation: selectedPulse 1.2s ease-in-out infinite;
  }
  @keyframes selectedPulse {
    0%, 100% { box-shadow: 0 0 0 4px var(--pink), 0 0 25px var(--pink-deep), 0 8px 0 var(--pink-deep); }
    50% { box-shadow: 0 0 0 4px var(--pink), 0 0 40px var(--pink-deep), 0 8px 0 var(--pink-deep); }
  }
  .starter-card img {
    width: 80px; height: 80px;
    object-fit: contain;
    image-rendering: pixelated;
    display: block;
    margin: 0 auto 4px;
    filter: drop-shadow(2px 4px 6px rgba(255,107,159,0.3));
    transition: transform .2s;
  }
  .starter-card:hover img { transform: scale(1.15) rotate(-5deg); }
  .starter-card.selected img { animation: bouncePet 1s ease-in-out infinite; }
  @keyframes bouncePet {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-10px) scale(1.08); }
  }
  .starter-card .name {
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    color: var(--pink-deep);
    margin-top: 4px;
  }
  .starter-card .attrs {
    display: flex;
    gap: 3px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .attr-tag {
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    font-family: 'Jua';
    border: 1.5px solid rgba(0,0,0,0.2);
  }
  .attr-tag.earth  { background: var(--mint-deep); }
  .attr-tag.water  { background: #5ac4ff; }
  .attr-tag.fire   { background: #ff7070; }
  .attr-tag.wind   { background: #ffbd55; color: #5a3a00; }
  .attr-tag.neutral{ background: #b0a0a8; }
  .starter-card .stats-mini {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 700;
  }

  .name-input-wrap {
    text-align: center;
    padding: 24px 20px;
  }
  .name-input-wrap img {
    width: 130px;
    height: 130px;
    image-rendering: pixelated;
    object-fit: contain;
    animation: nameFloat 3s ease-in-out infinite;
    filter: drop-shadow(4px 6px 12px rgba(255,107,159,0.4));
  }
  @keyframes nameFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }
  .name-input {
    padding: 12px 18px;
    background: #fff;
    border: 3px solid var(--pink);
    color: var(--pink-deep);
    border-radius: 16px;
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    width: 240px;
    max-width: 80%;
    box-shadow: 0 3px 0 var(--pink-deep), inset 0 2px 4px rgba(255,107,159,0.1);
  }
  .name-input:focus {
    outline: none;
    border-color: var(--pink-deep);
    box-shadow: 0 3px 0 var(--pink-deep), 0 0 15px var(--pink), inset 0 2px 4px rgba(255,107,159,0.1);
  }

  /* ═══════════════════════════════════════════════
     메인 플레이
  ═══════════════════════════════════════════════ */
  .game-grid {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 14px;
  }
  @media (max-width: 720px) {
    .game-grid { grid-template-columns: 1fr; }
  }

  .pet-panel {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 3px solid var(--border-pink);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 6px 0 var(--pink), 0 12px 30px rgba(255,107,159,0.25);
    position: relative;
  }

  .pet-panel .month-badge {
    position: absolute;
    top: -12px;
    right: 20px;
    background: linear-gradient(180deg, var(--cream), var(--gold));
    color: #8a5a10;
    padding: 6px 16px;
    border-radius: 20px;
    font-family: 'Jua';
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 3px 0 var(--gold-deep);
    z-index: 5;
    border: 2px solid #fff;
  }

  .week-progress {
    margin-top: 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 12px;
    height: 10px;
    overflow: hidden;
    border: 2px solid var(--pink);
    box-shadow: inset 0 1px 3px rgba(255,107,159,0.2);
  }
  .week-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--lavender-deep));
    transition: width .5s;
    box-shadow: 0 0 10px var(--pink);
  }

  /* 펫 스테이지 - 무대! */
  .pet-stage {
    width: 100%;
    height: 220px;
    background:
      radial-gradient(ellipse at center bottom, rgba(255,182,193,0.5) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-pink) 0%, var(--bg-cream) 100%);
    border: 3px solid var(--pink);
    border-radius: 18px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    overflow: hidden;
    margin-top: 14px;
    margin-bottom: 14px;
    box-shadow: inset 0 2px 8px rgba(255,107,159,0.15);
  }

  /* 스테이지 배경 SVG (무지개 언덕) */
  .stage-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* 스테이지 바닥 그림자 */
  .pet-stage::before {
    content: '';
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 18px;
    background: radial-gradient(ellipse, rgba(255,107,159,0.5) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
    filter: blur(2px);
  }

  .pet-big-sprite {
    width: 170px;
    height: 170px;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(4px 6px 10px rgba(255,107,159,0.4));
    position: relative;
    z-index: 3;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.02); }
  }

  /* 감정 애니메이션 */
  .pet-big-sprite.mood-happy {
    animation: moodHappy 0.8s ease-in-out infinite;
  }
  @keyframes moodHappy {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-15px) rotate(-4deg); }
    75% { transform: translateY(-15px) rotate(4deg); }
  }
  .pet-big-sprite.mood-tired {
    animation: moodTired 4s ease-in-out infinite;
    filter: drop-shadow(4px 6px 10px rgba(255,107,159,0.4)) saturate(0.6);
  }
  @keyframes moodTired {
    0%, 100% { transform: rotate(-8deg) translateY(8px); }
    50% { transform: rotate(-10deg) translateY(10px); }
  }
  .pet-big-sprite.mood-stress {
    animation: moodStress 0.2s linear infinite;
    filter: drop-shadow(4px 6px 10px rgba(255,107,159,0.4)) hue-rotate(-20deg);
  }
  @keyframes moodStress {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  /* 액션 애니메이션 */
  .pet-big-sprite.action-train {
    animation: actionTrain 0.6s ease-in-out;
  }
  @keyframes actionTrain {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-40px) scale(1.15); }
    60% { transform: translateY(8px) scale(0.92); }
    100% { transform: translateY(0) scale(1); }
  }
  .pet-big-sprite.action-run {
    animation: actionRun 0.6s ease-in-out;
  }
  @keyframes actionRun {
    0% { transform: translateX(-40px) scaleX(-1); }
    50% { transform: translateX(40px) scaleX(1); }
    100% { transform: translateX(0); }
  }
  .pet-big-sprite.action-eat {
    animation: actionEat 0.8s ease-in-out;
  }
  @keyframes actionEat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15) rotate(-5deg); }
    50% { transform: scale(1.12) rotate(5deg); }
    75% { transform: scale(1.15) rotate(-5deg); }
  }
  .pet-big-sprite.action-spirit {
    animation: actionSpirit 1s ease-in-out;
  }
  @keyframes actionSpirit {
    0%, 100% { transform: scale(1); filter: drop-shadow(4px 6px 10px rgba(255,107,159,0.4)); }
    50% { transform: scale(1.12); filter: drop-shadow(0 0 25px var(--lavender-deep)) drop-shadow(4px 6px 10px rgba(255,107,159,0.4)); }
  }

  .effect-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .effect {
    position: absolute;
    font-size: 28px;
    pointer-events: none;
    animation: effectPop 1.4s ease-out forwards;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
  }
  @keyframes effectPop {
    0% { opacity: 0; transform: translate(var(--startX, 0), var(--startY, 0)) scale(0.3) rotate(0); }
    20% { opacity: 1; transform: translate(var(--startX, 0), var(--startY, 0)) scale(1.4) rotate(30deg); }
    100% { opacity: 0; transform: translate(var(--endX, 0), var(--endY, -60px)) scale(0.9) rotate(180deg); }
  }

  .stat-popup {
    position: absolute;
    font-family: 'Jua';

  <button class="audio-btn" id="btn-sfx" title="효과음">🔔</button>
</div>

<!-- BGM 오디오 -->
<audio id="bgm-audio" loop preload="auto">
  <source src="raise_bgm/palace_garden.mp3" type="audio/mpeg">
</audio>

<div class="wrap">
  <div class="title-bar">
    <h1>👑 PRINCESS PET MAKER</h1>
    <div class="sub">스톤에이지 부족에서 1년간 새끼펫 키우기 · 52주 후 엔딩</div>
  </div>
  <div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   오디오 시스템 (Web Audio API로 효과음 생성)
═══════════════════════════════════════════════════════════ */
const audio = {
  ctx: null,
  bgm: document.getElementById('bgm-audio'),
  bgmEnabled: true,
  sfxEnabled: true,
  bgmStarted: false,
};

// localStorage에서 설정 로드
try {
  const savedBgm = localStorage.getItem('raise_bgm');
  const savedSfx = localStorage.getItem('raise_sfx');
  if (savedBgm !== null) audio.bgmEnabled = savedBgm === '1';
  if (savedSfx !== null) audio.sfxEnabled = savedSfx === '1';
} catch(e) {}

audio.bgm.volume = 0.25;

function ensureAudioCtx() {
  if (!audio.ctx) {
    try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audio.ctx;
}

function playBgm() {
  if (!audio.bgmEnabled) return;
  audio.bgm.play().catch(() => {});
  audio.bgmStarted = true;
}
function pauseBgm() {
  audio.bgm.pause();
}

function toggleBgm() {
  audio.bgmEnabled = !audio.bgmEnabled;
  localStorage.setItem('raise_bgm', audio.bgmEnabled ? '1' : '0');
  if (audio.bgmEnabled) playBgm();
  else pauseBgm();
  updateAudioBtns();
}
function toggleSfx() {
  audio.sfxEnabled = !audio.sfxEnabled;
  localStorage.setItem('raise_sfx', audio.sfxEnabled ? '1' : '0');
  updateAudioBtns();
}
function updateAudioBtns() {
  document.getElementById('btn-bgm').classList.toggle('muted', !audio.bgmEnabled);
  document.getElementById('btn-bgm').textContent = audio.bgmEnabled ? '🎵' : '🔇';
  document.getElementById('btn-sfx').classList.toggle('muted', !audio.sfxEnabled);
  document.getElementById('btn-sfx').textContent = audio.sfxEnabled ? '🔔' : '🔕';
}

// 효과음 생성기 (Web Audio API)
function playSfx(type) {
  if (!audio.sfxEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;

  const now = ctx.currentTime;

  if (type === 'click') {
    // 짧은 팝 소리
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }
  else if (type === 'success') {
    // 경쾌한 도-미-솔
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.08);
      gain.gain.setValueAtTime(0, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.2, now + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.3);
    });
  }
  else if (type === 'level_up') {
    // 상승하는 아르페지오 (스탯 상승)
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.06);
      gain.gain.setValueAtTime(0, now + i * 0.06);
      gain.gain.linearRampToValueAtTime(0.15, now + i * 0.06 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.2);
    });
  }
  else if (type === 'coin') {
    // 동전 소리
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(988, now);
    osc.frequency.setValueAtTime(1319, now + 0.05);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.2);
  }
  else if (type === 'fail') {
    // 하강음
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.3);
  }
  else if (type === 'event') {
    // 신비로운 반짝 소리
    [1047, 1319, 1568].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.03);
      gain.gain.setValueAtTime(0, now + i * 0.03);
      gain.gain.linearRampToValueAtTime(0.12, now + i * 0.03 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.03 + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.03); osc.stop(now + i * 0.03 + 0.5);
    });
  }
  else if (type === 'heart') {
    // 뿅- 하트 소리
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
    osc.frequency.exponentialRampToValueAtTime(700, now + 0.2);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.3);
  }
  else if (type === 'hurt') {
    // 삐 낮은음
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, now);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.15);
  }
  else if (type === 'win') {
    // 팡파레
    const notes = [523, 523, 523, 659, 784, 1047];
    const times =  [0, 0.1, 0.2, 0.3, 0.4, 0.55];
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + times[i]);
      gain.gain.setValueAtTime(0, now + times[i]);
      gain.gain.linearRampToValueAtTime(0.2, now + times[i] + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + times[i] + 0.4);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + times[i]); osc.stop(now + times[i] + 0.4);
    });
  }
}

  if (p.happy <= 10 && p.bond <= 20) return { id: 'runaway', emoji: '😱', name: '가출 엔딩', desc: `${p.name}은(는) 어느 날 조용히 떠났다.\n돌아오지 않았다. 부디 잘 지내길...`, color: '#886' };
  if (p.stress >= 90) return { id: 'broken', emoji: '💔', name: '지친 펫', desc: `${p.name}은(는) 극도의 스트레스로 마음을 닫았다.`, color: '#c66' };

  if (p.bond >= 90 && p.happy >= 70) return { id: 'soulmate', emoji: '💕', name: '영혼의 동반자', desc: `${p.name}은(는) 너와 평생을 함께하기로 했다.\n최고의 유대! 부족에서 가장 행복한 펫으로 기록될 것이다.`, color: '#ff6b9f' };
  if (p.wild >= 80 && p.bond < 30) return { id: 'wildbeast', emoji: '👹', name: '포악한 야수', desc: `${p.name}은(는) 야생에 완전히 지배됐다.`, color: '#d84040' };
  if (p.elem >= 80) return { id: 'spirit', emoji: '🔮', name: '정령수', desc: `${p.name}은(는) 정령과 하나가 되었다.\n부족의 무당마저 고개를 숙이는 신비로운 존재.`, color: '#9a6fff' };
  if (p.str >= 60 && p.agi >= 60 && p.hp >= 60 && p.cute >= 60) return { id: 'champion', emoji: '🏆', name: '전설의 챔피언', desc: `${p.name}은(는) 모든 면에서 완벽한 펫이 되었다.\n부족 역사에 길이 남을 전설이다!`, color: '#ffc640' };
  if (p.cute >= 80) return { id: 'star', emoji: '🎪', name: '부족의 스타', desc: `${p.name}은(는) 부족의 연예인이 되었다.`, color: '#ff9ac0' };
  if (p.int >= 70) return { id: 'sage', emoji: '📚', name: '현자의 펫', desc: `${p.name}은(는) 지혜로운 조언자가 되었다.`, color: '#7fd47f' };
  if (p.str >= 70 && p.hp >= 70) return { id: 'warrior', emoji: '⚔️', name: '부족 수호펫', desc: `${p.name}은(는) 부족의 전설적인 수호자가 되었다.`, color: '#d4943a' };
  if (p.str >= 60 && p.agi >= 60) return { id: 'hunter', emoji: '🏹', name: '맹수 사냥꾼', desc: `${p.name}은(는) 최고의 사냥 파트너가 되었다.`, color: '#c4743a' };
  if (p.bond >= 60) return { id: 'family', emoji: '🐾', name: '가족', desc: `${p.name}은(는) 너의 진정한 가족이 되었다.`, color: '#a0d4a0' };
  return { id: 'normal', emoji: '🏠', name: '평범한 부족펫', desc: `${p.name}은(는) 평범한 부족의 일원으로 살아간다.`, color: '#b0a080' };
}

const state = {
  scene: 'title',
  week: 1,
  pet: null,
  log: [],
  starterPool: [],
  starterPick: null,
  stats: { playCount: 0, bestRun: null },
};
let currentActionTab = 'train';

const app = document.getElementById('app');

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pushLog(msg, cls = '') {
  state.log.push({ msg, cls });
  if (state.log.length > 40) state.log.shift();
}
function getMonth(week) { return Math.min(12, Math.ceil(week / 4.33)); }
function getSeason(week) {
  const m = getMonth(week);
  if (m <= 2) return 'winter';
  if (m <= 5) return 'spring';
  if (m <= 8) return 'summer';
  if (m <= 11) return 'autumn';
  return 'winter';
}
function getAttrTags(pet) {
  if (!pet || !pet.attr) return '';
  const tagMap = { '지':'earth', '수':'water', '화':'fire', '풍':'wind' };
  return Object.entries(pet.attr)
    .filter(([k, v]) => v > 0)
    .map(([k, v]) => `<span class="attr-tag ${tagMap[k]||'neutral'}">${k}${v}</span>`)
    .join('');
}
function loadLocalStats() {
  try { const s = localStorage.getItem('raise_stats'); if (s) state.stats = { ...state.stats, ...JSON.parse(s) }; } catch(e) {}
}
function saveLocalStats() { localStorage.setItem('raise_stats', JSON.stringify(state.stats)); }
function statLabel(k) {
  return { str:'💪근력', agi:'🏃민첩', hp:'❤️체력', int:'🧠지능', elem:'🔥속성', cute:'😊애교', wild:'🎭야생', bond:'💕친밀', happy:'🌈행복' }[k] || k;
}
function statEmoji(k) {
  return { str:'💪', agi:'🏃', hp:'❤️', int:'🧠', elem:'🔥', cute:'😊', wild:'🎭', bond:'💕', happy:'🌈', stress:'😰', fatigue:'😫' }[k] || k;
}

function updateSeasonBackground(season) {
  document.body.className = 'season-' + season;

}

function generateSeasonParticles(season) {
  const layer = document.getElementById('season-particles');
  layer.innerHTML = '';
  const emoji = {
    spring: ['🌸', '🌺', '💮', '🌷', '💕'],
    summer: ['☀️', '🌿', '💧', '🍃', '🌻'],
    autumn: ['🍂', '🍁', '🌰', '🍄', '🌾'],
    winter: ['❄️', '❄', '✨', '⛄', '🎀'],
  }[season] || ['✨'];

  const count = 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = randChoice(emoji);

/* ═══════════════════════════════════════════════════════════
   SVG 스테이지 배경 생성
═══════════════════════════════════════════════════════════ */
function getStageBgSvg(season) {
  const themes = {
    spring: { sky: '#ffe4ec', hill1: '#ffc4d8', hill2: '#ffa0c0', tree: '#ff89b0', trunk: '#a06050', decor: '#ff6b9f' },
    summer: { sky: '#d0f0ff', hill1: '#a8e8c0', hill2: '#70d090', tree: '#60b070', trunk: '#7a5040', decor: '#ffc440' },
    autumn: { sky: '#ffd8b0', hill1: '#ffb080', hill2: '#ff8050', tree: '#ff6040', trunk: '#6a4030', decor: '#ffa020' },
    winter: { sky: '#e0e8ff', hill1: '#d0d8f0', hill2: '#c0cce8', tree: '#e8f0ff', trunk: '#6a6a80', decor: '#fff' },
  };
  const t = themes[season] || themes.spring;
  return `
    <svg class="stage-bg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="skyGrad${season}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${t.sky}"/>
          <stop offset="100%" stop-color="${t.hill1}" stop-opacity="0.6"/>
        </linearGradient>
      </defs>
      <!-- 하늘 -->
      <rect width="400" height="220" fill="url(#skyGrad${season})"/>
      <!-- 먼 산 -->
      <path d="M 0 160 Q 80 120 160 150 Q 240 170 320 130 Q 380 110 400 140 L 400 220 L 0 220 Z" fill="${t.hill1}" opacity="0.7"/>
      <!-- 가까운 언덕 -->
      <path d="M 0 190 Q 100 160 200 180 Q 300 200 400 170 L 400 220 L 0 220 Z" fill="${t.hill2}" opacity="0.8"/>
      <!-- 왼쪽 나무 -->
      <rect x="38" y="140" width="10" height="30" fill="${t.trunk}"/>
      <circle cx="43" cy="135" r="22" fill="${t.tree}" opacity="0.85"/>
      <circle cx="35" cy="125" r="15" fill="${t.tree}" opacity="0.85"/>
      <circle cx="52" cy="128" r="14" fill="${t.tree}" opacity="0.85"/>
      <!-- 오른쪽 나무 -->
      <rect x="350" y="145" width="8" height="26" fill="${t.trunk}"/>
      <circle cx="354" cy="140" r="18" fill="${t.tree}" opacity="0.85"/>
      <circle cx="346" cy="133" r="12" fill="${t.tree}" opacity="0.85"/>
      <!-- 구름 or 눈 -->
      <circle cx="80" cy="40" r="12" fill="#fff" opacity="0.8"/>
      <circle cx="95" cy="36" r="16" fill="#fff" opacity="0.8"/>
      <circle cx="110" cy="42" r="13" fill="#fff" opacity="0.8"/>
      <circle cx="300" cy="30" r="10" fill="#fff" opacity="0.7"/>
      <circle cx="315" cy="28" r="14" fill="#fff" opacity="0.7"/>
      <!-- 귀여운 꽃/장식 -->
      <g opacity="0.8">
        <circle cx="20" cy="200" r="3" fill="${t.decor}"/>
        <circle cx="75" cy="205" r="3" fill="${t.decor}"/>
        <circle cx="120" cy="202" r="3" fill="${t.decor}"/>
        <circle cx="280" cy="205" r="3" fill="${t.decor}"/>
        <circle cx="340" cy="201" r="3" fill="${t.decor}"/>
      </g>
      <!-- 하트 장식 (봄/소울메이트 느낌) -->
      ${season === 'spring' ? `
        <text x="190" y="50" font-size="18" opacity="0.4">💕</text>
        <text x="60" y="80" font-size="14" opacity="0.3">✨</text>
        <text x="330" y="70" font-size="14" opacity="0.3">✨</text>
      ` : ''}
    </svg>
  `;
}

/* ═══════════════════════════════════════════════════════════
   씬 라우팅
═══════════════════════════════════════════════════════════ */
function render() {
  app.innerHTML = '';
  if (state.scene === 'title') renderTitle();
  else if (state.scene === 'starter') renderStarter();
  else if (state.scene === 'name') renderNaming();
  else if (state.scene === 'playing') renderPlaying();
  else if (state.scene === 'ending') renderEnding();
}

async function startNewRun() {
  if (PET_DATA.length === 0) {
    alert('펫 데이터 로딩 중...');
    return;
  }
  const pool = PET_DATA.filter(p => p.grade === '일반');
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  state.starterPool = shuffled.slice(0, 6);
  state.starterPick = null;
  state.scene = 'starter';
  render();
}

function renderNaming() {
  const pet = state.starterPool.find(p => p.name === state.starterPick);

  screen.className = 'panel';
  screen.innerHTML = `
    <div class="panel-deco tl">💖</div>

      <img src="${pet.image}" alt="${pet.name}" onerror="this.style.visibility='hidden'">

        <button class="btn primary" id="btn-begin">🎬 모험 시작!</button>
      </div>
    </div>
  `;
  app.appendChild(screen);
  const input = document.getElementById('pet-name-input');
  input.focus();
  input.select();
  document.getElementById('btn-back').addEventListener('click', () => { playSfx('click'); state.scene = 'starter'; render(); });
  document.getElementById('btn-begin').addEventListener('click', () => {
    const name = input.value.trim();
    if (name.length < 1) { alert('이름을 입력해주세요'); return; }

    beginGame(pet, name);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-begin').click();
  });
}

function beginGame(petData, customName) {
  state.pet = {
    data: petData,
    name: customName,
    species: petData.name,
    image: petData.image,
    attr: petData.attr,
    str:  Math.round(petData.ic.atk * 1.5),
    agi:  Math.round(petData.ic.agi * 1.8),
    hp:   Math.round(petData.ic.hp * 0.8),
    int:  10 + rand(0, 5),
    elem: Object.values(petData.attr).reduce((s,v)=>s+v, 0) + rand(0, 5),
    cute: 20 + rand(0, 10),
    wild: 30 + rand(0, 15),
    bond: 30,
    happy: 50,
    stress: 0,
    fatigue: 0,
    stones: 50,
  };
  state.week = 1;
  state.log = [];
  state.scene = 'playing';
  pushLog(`${customName}과(와)의 1년이 시작되었다!`, 'info');
  render();
}

    <div class="action-list" id="action-list"></div>
    <div style="display:flex; gap:5px; margin-top:6px;">
      <button class="btn danger" id="btn-quit" style="flex:1; padding:10px; font-size:12px;">종료</button>
      <button class="btn mint" id="btn-save" style="flex:1; padding:10px; font-size:12px;">💾 저장</button>
    </div>
  `;

  grid.appendChild(left);
  grid.appendChild(right);
  app.appendChild(grid);

  right.querySelectorAll('.action-tab').forEach(tab => {
    tab.addEventListener('click', () => { playSfx('click'); currentActionTab = tab.dataset.tab; renderActionList(); });
  });
  renderActionList();

  document.getElementById('btn-quit').addEventListener('click', () => {
    playSfx('click');
    if (confirm('진행 중인 런을 포기하시겠습니까?')) { state.scene = 'title'; render(); }
  });
  document.getElementById('btn-save').addEventListener('click', () => { playSfx('success'); saveGame(); });

  const logBox = document.getElementById('log-box');
  if (logBox) logBox.scrollTop = logBox.scrollHeight;
}

function getMood(p) {
  if (p.hp <= 20) return 'mood-tired';
  if (p.fatigue >= 70) return 'mood-tired';
  if (p.stress >= 70) return 'mood-stress';
  if (p.happy >= 70 && p.bond >= 60) return 'mood-happy';
  return '';
}

function statBar(label, key, val, max, cls = '') {
  val = clamp(Math.round(val), 0, 999);
  const pct = Math.min(100, (val / max) * 100);
  return `
    <div class="stat-row">
      <div class="stat-label">${label}</div>
      <div class="stat-bar"><div class="stat-fill ${cls}" data-key="${key}" style="width:${pct}%"></div></div>
      <div class="stat-value" data-key="${key}">${val}</div>
    </div>
  `;
}

function renderActionList() {
  const list = document.getElementById('action-list');
  if (!list) return;
  list.innerHTML = '';
  let actions;
  if (currentActionTab === 'train') actions = TRAININGS;
  else if (currentActionTab === 'job') actions = JOBS;
  else actions = RESTS;

  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    const p = state.pet;
    let reqFail = null;
    if (a.req) {
      for (const [k, v] of Object.entries(a.req)) {
        if (k === 'stones') { if (p.stones < v) { reqFail = `💎 ${v} 필요`; break; } }
        else if (k === 'wildMax') { if (p.wild > v) { reqFail = `🎭 야생 ${v}↓ 필요`; break; } }
        else { if ((p[k]||0) < v) { reqFail = `${statLabel(k)} ${v} 필요`; break; } }
      }
    }
    if (a.cost && p.stones < a.cost) { if (!reqFail) reqFail = `💎 ${a.cost} 부족`; }
    if (p.fatigue >= 80 && a.id !== 'sleep') { if (!reqFail) reqFail = `⚠ 너무 피곤함`; }

    const costLine = a.cost ? `<div class="ab-cost">💎 ${a.cost}</div>`
                    : a.gain ? `<div class="ab-cost">💎 +${a.gain[0]}~${a.gain[1]}</div>`
                    : '';

    btn.innerHTML = `
      <div class="ab-name">${a.name}</div>
      <div class="ab-desc">${a.desc}</div>
      ${costLine}
      ${reqFail ? `<div class="ab-req">${reqFail}</div>` : ''}
    `;
    if (reqFail) btn.disabled = true;
    btn.addEventListener('click', () => doAction(a));
    list.appendChild(btn);
  });
}

/* ═══════════════════════════════════════════════════════════
   액션 실행
═══════════════════════════════════════════════════════════ */
let actionInProgress = false;

async function doAction(action) {
  if (actionInProgress) return;
  actionInProgress = true;

  const p = state.pet;
  if (action.cost) p.stones -= action.cost;
  let gained = 0;
  if (action.gain) {
    gained = rand(action.gain[0], action.gain[1]);
    p.stones += gained;
  }

  // 효과음
  if (action.sfx) playSfx(action.sfx);

  // 스프라이트 애니
  const sprite = document.getElementById('pet-sprite');
  if (sprite && action.anim) {
    sprite.classList.remove('mood-happy', 'mood-tired', 'mood-stress');
    sprite.classList.remove('action-train', 'action-run', 'action-eat', 'action-spirit');
    void sprite.offsetWidth;
    sprite.classList.add(action.anim);
    setTimeout(() => sprite.classList.remove(action.anim), 1200);
  }

  // 파티클
  if (action.particles) spawnParticles(action.particles, 8);

  // 스탯 변화
  const deltas = {};
  const eff = action.effects || {};
  for (const [k, range] of Object.entries(eff)) {
    const d = rand(range[0], range[1]);
    deltas[k] = d;
    applyDelta(p, k, d);
  }

  showStatPopups(deltas, gained);

  let msg = action.name;
  if (gained > 0) msg += ` (💎+${gained})`;
  const deltaStr = Object.entries(deltas)
    .filter(([k, v]) => v !== 0)
    .map(([k, v]) => `${statEmoji(k)}${v>0?'+':''}${v}`)
    .join(' ');
  if (deltaStr) msg += ` → ${deltaStr}`;
  pushLog(msg, 'info');

  await sleep(700);

  let eventChance = 0.12;
  if (action.event) eventChance = 0.55;
  if (Math.random() < eventChance) {
    actionInProgress = false;
    triggerEvent();
    return;
  }

  const tourney = TOURNAMENTS.find(t => t.week === state.week);
  if (tourney) {
    applyTournament(tourney);
    await sleep(400);
  }

  advanceWeek();
  actionInProgress = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function spawnParticles(emojis, count = 6) {
  const layer = document.getElementById('effect-layer');
  if (!layer) return;
  const rect = layer.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'effect';
    p.textContent = randChoice(emojis);
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const dist = rand(50, 90);
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--startX', '0px');
    p.style.setProperty('--startY', '0px');
    p.style.setProperty('--endX', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--endY', (Math.sin(angle) * dist - 25) + 'px');
    p.style.animationDelay = (i * 40) + 'ms';
    layer.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}

function showStatPopups(deltas, stonesDelta) {
  const stage = document.getElementById('pet-stage');
  if (!stage) return;

  const items = [];
  for (const [k, v] of Object.entries(deltas)) {
    if (!v || v === 0) continue;
    items.push({ text: `${statEmoji(k)}${v > 0 ? '+' : ''}${v}`, cls: v > 0 ? 'up' : 'down' });
  }
  if (stonesDelta > 0) items.push({ text: `💎+${stonesDelta}`, cls: 'gold' });

  items.forEach((it, i) => {
    const popup = document.createElement('div');
    popup.className = 'stat-popup ' + it.cls;
    popup.textContent = it.text;
    popup.style.left = '50%';
    popup.style.top = (30 + i * 24) + 'px';
    popup.style.animationDelay = (i * 120) + 'ms';
    stage.appendChild(popup);
    setTimeout(() => popup.remove(), 2100);
  });
}

function applyDelta(p, k, d) {
  if (k === 'stones') { p.stones = Math.max(0, p.stones + d); return; }
  p[k] = clamp((p[k]||0) + d, 0, 100);
}

function advanceWeek() {
  const p = state.pet;
  p.fatigue = Math.max(0, p.fatigue - 2);
  p.happy = Math.max(0, p.happy - 1);
  if (p.fatigue >= 70) { p.hp = Math.max(0, p.hp - 2); pushLog(`😫 피곤해서 체력 감소!`, 'hurt'); }
  if (p.stress >= 70) { p.bond = Math.max(0, p.bond - 2); pushLog(`😰 스트레스로 친밀도 감소`, 'hurt'); }
  if (p.happy >= 70) { p.stress = Math.max(0, p.stress - 1); }

  state.week++;
  if (state.week > 52) {
    state.scene = 'ending';
    state.stats.playCount++;
    const ending = decideEnding(p);
    if (!state.stats.bestRun || ['champion','soulmate','spirit'].includes(ending.id)) {
      state.stats.bestRun = { ending: ending.name, pet: p.name };
    }
    saveLocalStats();
    render();
    return;
  }
  render();
}

/* ═══════════════════════════════════════════════════════════
   이벤트
═══════════════════════════════════════════════════════════ */
function triggerEvent() {
  const ev = randChoice(EVENTS);
  playSfx('event');
  renderEventModal(ev);
}

function renderEventModal(ev) {
  const flash = document.createElement('div');
  flash.className = 'flash-overlay';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);

  const overlay = document.createElement('div');
  overlay.className = 'event-overlay open';
  const choicesHtml = ev.choices.map((c, i) => {
    let disabled = false, hint = '';
    if (c.req) {
      for (const [k, v] of Object.entries(c.req)) {
        if (k === 'stones' && state.pet.stones < v) { disabled = true; hint = `💎 ${v} 필요`; break; }
        else if (k !== 'stones' && (state.pet[k]||0) < v) { disabled = true; hint = `${statLabel(k)} ${v} 필요`; break; }
      }
    }
    return `<button class="ev-choice" data-idx="${i}" ${disabled?'disabled':''}>
      ${escapeHtml(c.text)}
      ${hint ? `<div class="hint" style="color:var(--red);">${hint}</div>` : ''}
    </button>`;
  }).join('');

  overlay.innerHTML = `
    <div class="event-panel">
      <div class="panel-deco tl">💖</div>
      <div class="panel-deco tr">✨</div>
      <div class="ev-icon">${ev.icon}</div>
      <div class="ev-title">${escapeHtml(ev.title)}</div>
      <div class="ev-desc">${escapeHtml(ev.desc)}</div>
      <div class="ev-choices">${choicesHtml}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.ev-choice').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      showEventResult(ev, idx, overlay);
    });
  });
}

function showEventResult(ev, choiceIdx, overlay) {
  const choice = ev.choices[choiceIdx];
  const p = state.pet;
  const deltas = {};
  let hasPositive = false, hasNegative = false;
  for (const [k, v] of Object.entries(choice.effect || {})) {
    applyDelta(p, k, v);
    deltas[k] = v;
    if (k !== 'stones' && v > 0) hasPositive = true;
    if (k !== 'stones' && v < 0) hasNegative = true;
  }
  pushLog(`📜 ${ev.title}: ${choice.msg}`, 'event');

  // 결과에 맞는 효과음
  if (hasPositive && !hasNegative) playSfx('success');
  else if (hasNegative && !hasPositive) playSfx('hurt');
  else playSfx('click');

  const panel = overlay.querySelector('.event-panel');
  const deltasHtml = Object.entries(deltas).filter(([k,v]) => v !== 0).map(([k,v]) => {
    const cls = k === 'stones' ? 'gold' : (v > 0 ? 'up' : 'down');
    const label = k === 'stones' ? `💎 ${v>0?'+':''}${v}` : `${statEmoji(k)} ${v>0?'+':''}${v}`;
    return `<span class="ev-delta ${cls}">${label}</span>`;
  }).join('');

  panel.innerHTML = `
    <div class="panel-deco tl">💖</div>
    <div class="panel-deco tr">✨</div>
    <div class="ev-icon">${ev.icon}</div>
    <div class="ev-title">${escapeHtml(ev.title)}</div>
    <div class="ev-msg">${escapeHtml(choice.msg)}</div>
    ${deltasHtml ? `<div class="ev-deltas">${deltasHtml}</div>` : ''}
    <button class="btn primary full" id="ev-continue">▶ 계속</button>
  `;

  document.getElementById('ev-continue').addEventListener('click', () => {
    playSfx('click');
    overlay.remove();
    const tourney = TOURNAMENTS.find(t => t.week === state.week);
    if (tourney) applyTournament(tourney);
    advanceWeek();
  });
}

/* ═══════════════════════════════════════════════════════════
   대회
═══════════════════════════════════════════════════════════ */
function applyTournament(t) {
  const p = state.pet;
  let score, thresholds;
  if (t.stat === 'overall') {
    score = p.str + p.agi + p.hp + p.cute + p.int + p.elem;
    thresholds = [240, 180, 120];
  } else {
    score = p[t.stat];
    thresholds = [60, 40, 25];
  }
  let rank, prize, bondDelta;
  if (score >= thresholds[0]) { rank = '🥇 1등!'; prize = 100; bondDelta = 8; playSfx('win'); }
  else if (score >= thresholds[1]) { rank = '🥈 2등'; prize = 50; bondDelta = 4; playSfx('success'); }
  else if (score >= thresholds[2]) { rank = '🥉 3등'; prize = 20; bondDelta = 2; playSfx('coin'); }
  else { rank = '참가상'; prize = 5; bondDelta = -1; playSfx('fail'); }

  p.stones += prize;
  applyDelta(p, 'bond', bondDelta);
  applyDelta(p, 'happy', bondDelta > 0 ? 5 : -3);
  pushLog(`🎪 ${t.name} ${rank} (💎+${prize}, 💕${bondDelta>0?'+':''}${bondDelta})`, 'event');
}

/* ═══════════════════════════════════════════════════════════
   엔딩
═══════════════════════════════════════════════════════════ */
function renderEnding() {
  const p = state.pet;
  const ending = decideEnding(p);
  updateSeasonBackground('spring');

  if (['champion','soulmate','spirit','star','warrior'].includes(ending.id)) {
    spawnEndingParticles();
    playSfx('win');
  } else if (['death','runaway','broken','wildbeast'].includes(ending.id)) {
    playSfx('fail');
  } else {
    playSfx('success');
  }

  const screen = document.createElement('div');
  screen.className = 'panel ending-screen';
  screen.innerHTML = `
    <div class="panel-deco tl">💖</div>
    <div class="panel-deco tr">✨</div>
    <div class="panel-deco bl">🎀</div>
    <div class="panel-deco br">💖</div>
    <div class="ep-emoji" style="color: ${ending.color};">${ending.emoji}</div>
    <div class="ep-title" style="color: ${ending.color};">${escapeHtml(ending.name)}</div>
    <img class="ep-pet-img" src="${p.image}" alt="${escapeHtml(p.name)}" onerror="this.style.visibility='hidden'">
    <div class="ep-pet"><b>${escapeHtml(p.name)}</b> (${escapeHtml(p.species)}) · 1년 후</div>
    <div class="ep-desc">${ending.desc.split('\n').map(s => escapeHtml(s)).join('<br>')}</div>
    <div class="ep-stats">
      💪 근력 <b>${p.str}</b> · 🏃 민첩 <b>${p.agi}</b> · ❤️ 체력 <b>${p.hp}</b><br>
      🧠 지능 <b>${p.int}</b> · 🔥 속성 <b>${p.elem}</b> · 😊 애교 <b>${p.cute}</b><br>
      🎭 야생 <b>${p.wild}</b> · 💕 친밀 <b>${p.bond}</b> · 🌈 행복 <b>${p.happy}</b><br>
      💎 최종 스톤 <b>${p.stones}</b>
    </div>
    <div class="ep-buttons">
      <button class="btn gold" id="btn-submit-ranking">🏆 랭킹 등록</button>
      <button class="btn primary" id="btn-restart">↻ 새 게임</button>
    </div>
  `;
  app.appendChild(screen);

  document.getElementById('btn-restart').addEventListener('click', () => { playSfx('click'); state.scene = 'title'; render(); });
  document.getElementById('btn-submit-ranking').addEventListener('click', () => { playSfx('success'); submitRanking(ending); });
}

function spawnEndingParticles() {
  const layer = document.createElement('div');
  layer.className = 'ending-particles';
  document.body.appendChild(layer);
  const emojis = ['🎉', '✨', '⭐', '💫', '🌟', '💖', '🎀', '👑'];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = randChoice(emojis);
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (rand(5, 10)) + 's';
    p.style.animationDelay = (Math.random() * -10) + 's';
    p.style.setProperty('--drift', (rand(-100, 100)) + 'px');
    p.style.fontSize = rand(22, 40) + 'px';
    layer.appendChild(p);
  }
}

async function submitRanking(ending) {
  const nick = prompt('랭킹에 등록할 닉네임 (2~10자)');
  if (!nick || nick.length < 2 || nick.length > 10) return;
  const p = state.pet;
  try {
    await db.ref('raise_rankings').push({
      nickname: nick,
      pet: p.name,
      species: p.species,
      ending: ending.name,
      endingId: ending.id,
      stones: p.stones,
      stats: { str: p.str, agi: p.agi, hp: p.hp, int: p.int, elem: p.elem, cute: p.cute, wild: p.wild, bond: p.bond, happy: p.happy },
      timestamp: Date.now(),
    });
    alert('랭킹 등록 완료! 💖');
  } catch(e) { alert('등록 실패: ' + e.message); }
}

/* ═══════════════════════════════════════════════════════════
   저장/불러오기
═══════════════════════════════════════════════════════════ */
function saveGame() {
  const nick = prompt('저장할 닉네임 (2~10자)', localStorage.getItem('raise_nick') || '');
  if (!nick || nick.length < 2) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  db.ref('raise_saves/' + key).set({
    pet: state.pet, week: state.week, log: state.log.slice(-20), timestamp: Date.now(),
  }).then(() => alert('저장 완료! 💾')).catch(e => alert('저장 실패: ' + e.message));
}

async function loadGame() {
  const nick = prompt('불러올 닉네임', localStorage.getItem('raise_nick') || '');
  if (!nick) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  try {
    const snap = await db.ref('raise_saves/' + key).once('value');
    const data = snap.val();
    if (!data) { alert('저장된 데이터가 없습니다.'); return; }
    state.pet = data.pet;
    state.week = data.week;
    state.log = data.log || [];
    state.scene = 'playing';
    render();
  } catch(e) { alert('불러오기 실패: ' + e.message); }
}

/* ═══════════════════════════════════════════════════════════
   오디오 버튼
═══════════════════════════════════════════════════════════ */
document.getElementById('btn-bgm').addEventListener('click', () => { playSfx('click'); toggleBgm(); });
document.getElementById('btn-sfx').addEventListener('click', () => { playSfx('click'); toggleSfx(); });
updateAudioBtns();

/* ═══════════════════════════════════════════════════════════
   초기
═══════════════════════════════════════════════════════════ */
loadLocalStats();
generateBgSparkles();
(async () => {
  await loadPetData();
  render();
})();
</script>
