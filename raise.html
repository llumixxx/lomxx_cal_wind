let PET_DATA = [];

async function loadPetData() {
  try {
    const r = await fetch('pet_info_data.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data)) {
        PET_DATA = data;
        return;
      }
    }
  } catch(e) {}
  // 폴백: game_pets.json
  try {
    const r = await fetch('game_pets.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) PET_DATA = await r.json();
  } catch(e) {}
}

function decideEnding(p) {
  const total = p.str + p.agi + p.hp + p.int + p.elem + p.cute;
  const avg = total / 6;

  if (p.hp <= 0) return { id: 'death', emoji: '☠️', name: '요절', desc: `${p.name}은(는) 너무 지쳐 쓰러졌다.\n모든 것이 끝났다... 다음엔 더 잘 돌보자.`, color: '#555' };
  if (p.happy <= 10 && p.bond <= 20) return { id: 'runaway', emoji: '😱', name: '가출 엔딩', desc: `${p.name}은(는) 어느 날 조용히 떠났다.\n돌아오지 않았다. 부디 잘 지내길...`, color: '#886' };
  if (p.stress >= 90) return { id: 'broken', emoji: '💔', name: '지친 펫', desc: `${p.name}은(는) 극도의 스트레스로 마음을 닫았다.\n이제 더 이상 예전의 그 펫이 아니다.`, color: '#a66' };

  // 특수 엔딩 (최고 스탯)
  if (p.bond >= 90 && p.happy >= 70) return { id: 'soulmate', emoji: '💕', name: '영혼의 동반자', desc: `${p.name}은(는) 너와 평생을 함께하기로 했다.\n최고의 유대! 부족에서 가장 행복한 펫으로 기록될 것이다.`, color: '#ff6b9f' };
  if (p.wild >= 80 && p.bond < 30) return { id: 'wildbeast', emoji: '👹', name: '포악한 야수', desc: `${p.name}은(는) 야생의 본능에 완전히 지배됐다.\n숲으로 사라졌다... 때때로 부족 근처에 나타난다는 소문이 돈다.`, color: '#d84040' };
  if (p.elem >= 80) return { id: 'spirit', emoji: '🔮', name: '정령수', desc: `${p.name}은(는) 정령과 하나가 되었다.\n부족의 무당마저 고개를 숙이는 신비로운 존재가 되었다.`, color: '#9a6fff' };
  // 챔피언(만능형)을 전문직보다 먼저
  if (p.str >= 60 && p.agi >= 60 && p.hp >= 60 && p.cute >= 60) return { id: 'champion', emoji: '🏆', name: '전설의 챔피언', desc: `${p.name}은(는) 모든 면에서 완벽한 펫이 되었다.\n부족 역사에 길이 남을 전설이다!`, color: '#ffd866' };
  if (p.cute >= 80) return { id: 'star', emoji: '🎪', name: '부족의 스타', desc: `${p.name}은(는) 부족의 연예인이 되었다.\n공연마다 관중이 몰려들고 모두가 사랑한다.`, color: '#ffca55' };
  if (p.int >= 70) return { id: 'sage', emoji: '📚', name: '현자의 펫', desc: `${p.name}은(는) 부족의 지혜로운 조언자가 되었다.\n어려운 결정 앞에서 너를 돕는다.`, color: '#7fd47f' };
  if (p.str >= 70 && p.hp >= 70) return { id: 'warrior', emoji: '⚔️', name: '부족 수호펫', desc: `${p.name}은(는) 부족의 전설적인 수호자가 되었다.\n아이들은 그 용맹을 이야기로 들려준다.`, color: '#d4943a' };
  if (p.str >= 60 && p.agi >= 60) return { id: 'hunter', emoji: '🏹', name: '맹수 사냥꾼', desc: `${p.name}은(는) 최고의 사냥 파트너가 되었다.\n어떤 먹잇감도 놓치지 않는다.`, color: '#c4743a' };
  if (p.bond >= 60) return { id: 'family', emoji: '🐾', name: '가족', desc: `${p.name}은(는) 너의 진정한 가족이 되었다.\n평범하지만 따뜻한 일상이 이어진다.`, color: '#a0d4a0' };

  return { id: 'normal', emoji: '🏠', name: '평범한 부족펫', desc: `${p.name}은(는) 평범한 부족의 일원으로 살아간다.\n특별하진 않지만, 누구보다 네 곁에 있다.`, color: '#b0a080' };
}

const app = document.getElementById('app');

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function pushLog(msg, cls = '') {
  state.log.push({ msg, cls });
  if (state.log.length > 40) state.log.shift();
}

function getMonth(week) {
  return Math.ceil(week / 4.33);
}

function getAttrTags(pet) {
  if (!pet || !pet.attr) return '';
  const tagMap = { '지': 'earth', '수': 'water', '화': 'fire', '풍': 'wind' };
  const tags = Object.entries(pet.attr)
    .filter(([k, v]) => v > 0)
    .map(([k, v]) => `<span class="attr-tag ${tagMap[k]||'neutral'}">${k}${v}</span>`);
  return tags.join('');
}

function loadLocalStats() {
  try {
    const s = localStorage.getItem('raise_stats');
    if (s) state.stats = { ...state.stats, ...JSON.parse(s) };
  } catch(e) {}
}
function saveLocalStats() {
  localStorage.setItem('raise_stats', JSON.stringify(state.stats));
}

  else if (state.scene === 'playing') renderPlaying();
  else if (state.scene === 'ending') renderEnding();
}

async function startNewRun() {
  if (PET_DATA.length === 0) {
    alert('펫 데이터 로딩 중... 잠시만 기다려주세요.');
    return;
  }
  // 일반 등급 중 6마리 랜덤
  const pool = PET_DATA.filter(p => p.grade === '일반');
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  state.starterPool = shuffled.slice(0, 6);
  state.starterPick = null;
  state.scene = 'starter';
  render();
}

function renderStarter() {
  const screen = document.createElement('div');
  screen.className = 'panel starter-screen';
  screen.innerHTML = `
    <h2>🐣 새끼펫 선택</h2>
    <div class="hint">부족의 전통에 따라, 너는 한 마리 새끼펫을 골라 돌보게 된다.<br>1년 후 이 펫은 어떤 존재가 될까?</div>
    <div class="starter-grid" id="starter-grid"></div>
    <div style="text-align:center; margin-top:10px;">
      <button class="btn primary" id="btn-reroll">🎲 다시 뽑기</button>
      <button class="btn ok" id="btn-confirm" disabled>✓ 이 펫을 선택</button>
    </div>
  `;
  app.appendChild(screen);

  const grid = document.getElementById('starter-grid');
  state.starterPool.forEach(pet => {
    const card = document.createElement('div');
    card.className = 'starter-card' + (state.starterPick === pet.name ? ' selected' : '');
    card.innerHTML = `
      <img src="${pet.image}" alt="${pet.name}" onerror="this.style.visibility='hidden'">
      <div class="name">${escapeHtml(pet.name)}</div>
      <div class="attrs">${getAttrTags(pet)}</div>
      <div class="stats-mini">
        HP ${Math.round(pet.ic.hp)} / ATK ${Math.round(pet.ic.atk)}<br>
        성장 ${Math.round((pet.sg.hp + pet.sg.atk + pet.sg.def + pet.sg.agi) * 10)/10}
      </div>
    `;
    card.addEventListener('click', () => {
      state.starterPick = pet.name;
      render();
    });
    grid.appendChild(card);
  });

  document.getElementById('btn-reroll').addEventListener('click', () => {
    const pool = PET_DATA.filter(p => p.grade === '일반');
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    state.starterPool = shuffled.slice(0, 6);
    state.starterPick = null;
    render();
  });
  const confirmBtn = document.getElementById('btn-confirm');
  confirmBtn.disabled = !state.starterPick;
  confirmBtn.addEventListener('click', () => {
    state.scene = 'name';
    render();
  });
}

function renderNaming() {
  const pet = state.starterPool.find(p => p.name === state.starterPick);
  const screen = document.createElement('div');
  screen.className = 'panel';
  screen.innerHTML = `
    <div class="name-input-wrap">
      <img src="${pet.image}" alt="${pet.name}" style="width:100px; height:100px; image-rendering:pixelated;" onerror="this.style.visibility='hidden'">
      <div style="margin: 10px 0; font-size: 16px;">선택한 펫: <b style="color: var(--accent);">${escapeHtml(pet.name)}</b></div>
      <div style="color: var(--fg2); font-size: 12px; margin-bottom: 16px;">너의 펫에게 이름을 지어주자.</div>
      <input type="text" id="pet-name-input" class="name-input" maxlength="12" placeholder="펫의 이름 (2~12자)" value="${escapeHtml(pet.name)}">
      <div style="margin-top: 16px;">
        <button class="btn" id="btn-back">← 다시 선택</button>
        <button class="btn primary" id="btn-begin">🎬 모험 시작!</button>
      </div>
    </div>
  `;
  app.appendChild(screen);
  const input = document.getElementById('pet-name-input');
  input.focus();
  input.select();
  document.getElementById('btn-back').addEventListener('click', () => {
    state.scene = 'starter';
    render();
  });
  document.getElementById('btn-begin').addEventListener('click', () => {
    const name = input.value.trim();
    if (name.length < 1) { alert('이름을 입력해주세요'); return; }
    beginGame(pet, name);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-begin').click();
  });
}

function beginGame(petData, customName) {
  state.pet = {
    data: petData,
    name: customName,
    species: petData.name,
    image: petData.image,
    attr: petData.attr,
    // 초기 능력치 (새끼 펫)
    str:  Math.round(petData.ic.atk * 1.5),
    agi:  Math.round(petData.ic.agi * 1.8),
    hp:   Math.round(petData.ic.hp * 0.8),
    int:  10 + rand(0, 5),
    elem: Object.values(petData.attr).reduce((s,v)=>s+v, 0) + rand(0, 5),
    cute: 20 + rand(0, 10),
    wild: 30 + rand(0, 15),
    bond: 30,
    happy: 50,
    stress: 0,
    fatigue: 0,
    stones: 50,
    achievements: [],
  };
  state.week = 1;
  state.log = [];
  state.lastEventMsg = null;
  state.scene = 'playing';
  pushLog(`${customName}과(와)의 1년이 시작되었다!`, 'info');
  render();
}

/* ============================================================
   메인 플레이 UI
============================================================ */
let currentActionTab = 'train';

function renderPlaying() {
  const p = state.pet;
  const month = getMonth(state.week);
  const day = (((state.week - 1) % 4.33) * 7 + 1) | 0;

  const grid = document.createElement('div');
  grid.className = 'game-grid';

  // ─── 좌측: 펫 상태 ───
  const left = document.createElement('div');
  left.className = 'pet-panel';
  left.innerHTML = `
    <div class="pet-header">
      <div class="pet-sprite-box">
        <img src="${p.image}" alt="${escapeHtml(p.name)}" onerror="this.style.visibility='hidden'">
      </div>
      <div class="pet-info">
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pspecies">종족: ${escapeHtml(p.species)}</div>
        <div style="display:flex; gap:4px; margin-top:4px;">${getAttrTags(p.data)}</div>
        <div class="date">📅 ${month}월 · ${state.week}/52주차</div>
        <div class="stones">💎 ${p.stones}</div>
      </div>
    </div>

    <div class="stats-grid">
      ${statBar('💪 근력', p.str, 100)}
      ${statBar('🏃 민첩', p.agi, 100)}
      ${statBar('❤️ 체력', p.hp, 100)}
      ${statBar('🧠 지능', p.int, 100)}
      ${statBar('🔥 속성', p.elem, 100)}
      ${statBar('😊 애교', p.cute, 100)}
      ${statBar('🎭 야생', p.wild, 100)}
      ${statBar('💕 친밀', p.bond, 100)}
      ${statBar('😰 스트레스', p.stress, 100, 'negative')}
      ${statBar('😫 피로', p.fatigue, 100, 'negative')}
      ${statBar('🌈 행복', p.happy, 100, 'positive')}
    </div>

    <div class="log-box" id="log-box">
      ${state.log.slice(-15).map(l => `<p class="${l.cls||''}">${escapeHtml(l.msg)}</p>`).join('')}
    </div>
  `;

  // ─── 우측: 액션 ───
  const right = document.createElement('div');
  right.className = 'action-panel';
  right.innerHTML = `
    <div class="action-tabs">
      <button class="action-tab ${currentActionTab==='train'?'active':''}" data-tab="train">🏋️ 훈련</button>
      <button class="action-tab ${currentActionTab==='job'?'active':''}" data-tab="job">💼 일</button>
      <button class="action-tab ${currentActionTab==='rest'?'active':''}" data-tab="rest">🛌 기타</button>
    </div>
    <div class="action-list" id="action-list"></div>
    <div style="display:flex; gap:4px; margin-top:6px;">
      <button class="btn danger" id="btn-quit" style="flex:1;">종료</button>
      <button class="btn" id="btn-save" style="flex:1;">💾 저장</button>
    </div>
  `;

  grid.appendChild(left);
  grid.appendChild(right);
  app.appendChild(grid);

  // 액션 탭 이벤트
  right.querySelectorAll('.action-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentActionTab = tab.dataset.tab;
      renderActionList();
    });
  });
  renderActionList();

  document.getElementById('btn-quit').addEventListener('click', () => {
    if (confirm('진행 중인 런을 포기하시겠습니까?')) {
      state.scene = 'title';
      render();
    }
  });
  document.getElementById('btn-save').addEventListener('click', saveGame);

  // 로그 스크롤
  const logBox = document.getElementById('log-box');
  if (logBox) logBox.scrollTop = logBox.scrollHeight;
}

function statBar(label, val, max, cls = '') {
  val = clamp(Math.round(val), 0, 999);
  const pct = Math.min(100, (val / max) * 100);
  return `
    <div class="stat-row">
      <div class="stat-label">${label}</div>
      <div class="stat-bar"><div class="stat-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="stat-value">${val}</div>
    </div>
  `;
}

function renderActionList() {
  const list = document.getElementById('action-list');
  if (!list) return;
  list.innerHTML = '';
  let actions;
  if (currentActionTab === 'train') actions = TRAININGS;
  else if (currentActionTab === 'job') actions = JOBS;
  else actions = RESTS;

  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';

    const p = state.pet;
    // 조건 체크
    let reqFail = null;
    if (a.req) {
      for (const [k, v] of Object.entries(a.req)) {
        if (k === 'stones') {
          if (p.stones < v) { reqFail = `💎 ${v} 필요 (현재 ${p.stones})`; break; }
        } else if (k === 'wildMax') {
          if (p.wild > v) { reqFail = `야생성 ${v} 이하 필요`; break; }
        } else {
          if ((p[k] || 0) < v) { reqFail = `${statLabel(k)} ${v} 필요`; break; }
        }
      }
    }
    // 비용 체크 (훈련/기타)
    if (a.cost && p.stones < a.cost) {
      if (!reqFail) reqFail = `💎 ${a.cost} 부족`;
    }
    // 피로 과다 체크
    if (p.fatigue >= 80 && a.id !== 'sleep') {
      if (!reqFail) reqFail = `⚠ 너무 피곤함 (휴식 필요)`;
    }

    const costLine = a.cost ? `<div class="ab-cost">💎 ${a.cost}</div>`
                    : a.gain ? `<div class="ab-cost">💎 +${a.gain[0]}~${a.gain[1]}</div>`
                    : '';

    btn.innerHTML = `
      <div class="ab-name">${a.name}</div>
      <div class="ab-desc">${a.desc}</div>
      ${costLine}
      ${reqFail ? `<div class="ab-req">${reqFail}</div>` : ''}
    `;
    if (reqFail) btn.disabled = true;
    btn.addEventListener('click', () => doAction(a));
    list.appendChild(btn);
  });
}

function statLabel(k) {
  return { str:'💪근력', agi:'🏃민첩', hp:'❤️체력', int:'🧠지능', elem:'🔥속성', cute:'😊애교', wild:'🎭야생' }[k] || k;
}

/* ============================================================
   행동 실행
============================================================ */
function doAction(action) {
  const p = state.pet;
  // 비용
  if (action.cost) p.stones -= action.cost;
  // 수입
  let gained = 0;
  if (action.gain) {
    gained = rand(action.gain[0], action.gain[1]);
    p.stones += gained;
  }

  // 효과 적용
  const deltas = {};
  const eff = action.effects || {};
  for (const [k, range] of Object.entries(eff)) {
    const d = rand(range[0], range[1]);
    deltas[k] = d;
    applyDelta(p, k, d);
  }

  // 로그
  let msg = `${action.name}`;
  if (gained > 0) msg += ` (💎+${gained})`;
  const deltaStr = Object.entries(deltas)
    .filter(([k, v]) => v !== 0)
    .map(([k, v]) => `${statEmoji(k)}${v>0?'+':''}${v}`)
    .join(' ');
  if (deltaStr) msg += ` → ${deltaStr}`;
  pushLog(msg, 'info');

  // 랜덤 이벤트 (산책이면 높은 확률)
  let eventChance = 0.15;
  if (action.event) eventChance = 0.6;
  if (Math.random() < eventChance) {
    triggerEvent();
    return;
  }

  // 주간 대회 체크
  const tourney = TOURNAMENTS.find(t => t.week === state.week);
  if (tourney) {
    applyTournament(tourney);
  }

  // 다음 주
  advanceWeek();
}

function statEmoji(k) {
  return { str:'💪', agi:'🏃', hp:'❤️', int:'🧠', elem:'🔥', cute:'😊', wild:'🎭', bond:'💕', happy:'🌈', stress:'😰', fatigue:'😫' }[k] || k;
}

function applyDelta(p, k, d) {
  if (k === 'stones') {
    p.stones = Math.max(0, p.stones + d);
    return;
  }
  p[k] = clamp((p[k] || 0) + d, 0, 100);
}

function advanceWeek() {
  const p = state.pet;
  // 주간 자연 감쇠
  p.fatigue = Math.max(0, p.fatigue - 2);
  p.happy = Math.max(0, p.happy - 1);
  // 피로/스트레스 누적 효과
  if (p.fatigue >= 70) {
    p.hp = Math.max(0, p.hp - 2);
    pushLog(`😫 너무 피곤해 체력이 떨어진다!`, 'hurt');
  }
  if (p.stress >= 70) {
    p.bond = Math.max(0, p.bond - 2);
    pushLog(`😰 스트레스로 친밀도 감소`, 'hurt');
  }
  if (p.happy >= 70) {
    p.stress = Math.max(0, p.stress - 1);
  }

  state.week++;
  if (state.week > 52) {
    // 엔딩
    state.scene = 'ending';
    state.stats.playCount++;
    const ending = decideEnding(p);
    if (!state.stats.bestRun || ending.id === 'champion' || ending.id === 'soulmate') {
      state.stats.bestRun = { ending: ending.name, pet: p.name };
    }
    saveLocalStats();
    render();
    return;
  }
  render();
}

/* ============================================================
   이벤트
============================================================ */
function triggerEvent() {
  // 조건 맞는 이벤트 중 랜덤
  const pool = EVENTS.filter(e => true);
  const ev = randChoice(pool);
  state.currentEvent = ev;
  renderEventModal(ev);
}

function renderEventModal(ev) {
  const overlay = document.createElement('div');
  overlay.className = 'event-overlay open';
  const choicesHtml = ev.choices.map((c, i) => {
    let disabled = false;
    let hint = '';
    if (c.req) {
      for (const [k, v] of Object.entries(c.req)) {
        if (k === 'stones' && state.pet.stones < v) { disabled = true; hint = `💎 ${v} 필요`; break; }
        else if (k !== 'stones' && (state.pet[k] || 0) < v) { disabled = true; hint = `${statLabel(k)} ${v} 필요`; break; }
      }
    }
    return `
      <button class="ev-choice" data-idx="${i}" ${disabled?'disabled':''}>
        ${escapeHtml(c.text)}
        ${hint ? `<div class="hint" style="color:#e74c3c;">${hint}</div>` : ''}
      </button>
    `;
  }).join('');

  overlay.innerHTML = `
    <div class="event-panel">
      <div class="ev-title">${ev.title}</div>
      <div class="ev-desc">${escapeHtml(ev.desc)}</div>
      <div class="ev-choices">${choicesHtml}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.ev-choice').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      resolveEvent(ev, idx);
      overlay.remove();
    });
  });
}

function resolveEvent(ev, choiceIdx) {
  const choice = ev.choices[choiceIdx];
  const p = state.pet;
  for (const [k, v] of Object.entries(choice.effect || {})) {
    applyDelta(p, k, v);
  }
  pushLog(`📜 ${ev.title}: ${choice.msg}`, 'event');

  // 분기 대회 체크
  const tourney = TOURNAMENTS.find(t => t.week === state.week);
  if (tourney) applyTournament(tourney);

  advanceWeek();
}

/* ============================================================
   분기별 대회
============================================================ */
function applyTournament(t) {
  const p = state.pet;
  let score;
  if (t.stat === 'overall') {
    score = p.str + p.agi + p.hp + p.cute + p.int + p.elem;
    var threshold1 = 240, threshold2 = 180, threshold3 = 120;
  } else {
    score = p[t.stat];
    var threshold1 = 60, threshold2 = 40, threshold3 = 25;
  }
  let rank, prize, bondDelta;
  if (score >= threshold1) { rank = '🥇 1등!'; prize = 100; bondDelta = 8; }
  else if (score >= threshold2) { rank = '🥈 2등'; prize = 50; bondDelta = 4; }
  else if (score >= threshold3) { rank = '🥉 3등'; prize = 20; bondDelta = 2; }
  else { rank = '참가상'; prize = 5; bondDelta = -1; }

  p.stones += prize;
  applyDelta(p, 'bond', bondDelta);
  applyDelta(p, 'happy', bondDelta > 0 ? 5 : -3);
  pushLog(`🎪 ${t.name} ${rank} (💎+${prize}, 💕${bondDelta>0?'+':''}${bondDelta})`, 'event');
}

/* ============================================================
   엔딩
============================================================ */
function renderEnding() {
  const p = state.pet;
  const ending = decideEnding(p);
  const screen = document.createElement('div');
  screen.className = 'ending-screen';
  screen.innerHTML = `
    <div style="font-size: 80px; margin-bottom: 10px;">${ending.emoji}</div>
    <div class="ep-title" style="color: ${ending.color};">${ending.name}</div>
    <div class="ep-pet">${escapeHtml(p.name)} (${escapeHtml(p.species)}) · 1년 후</div>
    <div class="ep-desc">${ending.desc.split('\n').map(s => escapeHtml(s)).join('<br>')}</div>
    <div class="ep-stats">
      💪근력 ${p.str} · 🏃민첩 ${p.agi} · ❤️체력 ${p.hp}<br>
      🧠지능 ${p.int} · 🔥속성 ${p.elem} · 😊애교 ${p.cute}<br>
      🎭야생 ${p.wild} · 💕친밀 ${p.bond} · 🌈행복 ${p.happy}<br>
      💎 최종 스톤 ${p.stones}
    </div>
    <button class="btn primary" id="btn-submit-ranking" style="margin-right: 6px;">🏆 랭킹 등록</button>
    <button class="btn" id="btn-restart">↻ 새 게임</button>
  `;
  app.appendChild(screen);

  document.getElementById('btn-restart').addEventListener('click', () => {
    state.scene = 'title';
    render();
  });
  document.getElementById('btn-submit-ranking').addEventListener('click', () => submitRanking(ending));
}

async function submitRanking(ending) {
  const nick = prompt('랭킹에 등록할 닉네임을 입력하세요 (2~10자)');
  if (!nick || nick.length < 2 || nick.length > 10) return;
  const p = state.pet;
  try {
    await db.ref('raise_rankings').push({
      nickname: nick,
      pet: p.name,
      species: p.species,
      ending: ending.name,
      endingId: ending.id,
      stones: p.stones,
      stats: {
        str: p.str, agi: p.agi, hp: p.hp, int: p.int, elem: p.elem,
        cute: p.cute, wild: p.wild, bond: p.bond, happy: p.happy,
      },
      timestamp: Date.now(),
    });
    alert('랭킹 등록 완료!');
  } catch(e) {
    alert('등록 실패: ' + e.message);
  }
}

/* ============================================================
   저장/불러오기
============================================================ */
function saveGame() {
  const nick = prompt('저장할 닉네임을 입력하세요 (2~10자)', localStorage.getItem('raise_nick') || '');
  if (!nick || nick.length < 2) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  const saveData = {
    pet: state.pet,
    week: state.week,
    log: state.log.slice(-20),
    timestamp: Date.now(),
  };
  db.ref('raise_saves/' + key).set(saveData)
    .then(() => alert('저장 완료!'))
    .catch(e => alert('저장 실패: ' + e.message));
}

async function loadGame() {
  const nick = prompt('불러올 닉네임을 입력하세요', localStorage.getItem('raise_nick') || '');
  if (!nick) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  try {
    const snap = await db.ref('raise_saves/' + key).once('value');
    const data = snap.val();
    if (!data) { alert('저장된 데이터가 없습니다.'); return; }
    state.pet = data.pet;
    state.week = data.week;
    state.log = data.log || [];
    state.scene = 'playing';
    render();
  } catch(e) {
    alert('불러오기 실패: ' + e.message);
  }
}

/* ============================================================
   초기화
============================================================ */
loadLocalStats();
(async () => {
  await loadPetData();
  render();
})();
</script>
