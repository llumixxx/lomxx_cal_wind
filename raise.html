<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>👑 프린세스 펫 메이커 - wind01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-pink: #ffe0ec;
    --bg-mint: #e4fff5;
    --bg-cream: #fff5e4;
    --pink-light: #ffd4e5;
    --pink: #ff9ec7;
    --pink-deep: #d4477a;
    --lavender: #c9a6ff;
    --lavender-deep: #7a4fd4;
    --mint: #a0e8d0;
    --mint-deep: #3ca080;
    --cream: #ffe8b8;
    --gold: #ffc640;
    --gold-deep: #d47820;
    --red: #d44040;
    --text: #3a2030;
    --text-muted: #705058;
    --panel-bg: rgba(255, 248, 252, 0.97);
    --border-pink: #ffb8d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--text);
    font-family: 'Jua', 'Gaegu', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(180deg, #ffe0ec 0%, #ffd4e5 100%);
    transition: background 1.5s;
  }

  body.season-spring { background: linear-gradient(180deg, #ffd4e5 0%, #ffe8f0 50%, #ffc4d8 100%); }
  body.season-summer { background: linear-gradient(180deg, #b8e8ff 0%, #d4f4ff 50%, #ffe8a0 100%); }
  body.season-autumn { background: linear-gradient(180deg, #ffb894 0%, #ffd4a0 50%, #ffc48c 100%); }
  body.season-winter { background: linear-gradient(180deg, #c4d4ff 0%, #e0e8ff 50%, #f0f4ff 100%); }

  .bg-sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .bg-sparkle {
    position: absolute; opacity: 0.5;
    animation: sparkleFloat infinite ease-in-out;
    font-size: 24px;
  }
  @keyframes sparkleFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50% { transform: translateY(-20px) scale(1.2); opacity: 0.7; }
  }

  .season-particles {
    position: fixed; inset: 0;
    pointer-events: none; overflow: hidden; z-index: 2;
  }
  .particle {
    position: absolute; top: -30px;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    user-select: none;
    filter: drop-shadow(0 2px 4px rgba(255,107,159,0.3));
  }
  @keyframes fall {
    0% { transform: translateY(-30px) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% { transform: translateY(110vh) translateX(var(--drift)) rotate(720deg); opacity: 0; }
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 10;
  }

  .title-bar { text-align: center; padding: 14px 0 8px; }
  .title-bar h1 {
    font-family: 'Jua', sans-serif;
    font-size: 30px;
    color: #fff;
    margin: 0;
    text-shadow: 2px 2px 0 var(--pink-deep), 4px 4px 0 rgba(0,0,0,0.2);
    letter-spacing: 2px;
  }
  .title-bar .sub { font-size: 13px; color: var(--text); margin-top: 4px; font-weight: 700; }

  /* 공통 패널 */
  .panel {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 3px solid var(--border-pink);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 6px 0 var(--pink), 0 12px 30px rgba(255,107,159,0.25), inset 0 1px 0 rgba(255,255,255,0.8);
    position: relative;
  }
  .panel-deco {
    position: absolute;
    font-size: 20px;
    animation: decoSpin 8s linear infinite;
  }
  .panel-deco.tl { top: -12px; left: -12px; }
  .panel-deco.tr { top: -12px; right: -12px; animation-direction: reverse; }
  .panel-deco.bl { bottom: -12px; left: -12px; animation-direction: reverse; }
  .panel-deco.br { bottom: -12px; right: -12px; }
  @keyframes decoSpin {
    0%, 100% { transform: rotate(-15deg) scale(1); }
    50% { transform: rotate(15deg) scale(1.1); }
  }

  /* 버튼 */
  .btn {
    background: linear-gradient(180deg, #fff 0%, var(--pink-light) 100%);
    border: 3px solid var(--pink);
    color: var(--pink-deep);
    padding: 12px 20px;
    border-radius: 24px;
    cursor: pointer;
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    font-weight: 700;
    transition: all .15s;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 0 var(--pink), 0 6px 10px rgba(255,107,159,0.2);
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    transition: left .5s;
  }
  .btn:hover:not(:disabled)::before { left: 100%; }
  .btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 7px 0 var(--pink), 0 10px 16px rgba(255,107,159,0.3);
  }
  .btn:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 0 var(--pink);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary {
    background: linear-gradient(180deg, var(--pink), var(--pink-deep));
    color: #fff; border-color: var(--pink-deep);
    box-shadow: 0 4px 0 #c04870;
  }
  .btn.primary:hover:not(:disabled) { box-shadow: 0 7px 0 #c04870; }
  .btn.lavender {
    background: linear-gradient(180deg, #d9bdff, var(--lavender-deep));
    color: #fff; border-color: var(--lavender-deep);
    box-shadow: 0 4px 0 #6a4aaa;
  }
  .btn.mint {
    background: linear-gradient(180deg, var(--mint), var(--mint-deep));
    color: #fff; border-color: var(--mint-deep);
    box-shadow: 0 4px 0 #3a9a78;
  }
  .btn.gold {
    background: linear-gradient(180deg, var(--cream), var(--gold));
    color: #8a5a10; border-color: var(--gold-deep);
    box-shadow: 0 4px 0 #c07020;
  }
  .btn.danger {
    background: linear-gradient(180deg, #ffb0b0, var(--red));
    color: #fff; border-color: #c04040;
    box-shadow: 0 4px 0 #803030;
  }
  .btn.full { width: 100%; }
  .btn.small { padding: 8px 14px; font-size: 12px; border-radius: 18px; }

  /* 타이틀 */
  .title-screen { text-align: center; padding: 20px; position: relative; }
  .title-screen .big-title {
    font-family: 'Jua', sans-serif;
    font-size: 52px;
    color: #fff;
    text-shadow: 3px 3px 0 var(--pink-deep), 6px 6px 0 rgba(0,0,0,0.2);
    letter-spacing: 3px;
    margin-bottom: 10px;
    line-height: 1.1;
    animation: titleBounce 2s ease-in-out infinite;
  }
  @keyframes titleBounce {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-8px) rotate(1deg); }
  }
  @media (max-width: 500px) { .title-screen .big-title { font-size: 38px; letter-spacing: 2px; } }
  .title-screen .tagline { font-size: 15px; color: var(--text); margin-bottom: 25px; line-height: 1.8; font-weight: 700; }
  .title-screen .menu-btns { display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin: 0 auto; }
  .title-screen .menu-btns .btn { padding: 14px; font-size: 18px; }
  .title-decorations { display: flex; justify-content: center; gap: 20px; margin: 24px 0; }
  .title-decorations .char {
    font-size: 50px;
    animation: floatChar 3s ease-in-out infinite;
    display: inline-block;
    filter: drop-shadow(3px 5px 8px rgba(255,107,159,0.4));
  }
  .title-decorations .char:nth-child(2) { animation-delay: 0.5s; }
  .title-decorations .char:nth-child(3) { animation-delay: 1s; }
  @keyframes floatChar {
    0%, 100% { transform: translateY(0) rotate(-8deg) scale(1); }
    50% { transform: translateY(-15px) rotate(8deg) scale(1.1); }
  }
  .title-screen .stats-row { margin-top: 24px; font-size: 12px; color: var(--text-muted); font-weight: 700; }

  /* 스타터 */
  .starter-screen h2 {
    font-family: 'Jua', sans-serif;
    color: var(--pink-deep);
    text-align: center;
    margin: 0 0 6px;
    font-size: 28px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
  }
  .starter-screen .hint { text-align: center; color: var(--text); font-size: 13px; margin-bottom: 16px; font-weight: 700; }
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .starter-card {
    background: linear-gradient(180deg, #fff 0%, var(--bg-pink) 100%);
    border: 3px solid var(--border-pink);
    border-radius: 18px;
    padding: 14px 10px;
    cursor: pointer;
    text-align: center;
    transition: all .25s cubic-bezier(.3,.7,.4,1.3);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 0 var(--pink), 0 8px 16px rgba(255,107,159,0.2);
  }
  .starter-card:hover {
    border-color: var(--pink-deep);
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 10px 0 var(--pink), 0 14px 28px rgba(255,107,159,0.35);
  }
  .starter-card.selected {
    border-color: var(--pink-deep);
    background: linear-gradient(180deg, #fff 0%, var(--pink-light) 100%);
    box-shadow: 0 0 0 4px var(--pink), 0 0 25px var(--pink-deep), 0 8px 0 var(--pink-deep);
    animation: selectedPulse 1.2s ease-in-out infinite;
  }
  @keyframes selectedPulse {
    0%, 100% { box-shadow: 0 0 0 4px var(--pink), 0 0 25px var(--pink-deep), 0 8px 0 var(--pink-deep); }
    50% { box-shadow: 0 0 0 4px var(--pink), 0 0 40px var(--pink-deep), 0 8px 0 var(--pink-deep); }
  }
  .starter-card img {
    width: 80px; height: 80px;
    object-fit: contain;
    image-rendering: pixelated;
    display: block; margin: 0 auto 4px;
    filter: drop-shadow(2px 4px 6px rgba(255,107,159,0.3));
  }
  .starter-card.selected img { animation: bouncePet 1s ease-in-out infinite; }
  @keyframes bouncePet {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-10px) scale(1.08); }
  }
  .starter-card .name { font-family: 'Jua', sans-serif; font-size: 18px; color: var(--pink-deep); margin-top: 4px; }
  .starter-card .attrs { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .attr-tag { padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; color: #fff; font-family: 'Jua'; border: 1.5px solid rgba(0,0,0,0.15); }
  .attr-tag.earth { background: var(--mint-deep); }
  .attr-tag.water { background: #5ac4ff; }
  .attr-tag.fire { background: #ff7070; }
  .attr-tag.wind { background: #ffbd55; color: #5a3a00; }
  .attr-tag.neutral { background: #b0a0a8; }
  .starter-card .stats-mini { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 700; }

  .name-input-wrap { text-align: center; padding: 24px 20px; }
  .name-input-wrap img {
    width: 130px; height: 130px;
    image-rendering: pixelated;
    object-fit: contain;
    animation: nameFloat 3s ease-in-out infinite;
    filter: drop-shadow(4px 6px 12px rgba(255,107,159,0.4));
  }
  @keyframes nameFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }
  .name-input {
    padding: 12px 18px;
    background: #fff;
    border: 3px solid var(--pink);
    color: var(--pink-deep);
    border-radius: 16px;
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    width: 240px; max-width: 80%;
    box-shadow: 0 3px 0 var(--pink-deep);
  }
  .name-input:focus { outline: none; border-color: var(--pink-deep); box-shadow: 0 3px 0 var(--pink-deep), 0 0 15px var(--pink); }

  /* ═════════════════════════════════════════════
     플레이 레이아웃 (재정비)
  ═════════════════════════════════════════════ */
  .play-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .play-layout { grid-template-columns: 1fr; }
  }

  /* 펫 상태 패널 (좌측) */
  .pet-status-panel {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 3px solid var(--border-pink);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 6px 0 var(--pink), 0 12px 30px rgba(255,107,159,0.25);
    position: relative;
  }
  .pet-status-panel .month-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, var(--cream), var(--gold));
    color: #8a5a10;
    padding: 6px 20px;
    border-radius: 20px;
    font-family: 'Jua';
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 3px 0 var(--gold-deep);
    z-index: 5;
    border: 2px solid #fff;
    white-space: nowrap;
  }

  .pet-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    margin-bottom: 10px;
  }
  .pet-big-sprite-wrap {
    width: 90px;
    height: 90px;
    background: radial-gradient(ellipse, rgba(255,182,193,0.4) 0%, transparent 70%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pet-big-sprite-wrap img {
    width: 86px; height: 86px;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(2px 4px 6px rgba(255,107,159,0.4));
    animation: breathe 3s ease-in-out infinite;
  }
  .pet-big-sprite-wrap img.mood-happy {
    animation: moodHappy 0.8s ease-in-out infinite;
  }
  .pet-big-sprite-wrap img.mood-tired {
    animation: moodTired 4s ease-in-out infinite;
    filter: drop-shadow(2px 4px 6px rgba(255,107,159,0.4)) saturate(0.6);
  }
  .pet-big-sprite-wrap img.mood-stress {
    animation: moodStress 0.2s linear infinite;
    filter: drop-shadow(2px 4px 6px rgba(255,107,159,0.4)) hue-rotate(-20deg);
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.02); }
  }
  @keyframes moodHappy {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-8px) rotate(-3deg); }
    75% { transform: translateY(-8px) rotate(3deg); }
  }
  @keyframes moodTired {
    0%, 100% { transform: rotate(-6deg) translateY(4px); }
    50% { transform: rotate(-8deg) translateY(6px); }
  }
  @keyframes moodStress {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }

  .pet-name-box { flex: 1; min-width: 0; }
  .pet-name-box .pname {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: var(--pink-deep);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
    word-break: break-all;
  }
  .pet-name-box .pspecies { font-size: 11px; color: var(--text-muted); margin-top: -2px; font-weight: 700; }
  .pet-name-box .pattrs { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }

  .stones-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
  }
  .stones-big {
    font-family: 'Jua';
    font-size: 20px;
    color: #8a5a10;
    background: linear-gradient(180deg, var(--cream), var(--gold));
    padding: 8px 14px;
    border-radius: 20px;
    border: 2px solid var(--gold-deep);
    box-shadow: 0 3px 0 var(--gold-deep);
    animation: stonesShine 2s ease-in-out infinite;
    flex: 1;
    text-align: center;
  }
  @keyframes stonesShine {
    0%, 100% { box-shadow: 0 3px 0 var(--gold-deep); }
    50% { box-shadow: 0 3px 0 var(--gold-deep), 0 0 15px var(--gold); }
  }

  .week-progress {
    background: rgba(255,255,255,0.6);
    border-radius: 12px;
    height: 10px;
    overflow: hidden;
    border: 2px solid var(--pink);
    margin-bottom: 10px;
  }
  .week-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--lavender-deep));
    transition: width .5s;
    box-shadow: 0 0 10px var(--pink);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
  }
  .stat-row { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; }
  .stat-label { width: 52px; flex-shrink: 0; color: var(--text); font-weight: 800; }
  .stat-bar {
    flex: 1;
    height: 11px;
    background: rgba(255,255,255,0.7);
    border-radius: 5px;
    overflow: hidden;
    border: 2px solid var(--border-pink);
  }
  .stat-fill {
    height: 100%;
    transition: width .5s;
    background: linear-gradient(90deg, var(--pink), var(--pink-deep));
  }
  .stat-fill.positive { background: linear-gradient(90deg, var(--mint), var(--mint-deep)); }
  .stat-fill.negative { background: linear-gradient(90deg, #ff8888, var(--red)); }
  .stat-value {
    width: 28px; text-align: right;
    font-family: 'Jua'; font-size: 14px;
    color: var(--pink-deep);
    flex-shrink: 0;
    font-weight: 800;
  }

  /* 로그 박스 */
  .log-box {
    background: rgba(255,255,255,0.85);
    border: 2px solid var(--border-pink);
    border-radius: 12px;
    padding: 10px 14px;
    margin-top: 10px;
    max-height: 110px;
    overflow-y: auto;
    font-size: 12.5px;
    line-height: 1.6;
    font-weight: 700;
  }
  .log-box p { margin: 0 0 3px; color: var(--text); }
  .log-box p.heal { color: var(--mint-deep); }
  .log-box p.hurt { color: var(--red); }
  .log-box p.info { color: var(--lavender-deep); }
  .log-box p.event { color: var(--gold-deep); }
  .log-box p.rival { color: var(--pink-deep); font-weight: 800; }

  /* 저장/종료 */
  .status-buttons {
    display: flex;
    gap: 5px;
    margin-top: 10px;
  }
  .status-buttons .btn { flex: 1; padding: 8px; font-size: 12px; border-radius: 14px; }

  /* ═════════════════════════════════════════════
     우측: 스케줄 + 액션
  ═════════════════════════════════════════════ */
  .main-area {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* 스케줄표 */
  .schedule-panel {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 3px solid var(--border-pink);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 6px 0 var(--pink), 0 12px 30px rgba(255,107,159,0.25);
    position: relative;
  }
  .schedule-title {
    font-family: 'Jua';
    font-size: 18px;
    color: var(--pink-deep);
    text-align: center;
    margin: 0 0 12px;
    text-shadow: 2px 2px 0 #fff;
  }
  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  @media (max-width: 600px) {
    .schedule-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .schedule-day {
    background: linear-gradient(180deg, #fff 0%, var(--bg-pink) 100%);
    border: 3px solid var(--border-pink);
    border-radius: 14px;
    padding: 8px 5px;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .schedule-day:hover {
    border-color: var(--pink-deep);
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--pink);
  }
  .schedule-day.filled {
    background: linear-gradient(180deg, var(--pink-light), #fff);
    border-color: var(--pink-deep);
  }
  .schedule-day .day-label {
    font-family: 'Jua';
    font-size: 13px;
    color: var(--pink-deep);
    background: #fff;
    border: 1.5px solid var(--pink);
    border-radius: 10px;
    padding: 2px 8px;
    font-weight: 800;
  }
  .schedule-day.filled .day-label { background: var(--pink-deep); color: #fff; border-color: var(--pink-deep); }
  .schedule-day .day-icon-svg {
    margin: 4px auto;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .schedule-day .day-icon-svg svg { width: 100%; height: 100%; }
  .schedule-day .day-action {
    font-family: 'Jua';
    font-size: 11.5px;
    color: var(--text);
    line-height: 1.3;
    font-weight: 800;
  }
  .schedule-day.filled .day-action { color: var(--pink-deep); }

    bottom: 40px;

  /* 애니메이션 중인 펫 */
  .wp-pet {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 140px;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(4px 6px 10px rgba(212,71,122,0.5));

  /* 액션별 펫 애니메이션 */
  .wp-pet.act-train {
    animation: wpTrain 1.4s ease-in-out;
  }
  @keyframes wpTrain {
    0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
    20% { transform: translateX(-50%) translateY(8px) scale(0.92); }
    50% { transform: translateX(-50%) translateY(-60px) scale(1.15); }
    80% { transform: translateX(-50%) translateY(10px) scale(0.95); }
  }
  .wp-pet.act-run {
    animation: wpRun 1.4s ease-in-out;
  }
  @keyframes wpRun {
    0% { transform: translateX(-50%) translateY(0); }
    20% { transform: translateX(-200px) translateY(-10px) scaleX(-1); }
    40% { transform: translateX(-200px) translateY(0) scaleX(-1); }
    60% { transform: translateX(100px) translateY(-10px) scaleX(1); }
    80% { transform: translateX(100px) translateY(0) scaleX(1); }
    100% { transform: translateX(-50%) translateY(0); }
  }
  .wp-pet.act-rest {
    animation: wpRest 1.4s ease-in-out;
    transform-origin: 50% 80%;
  }
  @keyframes wpRest {
    0%, 100% { transform: translateX(-50%) rotate(0) scale(1); }
    30% { transform: translateX(-50%) rotate(-8deg) scale(1) translateY(15px); }
    60% { transform: translateX(-50%) rotate(-15deg) scale(0.95) translateY(20px); }
    90% { transform: translateX(-50%) rotate(-6deg) scale(1) translateY(12px); }
  }
  .wp-pet.act-eat {
    animation: wpEat 1.4s ease-in-out;
  }
  @keyframes wpEat {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(0); }
    20% { transform: translateX(-50%) scale(1.12) rotate(-5deg); }
    40% { transform: translateX(-50%) scale(1.08) rotate(5deg); }
    60% { transform: translateX(-50%) scale(1.15) rotate(-4deg); }
    80% { transform: translateX(-50%) scale(1.1) rotate(4deg); }
  }
  .wp-pet.act-spirit {
    animation: wpSpirit 1.4s ease-in-out;
  }
  @keyframes wpSpirit {
    0%, 100% { transform: translateX(-50%) scale(1); filter: drop-shadow(4px 6px 10px rgba(212,71,122,0.5)); }
    30% { transform: translateX(-50%) scale(1.1) translateY(-20px); filter: drop-shadow(0 0 30px var(--lavender-deep)) drop-shadow(4px 6px 10px rgba(212,71,122,0.5)); }
    60% { transform: translateX(-50%) scale(1.2) translateY(-40px); filter: drop-shadow(0 0 50px var(--lavender-deep)) drop-shadow(4px 6px 10px rgba(212,71,122,0.5)); }
    80% { transform: translateX(-50%) scale(1.1) translateY(-20px); filter: drop-shadow(0 0 30px var(--lavender-deep)); }
  }

/* ═══════════════════════════════════════════════════════════
   오디오
═══════════════════════════════════════════════════════════ */
const audio = {
  ctx: null,
  bgm: document.getElementById('bgm-audio'),
  bgmEnabled: true,
  sfxEnabled: true,
  bgmStarted: false,
};
try {
  const savedBgm = localStorage.getItem('raise_bgm');
  const savedSfx = localStorage.getItem('raise_sfx');
  if (savedBgm !== null) audio.bgmEnabled = savedBgm === '1';
  if (savedSfx !== null) audio.sfxEnabled = savedSfx === '1';
} catch(e) {}
audio.bgm.volume = 0.25;

function ensureAudioCtx() {
  if (!audio.ctx) { try { audio.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  return audio.ctx;
}
function playBgm() { if (!audio.bgmEnabled) return; audio.bgm.play().catch(() => {}); audio.bgmStarted = true; }
function pauseBgm() { audio.bgm.pause(); }
function toggleBgm() {
  audio.bgmEnabled = !audio.bgmEnabled;
  localStorage.setItem('raise_bgm', audio.bgmEnabled ? '1' : '0');
  if (audio.bgmEnabled) playBgm(); else pauseBgm();
  updateAudioBtns();
}
function toggleSfx() {
  audio.sfxEnabled = !audio.sfxEnabled;
  localStorage.setItem('raise_sfx', audio.sfxEnabled ? '1' : '0');
  updateAudioBtns();
}
function updateAudioBtns() {
  document.getElementById('btn-bgm').classList.toggle('muted', !audio.bgmEnabled);
  document.getElementById('btn-bgm').textContent = audio.bgmEnabled ? '🎵' : '🔇';
  document.getElementById('btn-sfx').classList.toggle('muted', !audio.sfxEnabled);
  document.getElementById('btn-sfx').textContent = audio.sfxEnabled ? '🔔' : '🔕';
}

function playSfx(type) {
  if (!audio.sfxEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const play = (freq, dur, type2 = 'sine', gain = 0.15, delay = 0) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type2;
    osc.frequency.setValueAtTime(freq, now + delay);
    g.gain.setValueAtTime(gain, now + delay);
    g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + delay); osc.stop(now + delay + dur);
  };
  if (type === 'click') play(800, 0.08, 'sine', 0.1);
  else if (type === 'success') { [523, 659, 784].forEach((f, i) => play(f, 0.25, 'triangle', 0.18, i*0.08)); }
  else if (type === 'level_up') { [523, 659, 784, 1046].forEach((f, i) => play(f, 0.2, 'sine', 0.15, i*0.06)); }
  else if (type === 'coin') { play(988, 0.1, 'square', 0.12); play(1319, 0.12, 'square', 0.12, 0.05); }
  else if (type === 'fail') {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.3);
  }
  else if (type === 'event') { [1047, 1319, 1568].forEach((f, i) => play(f, 0.4, 'triangle', 0.11, i*0.03)); }
  else if (type === 'heart') {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
    osc.frequency.exponentialRampToValueAtTime(700, now + 0.2);
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.3);
  }
  else if (type === 'hurt') { play(200, 0.15, 'square', 0.09); }
  else if (type === 'win') {
    const notes = [523, 523, 523, 659, 784, 1047];
    const times = [0, 0.1, 0.2, 0.3, 0.4, 0.55];
    notes.forEach((f, i) => play(f, 0.35, 'triangle', 0.16, times[i]));
  }
}
function tryStartBgm() { if (!audio.bgmStarted && audio.bgmEnabled) playBgm(); }
document.addEventListener('click', tryStartBgm, { once: false });

}

const RIVAL_PERSONALITIES = ['arrogant', 'friendly', 'cold'];

let RIVAL_NICKS = ['엘리나','보르그','세리나','바로크','카리나','디무스']; // 폴백
async function loadRivalNicks() {
  try {
    const r = await fetch('pet_ranking_data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const data = await r.json();
    const latest = Array.isArray(data) ? data[data.length-1] : data;
    const nicks = new Set();
    (latest?.pets || []).forEach(pet => {
      (pet.general_ranking || []).forEach(rr => { if (rr.nickname) nicks.add(rr.nickname); });
      (pet.rebirth_ranking || []).forEach(rr => { if (rr.nickname) nicks.add(rr.nickname); });
    });
    if (nicks.size > 0) {
      RIVAL_NICKS = [...nicks];
      console.log('라이벌 풀 로드:', RIVAL_NICKS.length, '명');
    }
  } catch(e) { console.warn('라이벌 풀 로드 실패', e); }
}

function chooseRival() {
  const nick = RIVAL_NICKS[Math.floor(Math.random() * RIVAL_NICKS.length)];
  const personality = RIVAL_PERSONALITIES[Math.floor(Math.random() * RIVAL_PERSONALITIES.length)];
  // 랜덤 일반 펫 1마리
  const pool = PET_DATA.filter(p => p.grade === '일반');
  const petData = pool[Math.floor(Math.random() * pool.length)];
  return {
    name: nick,
    personality,
    petName: petData.name,
    petSpecies: petData.name,
    image: petData.image,
    attr: petData.attr,
    data: petData,
    str: Math.round(petData.ic.atk * 1.5),
    agi: Math.round(petData.ic.agi * 1.8),
    hp: Math.round(petData.ic.hp * 0.8),
    cute: 20,
    int: 10,
    elem: Object.values(petData.attr).reduce((s,v)=>s+v, 0),
    totalGrowth: petData.sg.atk + petData.sg.agi + petData.sg.hp + petData.sg.def,
    currentMsg: null,
  };
}

function growRival(rival, weeks = 1) {
  // 매주 자동으로 조금씩 자람 (1.2 + 성장률 * 보정)
  const growthBase = rival.totalGrowth * 0.4;
  for (let i = 0; i < weeks; i++) {
    rival.str += randInt(1, 2);
    rival.agi += randInt(1, 2);
    rival.hp += randInt(1, 2);
    rival.cute += randInt(0, 2);
    rival.int += randInt(0, 1);
    rival.elem += randInt(0, 1);
  }
  // 클램프
  ['str','agi','hp','cute','int','elem'].forEach(k => {
    rival[k] = Math.min(100, rival[k]);
  });
}

function getRivalPower(rival) {
  return rival.str + rival.agi + rival.hp + rival.cute + rival.int + rival.elem;
}
function getMyPower(p) {
  return p.str + p.agi + p.hp + p.cute + p.int + p.elem;
}

function pickRivalMsg(rival, context) {
  const msgs = RIVAL_MESSAGES[rival.personality][context] || [];
  if (msgs.length === 0) return '...';
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function updateRivalMsg(p, rival) {
  const myPow = getMyPower(p);
  const rvPow = getRivalPower(rival);
  const diff = myPow - rvPow;
  let ctx;
  if (diff > 30) ctx = 'behind'; // 라이벌이 뒤쳐짐
  else if (diff < -30) ctx = 'lead';
  else ctx = 'start';
  rival.currentMsg = pickRivalMsg(rival, ctx);
}

  if (p.str >= 60 && p.agi >= 60 && p.hp >= 60 && p.cute >= 60) return { id: 'champion', emoji: '🏆', name: '전설의 챔피언', desc: `${p.name}은(는) 완벽한 펫이 되었다.\n전설이다!`, color: '#ffc640' };
  if (p.cute >= 80) return { id: 'star', emoji: '🎪', name: '부족의 스타', desc: `${p.name}은(는) 부족의 연예인이 되었다.`, color: '#ff9ac0' };
  if (p.int >= 70) return { id: 'sage', emoji: '📚', name: '현자의 펫', desc: `${p.name}은(는) 지혜로운 조언자가 되었다.`, color: '#7fd47f' };
  if (p.str >= 70 && p.hp >= 70) return { id: 'warrior', emoji: '⚔️', name: '부족 수호펫', desc: `${p.name}은(는) 부족의 수호자.`, color: '#d4943a' };
  if (p.str >= 60 && p.agi >= 60) return { id: 'hunter', emoji: '🏹', name: '맹수 사냥꾼', desc: `${p.name}은(는) 사냥 파트너.`, color: '#c4743a' };
  if (p.bond >= 60) return { id: 'family', emoji: '🐾', name: '가족', desc: `${p.name}은(는) 너의 진정한 가족.`, color: '#a0d4a0' };
  return { id: 'normal', emoji: '🏠', name: '평범한 부족펫', desc: `${p.name}은(는) 평범한 부족 일원.`, color: '#b0a080' };
}

/* ═══════════════════════════════════════════════════════════
   상태

const state = {
  scene: 'title',
  week: 1,
  pet: null,
  rival: null,
  log: [],
  starterPool: [],
  starterPick: null,
  schedule: Array(7).fill(null), // 월~일 7일치, 각 칸은 { type: 'train'|'job'|'rest', id: 'rock' }
  currentSlot: 0, // 편집 중인 슬롯
  stats: { playCount: 0, bestRun: null },
};

const DAYS = ['월', '화', '수', '목', '금', '토', '일'];

const app = document.getElementById('app');

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pushLog(msg, cls = '') {
  state.log.push({ msg, cls });
  if (state.log.length > 40) state.log.shift();
}
function getMonth(week) { return Math.min(12, Math.ceil(week / 4.33)); }
function getSeason(week) {
  const m = getMonth(week);
  if (m <= 2) return 'winter';
  if (m <= 5) return 'spring';
  if (m <= 8) return 'summer';
  if (m <= 11) return 'autumn';
  return 'winter';
}
function getAttrTags(pet) {
  if (!pet || !pet.attr) return '';
  const tagMap = { '지':'earth', '수':'water', '화':'fire', '풍':'wind' };
  return Object.entries(pet.attr).filter(([k,v]) => v>0).map(([k,v]) => `<span class="attr-tag ${tagMap[k]||'neutral'}">${k}${v}</span>`).join('');
}
function loadLocalStats() {
  try { const s = localStorage.getItem('raise_stats'); if (s) state.stats = { ...state.stats, ...JSON.parse(s) }; } catch(e) {}
}
function saveLocalStats() { localStorage.setItem('raise_stats', JSON.stringify(state.stats)); }
function statLabel(k) { return { str:'💪근력', agi:'🏃민첩', hp:'❤️체력', int:'🧠지능', elem:'🔥속성', cute:'😊애교', wild:'🎭야생', bond:'💕친밀', happy:'🌈행복' }[k] || k; }
function statEmoji(k) { return { str:'💪', agi:'🏃', hp:'❤️', int:'🧠', elem:'🔥', cute:'😊', wild:'🎭', bond:'💕', happy:'🌈', stress:'😰', fatigue:'😫' }[k] || k; }

function getActionById(type, id) {
  const arr = type === 'train' ? TRAININGS : type === 'job' ? JOBS : RESTS;
  return arr.find(a => a.id === id);
}

/* 배경 반짝이 */
function generateBgSparkles() {
  const layer = document.getElementById('bg-sparkles');
  layer.innerHTML = '';
  const emojis = ['✨', '💫', '⭐', '🌟'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span');
    s.className = 'bg-sparkle';
    s.textContent = randChoice(emojis);
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDuration = randInt(3, 6) + 's';
    s.style.animationDelay = (Math.random() * -5) + 's';
    s.style.fontSize = randInt(14, 22) + 'px';
    layer.appendChild(s);
  }
}
function updateSeasonBackground(season) {
  document.body.className = 'season-' + season;
  generateSeasonParticles(season);
}
function generateSeasonParticles(season) {
  const layer = document.getElementById('season-particles');
  layer.innerHTML = '';
  const emoji = {
    spring: ['🌸', '🌺', '💮', '🌷', '💕'],
    summer: ['☀️', '🌿', '💧', '🍃', '🌻'],
    autumn: ['🍂', '🍁', '🌰', '🍄', '🌾'],
    winter: ['❄️', '❄', '✨', '⛄', '🎀'],
  }[season] || ['✨'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = randChoice(emoji);
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = randInt(9, 22) + 's';
    p.style.animationDelay = (Math.random() * -20) + 's';
    p.style.setProperty('--drift', randInt(-100, 100) + 'px');
    p.style.fontSize = randInt(18, 30) + 'px';
    p.style.opacity = 0.5 + Math.random() * 0.4;
    layer.appendChild(p);
  }
}

/* 씬 라우팅 */
function render() {
  app.innerHTML = '';
  if (state.scene === 'title') renderTitle();
  else if (state.scene === 'starter') renderStarter();
  else if (state.scene === 'name') renderNaming();
  else if (state.scene === 'playing') renderPlaying();
  else if (state.scene === 'ending') renderEnding();
}

async function startNewRun() {
  if (PET_DATA.length === 0) { alert('펫 데이터 로딩 중...'); return; }
  const pool = PET_DATA.filter(p => p.grade === '일반');
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  state.starterPool = shuffled.slice(0, 6);
  state.starterPick = null;
  state.scene = 'starter';
  render();
}

function beginGame(petData, customName) {
  state.pet = {
    data: petData,
    name: customName,
    species: petData.name,
    image: petData.image,
    attr: petData.attr,
    str: Math.round(petData.ic.atk * 1.5),
    agi: Math.round(petData.ic.agi * 1.8),
    hp: Math.round(petData.ic.hp * 0.8),
    int: 10 + randInt(0, 5),
    elem: Object.values(petData.attr).reduce((s,v)=>s+v,0) + randInt(0,5),
    cute: 20 + randInt(0, 10),
    wild: 30 + randInt(0, 15),
    bond: 30,
    happy: 50,
    stress: 0,
    fatigue: 0,
    stones: 50,
  };
  state.week = 1;
  state.log = [];
  state.schedule = Array(7).fill(null);
  state.rival = chooseRival();
  updateRivalMsg(state.pet, state.rival);
  state.scene = 'playing';
  pushLog(`${customName}과(와)의 1년이 시작되었다!`, 'info');
  pushLog(`🎯 라이벌 ${state.rival.name}이(가) 등장했다!`, 'rival');
  render();
}

    if (logBox) logBox.scrollTop = logBox.scrollHeight;

function getMood(p) {
  if (p.hp <= 20) return 'mood-tired';
  if (p.fatigue >= 70) return 'mood-tired';
  if (p.stress >= 70) return 'mood-stress';
  if (p.happy >= 70 && p.bond >= 60) return 'mood-happy';
  return '';
}

function statBar(label, key, val, max, cls = '') {
  val = clamp(Math.round(val), 0, 999);
  const pct = Math.min(100, (val / max) * 100);
  return `<div class="stat-row"><div class="stat-label">${label}</div><div class="stat-bar"><div class="stat-fill ${cls}" style="width:${pct}%"></div></div><div class="stat-value">${val}</div></div>`;
}

/* ═══════════════════════════════════════════════════════════
   액션 선택 팝업
═══════════════════════════════════════════════════════════ */
let chooserTab = 'train';

function openChooser(slotIdx) {
  state.currentSlot = slotIdx;
  chooserTab = 'train';
  document.getElementById('chooser-title').textContent = `💖 ${DAYS[slotIdx]}요일 활동 선택 💖`;
  renderChooserItems();
  document.getElementById('chooser-overlay').classList.add('open');
}
function closeChooser() {
  document.getElementById('chooser-overlay').classList.remove('open');
}
function renderChooserItems() {
  document.querySelectorAll('.action-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === chooserTab));
  const grid = document.getElementById('chooser-grid');
  grid.innerHTML = '';
  const actions = chooserTab === 'train' ? TRAININGS : chooserTab === 'job' ? JOBS : RESTS;
  const p = state.pet;
  actions.forEach(a => {
    const item = document.createElement('div');
    item.className = 'action-item';
    let reqFail = null;
    if (a.req) {
      for (const [k, v] of Object.entries(a.req)) {
        if (k === 'stones') { if (p.stones < v) { reqFail = `💎 ${v} 필요`; break; } }
        else if (k === 'wildMax') { if (p.wild > v) { reqFail = `🎭 ${v}↓ 필요`; break; } }
        else { if ((p[k]||0) < v) { reqFail = `${statLabel(k)} ${v}+`; break; } }
      }
    }
    if (a.cost && p.stones < a.cost) { if (!reqFail) reqFail = `💎 ${a.cost} 부족`; }
    const costLine = a.cost ? `<div class="ai-cost">💎 ${a.cost}</div>`
                    : a.gain ? `<div class="ai-cost">💎 +${a.gain[0]}~${a.gain[1]}</div>`
                    : '<div class="ai-cost">&nbsp;</div>';
    const svg = ACTION_SVG[a.id] || '';
    item.innerHTML = `
      <div class="ai-icon">${svg}</div>
      <div class="ai-name">${a.name}</div>
      <div class="ai-desc">${a.desc}</div>
      ${costLine}
      ${reqFail ? `<div class="ai-req">${reqFail}</div>` : ''}
    `;
    if (reqFail) item.classList.add('disabled');
    else item.addEventListener('click', () => {
      playSfx('heart');
      state.schedule[state.currentSlot] = { type: chooserTab, id: a.id };
      closeChooser();
      render();
    });
    grid.appendChild(item);
  });
}

/* 스케줄 실행 - 애니메이션 재생 */
async function runWeek() {
  const p = state.pet;
  const results = [];
  const schedule = state.schedule.slice();

  // 실행용 오버레이 열기
  const overlay = document.getElementById('wp-overlay');
  overlay.classList.add('open');

  // 진행도 점 7개
  const progressEl = document.getElementById('wp-progress');
  progressEl.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = document.createElement('div');
    d.className = 'wp-progress-dot';
    progressEl.appendChild(d);
  }

  let skipped = false;
  const skipBtn = document.getElementById('wp-skip');
  const onSkip = () => { skipped = true; };
  skipBtn.addEventListener('click', onSkip);

  // 요일별 순차 재생
  for (let i = 0; i < 7; i++) {
    const slot = schedule[i];
    const dots = progressEl.querySelectorAll('.wp-progress-dot');
    dots.forEach((d, idx) => {
      d.classList.toggle('current', idx === i);
      d.classList.toggle('done', idx < i);
    });

    if (!slot) {
      // 빈 날: 짧게 표시
      document.getElementById('wp-day-label').textContent = DAYS[i] + '요일';
      document.getElementById('wp-action-label').textContent = '💤 아무것도 안 함';
      renderPlayScene(null, p, []);
      if (!skipped) await sleep(600);
      continue;
    }

    const action = getActionById(slot.type, slot.id);
    if (!action) continue;

    // 조건 체크
    let canDo = true;
    if (action.req) {
      for (const [k, v] of Object.entries(action.req)) {
        if (k === 'stones' && p.stones < v) { canDo = false; break; }
        else if (k === 'wildMax' && p.wild > v) { canDo = false; break; }
        else if (k !== 'stones' && k !== 'wildMax' && (p[k]||0) < v) { canDo = false; break; }
      }
    }
    if (action.cost && p.stones < action.cost) canDo = false;
    if (p.fatigue >= 80 && action.id !== 'sleep') canDo = false;

    const dayResult = { day: DAYS[i], action, deltas: {}, gained: 0, reqFail: !canDo };

    // 라벨 업데이트
    document.getElementById('wp-day-label').textContent = DAYS[i] + '요일';
    document.getElementById('wp-action-label').textContent = action.name;

    if (!canDo) {
      renderPlayScene(action, p, [], 'fail');
      pushLog(`${DAYS[i]}: ${action.name} 실패 (조건 불충분)`, 'hurt');
      playSfx('fail');
      if (!skipped) await sleep(900);
      results.push(dayResult);
      continue;
    }

    // 실제 효과 계산
    if (action.cost) p.stones -= action.cost;
    if (action.gain) {
      const g = randInt(action.gain[0], action.gain[1]);
      p.stones += g;
      dayResult.gained = g;
    }
    if (action.effects) {
      for (const [k, range] of Object.entries(action.effects)) {
        const d = randInt(range[0], range[1]);
        dayResult.deltas[k] = d;
        applyDelta(p, k, d);
      }
    }
    results.push(dayResult);

    // 로그
    const deltaStr = Object.entries(dayResult.deltas).filter(([k,v]) => v !== 0).map(([k,v]) => `${statEmoji(k)}${v>0?'+':''}${v}`).join(' ');
    let msg = `${DAYS[i]}: ${action.name}`;
    if (dayResult.gained > 0) msg += ` 💎+${dayResult.gained}`;
    if (deltaStr) msg += ` ${deltaStr}`;
    pushLog(msg, 'info');

    // 애니메이션 재생
    renderPlayScene(action, p, dayResult.deltas, null, dayResult.gained);
    if (action.sfx) playSfx(action.sfx);

    if (!skipped) await sleep(1500);
  }

  // 진행도 모두 완료
  progressEl.querySelectorAll('.wp-progress-dot').forEach(d => {
    d.classList.remove('current');
    d.classList.add('done');
  });

  skipBtn.removeEventListener('click', onSkip);
  if (!skipped) await sleep(400);

  // 오버레이 닫기
  overlay.classList.remove('open');

  // 이벤트 체크
  let eventTriggered = null;
  const hasWalk = schedule.some(s => s && s.id === 'walk');
  const eventChance = hasWalk ? 0.5 : 0.2;
  if (Math.random() < eventChance) {
    eventTriggered = randChoice(EVENTS);
  }

  // 라이벌도 이번 주 자동 성장
  growRival(state.rival, 1);

  // 스케줄 초기화
  state.schedule = Array(7).fill(null);

  if (eventTriggered) {
    setTimeout(() => showEvent(eventTriggered), 300);
  } else {
    afterWeek();
  }
}

function renderPlayScene(action, pet, deltas, forceClass, stonesDelta) {
  const scene = document.getElementById('wp-scene');
  // 기존 펫/파티클/팝업 제거
  scene.querySelectorAll('.wp-pet, .wp-particle, .wp-popup').forEach(el => el.remove());

  // 배경 업데이트
  const bgEl = document.getElementById('wp-bg-svg');
  bgEl.innerHTML = action ? getSceneBgSvg(action) : getSceneBgSvg({ id: 'sleep' });

  // 펫 스프라이트
  const pet_el = document.createElement('img');
  pet_el.className = 'wp-pet ' + (forceClass || (action ? getActAnimClass(action) : ''));
  pet_el.src = pet.image;
  pet_el.onerror = function() { this.style.visibility = 'hidden'; };
  scene.appendChild(pet_el);

  // 파티클
  if (!forceClass && action) {
    const particles = actionParticles(action);
    setTimeout(() => spawnScenePartices(scene, particles, 10), 200);
  }

  // 스탯 팝업 (중간에 나타남)
  if (!forceClass && deltas) {
    setTimeout(() => spawnScenePopups(scene, deltas, stonesDelta), 500);
  }
}

function spawnScenePartices(scene, emojis, count = 10) {
  const rect = scene.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height * 0.55;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'wp-particle';
    p.textContent = randChoice(emojis);
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = randInt(60, 140);
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--sx', '0px');
    p.style.setProperty('--sy', '0px');
    p.style.setProperty('--ex', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ey', (Math.sin(angle) * dist - 40) + 'px');
    p.style.animationDelay = (i * 50) + 'ms';
    p.style.fontSize = randInt(28, 44) + 'px';
    scene.appendChild(p);
    setTimeout(() => p.remove(), 1700);
  }
}

function spawnScenePopups(scene, deltas, stonesDelta) {
  const items = [];
  for (const [k, v] of Object.entries(deltas || {})) {
    if (!v || v === 0) continue;
    items.push({ text: `${statEmoji(k)}${v > 0 ? '+' : ''}${v}`, cls: v > 0 ? 'up' : 'down' });
  }
  if (stonesDelta > 0) items.push({ text: `💎+${stonesDelta}`, cls: 'gold' });
  items.forEach((it, i) => {
    const popup = document.createElement('div');
    popup.className = 'wp-popup ' + it.cls;
    popup.textContent = it.text;
    popup.style.left = '50%';
    popup.style.top = (60 + i * 32) + 'px';
    popup.style.animationDelay = (i * 150) + 'ms';
    scene.appendChild(popup);
    setTimeout(() => popup.remove(), 2100);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function applyDelta(p, k, d) {
  if (k === 'stones') { p.stones = Math.max(0, p.stones + d); return; }
  p[k] = clamp((p[k]||0) + d, 0, 100);
}

      const deltaStr = Object.entries(r.deltas).filter(([k,v]) => v !== 0).map(([k,v]) => `${statEmoji(k)}${v>0?'+':''}${v}`).join(' ');
      let msg = `${r.day}: ${r.action.name}`;
      if (r.gained > 0) msg += ` 💎+${r.gained}`;
      if (deltaStr) msg += ` ${deltaStr}`;
      pushLog(msg, 'info');
    }
  });

  document.getElementById('wr-continue').addEventListener('click', () => {
    playSfx('click');
    overlay.remove();
    if (eventTriggered) {
      setTimeout(() => showEvent(eventTriggered), 200);
    } else {
      afterWeek();
    }
  });
}

function afterWeek() {
  const p = state.pet;
  // 주간 자연 감쇠
  p.fatigue = Math.max(0, p.fatigue - 3);
  p.happy = Math.max(0, p.happy - 1);
  if (p.fatigue >= 70) { p.hp = Math.max(0, p.hp - 2); pushLog(`😫 피곤으로 체력↓`, 'hurt'); }
  if (p.stress >= 70) { p.bond = Math.max(0, p.bond - 2); pushLog(`😰 스트레스로 친밀도↓`, 'hurt'); }
  if (p.happy >= 70) p.stress = Math.max(0, p.stress - 1);

  // 대회 체크
  const tourney = TOURNAMENTS.find(t => t.week === state.week);
  if (tourney) {
    applyTournament(tourney);
  }

  // 라이벌 멘트 업데이트
  updateRivalMsg(p, state.rival);

  state.week++;
  if (state.week > 52) {
    state.scene = 'ending';
    state.stats.playCount++;
    const ending = decideEnding(p);
    if (!state.stats.bestRun || ['champion','soulmate','spirit'].includes(ending.id)) {
      state.stats.bestRun = { ending: ending.name, pet: p.name };
    }
    saveLocalStats();
    render();
    return;
  }
  render();
}

/* 이벤트 모달 */
function showEvent(ev) {
  playSfx('event');
  const flash = document.createElement('div');
  flash.className = 'flash-overlay';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);

  const overlay = document.createElement('div');
  overlay.className = 'event-overlay open';
  const choicesHtml = ev.choices.map((c, i) => {
    let disabled = false, hint = '';
    if (c.req) {
      for (const [k, v] of Object.entries(c.req)) {
        if (k === 'stones' && state.pet.stones < v) { disabled = true; hint = `💎 ${v} 필요`; break; }
        else if (k !== 'stones' && (state.pet[k]||0) < v) { disabled = true; hint = `${statLabel(k)} ${v}+`; break; }
      }
    }
    return `<button class="ev-choice" data-idx="${i}" ${disabled?'disabled':''}>${escapeHtml(c.text)}${hint?`<div class="hint" style="color:var(--red);">${hint}</div>`:''}</button>`;
  }).join('');
  overlay.innerHTML = `
    <div class="event-panel">
      <div class="panel-deco tl">💖</div><div class="panel-deco tr">✨</div>
      <div class="ev-icon">${ev.icon}</div>
      <div class="ev-title">${escapeHtml(ev.title)}</div>
      <div class="ev-desc">${escapeHtml(ev.desc)}</div>
      <div class="ev-choices">${choicesHtml}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.ev-choice').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => showEventResult(ev, +btn.dataset.idx, overlay));
  });
}

function showEventResult(ev, idx, overlay) {
  const choice = ev.choices[idx];
  const p = state.pet;
  const deltas = {};
  let hasPos = false, hasNeg = false;
  for (const [k, v] of Object.entries(choice.effect || {})) {
    applyDelta(p, k, v);
    deltas[k] = v;
    if (k !== 'stones' && v > 0) hasPos = true;
    if (k !== 'stones' && v < 0) hasNeg = true;
  }
  pushLog(`📜 ${ev.title}: ${choice.msg}`, 'event');

  // 라이벌 배틀 특수 처리
  if (choice.rivalBattle) {
    const myPow = getMyPower(p);
    const rvPow = getRivalPower(state.rival);
    const bonusMsg = myPow > rvPow ? '\n🎉 라이벌에게 승리!' : '\n💧 라이벌에게 패배...';
    if (myPow > rvPow) {
      applyDelta(p, 'bond', 3);
      applyDelta(p, 'stones', 30);
      deltas.bond = (deltas.bond || 0) + 3;
      deltas.stones = (deltas.stones || 0) + 30;
    } else {
      applyDelta(p, 'stress', 5);
      deltas.stress = (deltas.stress || 0) + 5;
    }
    choice.msg = choice.msg + bonusMsg;
  }

  if (hasPos && !hasNeg) playSfx('success');
  else if (hasNeg && !hasPos) playSfx('hurt');
  else playSfx('click');

  const panel = overlay.querySelector('.event-panel');
  const deltasHtml = Object.entries(deltas).filter(([k,v]) => v !== 0).map(([k,v]) => {
    const cls = k === 'stones' ? 'gold' : (v > 0 ? 'up' : 'down');
    const label = k === 'stones' ? `💎 ${v>0?'+':''}${v}` : `${statEmoji(k)} ${v>0?'+':''}${v}`;
    return `<span class="ev-delta ${cls}">${label}</span>`;
  }).join('');
  panel.innerHTML = `
    <div class="panel-deco tl">💖</div><div class="panel-deco tr">✨</div>
    <div class="ev-icon">${ev.icon}</div>
    <div class="ev-title">${escapeHtml(ev.title)}</div>
    <div class="ev-msg">${escapeHtml(choice.msg).replace(/\n/g,'<br>')}</div>
    ${deltasHtml ? `<div class="ev-deltas">${deltasHtml}</div>` : ''}
    <button class="btn primary full" id="ev-continue">▶ 계속</button>
  `;
  document.getElementById('ev-continue').addEventListener('click', () => {
    playSfx('click');
    overlay.remove();
    afterWeek();
  });
}

function applyTournament(t) {
  const p = state.pet;
  let score, thresholds;
  if (t.stat === 'overall') {
    score = p.str + p.agi + p.hp + p.cute + p.int + p.elem;
    thresholds = [240, 180, 120];
  } else {
    score = p[t.stat];
    thresholds = [60, 40, 25];
  }
  // 라이벌 점수
  const rival = state.rival;
  let rvScore;
  if (t.stat === 'overall') rvScore = getRivalPower(rival);
  else rvScore = rival[t.stat] || 0;

  let rank, prize, bondDelta;
  if (score >= thresholds[0]) { rank = '🥇 1등!'; prize = 100; bondDelta = 8; playSfx('win'); }
  else if (score >= thresholds[1]) { rank = '🥈 2등'; prize = 50; bondDelta = 4; playSfx('success'); }
  else if (score >= thresholds[2]) { rank = '🥉 3등'; prize = 20; bondDelta = 2; playSfx('coin'); }
  else { rank = '참가상'; prize = 5; bondDelta = -1; playSfx('fail'); }
  p.stones += prize;
  applyDelta(p, 'bond', bondDelta);
  applyDelta(p, 'happy', bondDelta > 0 ? 5 : -3);
  pushLog(`🎪 ${t.name} ${rank} (💎+${prize})`, 'event');

  // 라이벌 멘트
  const vsRival = score > rvScore ? '이겼다!' : '라이벌에게 졌다...';
  pushLog(`${state.rival.name}: "${pickRivalMsg(state.rival, 'tournament')}" (${vsRival})`, 'rival');
}

/* 엔딩 */
function renderEnding() {
  const p = state.pet;
  const ending = decideEnding(p);
  updateSeasonBackground('spring');
  if (['champion','soulmate','spirit','star','warrior'].includes(ending.id)) {
    spawnEndingParticles();
    playSfx('win');
  } else if (['death','runaway','broken','wildbeast'].includes(ending.id)) {
    playSfx('fail');
  } else {
    playSfx('success');
  }
  const screen = document.createElement('div');
  screen.className = 'panel ending-screen';
  screen.innerHTML = `
    <div class="panel-deco tl">💖</div><div class="panel-deco tr">✨</div>
    <div class="panel-deco bl">🎀</div><div class="panel-deco br">💖</div>
    <div class="ep-emoji" style="color: ${ending.color};">${ending.emoji}</div>
    <div class="ep-title" style="color: ${ending.color};">${escapeHtml(ending.name)}</div>
    <img class="ep-pet-img" src="${p.image}" onerror="this.style.visibility='hidden'">
    <div class="ep-pet"><b>${escapeHtml(p.name)}</b> (${escapeHtml(p.species)}) · 1년 후</div>
    <div class="ep-desc">${ending.desc.split('\n').map(s=>escapeHtml(s)).join('<br>')}</div>
    <div class="ep-stats">
      💪 근력 <b>${p.str}</b> · 🏃 민첩 <b>${p.agi}</b> · ❤️ 체력 <b>${p.hp}</b><br>
      🧠 지능 <b>${p.int}</b> · 🔥 속성 <b>${p.elem}</b> · 😊 애교 <b>${p.cute}</b><br>
      🎭 야생 <b>${p.wild}</b> · 💕 친밀 <b>${p.bond}</b> · 🌈 행복 <b>${p.happy}</b><br>
      💎 최종 <b>${p.stones}</b>
    </div>
    <div class="ep-buttons">
      <button class="btn gold" id="btn-submit-ranking">🏆 랭킹 등록</button>
      <button class="btn primary" id="btn-restart">↻ 새 게임</button>
    </div>
  `;
  app.appendChild(screen);
  document.getElementById('btn-restart').addEventListener('click', () => { playSfx('click'); state.scene = 'title'; render(); });
  document.getElementById('btn-submit-ranking').addEventListener('click', () => { playSfx('success'); submitRanking(ending); });
}

function spawnEndingParticles() {
  const layer = document.createElement('div');
  layer.className = 'ending-particles';
  document.body.appendChild(layer);
  const emojis = ['🎉', '✨', '⭐', '💫', '🌟', '💖', '🎀', '👑'];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = randChoice(emojis);
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = randInt(5,10) + 's';
    p.style.animationDelay = (Math.random() * -10) + 's';
    p.style.setProperty('--drift', randInt(-100,100) + 'px');
    p.style.fontSize = randInt(22,40) + 'px';
    layer.appendChild(p);
  }
}

async function submitRanking(ending) {
  const nick = prompt('랭킹 닉네임 (2~10자)');
  if (!nick || nick.length < 2 || nick.length > 10) return;
  const p = state.pet;
  try {
    await db.ref('raise_rankings').push({
      nickname: nick, pet: p.name, species: p.species,
      ending: ending.name, endingId: ending.id, stones: p.stones,
      stats: { str:p.str, agi:p.agi, hp:p.hp, int:p.int, elem:p.elem, cute:p.cute, wild:p.wild, bond:p.bond, happy:p.happy },
      timestamp: Date.now(),
    });
    alert('등록 완료! 💖');
  } catch(e) { alert('실패: ' + e.message); }
}

function saveGame() {
  const nick = prompt('저장 닉네임', localStorage.getItem('raise_nick') || '');
  if (!nick || nick.length < 2) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  db.ref('raise_saves/' + key).set({
    pet: state.pet, week: state.week, log: state.log.slice(-20),
    rival: state.rival, schedule: state.schedule, timestamp: Date.now(),
  }).then(() => alert('저장 완료! 💾')).catch(e => alert('실패: ' + e.message));
}

async function loadGame() {
  const nick = prompt('닉네임', localStorage.getItem('raise_nick') || '');
  if (!nick) return;
  localStorage.setItem('raise_nick', nick);
  const key = nick.replace(/[^a-zA-Z0-9가-힣_-]/g, '_');
  try {
    const snap = await db.ref('raise_saves/' + key).once('value');
    const data = snap.val();
    if (!data) { alert('저장 없음'); return; }
    state.pet = data.pet;
    state.week = data.week;
    state.log = data.log || [];
    state.rival = data.rival || chooseRival();
    state.schedule = data.schedule || Array(7).fill(null);
    state.scene = 'playing';
    render();
  } catch(e) { alert('실패: ' + e.message); }
}

document.getElementById('btn-bgm').addEventListener('click', () => { playSfx('click'); toggleBgm(); });
document.getElementById('btn-sfx').addEventListener('click', () => { playSfx('click'); toggleSfx(); });
updateAudioBtns();

loadLocalStats();
generateBgSparkles();
(async () => { 
  await Promise.all([loadPetData(), loadRivalNicks()]);
  render(); 
})();
</script>
