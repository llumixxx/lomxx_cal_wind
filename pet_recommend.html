<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>✨ WIND 펫 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#faf9ff;min-height:100vh;color:#3d3560;
  display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(circle at 15% 20%,rgba(155,135,245,.1) 0%,transparent 50%),
  radial-gradient(circle at 85% 80%,rgba(245,135,184,.08) 0%,transparent 50%)}
.box{text-align:center;padding:3rem 2rem}
.icon{font-size:60px;margin-bottom:1rem;display:block}
h1{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;
  background:linear-gradient(135deg,#9b87f5,#f587b8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
p{font-size:14px;color:#7b72a8;line-height:1.7}
.badge{display:inline-block;margin-top:1.2rem;background:#ede9ff;color:#6c5ce7;
  font-size:12px;font-weight:700;padding:5px 16px;border-radius:20px;border:1.5px solid #c5beff}
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="box">
  <span class="icon">🔧</span>
  <h1>펫 추천 준비 중</h1>
  <p>더 정확한 추천을 위해 준비 중이에요.<br>조금만 기다려주세요!</p>
  <span class="badge">Coming Soon</span>
</div>
</body>
</html>
