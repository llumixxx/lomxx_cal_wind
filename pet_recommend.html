<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>✨ WIND 펫 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#faf9ff;min-height:100vh;color:#3d3560}
.wrap{max-width:700px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
.header{text-align:center;margin-bottom:1.5rem;padding-top:.8rem}
.header h1{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;
  background:linear-gradient(135deg,#9b87f5,#f587b8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.header p{font-size:13px;color:#7b72a8}
.input-wrap{position:relative;margin-bottom:1rem}
textarea{width:100%;background:#fff;border:1.5px solid #e8e3ff;border-radius:16px;
  padding:14px 52px 14px 16px;font-size:14px;font-family:'Noto Sans KR',sans-serif;
  color:#3d3560;resize:none;line-height:1.6;outline:none;transition:border-color .15s;min-height:76px}
textarea:focus{border-color:#9b87f5}
textarea::placeholder{color:#b0a8d4}
.send-btn{position:absolute;right:10px;bottom:10px;width:36px;height:36px;
  background:linear-gradient(135deg,#9b87f5,#f587b8);border:none;border-radius:10px;
  cursor:pointer;font-size:16px;color:#fff;transition:opacity .15s}
.send-btn:hover{opacity:.85}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.examples{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.4rem}
.ex-btn{background:#fff;border:1.5px solid #e8e3ff;border-radius:20px;
  padding:6px 13px;font-size:12px;color:#7b72a8;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap}
.ex-btn:hover{border-color:#9b87f5;color:#6c5ce7;background:#f3f0ff}
.response-wrap{background:#fff;border:1.5px solid #e8e3ff;border-radius:18px;
  padding:1.3rem;min-height:100px;box-shadow:0 2px 12px rgba(155,135,245,.07)}
.placeholder{color:#b0a8d4;font-size:14px;text-align:center;padding:1.2rem 0;line-height:1.8}
.loading{display:flex;align-items:center;gap:10px;color:#7b72a8;font-size:14px;padding:.3rem 0}
.dots{display:flex;gap:4px}
.dot{width:6px;height:6px;background:#9b87f5;border-radius:50%;animation:bounce .8s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s;background:#f587b8}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.response-text{font-size:14px;line-height:1.9;color:#3d3560}
.response-text strong{color:#6c5ce7;font-weight:700}
.response-text em{color:#f587b8;font-style:normal}
.filter-info{font-size:11px;color:#b0a8d4;margin-bottom:8px}
.history{margin-top:1.2rem;display:flex;flex-direction:column;gap:8px}
.hist-label{font-size:12px;color:#b0a8d4;margin-bottom:2px}
.hist-item{background:#fff;border:1.5px solid #e8e3ff;border-radius:12px;
  padding:10px 13px;font-size:13px;cursor:pointer;transition:border-color .15s}
.hist-item:hover{border-color:#9b87f5}
.hist-q{color:#9b87f5;font-size:11px;font-weight:700;margin-bottom:3px}
.hist-a{color:#7b72a8;line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="wrap">
  <div class="header">
    <h1>✨ AI 펫 추천</h1>
    <p>원하는 조건을 자유롭게 말해주세요. AI가 데이터를 분석해서 추천해드려요!</p>
  </div>
  <div class="input-wrap">
    <textarea id="query" placeholder="예: 탑승 가능하고 공격력 높은 펫 추천해줘"></textarea>
    <button class="send-btn" id="sendBtn" onclick="doAsk()">&#9658;</button>
  </div>
  <div class="examples">
    <button class="ex-btn" onclick="setQ(this.dataset.q)" data-q="탑승 가능한 펫 중 공격력이 가장 높은 펫 추천해줘">🐴 탑승+공격력 최강</button>
    <button class="ex-btn" onclick="setQ(this.dataset.q)" data-q="화속성이 강한 2등급 펫 추천해줘">🔥 화속성 2등급</button>
    <button class="ex-btn" onclick="setQ(this.dataset.q)" data-q="내구력과 방어력이 높은 탱커형 펫 추천해줘">🛡️ 탱커형</button>
    <button class="ex-btn" onclick="setQ(this.dataset.q)" data-q="성장률이 전체적으로 균형잡힌 펫 추천해줘">⚖️ 균형형</button>
    <button class="ex-btn" onclick="setQ(this.dataset.q)" data-q="포획으로 얻을 수 있는 펫 중 가장 강한 펫은">🌿 포획 가능</button>
    <button class="ex-btn" onclick="setQ(this.dataset.q)" data-q="순발력이 제일 높은 펫 알려줘">⚡ 순발력 최강</button>
  </div>
  <div class="response-wrap" id="responseWrap">
    <div class="placeholder">👆 질문을 입력하거나 예시 버튼을 눌러보세요!</div>
  </div>
  <div class="history" id="historyWrap"></div>
</div>
<script>
var GKEY = 'AQ.Ab8RN6JMTugo74saHMgkaWd4ZEbUexVlq5dDkEb0bzBNIJpK-A';
var GURL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + GKEY;
var ALL_PETS = [];
var HIST = [];

fetch('pet_info_data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    ALL_PETS = data;
    console.log('펫 데이터 로드:', data.length, '마리');
  })
  .catch(function() { console.warn('pet_info_data.json 로드 실패'); });

document.getElementById('query').onkeydown = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doAsk(); }
};

function setQ(t) {
  document.getElementById('query').value = t;
  document.getElementById('query').focus();
}

// 질문에서 조건 파악 후 후보 필터링
function filterPets(q) {
  var lower = q.toLowerCase();
  var result = ALL_PETS.slice();

  // 탑승 필터
  if (lower.indexOf('탑승') !== -1) {
    result = result.filter(function(p) { return p.mount === true; });
  }

  // 속성 필터
  var attrs = ['지', '수', '화', '풍'];
  for (var i = 0; i < attrs.length; i++) {
    var k = attrs[i];
    if (lower.indexOf(k + '속성') !== -1 || lower.indexOf(k + '속') !== -1) {
      result = result.filter(function(p) { return (p.attr[k] || 0) > 0; });
    }
  }

  // 등급 필터
  if (lower.indexOf('2등급') !== -1) result = result.filter(function(p) { return p.grade === '2등급'; });
  else if (lower.indexOf('1등급') !== -1) result = result.filter(function(p) { return p.grade === '1등급'; });
  else if (lower.indexOf('일반급') !== -1 || lower.indexOf('일반 등급') !== -1) result = result.filter(function(p) { return p.grade === '일반'; });

  // 획득경로 필터
  if (lower.indexOf('포획') !== -1) result = result.filter(function(p) { return (p.obtain || '').indexOf('포획') !== -1; });

  // 정렬 기준
  var sortFn;
  if (lower.indexOf('공격') !== -1)      sortFn = function(p) { return (p.ic.atk || 0) + (p.sg.atk || 0) * 10; };
  else if (lower.indexOf('방어') !== -1)  sortFn = function(p) { return (p.ic.def || 0) + (p.sg.def || 0) * 10; };
  else if (lower.indexOf('순발') !== -1 || lower.indexOf('속도') !== -1) sortFn = function(p) { return (p.ic.agi || 0) + (p.sg.agi || 0) * 10; };
  else if (lower.indexOf('내구') !== -1 || lower.indexOf('체력') !== -1 || lower.indexOf('탱') !== -1) sortFn = function(p) { return (p.ic.hp || 0) + (p.sg.hp || 0) * 10; };
  else if (lower.indexOf('균형') !== -1)  sortFn = function(p) { return (p.sg.hp || 0) + (p.sg.atk || 0) + (p.sg.def || 0) + (p.sg.agi || 0); };
  else sortFn = function(p) { return (p.ic.atk || 0) + (p.ic.hp || 0) + (p.sg.atk || 0) * 5; };

  result.sort(function(a, b) { return sortFn(b) - sortFn(a); });
  return result.slice(0, 20);
}

function doAsk() {
  var q = document.getElementById('query').value.trim();
  if (!q) return;
  if (!ALL_PETS.length) { showErr('펫 데이터 로드 중이에요. 잠시 후 다시 시도!'); return; }

  document.getElementById('sendBtn').disabled = true;
  document.getElementById('responseWrap').innerHTML =
    '<div class="loading"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>펫 데이터 분석 중...</div>';

  // JS에서 먼저 필터링 → 후보 20마리만 AI에게 전달
  var filtered = filterPets(q);

  var petLines = filtered.map(function(p) {
    var ic = p.ic, sg = p.sg;
    var a = Object.entries(p.attr || {}).filter(function(e) { return e[1] > 0; }).map(function(e) { return e[0] + e[1]; }).join('');
    return p.name + '|' + (p.grade || '일반') + '|' + (p.mount ? '탑승O' : '탑승X')
      + '|' + (a || '무속성')
      + '|내구' + ic.hp + ' 공격' + ic.atk + ' 방어' + ic.def + ' 순발' + ic.agi
      + '|성장률 내구' + sg.hp + ' 공격' + sg.atk + ' 방어' + sg.def + ' 순발' + sg.agi
      + '|' + (p.obtain || '');
  }).join('\n');

  var prompt = 'WIND 온라인 게임 펫 추천 전문가입니다.\n'
    + '형식: 이름|등급|탑승|속성|초기치|성장률|획득경로\n\n'
    + '후보 펫 목록:\n' + petLines + '\n\n'
    + '질문: ' + q + '\n\n'
    + '위 목록에서 최적 3~5개 추천. 각 펫마다 이름, 주요 수치, 추천 이유 간결히. 한국어로.';

  fetch(GURL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: 600, temperature: 0.7 }
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var text = '';
    if (d.error) {
      if (d.error.code === 429) text = '요청이 너무 많아요. 잠시 후 다시 시도해주세요! (1분 후)';
      else text = 'API 오류 ' + d.error.code + ': ' + d.error.message.substring(0, 80);
    } else if (d.candidates && d.candidates[0] && d.candidates[0].content) {
      text = d.candidates[0].content.parts[0].text;
    } else {
      text = '응답을 받지 못했어요.';
    }
    showRes(text);
    if (!d.error) addHist(q, text);
    document.getElementById('query').value = '';
  })
  .catch(function(e) { showErr('네트워크 오류: ' + e.message); })
  ['finally'](function() { document.getElementById('sendBtn').disabled = false; });
}

function showErr(msg) {
  document.getElementById('responseWrap').innerHTML = '<div style="color:#c0392b;font-size:14px;padding:.3rem 0">⚠️ ' + msg + '</div>';
}

function showRes(text) {
  var h = text
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
  document.getElementById('responseWrap').innerHTML = '<div class="response-text">' + h + '</div>';
}

function addHist(q, a) {
  HIST.unshift({ q: q, a: a });
  if (HIST.length > 5) HIST.pop();
  var el = document.getElementById('historyWrap');
  el.innerHTML = '<div class="hist-label">최근 질문</div>' + HIST.map(function(h, i) {
    return '<div class="hist-item" onclick="loadHist(' + i + ')">'
      + '<div class="hist-q">Q. ' + h.q + '</div>'
      + '<div class="hist-a">' + h.a.replace(/<[^>]+>/g, '').substring(0, 80) + '</div></div>';
  }).join('');
}

function loadHist(i) { showRes(HIST[i].a); }
</script>
</body>
</html>
