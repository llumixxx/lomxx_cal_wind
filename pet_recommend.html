<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>✨ WIND 펫 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#faf9ff;min-height:100vh;color:#3d3560;
  background-image:radial-gradient(circle at 15% 20%,rgba(155,135,245,.1) 0%,transparent 50%),
  radial-gradient(circle at 85% 80%,rgba(245,135,184,.08) 0%,transparent 50%)}
.wrap{max-width:760px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
.header{text-align:center;margin-bottom:1.2rem;padding-top:.5rem}
.header h1{font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;
  background:linear-gradient(135deg,#9b87f5,#f587b8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.header p{font-size:13px;color:#7b72a8}

/* 환생 안내 */
.rebirth-notice{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;
  padding:8px 14px;font-size:12px;color:#92400e;margin-bottom:1rem;display:none;line-height:1.6}
.rebirth-notice b{color:#d97706}

/* 문답식 */
.quiz-prog{display:flex;gap:6px;justify-content:center;margin-bottom:1.2rem}
.prog-dot{width:8px;height:8px;border-radius:50%;background:#e8e3ff;transition:all .3s}
.prog-dot.done{background:#9b87f5}
.prog-dot.active{background:linear-gradient(135deg,#9b87f5,#f587b8);transform:scale(1.3)}
.quiz-card{background:#fff;border:1.5px solid #e8e3ff;border-radius:20px;
  padding:1.8rem 1.5rem;box-shadow:0 2px 16px rgba(155,135,245,.09);margin-bottom:1rem;
  animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.quiz-step{font-size:11px;font-weight:700;color:#b0a8d4;letter-spacing:1px;margin-bottom:.5rem}
.quiz-q{font-size:18px;font-weight:700;color:#3d3560;margin-bottom:.3rem;line-height:1.4}
.quiz-sub{font-size:13px;color:#9e97c8;margin-bottom:1.2rem}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{background:#faf9ff;border:1.5px solid #e8e3ff;border-radius:14px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:500;color:#3d3560;
  font-family:'Noto Sans KR',sans-serif;text-align:left;transition:all .15s;display:flex;align-items:center;gap:10px}
.quiz-opt:hover{border-color:#9b87f5;background:#f3f0ff;color:#6c5ce7}
.opt-icon{font-size:22px;flex-shrink:0}
.opt-text{flex:1}
.opt-sub{font-size:11px;color:#b0a8d4;display:block;margin-top:1px}
.quiz-back{background:none;border:none;font-size:12px;color:#b0a8d4;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;padding:4px 0;margin-top:.5rem}
.quiz-back:hover{color:#9b87f5}

/* 결과 */
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;flex-wrap:wrap;gap:6px}
.result-title{font-size:15px;font-weight:700;color:#3d3560}
.result-tag{font-size:11px;padding:3px 10px;border-radius:20px;background:#ede9ff;color:#6c5ce7;font-weight:700}
.result-cond{font-size:11px;color:#b0a8d4;margin-bottom:.9rem;background:#f7f5ff;border-radius:8px;padding:6px 10px;line-height:1.7}
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}

/* 카드 */
.pet-card{background:#fff;border:1.5px solid #e8e3ff;border-radius:16px;padding:.9rem;
  display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 8px rgba(155,135,245,.06);
  transition:transform .12s,box-shadow .12s}
.pet-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(155,135,245,.14)}
/* 환생 가능: 골드 테두리만 */
.pet-card.can-rebirth{border:2px solid #f59e0b;cursor:pointer}
.pet-card.can-rebirth:hover{box-shadow:0 6px 20px rgba(245,158,11,.2)}
/* 환생 수치 표시 중 */
.pet-card.showing-rebirth{border:2px solid #f59e0b;background:#fffdf5}

.card-top{display:flex;align-items:center;gap:9px}
.pet-img{width:50px;height:50px;object-fit:contain;image-rendering:pixelated;
  background:#f7f5ff;border-radius:10px;padding:3px;flex-shrink:0}
.pet-name{font-size:14px;font-weight:700;color:#3d3560;line-height:1.2}
.pet-grade{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;margin-top:2px;display:inline-block}
.grade-일반{background:#f0eeff;color:#7b72a8}
.grade-1등급{background:#fff8e1;color:#f59e0b}
.grade-2등급{background:#fce7f3;color:#ec4899}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.attr-badge{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600}
.attr-지{background:#e8f5e9;color:#2e7d32}
.attr-수{background:#e3f2fd;color:#1565c0}
.attr-화{background:#fce4ec;color:#c62828}
.attr-풍{background:#e8eaf6;color:#283593}
.mount-badge{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600}
.mount-yes{background:#e8f5e9;color:#2e7d32}
.mount-no{background:#f5f5f5;color:#aaa;border:.5px solid #e0e0e0}
.rebirth-badge{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;background:#fef3c7;color:#d97706}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.stat-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:.5px solid #f0eeff;font-size:11px}
.stat-label{color:#b0a8d4}
.stat-val{color:#6c5ce7;font-weight:700}
.sg{color:#f587b8}
.stat-val.rv{color:#d97706}
.sg.rsv{color:#f59e0b}
.card-mode-hint{font-size:10px;color:#f59e0b;text-align:center;margin-top:2px}
.obtain-row{font-size:10.5px;color:#9e97c8;background:#f7f5ff;border-radius:7px;padding:4px 7px;line-height:1.4}
.no-result{text-align:center;padding:2.5rem;color:#b0a8d4;font-size:14px;background:#fff;border:1.5px solid #e8e3ff;border-radius:16px}
.retry-btn{padding:10px 28px;border-radius:10px;background:#f3f0ff;border:1.5px solid #d4cbff;
  font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#6c5ce7;transition:all .15s}
.retry-btn:hover{background:#9b87f5;color:#fff;border-color:#9b87f5}
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="wrap">
  <div class="header">
    <h1>✨ 펫 추천</h1>
    <p>나에게 맞는 펫을 찾아보세요!</p>
  </div>
  <div class="rebirth-notice" id="rebirthNotice">
    <b>🌟 환생 가능 펫</b>은 <b>금색 테두리</b>로 표시돼요.<br>
    카드를 클릭하면 환생 능력치로 전환되고, 다시 클릭하면 일반 능력치로 돌아와요.
  </div>
  <div class="quiz-prog" id="quizProg"></div>
  <div id="quizCard"></div>
  <div id="quizResult" style="display:none"></div>
</div>

<script>
var ALL_PETS = [];

fetch('pet_info_data.json')
  .then(function(r){ return r.json(); })
  .then(function(d){ ALL_PETS = d; })
  .catch(function(){ console.warn('pet_info_data.json 로드 실패'); });

var Q = {
  purpose: {
    q:'펫을 어떤 목적으로 사용할 건가요?', sub:'사용 목적에 따라 최적의 펫이 달라져요',
    opts:[
      {icon:'⚔️', text:'레이드 펫 추천', sub:'속성 레이드에서 사용할 펫', val:'raid'},
      {icon:'🗺️', text:'일반 추천', sub:'상황에 따른 추천 펫 찾아보기', val:'general'},
    ],
    next:function(v){ return v==='raid'?'raidAttr':'stat'; }
  },
  raidAttr: {
    q:'어떤 레이드를 주로 하나요?', sub:'레이드 종류에 따라 필요한 펫 속성이 달라요',
    opts:[
      {icon:'🌿', text:'지(地) 레이드', sub:'→ 풍속성 펫 유리', val:'지'},
      {icon:'💧', text:'수(水) 레이드', sub:'→ 지속성 펫 유리', val:'수'},
      {icon:'🔥', text:'화(火) 레이드', sub:'→ 수속성 펫 유리', val:'화'},
      {icon:'🌀', text:'풍(風) 레이드', sub:'→ 화속성 펫 유리', val:'풍'},
    ],
    next:function(){ return 'chartype'; }
  },
  chartype: {
    q:'캐릭터 타입이 어떻게 되나요?', sub:'순캐/완캐에 따라 필요한 펫 스펙이 달라요',
    opts:[
      {icon:'💪', text:'완캐 (완력 위주 캐릭터)', sub:'힘과 체력 위주의 캐릭터', val:'완캐'},
      {icon:'⚡', text:'순캐 (순발력 위주 캐릭터)', sub:'스피드와 민첩성 위주의 캐릭터', val:'순캐'},
    ],
    next:function(v){ return v==='순캐'?'role':null; }
  },
  role: {
    q:'순캐에서 펫의 역할은?', sub:'딜펫과 탑펫은 필요한 스펙이 달라요',
    opts:[
      {icon:'⚔️', text:'딜펫 (공격용 펫)', sub:'함께 싸워주는 전투 펫', val:'딜'},
      {icon:'🐴', text:'탑펫 (탑승용 펫)', sub:'빠른 이동을 위한 탑승 펫', val:'탑'},
    ],
    next:function(){ return null; }
  },
  stat: {
    q:'어떤 능력이 가장 중요한가요?', sub:'펫을 고를 때 제일 먼저 보는 스탯',
    opts:[
      {icon:'⚔️', text:'공격력', sub:'공격성장 2.2이상', val:'atk'},
      {icon:'🛡️', text:'방어력', sub:'방어성장 1.8이상', val:'def'},
      {icon:'❤️', text:'내구력(HP)', sub:'내구성장 1.2이상', val:'hp'},
      {icon:'⚡', text:'순발력', sub:'순발성장 1.8이상', val:'agi'},
    ],
    next:function(){ return 'attrPref'; }
  },
  attrPref: {
    q:'원하는 속성이 있나요?', sub:'속성에 따라 맞는 펫을 찾아드려요',
    opts:[
      {icon:'🌿', text:'지(地) 속성', sub:'지속성 8이상', val:'지'},
      {icon:'💧', text:'수(水) 속성', sub:'수속성 8이상', val:'수'},
      {icon:'🔥', text:'화(火) 속성', sub:'화속성 8이상', val:'화'},
      {icon:'🌀', text:'풍(風) 속성', sub:'풍속성 8이상', val:'풍'},
      {icon:'☯️', text:'반반 속성', sub:'5/5, 6/4, 4/6 속성', val:'반반'},
      {icon:'7️⃣', text:'7속성', sub:'7/3 비율 속성', val:'7속성'},
      {icon:'🤷', text:'상관없어', sub:'속성 무관', val:'any'},
    ],
    next:function(){ return 'mount'; }
  },
  mount: {
    q:'탑승 가능한 펫이 필요한가요?', sub:'',
    opts:[
      {icon:'🐴', text:'탑승 가능한 펫이 좋아', val:'yes'},
      {icon:'🤷', text:'상관없어', val:'any'},
    ],
    next:function(){ return null; }
  },
};

var quizHistory=[], quizAnswers={}, currentQKey='purpose';

function startQuiz(){
  quizHistory=[]; quizAnswers={}; currentQKey='purpose';
  document.getElementById('quizResult').style.display='none';
  document.getElementById('rebirthNotice').style.display='none';
  document.getElementById('quizCard').style.display='';
  renderQuizCard();
}

function renderQuizCard(){
  var q=Q[currentQKey], step=quizHistory.length+1;
  var dots='';
  for(var i=0;i<step;i++) dots+='<div class="prog-dot '+(i<step-1?'done':'active')+'"></div>';
  dots+='<div class="prog-dot"></div><div class="prog-dot"></div>';
  document.getElementById('quizProg').innerHTML=dots;

  var optsHtml=q.opts.map(function(opt){
    return '<button class="quiz-opt" id="qopt_'+opt.val+'">'
      +'<span class="opt-icon">'+opt.icon+'</span>'
      +'<span class="opt-text">'+opt.text+(opt.sub?'<span class="opt-sub">'+opt.sub+'</span>':'')+'</span>'
      +'</button>';
  }).join('');

  document.getElementById('quizCard').innerHTML=
    '<div class="quiz-step">STEP '+step+'</div>'
    +'<div class="quiz-q">'+q.q+'</div>'
    +'<div class="quiz-sub">'+q.sub+'</div>'
    +'<div class="quiz-opts">'+optsHtml+'</div>'
    +'<button class="quiz-back" id="quizBackBtn">'+(quizHistory.length>0?'← 이전으로':'← 처음으로')+'</button>';

  q.opts.forEach(function(opt){
    var btn=document.getElementById('qopt_'+opt.val);
    if(btn) btn.onclick=function(){ answerQuiz(opt.val, q.next(opt.val)); };
  });
  var bb=document.getElementById('quizBackBtn');
  if(bb) bb.onclick=quizHistory.length>0?quizBack:startQuiz;
}

function answerQuiz(val,nextKey){
  quizHistory.push({key:currentQKey,answers:JSON.parse(JSON.stringify(quizAnswers))});
  quizAnswers[currentQKey]=val;
  if(!nextKey){ showQuizResult(); } else { currentQKey=nextKey; renderQuizCard(); }
}

function quizBack(){
  if(!quizHistory.length){startQuiz();return;}
  var prev=quizHistory.pop();
  currentQKey=prev.key; quizAnswers=prev.answers;
  document.getElementById('quizResult').style.display='none';
  document.getElementById('quizCard').style.display='';
  renderQuizCard();
}

function attrType(p){
  var a=p.attr||{};
  var vals=Object.values(a).filter(function(v){return v>0;}).sort(function(a,b){return b-a;});
  if(!vals.length) return 'none';
  if(vals[0]>=8) return 'dominant';
  if(vals[0]===7) return 'seven';
  if(vals.length>=2&&vals[0]>=4&&vals[1]>=4) return 'half';
  return 'other';
}

function showQuizResult(){
  document.getElementById('quizCard').style.display='none';
  document.getElementById('quizProg').innerHTML='';

  var result, label, condDesc;
  var COUNTER={지:'풍',수:'지',화:'수',풍:'화'};

  if(quizAnswers.purpose==='raid'){
    var attr=quizAnswers.raidAttr, chartype=quizAnswers.chartype, role=quizAnswers.role;
    var ca=COUNTER[attr];

    if(chartype==='완캐'){
      label=attr+'레이드 · 완캐';
      condDesc=ca+'속성 8이상 · 내구성장 11.3이상 · 방어성장 1.65이상';
      result=ALL_PETS.filter(function(p){
        var sg=p.sg||{};
        return (p.attr[ca]||0)>=8&&(sg.hp||0)>=11.3&&(sg.def||0)>=1.65;
      }).sort(function(a,b){
        function s(p){var sg=p.sg||{};return (p.attr[ca]||0)*1000+(sg.hp||0)*4+(sg.def||0)*3+(sg.atk||0)*2+(sg.agi||0);}
        return s(b)-s(a);
      });
    } else if(role==='딜'){
      label=attr+'레이드 · 순캐 딜펫';
      condDesc=ca+'속성 8이상 · 공격성장 2.0이상 · 순발성장 1.2이상';
      result=ALL_PETS.filter(function(p){
        var sg=p.sg||{};
        return (p.attr[ca]||0)>=8&&(sg.atk||0)>=2.0&&(sg.agi||0)>=1.2;
      }).sort(function(a,b){
        function s(p){var sg=p.sg||{};return (p.attr[ca]||0)*1000+(sg.atk||0)*4+(sg.agi||0)*3+(sg.def||0)*2+(sg.hp||0);}
        return s(b)-s(a);
      });
    } else {
      label=attr+'레이드 · 순캐 탑펫';
      condDesc='탑승 가능 · 순발성장 1.8이상';
      result=ALL_PETS.filter(function(p){
        var sg=p.sg||{};
        return p.mount&&(sg.agi||0)>=1.8;
      }).sort(function(a,b){
        function s(p){var sg=p.sg||{},ic=p.ic||{};return (p.attr[ca]||0)*100+(sg.agi||0)*10+(ic.agi||0);}
        return s(b)-s(a);
      });
    }
  } else {
    var stat=quizAnswers.stat, attrPref=quizAnswers.attrPref, mount=quizAnswers.mount;
    // 성장률 최소값 필터
    var sgMin = {atk:2.2, def:1.8, hp:1.2, agi:1.8};
    var sgKey = {atk:'atk', def:'def', hp:'hp', agi:'agi'};
    result=ALL_PETS.filter(function(p){
      if(mount==='yes'&&!p.mount) return false;
      // 성장률 필터
      var sg=p.sg||{};
      if(sgMin[stat] && (sg[sgKey[stat]]||0) < sgMin[stat]) return false;
      // 속성 필터
      if(attrPref==='any') return true;
      var at=attrType(p);
      if(attrPref==='반반') return at==='half';
      if(attrPref==='7속성') return at==='seven';
      return (p.attr[attrPref]||0)>=8;
    }).sort(function(a,b){
      function s(p){
        var ic=p.ic||{},sg=p.sg||{};
        if(stat==='atk') return (ic.atk||0)+(sg.atk||0)*10;
        if(stat==='def') return (ic.def||0)+(sg.def||0)*10;
        if(stat==='hp')  return (ic.hp||0)+(sg.hp||0)*10;
        if(stat==='agi') return (ic.agi||0)+(sg.agi||0)*10;
        return 0;
      }
      return s(b)-s(a);
    });
    var statNames={atk:'공격력',def:'방어력',hp:'내구력',agi:'순발력'};
    var attrNames={지:'지속성 8이상',수:'수속성 8이상',화:'화속성 8이상',풍:'풍속성 8이상',반반:'반반속성','7속성':'7/3속성',any:'전체속성'};
    var sgCondNames={atk:'공격성장 2.2이상',def:'방어성장 1.8이상',hp:'내구성장 1.2이상',agi:'순발성장 1.8이상'};
    label=(mount==='yes'?'탑승가능 · ':'')+statNames[stat]+' 우선';
    condDesc=(attrNames[attrPref]||'전체')+' · '+(sgCondNames[stat]||'');
  }

  var el=document.getElementById('quizResult');
  el.style.display='';

  // 환생 가능 펫이 있으면 안내 표시
  var hasAnyRebirth=result.some(function(p){return p.rebirth&&p.rebirth_ic&&p.rebirth_ic.hp;});
  document.getElementById('rebirthNotice').style.display=hasAnyRebirth?'block':'none';

  if(!result.length){
    el.innerHTML='<div class="no-result">조건에 맞는 펫이 없어요 😢</div>'
      +'<div style="text-align:center;margin-top:1rem"><button class="retry-btn" id="retryBtn">🔄 다시 추천받기</button></div>';
    document.getElementById('retryBtn').onclick=startQuiz;
    return;
  }

  el.innerHTML='<div class="result-header">'
    +'<div class="result-title">🎯 추천 결과 '+result.length+'마리</div>'
    +'<span class="result-tag">'+label+'</span></div>'
    +'<div class="result-cond">📋 '+condDesc+'</div>'
    +'<div class="pet-grid" id="petGrid">'+result.map(cardHtml).join('')+'</div>'
    +'<div style="text-align:center;margin-top:1.2rem"><button class="retry-btn" id="retryBtn">🔄 다시 추천받기</button></div>';
  document.getElementById('retryBtn').onclick=startQuiz;

  // 환생 카드 클릭 이벤트
  document.getElementById('petGrid').querySelectorAll('.can-rebirth').forEach(function(card){
    card.onclick=function(){ toggleRebirth(card); };
  });
}

function toggleRebirth(card){
  var name=card.dataset.name;
  var p=ALL_PETS.filter(function(x){return x.name===name;})[0];
  if(!p) return;
  var showing=card.classList.contains('showing-rebirth');
  if(showing){
    card.classList.remove('showing-rebirth');
    card.querySelector('.card-mode-hint').textContent='탭하면 환생 능력치로 전환';
    setStats(card, p.ic||{}, p.sg||{}, false);
  } else {
    card.classList.add('showing-rebirth');
    card.querySelector('.card-mode-hint').textContent='🌟 환생 능력치 보는 중 (탭하면 일반으로)';
    setStats(card, p.rebirth_ic||{}, p.rebirth_sg||{}, true);
  }
}

function setStats(card, ic, sg, isRebirth){
  var rows=card.querySelectorAll('.stat-val');
  var keys=['hp','atk','def','agi'];
  keys.forEach(function(k,i){
    rows[i].className='stat-val'+(isRebirth?' rv':'');
    rows[i].innerHTML=(ic[k]||'-')+' / <span class="sg'+(isRebirth?' rsv':'')+'">'+(sg[k]||'-')+'</span>';
  });
}

function cardHtml(p){
  var ic=p.ic||{}, sg=p.sg||{};
  var canRebirth=p.rebirth&&p.rebirth_ic&&p.rebirth_ic.hp;
  var attrBadges=Object.entries(p.attr||{}).filter(function(e){return e[1]>0;})
    .map(function(e){return '<span class="attr-badge attr-'+e[0]+'">'+e[0]+' '+e[1]+'</span>';}).join('');
  var mountBadge=p.mount?'<span class="mount-badge mount-yes">🐴 탑승O</span>':'<span class="mount-badge mount-no">탑승X</span>';
  var rebirthBadge=canRebirth?'<span class="rebirth-badge">🌟 환생가능</span>':'';
  var imgSrc=(p.image||'').replace('.png','.gif');
  var img=imgSrc?'<img class="pet-img" src="'+imgSrc+'" alt="'+p.name+'" onerror="this.style.opacity=0.3">':'<div class="pet-img"></div>';
  var modeHint=canRebirth?'<div class="card-mode-hint">탭하면 환생 능력치로 전환</div>':'';
  var cardClass='pet-card'+(canRebirth?' can-rebirth':'');
  var dataAttr=canRebirth?' data-name="'+p.name+'"':'';
  return '<div class="'+cardClass+'"'+dataAttr+'>'
    +'<div class="card-top">'+img+'<div><div class="pet-name">'+p.name+'</div>'
    +'<span class="pet-grade grade-'+(p.grade||'일반')+'">'+(p.grade||'일반')+'</span></div></div>'
    +'<div class="badges">'+attrBadges+mountBadge+rebirthBadge+'</div>'
    +'<div class="stats-grid">'
    +'<div class="stat-row"><span class="stat-label">내구력</span><span class="stat-val">'+ic.hp+' / <span class="sg">'+sg.hp+'</span></span></div>'
    +'<div class="stat-row"><span class="stat-label">공격력</span><span class="stat-val">'+ic.atk+' / <span class="sg">'+sg.atk+'</span></span></div>'
    +'<div class="stat-row"><span class="stat-label">방어력</span><span class="stat-val">'+ic.def+' / <span class="sg">'+sg.def+'</span></span></div>'
    +'<div class="stat-row"><span class="stat-label">순발력</span><span class="stat-val">'+ic.agi+' / <span class="sg">'+sg.agi+'</span></span></div>'
    +'</div>'+modeHint+'<div class="obtain-row">📍 '+(p.obtain||'정보없음')+'</div></div>';
}

startQuiz();
</script>
</body>
</html>
