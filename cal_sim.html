<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>환각 시뮬레이터 · 윈드</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #faf9ff; --bg2: #f3f0ff; --white: #ffffff;
  --s1: #f8f7ff; --s2: #f0eeff;
  --border: #e8e3ff; --border2: #d4cbff;
  --a1: #9b87f5; --a2: #f587b8; --a3: #87d4f5; --a4: #f5c887; --a5: #87f5c0;
  --t1: #3d3560; --t2: #7b72a8; --t3: #b0a8d4; --t4: #d4cff0;
  --ok: #6dd5a0; --err: #f57878;
  --gold: #f5a623; --gold2: #fdd835;
  --shadow: 0 4px 24px rgba(155,135,245,0.12);
  --shadow2: 0 8px 32px rgba(155,135,245,0.18);
}
[data-theme="dark"] {
  --bg: #0f0f1a; --bg2: #1a1a2e; --white: #252540;
  --s1: #2a2a45; --s2: #353555;
  --border: #404060; --border2: #505080;
  --t1: #e8e8f0; --t2: #b0b0c8; --t3: #8080a0; --t4: #606080;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow2: 0 8px 32px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--t1);
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(155,135,245,0.08) 0%, transparent 50%),
    radial-gradient(circle at 85% 80%, rgba(245,135,184,0.07) 0%, transparent 50%);
}
.main-inner { max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; }

/* ── header ── */
.page-head { text-align: center; padding: 18px 0 26px; }
.wind-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #f0eeff, #ffeef6);
  border: 1.5px solid var(--border2); border-radius: 99px;
  padding: 4px 14px; font-size: 11px; font-weight: 800;
  font-family: 'Nunito', sans-serif;
  color: var(--a1); letter-spacing: 1px; margin-bottom: 12px;
}
.wind-badge-dot { width: 6px; height: 6px; background: var(--a2); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(2)} }
.page-title {
  font-family: 'Nunito', sans-serif;
  font-size: 34px; font-weight: 900; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--a1) 0%, var(--a2) 60%, var(--a4) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1.15; margin-bottom: 6px;
}
.page-sub { font-size: 12px; color: var(--t3); font-family: 'Nunito', sans-serif; font-weight: 600; letter-spacing: 0.5px; }

/* ── card ── */
.card {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 20px; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--t3); margin-bottom: 14px;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  display: flex; align-items: center; gap: 7px;
}
.card-title::before {
  content: ''; display: block; width: 10px; height: 10px;
  border-radius: 50%; background: linear-gradient(135deg, var(--a1), var(--a2));
}

/* ── input row ── */
.setup-grid {
  display: grid; grid-template-columns: 1.2fr 1fr;
  gap: 14px;
}
@media(max-width:760px){ .setup-grid { grid-template-columns: 1fr; } }

.field { margin-bottom: 12px; position: relative; }
.field-label {
  font-size: 12px; font-weight: 700; color: var(--t2);
  margin-bottom: 5px; display: block;
}
.field-input {
  width: 100%; padding: 11px 14px;
  background: var(--s1); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--t1); font-size: 15px;
  font-family: 'Noto Sans KR', sans-serif;
  transition: border-color .18s, box-shadow .18s, background .18s;
}
.field-input:focus { outline: none; border-color: var(--a1); background: var(--white); box-shadow: 0 0 0 4px rgba(155,135,245,.1); }

/* suggestions */
.sugg-wrap { position: relative; }
.suggestions {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  background: var(--white); border: 1.5px solid var(--a1);
  border-top: none; border-radius: 0 0 14px 14px;
  max-height: 180px; overflow-y: auto;
  box-shadow: 0 12px 32px rgba(155,135,245,.15);
}
.sugg-item { padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--t1); }
.sugg-item:last-child { border-bottom: none; }
.sugg-item:hover { background: var(--s1); color: var(--a1); }

/* stat grid */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-field-new { display: flex; flex-direction: column; gap: 6px; }
.sfn-header { display: flex; align-items: baseline; justify-content: space-between; }
.sfn-label { font-size: 12px; font-weight: 700; color: var(--t2); }
.sfn-row { display: flex; align-items: center; gap: 0; overflow: hidden; border-radius: 10px; }
.sfn-btn { width: 36px; height: 44px; border: 1.5px solid var(--border2); background: var(--s2); cursor: pointer; font-size: 18px; font-weight: 700; color: var(--a1); transition: all .12s; flex-shrink: 0; font-family: 'Nunito', sans-serif; line-height: 1; }
.sfn-m { border-right: none; }
.sfn-p { border-left: none; }
.sfn-btn:hover { background: var(--a1); color: #fff; border-color: var(--a1); }
.sfn-input { flex: 1; min-width: 0; width: 0; height: 44px; border: 1.5px solid var(--border2); text-align: center; font-size: 18px; font-weight: 900; font-family: 'Nunito', sans-serif; color: var(--t1); background: var(--white); outline: none; -moz-appearance: textfield; }
.sfn-input::-webkit-outer-spin-button, .sfn-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sfn-input:focus { border-color: var(--a1); background: var(--s1); }

/* ── 4개 스탯 랜덤값 셀 ── */
.stat-rolls {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 14px;
}
.stat-roll-cell {
  background: var(--s1); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 10px 4px;
  text-align: center;
  transition: all .25s;
}
.srl-label {
  font-size: 10px; font-weight: 800; color: var(--t3);
  letter-spacing: 1px; font-family: 'Nunito', sans-serif;
  margin-bottom: 4px;
}
.srl-val {
  font-size: 22px; font-weight: 900; font-family: 'Nunito', sans-serif;
  color: var(--t1);
  transition: color .15s;
}
/* 스탯 값별 색상 */
.srl-val.s-pos2 { color: #f5a623; }   /* +2 → 골드 (최대) */
.srl-val.s-pos1 { color: #9b87f5; }
.srl-val.s-zero { color: var(--t3); }
.srl-val.s-neg1 { color: #b0a8d4; }
.srl-val.s-neg2 { color: var(--err); }

/* 모두 +2일 때 강조 */
.stat-rolls.all-max .stat-roll-cell {
  background: linear-gradient(135deg, #fff5cc, #ffe988);
  border-color: var(--gold);
  animation: gradePop .25s ease-out;
}
.stat-rolls.all-max .srl-val { color: #c87800; }
[data-theme="dark"] .stat-rolls.all-max .stat-roll-cell {
  background: linear-gradient(135deg, #3a3020, #4a3825);
}
[data-theme="dark"] .stat-rolls.all-max .srl-val { color: var(--gold); }

/* 셀 팝 애니메이션 (매 시도마다) */
.stat-roll-cell.flash {
  animation: cellFlash .15s ease;
}
@keyframes cellFlash {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* ── 4개 스탯 랜덤값 셀 끝 ── */
.orb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.orb-input { padding: 9px 12px; font-size: 14px; }

/* ═══ 의사결정 카드 (5번 후, 10번 후) ═══ */
.decision-card {
  background: var(--white); border: 2px solid var(--a1);
  border-radius: 20px; padding: 20px; margin-top: 14px;
  box-shadow: var(--shadow2);
  animation: fadeUp .3s ease;
}
.decision-card.hard {
  border-color: var(--err);
}
.decision-strip {
  height: 4px; border-radius: 99px;
  background: linear-gradient(90deg, var(--a1), var(--a2));
  margin-bottom: 14px;
}
.decision-card.hard .decision-strip {
  background: linear-gradient(90deg, var(--err), var(--a2));
}
.decision-title {
  font-size: 16px; font-weight: 900; color: var(--t1);
  margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
}
.decision-sub {
  font-size: 12px; color: var(--t2); margin-bottom: 12px;
  line-height: 1.6;
}
.decision-compare {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px;
  align-items: center; margin-bottom: 14px;
}
@media(max-width:500px){ .decision-compare { grid-template-columns: 1fr; } .decision-vs { display: none; } }
.compare-cell {
  background: var(--s1); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 12px;
  text-align: center;
}
.compare-cell.recommend {
  border-color: var(--ok); background: linear-gradient(135deg, #e8f8ee, #f0f9ff);
  position: relative;
}
[data-theme="dark"] .compare-cell.recommend {
  background: linear-gradient(135deg, #1a2a1f, #1a2a35);
}
.compare-cell.recommend::before {
  content: '👍 추천';
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  background: var(--ok); color: #fff;
  font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 99px;
  font-family: 'Nunito', sans-serif; letter-spacing: .5px;
}
.compare-label {
  font-size: 11px; font-weight: 800; color: var(--t3);
  letter-spacing: 1px; font-family: 'Nunito', sans-serif;
  text-transform: uppercase; margin-bottom: 6px;
}
.compare-val {
  font-size: 20px; font-weight: 900; font-family: 'Nunito', sans-serif;
  color: var(--t1);
}
.compare-detail {
  font-size: 10px; color: var(--t3); margin-top: 4px;
  font-family: 'Nunito', sans-serif; font-weight: 700;
}
.decision-vs {
  font-size: 14px; font-weight: 900; color: var(--t3);
  font-family: 'Nunito', sans-serif;
}
.decision-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
@media(max-width:500px){ .decision-actions { grid-template-columns: 1fr; } }
.btn-decision {
  padding: 14px; border-radius: 12px;
  font-size: 14px; font-weight: 800;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: all .15s;
  border: 2px solid transparent;
}
.btn-decision-life {
  background: linear-gradient(135deg, var(--a1), var(--a2));
  color: #fff;
  box-shadow: 0 4px 14px rgba(155,135,245,.25);
}
.btn-decision-life:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(155,135,245,.4); }
.btn-decision-newpet {
  background: var(--white); color: var(--a1);
  border-color: var(--a1);
}
.btn-decision-newpet:hover { background: var(--a1); color: #fff; }
.btn-decision-giveup {
  background: var(--white); color: var(--t3);
  border-color: var(--border2);
}
.btn-decision-giveup:hover { background: var(--s2); color: var(--t2); }

/* ── opt-row ── */
.opt-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.opt-check {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; color: var(--t2);
  padding: 8px 12px; background: var(--s1); border: 1.5px solid var(--border);
  border-radius: 10px; cursor: pointer; user-select: none;
  transition: all .15s;
}
.opt-check:hover { border-color: var(--a1); color: var(--a1); }
.opt-check input { cursor: pointer; accent-color: var(--a1); }
.opt-check.active { border-color: var(--a1); background: #f5f0ff; color: var(--a1); }
[data-theme="dark"] .opt-check.active { background: #2a2a45; }

/* ── action btns ── */
.act-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
.btn-go {
  padding: 16px;
  background: linear-gradient(135deg, var(--a1) 0%, var(--a2) 100%);
  color: #fff; border: none; border-radius: 16px;
  font-size: 16px; font-weight: 800;
  font-family: 'Nunito', sans-serif;
  cursor: pointer; transition: all .2s; letter-spacing: .5px;
  box-shadow: 0 4px 20px rgba(155,135,245,.3);
}
.btn-go:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(155,135,245,.42); }
.btn-go:active { transform: scale(.99); }
.btn-go:disabled { opacity: .55; cursor: not-allowed; }
.btn-stop {
  padding: 16px 20px; background: var(--white);
  color: var(--err); border: 1.5px solid var(--err);
  border-radius: 16px; font-size: 14px; font-weight: 800;
  font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
  transition: all .15s;
}
.btn-stop:hover { background: var(--err); color: #fff; }

/* ── 정보 박스 ── */
.info-box {
  background: var(--s1); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 12px 14px; margin-top: 10px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.info-prob {
  font-size: 22px; font-weight: 900; font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.info-prob.gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); -webkit-background-clip: text; background-clip: text; }
.info-label { font-size: 11px; color: var(--t3); font-weight: 700; letter-spacing: 1px; font-family: 'Nunito', sans-serif; text-transform: uppercase; }

/* ── 시뮬 디스플레이 ── */
.sim-display {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 24px;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
  min-height: 260px;
  display: flex; flex-direction: column;
}
.sim-tries-big {
  text-align: center;
  font-family: 'Nunito', sans-serif;
  margin-bottom: 14px;
}
.sim-tries-num {
  font-size: 64px; font-weight: 900; line-height: 1;
  color: var(--a1);
  display: inline-block; min-width: 80px;
}
.sim-tries-unit { font-size: 22px; color: var(--t2); font-weight: 800; margin-left: 4px; }
.sim-tries-label { font-size: 11px; color: var(--t3); font-weight: 700; letter-spacing: 2px; margin-top: 6px; }

/* 등급 결과 한 줄 */
.sim-rolling {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Nunito', sans-serif;
  font-size: 24px; font-weight: 900;
  min-height: 60px;
  transition: all .15s;
}
.sim-grade-pop {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 22px;
  background: var(--s1); border: 2px solid var(--border);
  border-radius: 99px;
  animation: gradePop .25s ease-out;
}
@keyframes gradePop {
  0% { transform: scale(0.6); opacity: 0; }
  60% { transform: scale(1.08); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.sim-grade-num { font-size: 26px; font-weight: 900; }
.sim-grade-text { font-size: 14px; font-weight: 700; color: var(--t2); }

/* 등급별 색상 */
.g-pos1 { color: #b8aef5; }
.g-pos2 { color: #9b87f5; }
.g-pos3 { color: #f587b8; }
.g-zero { color: var(--t3); }
.g-neg { color: var(--t4); }
.g-hall {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

/* 환각 떴을 때 카드 */
.sim-display.hall-mode {
  background: linear-gradient(135deg, #fff9ee 0%, #fff3d4 50%, #ffeef6 100%);
  border-color: var(--gold);
  animation: hallShake .5s ease;
}
[data-theme="dark"] .sim-display.hall-mode {
  background: linear-gradient(135deg, #2a2515 0%, #3a3020 50%, #2a1f2e 100%);
}
@keyframes hallShake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

/* 비용 표시 작은거 */
.sim-cost-small { text-align: center; font-size: 12px; color: var(--t3); margin-top: 8px; font-family: 'Nunito', sans-serif; font-weight: 700; }

/* 로그 */
.sim-log {
  margin-top: 14px; max-height: 100px;
  overflow-y: auto;
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 12px;
  font-family: 'Nunito', sans-serif; font-size: 11px;
  color: var(--t3);
  display: none;
}
.sim-log.show { display: block; }
.sim-log-line { padding: 1px 0; }
.sim-log-line.hall { color: var(--gold); font-weight: 900; }
.sim-log::-webkit-scrollbar { width: 4px; }
.sim-log::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── 결과 카드 ── */
.result-card {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 24px;
  box-shadow: var(--shadow);
  animation: fadeUp .3s ease;
  margin-top: 14px;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.result-strip {
  height: 4px; border-radius: 99px;
  background: linear-gradient(90deg, var(--gold), var(--gold2), var(--a2));
  margin-bottom: 18px;
}
.result-grand {
  text-align: center; margin-bottom: 18px;
}
.result-grand-tries {
  font-size: 56px; font-weight: 900; font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
}
.result-grand-tries-unit { font-size: 22px; color: var(--t2); font-weight: 800; margin-left: 4px; -webkit-text-fill-color: var(--t2); }
.result-grand-label { font-size: 13px; color: var(--t2); font-weight: 700; margin-top: 8px; }
.result-grand-cost {
  display: inline-block; margin-top: 10px;
  padding: 6px 16px; background: linear-gradient(135deg, #fff5cc, #ffe988);
  border: 1.5px solid var(--gold); border-radius: 99px;
  font-size: 14px; font-weight: 900; color: #c87800;
  font-family: 'Nunito', sans-serif;
}
[data-theme="dark"] .result-grand-cost { background: linear-gradient(135deg, #3a3020, #4a3825); color: var(--gold); }

/* 이론값 비교 */
.theory-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-top: 16px;
}
@media(max-width:500px){ .theory-grid { grid-template-columns: 1fr; } }
.theory-cell {
  padding: 12px 10px; background: var(--s1);
  border: 1.5px solid var(--border); border-radius: 12px;
  text-align: center;
}
.theory-cell.highlight { border-color: var(--a1); background: #f5f0ff; }
[data-theme="dark"] .theory-cell.highlight { background: #2a2a45; }
.theory-label { font-size: 10px; font-weight: 800; color: var(--t3); letter-spacing: 1px; font-family: 'Nunito', sans-serif; text-transform: uppercase; margin-bottom: 4px; }
.theory-val { font-size: 20px; font-weight: 900; font-family: 'Nunito', sans-serif; color: var(--a1); }
.theory-sub { font-size: 10px; color: var(--t3); font-family: 'Nunito', sans-serif; font-weight: 700; margin-top: 2px; }

/* 운빨 멘트 */
.luck-msg {
  margin-top: 14px; padding: 12px 16px; border-radius: 12px;
  background: var(--s1); border: 1.5px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  text-align: left;
}
.luck-emoji { font-size: 26px; flex-shrink: 0; }
.luck-text { font-size: 13px; font-weight: 700; color: var(--t1); line-height: 1.5; }
.luck-msg.lucky { background: linear-gradient(135deg, #fff5cc, #ffe988); border-color: var(--gold); }
[data-theme="dark"] .luck-msg.lucky { background: linear-gradient(135deg, #3a3020, #2a2a45); }

<script>
/* ═══════════════════════════════════════════════════════════
   계산 로직 (index.html과 동일)
   ═══════════════════════════════════════════════════════════ */

function calcIdeal(pet) {
  const ic = pet.initialCoefficient;
  const iA = (pet.attackCoefficient + 4.5) * ic / 100;
  const iD = (pet.defenseCoefficient + 4.5) * ic / 100;
  const iG = (pet.agilityCoefficient + 4.5) * ic / 100;
  const iH = (pet.healthCoefficient + 4.5) * ic / 100;
  const rAtk = iH * 0.1 + iA + iD * 0.1 + iG * 0.05;
  const rDef = iH * 0.1 + iA * 0.1 + iD + iG * 0.05;
  const rAgi = iG;
  const rHp = iH * 4 + iA + iD + iG;
  return {
    atk: Math.floor(rAtk), def: Math.floor(rDef),
    agi: Math.floor(rAgi), hp: Math.floor(rHp)
  };
}

function runCalc(pet, dAtk, dDef, dAgi, dHp) {
  let totalCases = 0, hallCases = 0, exactCount = 0, totalPossible = 0, gradeDist = {};
  for (let ar = -2; ar <= 2; ar++)
    for (let dr = -2; dr <= 2; dr++)
      for (let gr = -2; gr <= 2; gr++)
        for (let hr = -2; hr <= 2; hr++)
          for (let ab = 0; ab <= 10; ab++)
            for (let db = 0; db <= 10; db++)
              for (let gb = 0; gb <= 10; gb++) {
                const hb = 10 - ab - db - gb;
                if (hb < 0 || hb > 10) continue;
                const bA = pet.attackCoefficient + ar + ab;
                const bD = pet.defenseCoefficient + dr + db;
                const bG = pet.agilityCoefficient + gr + gb;
                const bH = pet.healthCoefficient + hr + hb;
                const ic = pet.initialCoefficient;
                const iA = bA * ic / 100, iD = bD * ic / 100, iG = bG * ic / 100, iH = bH * ic / 100;
                const cA = Math.floor(iH * 0.1 + iA + iD * 0.1 + iG * 0.05);
                const cD = Math.floor(iH * 0.1 + iA * 0.1 + iD + iG * 0.05);
                const cG = Math.floor(iG);
                const cH = Math.floor(iH * 4 + iA + iD + iG);
                totalPossible++;
                if (cA === dAtk && cD === dDef && cG === dAgi && cH === dHp) {
                  exactCount++; totalCases++;
                  const signed = ar + dr + gr + hr;
                  gradeDist[signed] = (gradeDist[signed] || 0) + 1;
                  if (ar === 2 && dr === 2 && gr === 2 && hr === 2) hallCases++;
                }
              }
  return { totalCases, hallCases, exactCount, totalPossible, gradeDist };
}

/* 계수 역산 (펫 데이터 변환용) */
function _tryCoeff(fH, fA, fD, fG, tol) {
  for (let ic = 10; ic <= 100; ic++) {
    const agi = (fG * 100 / ic) - 4.5;
    if (agi <= 0 || Math.abs(agi - Math.round(agi)) > tol) continue;
    const e1 = fH - fG, e2 = fA - 0.05 * fG, e3 = fD - 0.05 * fG, e4 = e2 - e1, e5 = e3 - 0.1 * e1;
    const mul = 3 / 3.9;
    const C = (e5 * 10 - e4 * mul) / (9 + 0.9 * mul);
    const A = (e5 - 0.9 * C) / -0.3, B = e1 - 4 * A - C;
    if (A < 0 || B < 0 || C < 0) continue;
    const hc = (A * 100 / ic) - 4.5, ac = (B * 100 / ic) - 4.5, dc = (C * 100 / ic) - 4.5;
    if (Math.abs(hc - Math.round(hc)) > tol || Math.abs(ac - Math.round(ac)) > tol || Math.abs(dc - Math.round(dc)) > tol) continue;
    return {
      initialCoefficient: ic,
      healthCoefficient: Math.round(hc),
      attackCoefficient: Math.round(ac),
      defenseCoefficient: Math.round(dc),
      agilityCoefficient: Math.round(agi)
    };
  }
  return null;
}

function _convertPetInfo(p) {
  let coeffs = null;
  if (p.ic && p.ic.hp != null && p.ic.atk != null && p.ic.def != null && p.ic.agi != null) {
    coeffs = _tryCoeff(p.ic.hp, p.ic.atk, p.ic.def, p.ic.agi, 0.01);
  }
  if (!coeffs) {
    coeffs = { initialCoefficient: 20, healthCoefficient: 0, attackCoefficient: 0, defenseCoefficient: 0, agilityCoefficient: 0 };
  }
  return {
    ...coeffs,
    grade: p.grade || "일반",
    obtain: p.obtain || "",
    image: p.image || ""
  };
}

// [{ atk, def, agi, hp, total, hall, prob }, ...]
// total = 같은 4스탯이 나오는 (등급,보너스) 조합 수
// hall = 그 중 환각(모든 +2) 조합 수
// prob = hall/total (이 스탯에서 환각 도전했을 때 확률)
let currentPetStatPool = null;
let currentPetTotalCombos = 0; // 모든 조합 합 (보통 178750)

/**
 * 펫의 모든 가능한 1레벨 4스탯 조합과 각 스탯의 환각 확률 계산
 * runCalc와 동일 로직이지만 한 번에 모든 결과를 그룹화
 */
function buildPetStatPool(pet) {
  const map = {}; // "atk,def,agi,hp" → {atk, def, agi, hp, total, hall}
  for (let ar = -2; ar <= 2; ar++)
    for (let dr = -2; dr <= 2; dr++)
      for (let gr = -2; gr <= 2; gr++)
        for (let hr = -2; hr <= 2; hr++)
          for (let ab = 0; ab <= 10; ab++)
            for (let db = 0; db <= 10; db++)
              for (let gb = 0; gb <= 10; gb++) {
                const hb = 10 - ab - db - gb;
                if (hb < 0 || hb > 10) continue;
                const bA = pet.attackCoefficient + ar + ab;
                const bD = pet.defenseCoefficient + dr + db;
                const bG = pet.agilityCoefficient + gr + gb;
                const bH = pet.healthCoefficient + hr + hb;
                const ic = pet.initialCoefficient;
                const iA = bA * ic / 100, iD = bD * ic / 100, iG = bG * ic / 100, iH = bH * ic / 100;
                const cA = Math.floor(iH * 0.1 + iA + iD * 0.1 + iG * 0.05);
                const cD = Math.floor(iH * 0.1 + iA * 0.1 + iD + iG * 0.05);
                const cG = Math.floor(iG);
                const cH = Math.floor(iH * 4 + iA + iD + iG);
                const key = `${cA},${cD},${cG},${cH}`;
                if (!map[key]) {
                  map[key] = { atk: cA, def: cD, agi: cG, hp: cH, total: 0, hall: 0 };
                }
                map[key].total++;
                if (ar === 2 && dr === 2 && gr === 2 && hr === 2) map[key].hall++;
              }
  // 배열로 변환, prob 계산
  const arr = [];
  let totalCombos = 0;
  for (const k in map) {
    const v = map[k];
    v.prob = v.hall / v.total;
    totalCombos += v.total;
    arr.push(v);
  }
  return { pool: arr, totalCombos };
}

function setupPetSearch() {

      .slice(0, 12);

    sugg.innerHTML = matches.map(n => `<div class="sugg-item" data-name="${n}">${n}</div>`).join('');
    sugg.style.display = 'block';

  sugg.addEventListener('click', e => {
    const item = e.target.closest('.sugg-item');

  const obtain = pet.obtain || '';
  const m = obtain.match(/V[\s]*[PI]P?[\s]*(\d{3,6})/i) || obtain.match(/(\d{3,6})\s*VP/i);

    $('hall-vip-auto').style.display = 'none';

  const hallInput = $('pet-price');

function renderDistPreview(targetProb) {
  // 확률 구간별로 묶기
  const buckets = [
    { label: '0%',         min: 0,    max: 0,     combos: 0 },
    { label: '0~0.1%',    min: 0,    max: 0.001, combos: 0 },
    { label: '0.1~1%',    min: 0.001,max: 0.01,  combos: 0 },
    { label: '1~5%',      min: 0.01, max: 0.05,  combos: 0 },
    { label: '5~10%',     min: 0.05, max: 0.10,  combos: 0 },
    { label: '10~50%',    min: 0.10, max: 0.50,  combos: 0 },
    { label: '50~99%',    min: 0.50, max: 0.99,  combos: 0 },
    { label: '99% 이상',   min: 0.99, max: 1.001,combos: 0 },
  ];
  currentPetStatPool.forEach(s => {
    if (s.prob === 0) buckets[0].combos += s.total;
    else {
      for (let i = 1; i < buckets.length; i++) {
        if (s.prob >= buckets[i].min - 1e-9 && s.prob < buckets[i].max - 1e-9) {
          buckets[i].combos += s.total;
          break;
        }
      }
    }
  });
  const total = currentPetTotalCombos;
  // 0인 버킷은 숨김
  const visible = buckets.filter(b => b.combos > 0);
  const maxCombos = Math.max(...visible.map(b => b.combos), 1);

  const html = visible.map(b => {
    const pct = (b.combos / total) * 100;
    const isHighlight = b.min >= targetProb - 1e-9; // 목표 이상 버킷
    return `
      <div class="dist-bar-row ${isHighlight ? 'highlight' : ''}">
        <div class="dist-bar-label">${b.label}</div>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${(b.combos / maxCombos * 100).toFixed(1)}%;"></div></div>
        <div class="dist-bar-pct">${pct < 0.01 ? pct.toExponential(1) : pct.toFixed(2)}%</div>
      </div>
    `;
  }).join('');
  $('dist-bars').innerHTML = html;
}

function formatPct(p) {
  if (p < 0.0001) return p.toExponential(2) + '%';
  if (p < 0.01) return p.toFixed(4) + '%';
  if (p < 1) return p.toFixed(3) + '%';
  if (p < 10) return p.toFixed(2) + '%';
  return Math.min(p, 99.99).toFixed(2) + '%';
}

function formatTries(n) {
  if (!isFinite(n)) return '∞';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 10000) return (n / 1000).toFixed(0) + 'K';
  return Math.round(n).toLocaleString();
}

}

}

/* 스탯 값 → "+1"/"-2"/"0" 표시 문자 */
function fmtStat(v) {
  if (v > 0) return '+' + v;
  return String(v);
}

/* 이론값 계산 */
function calcTheory(p) {
  // p = 8등급 확률 (0~1)
  if (p <= 0) return null;
  const avg = 1 / p;                    // 기대값
  const median = Math.log(0.5) / Math.log(1 - p);  // 50% 누적
  const p99 = Math.log(0.01) / Math.log(1 - p);    // 99%
  return { avg, median: Math.ceil(median), p99: Math.ceil(p99) };
}

/* 운빨 메시지 */
function getLuckMsg(actual, theory) {
  if (!theory) return null;
  const ratio = actual / theory.avg;
  if (ratio <= 0.1) return { kind: 'lucky', emoji: '👑', text: `평균의 ${(ratio*100).toFixed(0)}%! 미친 운빨이에요. 로또 사세요!` };
  if (ratio <= 0.3) return { kind: 'lucky', emoji: '🍀', text: `평균보다 훨씬 빨랐어요! 운이 좋네요 ✨` };
  if (ratio <= 0.7) return { kind: 'lucky', emoji: '🌟', text: `평균보다 빨랐어요! 잘했어요!` };
  if (ratio <= 1.3) return { kind: 'normal', emoji: '🙂', text: `평균 정도의 운빨이에요. 무난하네요.` };
  if (ratio <= 2.5) return { kind: 'unlucky', emoji: '😅', text: `평균보다 좀 늦었어요... 다음엔 더 잘 풀리길!` };
  if (ratio <= 5) return { kind: 'unlucky', emoji: '😭', text: `평균의 ${ratio.toFixed(1)}배... 오늘은 운이 별로네요.` };
  return { kind: 'unlucky', emoji: '💀', text: `${actual}회... 평균의 ${ratio.toFixed(1)}배! 이건 좀 가혹하네요...` };
}

let simAbort = false;

/* ═══════════════════════════════════════════════════════════
   모드 1: 초구 돌리기 (펫당 5번 + 생명 후 5번, 펫 갈아탐)
   ═══════════════════════════════════════════════════════════ */

async function runCatchSim() {
  const targetPct = parseFloat($('target-prob').value) || 5;
  const targetProb = targetPct / 100;

  // 환각 모드와 같은 사이클 시스템 사용. simState에 catch 전용 필드 추가.
  simState = {
    totalTries: 0,
    petsBought: 1,
    resetOrbsUsed: 0,
    lifeOrbsUsed: 0,
    currentPetTries: 0,
    mode: 'catch',
    targetProb: targetProb,
    bestProb: 0,        // 지금까지 잡힌 펫 중 최고 환각 확률
    bestStats: null,    // 그 때의 스탯
  };

  await runCatchCycle();
}

/**
 * 초구 사이클: 한 번에 5번 초구 → 그 중 목표 달성 못 했으면 결정 카드
 */
async function runCatchCycle() {
  simRunning = true;
  simAbort = false;
  $('btn-go').style.display = 'none';
  $('btn-stop').style.display = 'block';
  $('decision-area').innerHTML = '';
  $('stat-rolls').classList.remove('all-max');

  const skip = $('skip-check').checked;
  const showLog = $('log-check').checked;
  const logEl = $('sim-log');
  logEl.classList.toggle('show', showLog);

  const startInPet = simState.currentPetTries;
  const targetInPet = Math.min(startInPet + 5, 10);
  const remainingInThisCycle = targetInPet - startInPet;

  let found = null;

  for (let i = 0; i < remainingInThisCycle; i++) {
    if (simAbort) break;

    simState.totalTries++;
    simState.currentPetTries++;
    simState.resetOrbsUsed++;

    const picked = weightedPick(currentPetStatPool, currentPetTotalCombos);
    const matched = picked.prob >= simState.targetProb - 1e-9;

    // 최고 기록 갱신
    if (picked.prob > simState.bestProb) {
      simState.bestProb = picked.prob;
      simState.bestStats = picked;
    }

    updateCatchDisplay(picked);

    if (showLog) {
      const line = document.createElement('div');
      line.className = 'sim-log-line' + (matched ? ' hall' : '');
      const petTag = simState.petsBought > 1 ? `[펫${simState.petsBought}] ` : '';
      const statStr = `공${picked.atk}/방${picked.def}/민${picked.agi}/체${picked.hp}`;
      line.textContent = `${petTag}${simState.totalTries}회 · ${statStr} · 환각 ${formatPct(picked.prob * 100)}${matched ? ' ✨ 달성!' : ''}`;
      logEl.insertBefore(line, logEl.firstChild);
      while (logEl.children.length > 100) logEl.removeChild(logEl.lastChild);
    }

    if (matched) {
      found = picked;
      $('sim-display').classList.add('hall-mode');
      $('stat-rolls').classList.add('all-max');
      await sleep(900);
      break;
    }

    const delay = computeDelay(simState.totalTries, skip);
    if (delay > 0) await sleep(delay);
  }

  simRunning = false;
  $('btn-go').style.display = 'none';
  $('btn-stop').style.display = 'none';

  if (found) {
    showCatchResult(found);
    $('btn-go').style.display = 'block';
    return;
  }

  if (simAbort) {
    showAbortResult(simState.totalTries);
    $('btn-go').style.display = 'block';
    return;
  }

  // 5번 또는 10번 후 의사결정
  if (simState.currentPetTries === 5) {
    showCatchDecisionAt5();
  } else if (simState.currentPetTries === 10) {
    showCatchDecisionAt10();
  }
}

function updateCatchDisplay(stats) {
  $('sim-tries-num').textContent = simState.totalTries.toLocaleString();

  // 4개 스탯 셀 업데이트
  const cells = [
    { id: 'srl-atk', val: stats.atk },
    { id: 'srl-def', val: stats.def },
    { id: 'srl-agi', val: stats.agi },
    { id: 'srl-hp',  val: stats.hp  }
  ];
  cells.forEach(c => {
    const el = $(c.id);
    el.textContent = c.val;
    el.className = 'srl-val';
    const cell = el.parentElement;
    cell.classList.remove('flash');
    void cell.offsetWidth;
    cell.classList.add('flash');
  });

  const totalCost = calcRunningCost(simState);
  const petLine = simState.petsBought > 1
    ? `🐾 펫 ${simState.petsBought}마리째 · 현재 펫에서 ${simState.currentPetTries}/10번`
    : `🐾 현재 펫에서 ${simState.currentPetTries}/10번 초기화`;
  const bestLine = simState.bestProb > 0
    ? `<div style="margin-top:3px;color:var(--a1);">⭐ 최고 기록: ${formatPct(simState.bestProb * 100)}</div>`
    : '';
  $('sim-cost-small').innerHTML = totalCost > 0
    ? `<div>${petLine}</div><div style="margin-top:3px;">💰 누적 비용: ${totalCost.toLocaleString()} vip</div>${bestLine}`
    : `<div>${petLine}</div>${bestLine}`;

  // 환각 확률 표시
  const pct = stats.prob * 100;
  const probTxt = formatPct(pct);
  let colorClass = 'g-neg';
  if (pct >= 50) colorClass = 'g-hall';
  else if (pct >= 10) colorClass = 'g-pos3';
  else if (pct >= 1) colorClass = 'g-pos2';
  else if (pct >= 0.1) colorClass = 'g-pos1';
  else if (pct > 0) colorClass = 'g-zero';

  const rolling = $('sim-rolling');
  rolling.innerHTML = `
    <div class="sim-grade-pop">
      <span class="sim-grade-num ${colorClass}">환각 ${probTxt}</span>
      <span class="sim-grade-text">${pct === 0 ? '꽝' : (pct < 1 ? '아쉬움' : (pct < 5 ? '쓸만함' : (pct < 50 ? '좋음!' : '대박!')))}</span>
    </div>
  `;
}

 */
function startHallFromCatch() {
  if (!simState || !simState.bestStats) return;
  const caughtPet = simState.bestStats;

  // 환각 모드로 전환
  setMode('hall');

  // 잡은 펫의 스탯 자동 입력

  $('stat-hp').value = caughtPet.hp;

  $('pet-price').value = $('catch-pet-price').value || '';
  $('orb-reset').value = $('catch-orb-reset').value;
  $('orb-life').value = $('catch-orb-life').value;

  // 확률 표시 갱신
  refreshProbInfo();
  updateGoButton();

  // 이전 시도/비용 이어받기 위해 누적 상태 보존
  carryoverFromCatch = {
    tries: simState.totalTries,
    petsBought: simState.petsBought,
    resetOrbsUsed: simState.resetOrbsUsed,
    lifeOrbsUsed: simState.lifeOrbsUsed,
    catchPetPrice: parseInt($('catch-pet-price').value) || 0,
    catchOrbReset: parseInt($('catch-orb-reset').value) || 0,
    catchOrbLife: parseInt($('catch-orb-life').value) || 0,
    // 잡은 펫 자체는 이번에 환각 도전할 거니까 petsBought - 1 만큼이 "이전" 비용
  };

  // 결과/디시전 카드 정리

/* ═══════════════════════════════════════════════════════════
   모드 2: 환각 도전 (기존 로직)
   ═══════════════════════════════════════════════════════════ */

// 초구→환각 이어받기 데이터 (carry over)
// runHallSim 시작 시 simState 초기 비용에 합산됨, 한 번 쓰면 비워짐
let carryoverFromCatch = null;

async function runHallSim() {
  // 현재 스탯에서 환각 확률 가져오기
  const dAtk = parseInt($('stat-atk').value);
  const dDef = parseInt($('stat-def').value);
  const dAgi = parseInt($('stat-agi').value);
  const dHp = parseInt($('stat-hp').value);
  const found = currentPetStatPool.find(s =>
    s.atk === dAtk && s.def === dDef && s.agi === dAgi && s.hp === dHp);
  if (!found || found.hall === 0) return;

  // 새로 시작 (carryover가 있으면 그대로 이어받음)
  simState = {
    totalTries: 0,
    petsBought: 1,
    resetOrbsUsed: 0,
    lifeOrbsUsed: 0,
    currentPetTries: 0,
    mode: 'hall',
    hallProb: found.prob,
    carryover: null,  // 이전 단계 비용 (초구 또는 직전 환각 도전)
  };

  // 이전 단계 비용 이어받기
  if (carryoverFromCatch) {
    simState.carryover = carryoverFromCatch;
    carryoverFromCatch = null; // 한 번만 사용
  }

  await runCycle();
}

/**
 * 한 사이클(5번)을 실행한다.
 * 환각 뜨면 → 결과 카드
 * 5번 다 했는데 못뜨면 → 결정 카드 (생명 쓸지 / 새 펫 살지)
 */
async function runCycle() {
  simRunning = true;
  simAbort = false;
  $('btn-go').style.display = 'none';
  $('btn-stop').style.display = 'block';
  $('decision-area').innerHTML = ''; // 이전 결정 카드 지우기
  $('stat-rolls').classList.remove('all-max');

  const skip = $('skip-check').checked;
  const showLog = $('log-check').checked;

  // 로그 (계속 누적)
  const logEl = $('sim-log');
  logEl.classList.toggle('show', showLog);

  // 이번 사이클에서 몇 번 더 할 수 있는지 (남은 시도)
  // 펫당 최대 10번이지만 5번 단위로 끊어서 진행
  const startInPet = simState.currentPetTries;
  const targetInPet = Math.min(startInPet + 5, 10); // 5번 더 (또는 10까지)
  const remainingInThisCycle = targetInPet - startInPet;

  let success = false;

  for (let i = 0; i < remainingInThisCycle; i++) {
    if (simAbort) break;

    simState.totalTries++;
    simState.currentPetTries++;
    simState.resetOrbsUsed++;

    // 환각 모드: 이 펫의 환각 확률로 베르누이 시행
    // 등급 표시는 시각적 효과로 별도 생성 (확률 분포와는 별개)
    const isHall = Math.random() < simState.hallProb;
    // 4스탯 시각용 (실제 게임 분포 아님, 화면용)
    const stats = isHall
      ? { atk: 2, def: 2, agi: 2, hp: 2 }
      : (() => {
          // 환각 아닌 결과: -2~+2 중 모두 +2가 아닌 조합 랜덤
          let s;
          do {
            s = { atk: Math.floor(Math.random()*5)-2, def: Math.floor(Math.random()*5)-2, agi: Math.floor(Math.random()*5)-2, hp: Math.floor(Math.random()*5)-2 };
          } while (s.atk === 2 && s.def === 2 && s.agi === 2 && s.hp === 2);
          return s;
        })();
    const signed = stats.atk + stats.def + stats.agi + stats.hp;
    // 8등급 = 모두 +2 (sum=+8)

    updateSimDisplay(stats, signed, isHall);

    // 로그
    if (showLog) {
      const line = document.createElement('div');
      line.className = 'sim-log-line' + (isHall ? ' hall' : '');
      const petTag = simState.petsBought > 1 ? `[펫${simState.petsBought}] ` : '';
      const statStr = `공${fmtStat(stats.atk)}/방${fmtStat(stats.def)}/민${fmtStat(stats.agi)}/체${fmtStat(stats.hp)}`;
      line.textContent = `${petTag}${simState.totalTries}회 · ${statStr} (${signed >= 0 ? '+' : ''}${signed})${isHall ? ' ✨ 환각!' : ''}`;
      logEl.insertBefore(line, logEl.firstChild);
      while (logEl.children.length > 100) logEl.removeChild(logEl.lastChild);
    }

    if (isHall) {
      success = true;
      $('sim-display').classList.add('hall-mode');
      $('stat-rolls').classList.add('all-max');
      await sleep(900);
      break;
    }

    // 딜레이
    const delay = computeDelay(simState.totalTries, skip);
    if (delay > 0) await sleep(delay);
  }

  simRunning = false;
  $('btn-go').style.display = 'none'; // 결정 안 끝났으면 시작 버튼 숨김
  $('btn-stop').style.display = 'none';

  // 결과 분기
  if (success) {
    showSuccessResult();
    saveStats(simState.totalTries);
    renderStats();
    $('btn-go').style.display = 'block';
    return;
  }

  if (simAbort) {
    showAbortResult();
    $('btn-go').style.display = 'block';
    return;
  }

  // 5번 또는 10번 다 했는데 환각 못 뜸 → 의사결정 카드
  if (simState.currentPetTries === 5) {
    showDecisionAt5();
  } else if (simState.currentPetTries === 10) {
    showDecisionAt10();
  }
}

function updateSimDisplay(stats, signed, isHall) {
  const totalCost = calcRunningCost(simState);
  $('sim-tries-num').textContent = simState.totalTries.toLocaleString();

  // 4개 스탯 셀 업데이트
  const cells = [
    { id: 'srl-atk', val: stats.atk },
    { id: 'srl-def', val: stats.def },
    { id: 'srl-agi', val: stats.agi },
    { id: 'srl-hp',  val: stats.hp  }
  ];
  cells.forEach(c => {
    const el = $(c.id);
    el.textContent = fmtStat(c.val);
    el.className = 'srl-val ' + statColorClass(c.val);

    const cell = el.parentElement;

    ? `🐾 펫 ${simState.petsBought}마리째 · 현재 펫에서 ${simState.currentPetTries}/10번`
    : `🐾 현재 펫에서 ${simState.currentPetTries}/10번 시도`;

  // carryover (초구 비용) 안내
  const co = simState.carryover;
  const coLine = co
    ? `<div style="margin-top:3px;color:var(--t3);font-size:11px;">🎣 초구 ${co.tries}회 + 환각 ${simState.totalTries}회 진행중</div>`
    : '';

  $('sim-cost-small').innerHTML = totalCost > 0
    ? `<div>${petLineFull}</div>${coLine}<div style="margin-top:3px;">💰 누적 비용: ${totalCost.toLocaleString()} vip</div>`
    : `<div>${petLineFull}</div>${coLine}`;

  const grade = signed; // -8 ~ +8
  const rolling = $('sim-rolling');
  const colorClass = gradeColorClass(grade);
  rolling.innerHTML = `
    <div class="sim-grade-pop">
      <span class="sim-grade-num ${colorClass}">${GRADE_NAMES[grade]}</span>
      <span class="sim-grade-text">${GRADE_TEXT[grade]}${isHall ? ' ✨' : ''}</span>
    </div>
  `;
}

function computeDelay(tries, skip) {
  if (skip) {
    if (tries < 20) return 30;
    if (tries < 100) return 12;
    if (tries < 1000) return 4;
    return 0;
  }
  if (tries < 5) return 280;
  if (tries < 20) return 180;
  if (tries < 50) return 100;
  if (tries < 200) return 50;
  if (tries < 1000) return 18;
  return 4;
}

/**
 * 현재까지 든 비용 계산 (펫값 + 구슬값)
 */
/**
 * 현재까지 든 비용 계산 (펫값 + 구슬값 + 이어받기 비용)
 * 모드에 따라 다른 입력란 참조
 */
function calcRunningCost(s) {
  const isCatch = s && s.mode === 'catch';
  const petPrice = parseInt($(isCatch ? 'catch-pet-price' : 'pet-price').value) || 0;
  const orbReset = parseInt($(isCatch ? 'catch-orb-reset' : 'orb-reset').value) || 0;
  const orbLife = parseInt($(isCatch ? 'catch-orb-life' : 'orb-life').value) || 0;
  let cost = s.petsBought * petPrice
       + s.resetOrbsUsed * orbReset
       + s.lifeOrbsUsed * orbLife;

  // 이전 단계 비용 (carryover) 합산
  if (s.carryover) {
    const co = s.carryover;
    cost += co.petsBought * co.catchPetPrice
         + co.resetOrbsUsed * co.catchOrbReset
         + co.lifeOrbsUsed * co.catchOrbLife;
  }
  return cost;
}

/**
 * 가중치 랜덤 뽑기 (각 조합의 total을 가중치로 사용)
 */
function weightedPick(pool, totalWeight) {
  let r = Math.random() * totalWeight;
  for (const s of pool) {
    r -= s.total;
    if (r <= 0) return s;
  }
  return pool[pool.length - 1];
}

 * 펫값은 추가되지만 환각 확률은 그대로

  $('stat-rolls').classList.remove('all-max');

/**
 * 초구부터 다시 - 환각 모드를 끝내고 초구 모드로 전환
 * 지금까지 사용한 비용/시도는 다음 초구→환각 사이클로 carry over
 */
function restartFromCatch() {
  if (!simState) return;

  // 지금까지의 누적 상태를 carryover로 저장
  // 다음 환각 모드 시작할 때 합산됨
  const prevCost = calcRunningCost(simState);
  const prevTries = simState.totalTries;
  carryoverFromCatch = {
    tries: prevTries,
    petsBought: simState.petsBought,
    resetOrbsUsed: simState.resetOrbsUsed,
    lifeOrbsUsed: simState.lifeOrbsUsed,
    catchPetPrice: parseInt($('pet-price').value) || 0,
    catchOrbReset: parseInt($('orb-reset').value) || 0,
    catchOrbLife: parseInt($('orb-life').value) || 0,
    // carryover 자체에 이전 carryover도 누적
    extraCost: simState.carryover ? calcRunningCostForCarryover(simState.carryover) : 0,
    extraTries: simState.carryover ? simState.carryover.tries + (simState.carryover.extraTries || 0) : 0,
  };

  // 초구 모드로 전환
  setMode('catch');

  // 초구 모드 가격 동기화 (환각 모드 값 → 초구 모드 값)
  $('catch-pet-price').value = $('pet-price').value;
  $('catch-orb-reset').value = $('orb-reset').value;
  $('catch-orb-life').value = $('orb-life').value;

  $('result-area').innerHTML = '';
  $('decision-area').innerHTML = '';
  $('sim-display').classList.remove('hall-mode');
  $('stat-rolls').classList.remove('all-max');
  $('sim-display').style.display = 'none';

  refreshProbInfo();
  updateGoButton();

  toast(`이전 ${prevTries}회·${prevCost.toLocaleString()}vip 누적 · 초구부터 다시!`);
}

/**
 * 환각→초구로 갈 때 이전 carryover까지 합산하기 위한 헬퍼
 */
function calcRunningCostForCarryover(co) {
  return co.petsBought * co.catchPetPrice
       + co.resetOrbsUsed * co.catchOrbReset
       + co.lifeOrbsUsed * co.catchOrbLife
       + (co.extraCost || 0);
}

      <div style="margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--border2);">

        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);padding:2px 0;">
          <span>초구 ${co.tries}회 · 펫 ${co.petsBought}마리</span>
          <span style="font-family:'Nunito',sans-serif;font-weight:700;">${(co.petsBought * co.catchPetPrice).toLocaleString()} vip</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);padding:2px 0;">
          <span>초기화 ${co.resetOrbsUsed}개 + 생명 ${co.lifeOrbsUsed}개</span>
          <span style="font-family:'Nunito',sans-serif;font-weight:700;">${(co.resetOrbsUsed*co.catchOrbReset + co.lifeOrbsUsed*co.catchOrbLife).toLocaleString()} vip</span>
        </div>
        ${co.extraCost ? `
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2);padding:2px 0;">
          <span>이전 단계까지 누적</span>
          <span style="font-family:'Nunito',sans-serif;font-weight:700;">${co.extraCost.toLocaleString()} vip</span>
        </div>` : ''}
      </div>
  ` : '';

  const breakdownHTML = totalCost > 0 ? `
    <div style="margin-top:14px;padding:12px 14px;background:var(--s1);border:1.5px solid var(--border);border-radius:12px;">
      <div style="font-size:11px;font-weight:800;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">💰 비용 상세</div>
      <div style="font-size:11px;font-weight:800;color:var(--a1);letter-spacing:.5px;margin-bottom:6px;">🎰 환각 도전 단계</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--t2);padding:3px 0;">
        <span>펫 ${simState.petsBought}마리</span>
        <span style="font-family:'Nunito',sans-serif;font-weight:700;">${(simState.petsBought * (parseInt($('pet-price').value)||0)).toLocaleString()} vip</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--t2);padding:3px 0;">
        <span>초기화 구슬 ${simState.resetOrbsUsed}개</span>
        <span style="font-family:'Nunito',sans-serif;font-weight:700;">${(simState.resetOrbsUsed * (parseInt($('orb-reset').value)||0)).toLocaleString()} vip</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--t2);padding:3px 0;">
        <span>생명의 구슬 ${simState.lifeOrbsUsed}개</span>
        <span style="font-family:'Nunito',sans-serif;font-weight:700;">${(simState.lifeOrbsUsed * (parseInt($('orb-life').value)||0)).toLocaleString()} vip</span>
      </div>
      ${carryoverHTML}
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:900;color:var(--t1);padding-top:8px;margin-top:8px;border-top:1.5px solid var(--border);font-family:'Nunito',sans-serif;">
        <span>최종 총합</span>
        <span style="color:#c87800;font-size:16px;">${totalCost.toLocaleString()} vip</span>
      </div>
    </div>
  ` : '';

  // 환각 단계 시도 횟수 / 전체 시도 횟수
  const hallTries = simState.totalTries;
  const grandTotalTries = hallTries + (co ? co.tries + (co.extraTries || 0) : 0);
  const totalTriesLine = co
    ? `<div style="font-size:11px;color:var(--t3);margin-top:6px;font-weight:700;">초구 ${co.tries}회 + 환각 ${hallTries}회 = <strong style="color:var(--a1);">총 ${grandTotalTries}회</strong></div>`
    : '';

  $('result-area').innerHTML = `
    <div class="result-card">
      <div class="result-strip"></div>
      <div class="result-grand">
        <div>
          <span class="result-grand-tries">${simState.totalTries.toLocaleString()}</span><span class="result-grand-tries-unit">회</span>
        </div>
        <div class="result-grand-label">만에 환각 성공! ✨</div>
        ${simState.petsBought > 1 ? `<div style="font-size:11px;color:var(--t3);margin-top:4px;font-weight:700;">환각 단계에서 펫 ${simState.petsBought}마리 사용</div>` : ''}
        ${totalTriesLine}
        ${totalCost > 0 ? `<div class="result-grand-cost">💰 ${totalCost.toLocaleString()} vip 사용</div>` : ''}
      </div>
      ${theoryHTML}
      ${luckHTML}
      ${breakdownHTML}
      <div style="text-align:center;margin-top:14px;">
        <button class="btn-go" style="padding:12px 28px;font-size:14px;" onclick="runSimulation()">🔁 다시 돌리기</button>
      </div>
    </div>
  `;
  $('decision-area').innerHTML = '';
  $('result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ─── 포기 결과 ─── */
function showGiveUpResult() {
  const totalCost = calcRunningCost(simState);
  $('result-area').innerHTML = `
    <div class="result-card">
      <div style="text-align:center;">
        <div style="font-size:22px;font-weight:900;color:var(--t2);margin-bottom:8px;">🏳️ 포기</div>
        <div style="font-size:13px;color:var(--t2);line-height:1.7;">
          누적 <strong>${simState.totalTries}회</strong> 시도<br>
          ${totalCost > 0 ? `사용한 vip: <strong style="color:#c87800;">${totalCost.toLocaleString()}</strong>` : ''}
        </div>
        <div style="margin-top:14px;">
          <button class="btn-go" style="padding:12px 28px;font-size:14px;" onclick="runSimulation()">🔁 다시 돌리기</button>
        </div>
      </div>
    </div>
  `;
  $('decision-area').innerHTML = '';
}

/* ─── 중지 결과 ─── */
function showAbortResult(tries) {
  const n = tries !== undefined ? tries : (simState ? simState.totalTries : 0);
  $('result-area').innerHTML = `
    <div class="result-card">
      <div style="text-align:center;color:var(--t2);font-size:14px;font-weight:700;">⏸ 중지됨 — ${n.toLocaleString()}회 시도</div>
    </div>`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

$('btn-go').addEventListener('click', runSimulation);
$('btn-stop').addEventListener('click', () => { simAbort = true; });

/* ═══════════════════════════════════════════════════════════
   누적 통계 (localStorage)
   ═══════════════════════════════════════════════════════════ */

const STATS_KEY = 'wind_sim_stats_v1';

function loadStats() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (!raw) return { runs: 0, totalTries: 0, best: null };
    return JSON.parse(raw);
  } catch (e) { return { runs: 0, totalTries: 0, best: null }; }
}
function saveStatsRaw(s) {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) {}
}
function saveStats(tries) {
  const s = loadStats();
  s.runs++;
  s.totalTries += tries;
  if (s.best === null || tries < s.best) s.best = tries;
  saveStatsRaw(s);
}
function resetStats() {
  if (!confirm('누적 통계를 초기화할까요?')) return;
  saveStatsRaw({ runs: 0, totalTries: 0, best: null });
  renderStats();
}
function renderStats() {
  const s = loadStats();
  if (s.runs === 0) { $('stats-card').style.display = 'none'; return; }
  $('stats-card').style.display = 'block';
  $('st-runs').textContent = s.runs.toLocaleString();
  $('st-total-tries').textContent = s.totalTries.toLocaleString();
  $('st-avg').textContent = (s.totalTries / s.runs).toFixed(1);
  $('st-best').textContent = s.best === null ? '-' : s.best.toLocaleString() + '회';
}

/* ═══════════════════════════════════════════════════════════
   토스트 알림
   ═══════════════════════════════════════════════════════════ */
let _toastTimer = null;
function toast(msg) {
  let el = document.getElementById('_toast_el');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast_el';
    el.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
      background:linear-gradient(135deg,#3d3560,#5b4f8a);color:#fff;padding:12px 22px;border-radius:99px;
      font-size:13px;font-weight:800;font-family:'Noto Sans KR',sans-serif;
      box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:99999;opacity:0;pointer-events:none;
      transition:opacity .2s,transform .2s;`;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => {
    el.style.opacity = '1';
    el.style.transform = 'translateX(-50%) translateY(0)';
  });
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2200);
}

/* ═══════════════════════════════════════════════════════════
   다크모드
   ═══════════════════════════════════════════════════════════ */
function toggleDarkMode() {
  const html = document.documentElement;
  const cur = html.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
}
(function () {
  try {
    const saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
})();

/* ═══════════════════════════════════════════════════════════
   초기화

(async () => {
  await loadPets();
  setupPetSearch();

  // URL 파라미터로 펫 자동 선택

  if (petParam && petData[petParam]) selectPet(petParam);
})();
</script>
