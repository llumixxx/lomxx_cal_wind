// 전투 실행
async function runBattle(me, opp) {
  try {
    console.log('[Battle] start', me, opp);
    // me/opp는 { petName, rank, attack, defense, speed, exp, level, nickname } 형식
    const myAtk = me.attack, myDef = me.defense, mySpd = me.speed, myHp = me.exp;
    const oppAtk = opp.attack, oppDef = opp.defense, oppSpd = opp.speed, oppHp = opp.exp;

    if (!myHp || !oppHp || myHp < 1 || oppHp < 1) {
      throw new Error('HP 값이 잘못됨: myHp=' + myHp + ' oppHp=' + oppHp);
    }

    // 각자 펫 이미지 (서로 다를 수 있음)
    const myImg = PET_IMAGES[me.petName];
    const oppImg = PET_IMAGES[opp.petName];
    const myImgHTML = myImg ? `<img src="${myImg}" alt="${me.petName}">` : '<span style="font-size:32px;">🐾</span>';
    const oppImgHTML = oppImg ? `<img src="${oppImg}" alt="${opp.petName}">` : '<span style="font-size:32px;">🐾</span>';

    document.getElementById('battle-arena-area').innerHTML = `
      <div class="battle-arena" id="battle-arena">
        <div class="battle-vs-row">
          <div class="battle-fighter" id="fighter-me">
            <div class="battle-fighter-img" id="my-img">${myImgHTML}</div>
            <div class="battle-fighter-name">${me.nickname} <span class="battle-fighter-rank">${me.rank}위</span></div>
            <div class="battle-fighter-nick">${me.petName} · Lv.${me.level}</div>
            <div class="battle-fighter-stats">⚔${myAtk} 🛡${myDef} 💨${mySpd}</div>
            ${attrText(me.petName) ? `<div class="battle-fighter-attr">${attrText(me.petName)}</div>` : ''}
            <div class="hp-bar-wrap"><div class="hp-bar-fill" id="my-hp-bar" style="width:100%;"></div><div class="hp-text" id="my-hp-text">❤️ ${myHp} / ${myHp}</div></div>
          </div>
          <div class="battle-vs">VS</div>
          <div class="battle-fighter" id="fighter-opp">
            <div class="battle-fighter-img" id="opp-img">${oppImgHTML}</div>
            <div class="battle-fighter-name">${opp.nickname} <span class="battle-fighter-rank">${opp.rank}위</span></div>
            <div class="battle-fighter-nick">${opp.petName} · Lv.${opp.level}</div>
            <div class="battle-fighter-stats">⚔${oppAtk} 🛡${oppDef} 💨${oppSpd}</div>
            ${attrText(opp.petName) ? `<div class="battle-fighter-attr">${attrText(opp.petName)}</div>` : ''}
            <div class="hp-bar-wrap"><div class="hp-bar-fill" id="opp-hp-bar" style="width:100%;"></div><div class="hp-text" id="opp-hp-text">❤️ ${oppHp} / ${oppHp}</div></div>
          </div>
        </div>
        <div class="battle-log" id="battle-log"></div>
      </div>
    `;

    // arena 스크롤
    setTimeout(() => {
      const arena = document.getElementById('battle-arena');
      if (arena) arena.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);

    // 속성 상성 계산
    const myToOppAttr = attrMultiplier(me.petName, opp.petName);
    const oppToMyAttr = attrMultiplier(opp.petName, me.petName);
    console.log('[Battle] attr', myToOppAttr, oppToMyAttr);

    // 초기 HP
    let myCurHp = myHp;
    let oppCurHp = oppHp;
    const logEl = document.getElementById('battle-log');

    function log(text, cls) {
      const line = document.createElement('div');
      line.className = 'battle-log-line' + (cls ? ' ' + cls : '');
      line.innerHTML = text;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateHpBar(who, cur, max) {
      // fighter 내부에서 찾아서 id 충돌 회피
      const fighter = document.getElementById('fighter-' + who);
      const bar = fighter ? fighter.querySelector('.hp-bar-fill') : null;
      const text = fighter ? fighter.querySelector('.hp-text') : null;
      console.log(`[Battle] updateHpBar(${who}, ${cur}, ${max})`, 'fighter:', !!fighter, 'bar:', !!bar, 'text:', !!text);
      if (!bar || !text) {
        console.warn(`[Battle] HP bar element not found! who=${who}`);
        return;
      }
      const pct = Math.max(0, cur) / max * 100;
      bar.style.cssText = `width:${pct}%; transition: width .4s ease, background .3s;`;
      text.textContent = '❤️ ' + Math.max(0, cur) + ' / ' + max;
      bar.classList.remove('medium','low','critical');
      if (pct < 20) bar.classList.add('critical');
      else if (pct < 40) bar.classList.add('low');
      else if (pct < 70) bar.classList.add('medium');
    }

    function showDamagePop(who, dmg, isCrit) {
      try {
        const pop = document.createElement('div');
        pop.className = 'damage-pop' + (isCrit ? ' crit' : '');
        pop.textContent = (isCrit ? 'CRIT! ' : '') + '-' + dmg;
        const imgEl = document.getElementById(who + '-img');
        const arenaEl = document.getElementById('battle-arena');
        if (!imgEl || !arenaEl) return;
        const rect = imgEl.getBoundingClientRect();
        const arenaRect = arenaEl.getBoundingClientRect();
        pop.style.left = (rect.left - arenaRect.left + rect.width / 2 - 20) + 'px';
        pop.style.top = (rect.top - arenaRect.top - 10) + 'px';
        arenaEl.appendChild(pop);
        setTimeout(() => pop.remove(), 1000);
      } catch(e) { console.warn('damagePop err', e); }
    }

    function animateAttack(attacker, defender) {
      const aEl = document.getElementById(attacker + '-img');
      const dEl = document.getElementById(defender + '-img');
      if (aEl) aEl.classList.add('attacking');
      if (dEl) dEl.classList.add('hit');
      setTimeout(() => {
        if (aEl) aEl.classList.remove('attacking');
        if (dEl) dEl.classList.remove('hit');
      }, 400);
    }

    // 시작 로그
    log(`⚔️ <strong>${me.petName}</strong> vs <strong>${opp.petName}</strong> 대결 시작!`, 'win');
    log(`👤 <strong>${me.nickname}</strong>의 ${me.petName} (${me.rank}위) vs <strong>${opp.nickname}</strong>의 ${opp.petName} (${opp.rank}위)`);

    // 속성 정보
    const myAttrStr = attrText(me.petName);
    const oppAttrStr = attrText(opp.petName);
    if (myAttrStr || oppAttrStr) {
      log(`🌐 속성 - ${me.petName}: ${myAttrStr || '없음'} / ${opp.petName}: ${oppAttrStr || '없음'}`);
    }
    if (myToOppAttr.summary) {
      log(`<strong>${me.nickname}</strong> → ${myToOppAttr.summary} (×${myToOppAttr.mult.toFixed(2)})`, myToOppAttr.mult > 1 ? 'crit' : 'lose');
    }
    if (oppToMyAttr.summary) {
      log(`<strong>${opp.nickname}</strong> → ${oppToMyAttr.summary} (×${oppToMyAttr.mult.toFixed(2)})`, oppToMyAttr.mult > 1 ? 'crit' : 'lose');
    }

    // 선공권: 순발 빠른 쪽
    const myFirst = mySpd >= oppSpd;
    if (mySpd === oppSpd) {
      log(`⚡ 순발 동률 (${mySpd}) - 운으로 선공 결정!`);
    } else {
      log(`⚡ ${myFirst ? me.nickname : opp.nickname}이(가) 더 빨라요! (${myFirst ? mySpd : oppSpd} vs ${myFirst ? oppSpd : mySpd}) 선공권 획득`);
    }

    await sleep(800);
    console.log('[Battle] entering main loop');

    const meObj = { atk: myAtk, def: myDef, spd: mySpd, hp: myHp };
    const oppObj = { atk: oppAtk, def: oppDef, spd: oppSpd, hp: oppHp };

    let turn = 0;
    const MAX_TURNS = 30;
    console.log('[Battle] myFirst:', myFirst, 'mySpd:', mySpd, 'oppSpd:', oppSpd);

    while (myCurHp > 0 && oppCurHp > 0 && turn < MAX_TURNS) {
      turn++;
      // 홀수턴: 선공자가 공격, 짝수턴: 후공자가 공격
      const isOddTurn = (turn % 2 === 1);
      const myTurn = isOddTurn ? myFirst : !myFirst;
      console.log(`[Battle] turn ${turn} - myTurn:${myTurn} myHp:${myCurHp} oppHp:${oppCurHp}`);

      if (myTurn) {
        const { dmg, isCrit } = calcDamage(meObj, oppObj, myToOppAttr.mult);
        oppCurHp = oppCurHp - dmg;
        animateAttack('me', 'opp');
        sfxClick();
        if (isCrit) sfxAch();
        showDamagePop('opp', dmg, isCrit);
        const critTag = isCrit ? '⭐<strong>크리티컬!</strong> ' : '';
        log(`<strong>턴 ${turn}</strong> · ${critTag}${me.nickname}의 공격 → <strong>${dmg}</strong> 데미지 (${opp.nickname} HP ${Math.max(0,oppCurHp)})`, isCrit ? 'crit' : '');
        updateHpBar('opp', oppCurHp, oppHp);
      } else {
        const { dmg, isCrit } = calcDamage(oppObj, meObj, oppToMyAttr.mult);
        myCurHp = myCurHp - dmg;
        animateAttack('opp', 'me');
        sfxClick();
        showDamagePop('me', dmg, isCrit);
        const critTag = isCrit ? '💢<strong>크리티컬!</strong> ' : '';
        log(`<strong>턴 ${turn}</strong> · ${critTag}${opp.nickname}의 공격 → <strong>${dmg}</strong> 데미지 (${me.nickname} HP ${Math.max(0,myCurHp)})`, isCrit ? 'crit' : '');
        updateHpBar('me', myCurHp, myHp);
      }
      await sleep(600);
    }

    await sleep(400);
    console.log('[Battle] ended', { myCurHp, oppCurHp, turn });

    // 결과
    const win = myCurHp > 0 && oppCurHp <= 0;
    const draw = myCurHp > 0 && oppCurHp > 0 && turn >= MAX_TURNS;

    if (draw) {
      log(`⏱️ <strong>${MAX_TURNS}턴 경과! 무승부!</strong>`, 'win');
      showBattleResult('draw', me, opp);
    } else if (win) {
      log(`🏆 <strong>승리! ${opp.nickname}을(를) 꺾었어요!</strong>`, 'win');
      fireConfetti({ count: 100, originY: window.innerHeight / 2 });
      sfxAch();
      setTimeout(() => showBattleResult('win', me, opp), 600);
    } else {
      log(`💔 <strong>패배... ${opp.nickname}이(가) 너무 강했어요</strong>`, 'lose');
      setTimeout(() => showBattleResult('lose', me, opp), 600);
    }
  } catch(err) {
    console.error('[Battle] ERROR', err);
    const logEl = document.getElementById('battle-log');
    if (logEl) {
      const errLine = document.createElement('div');
      errLine.className = 'battle-log-line lose';
      errLine.textContent = '❌ 전투 에러: ' + err.message;
      logEl.appendChild(errLine);
    }
    showToast('❌ 전투 에러: ' + err.message);
  }
}

// 결과 모달
function showBattleResult(kind, me, opp) {
  const isWin = kind === 'win';
  const isDraw = kind === 'draw';
  const emoji = isWin ? '🏆' : isDraw ? '🤝' : '😢';
  const title = isWin ? '승리!' : isDraw ? '무승부' : '패배...';
  const titleClass = isWin ? 'win' : 'lose';

  // 능력치 차이
  const diffs = [
    { label: '⚔️ 공격', val: me.attack - opp.attack },
    { label: '🛡️ 방어', val: me.defense - opp.defense },
    { label: '💨 순발', val: me.speed - opp.speed },
    { label: '❤️ 내구', val: me.exp - opp.exp },
  ];
  const diffHTML = diffs.map(d => {
    const cls = d.val > 0 ? 'plus' : d.val < 0 ? 'minus' : '';
    const sign = d.val > 0 ? '+' : '';
    return `
      <div class="battle-stat-diff-cell">
        <div class="battle-stat-diff-label">${d.label}</div>
        <div class="battle-stat-diff-val ${cls}">${sign}${d.val}</div>
      </div>
    `;
  }).join('');

  let msg;
  if (isWin) {
    msg = `${opp.petName} ${opp.rank}위 <strong>${opp.nickname}</strong>을(를) 꺾었습니다! 🎉`;
  } else if (isDraw) {
    msg = `${opp.nickname}와(과) 호각의 승부였어요!`;
  } else {
    const worst = diffs.reduce((a, b) => a.val < b.val ? a : b);
    msg = `${opp.nickname}이(가) 더 강했어요. <strong>${worst.label}</strong>에서 ${Math.abs(worst.val)}만큼 부족했어요!`;
  }

  document.getElementById('detailModalImg').innerHTML = `<span style="font-size:32px;">${emoji}</span>`;
  document.getElementById('detailModalName').textContent = '전투 결과';
  document.getElementById('detailModalSub').textContent = me.nickname + '(' + me.petName + ') vs ' + opp.nickname + '(' + opp.petName + ')';
  document.getElementById('detailModalBody').innerHTML = `
    <div class="battle-result">
      <div class="battle-result-emoji">${emoji}</div>
      <div class="battle-result-title ${titleClass}">${title}</div>
      <div class="battle-result-msg">${msg}</div>
      <div class="battle-stat-diff">${diffHTML}</div>
    </div>
  `;
  document.getElementById('detailModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

// aliasToMain: { '캐논': '루믹스', '루믹스': '루믹스' } - 모든 닉을 본캐로 정규화
// mainToAliases: { '루믹스': ['캐논'] } - 본캐 → 부캐 목록 (표시용)
let aliasToMain = {};
let mainToAliases = {};

async function loadAliases() {
  try {
    const r = await fetch('aliases.txt?t=' + Date.now()); // 캐시 무시
    if (!r.ok) return false;
    const text = await r.text();
    const newAliasToMain = {};
    const newMainToAliases = {};
    text.split(/\r?\n/).forEach(line => {
      const t = line.trim();
      if (!t || t.startsWith('#')) return;
      const parts = t.split('/').map(s => s.trim()).filter(Boolean);
      if (parts.length < 2) return;
      const main = parts[0];
      const subs = parts.slice(1);
      newAliasToMain[main] = main;
      subs.forEach(sub => { newAliasToMain[sub] = main; });
      newMainToAliases[main] = subs;
    });
    // 이전과 다른지 확인 (변경되면 true 반환 → 강제 리렌더용)
    const changed = JSON.stringify(aliasToMain) !== JSON.stringify(newAliasToMain);
    aliasToMain = newAliasToMain;
    mainToAliases = newMainToAliases;
    return changed;
  } catch(e) {
    console.warn('aliases.txt 로드 실패 (무시):', e);
    return false;
  }
}

async function loadData() {
  try {
    const r = await fetch('pet_ranking_data.json');
    if (!r.ok) {
      throw new Error(`HTTP ${r.status} ${r.statusText}`);
    }
    const allData = await r.json();
    if (!allData || allData.length === 0) {
      throw new Error('JSON이 비어있음');
    }
      const newData = allData[allData.length - 1];
      // 새 데이터인지 확인
      const isNew = newData.timestamp !== lastTimestamp;
      if (!isNew) return; // 변경 없으면 스킵
      lastTimestamp = newData.timestamp;

      // deep copy + 프로돈 주입
      latestData = JSON.parse(JSON.stringify(newData));
      // 프로돈: JSON에 없거나, 있어도 일반랭킹이 비어있으면 하드코딩 사용
      const prodonIdx = latestData.pets.findIndex(p => p.name === "프로돈");
      if (prodonIdx === -1) {
        latestData.pets.push(PRODON_DATA);
      } else if (!latestData.pets[prodonIdx].general_ranking || latestData.pets[prodonIdx].general_ranking.length === 0) {
        latestData.pets[prodonIdx] = PRODON_DATA;
      }
      // 베노노크: JSON에 없거나, 있어도 일반랭킹이 비어있으면 하드코딩 사용
      const benonokIdx = latestData.pets.findIndex(p => p.name === "베노노크");
      if (benonokIdx === -1) {
        latestData.pets.push(BENONOK_DATA);
      } else if (!latestData.pets[benonokIdx].general_ranking || latestData.pets[benonokIdx].general_ranking.length === 0) {
        latestData.pets[benonokIdx] = BENONOK_DATA;
      }

      const dt = new Date(latestData.timestamp);
      document.getElementById('updateTime').textContent =
        `마지막 업데이트: ${dt.toLocaleString('ko-KR')}`;
      document.getElementById('updateNotice').textContent =
        `총 ${latestData.pets.length}마리 펫 랭킹 로드 완료`;

      renderAllUserTabs(latestData.pets);
      renderPetRanking(latestData.pets);
      renderFortunePet(latestData.pets);
      renderChangesBanner(latestData.pets);
      renderBattleWidget(latestData.pets);

      // 인트로 스플래시 숨기기 (첫 로드 시)
      const splash = document.getElementById('intro-splash');
      if (splash && !splash.classList.contains('hide')) {
        setTimeout(() => splash.classList.add('hide'), 400);
      }
  } catch(e) {
    console.error('loadData 에러:', e);
    document.getElementById('updateTime').textContent = '데이터를 불러올 수 없습니다.';
    document.getElementById('updateNotice').textContent = '에러: ' + (e.message || e);
  }
}

// ── Dense 등수 계산 (1,1,2,2,3 방식) ──
// 동점이면 같은 등수, 그 다음은 +1 (건너뜀 없음)
function denseRank(arr, getScore) {
  if (!arr || arr.length === 0) return [];
  const result = [];
  let rank = 1;
  for (let i = 0; i < arr.length; i++) {
    if (i > 0 && getScore(arr[i]) !== getScore(arr[i-1])) rank++;
    result.push({ ...arr[i], displayRank: rank });
  }
  return result;
}

// ── 유저 집계 ──
// aliases.txt 로 본캐/부캐를 묶어서 합산. 본캐로 정규화한 키를 사용하고,
// 어떤 부캐 닉으로 등록되었는지(usedSubs)도 추적해 표시에 사용.
function buildUserStats(pets) {
  const userMap = {};
  pets.forEach(pet => {
    // 일반/환생 각각 처리
    const sections = [
      { list: pet.general_ranking || [], type: 'general' },
      { list: pet.rebirth_ranking || [], type: 'rebirth' }
    ];
    sections.forEach(({ list, type }) => {
      // 이 펫에서의 등수 계산 (dense)
      const ranked = denseRank(list, r => parseFloat(r.score));
      ranked.forEach(r => {
        if (!r.nickname) return;
        // 본캐로 정규화 (매핑 없으면 자기 자신)
        const mainName = aliasToMain[r.nickname] || r.nickname;
        if (!userMap[mainName]) userMap[mainName] = {
          total: 0, first: 0, top3: 0, pets: [], usedSubs: new Set()
        };
        // 사용된 부캐 닉 추적 (본캐와 다를 때만)
        if (r.nickname !== mainName) userMap[mainName].usedSubs.add(r.nickname);
        userMap[mainName].total++;
        if (r.displayRank === 1) userMap[mainName].first++;
        if (r.displayRank <= 3) userMap[mainName].top3++;
        userMap[mainName].pets.push({
          petName: pet.name,
          type,
          rank: r.displayRank,
          score: r.score,
          level: r.level,
          attack: r.attack,
          defense: r.defense,
          speed: r.speed,
          exp: r.exp,
          nickname: r.nickname // 어떤 닉으로 올린건지 보존
        });
      });
    });
  });
  // Set → Array 로 변환
  Object.values(userMap).forEach(u => { u.usedSubs = [...u.usedSubs]; });
  return userMap;
}

// ── 전체 데이터 저장소 ──
const gridDataStore = {};

// ── 그리드 렌더 공통 함수 ──
function renderGridContent(container, sorted, detailPrefix, filterFn, isExpanded) {
  const makeCard = (u, i, pfx) => {
    const fu = filterFn ? { ...u, pets: u.pets.filter(filterFn) } : u;
    return makeUserCard(fu, u.displayRank, `${pfx}-${i}`, pfx);
  };

  const top10 = sorted.filter(u => u.displayRank <= 10);
  const rest   = isExpanded ? sorted.filter(u => u.displayRank > 10) : [];

  // TOP10: 화려한 그리드
  let html = '<div class="top10-grid">' + top10.map((u, i) => makeCard(u, i, detailPrefix)).join('') + '</div>';

  // 11위+: 심플 리스트
  if (rest.length > 0) {
    html += '<div class="rest-list">' + rest.map((u, i) => makeCard(u, i, detailPrefix+'r')).join('') + '</div>';
  }

  container.innerHTML = html || '<div class="empty-state">데이터 없음</div>';
}

// ── 유저 그리드 렌더 (공통) ──
function renderUserGrid(sorted, gridId, storeKey, moreBtnId, detailPrefix, filterFn) {
  gridDataStore[storeKey] = { sorted, detailPrefix, filterFn };

  const container = document.getElementById(gridId);
  renderGridContent(container, sorted, detailPrefix, filterFn, false);

  const rest = sorted.filter(u => u.displayRank > 10);
  const moreBtn = document.getElementById(moreBtnId);
  if (rest.length > 0) {
    moreBtn.style.display = 'inline-block';
    moreBtn.textContent = `전체보기 (${rest.length}명 더) ▼`;
    moreBtn._expanded = false;
  } else {
    moreBtn.style.display = 'none';
  }
}

// ── 전체보기 펼치기 / 접기 ──
function expandGrid(gridId, storeKey, moreBtnId) {
  const btn = document.getElementById(moreBtnId);
  const store = gridDataStore[storeKey];
  if (!store) return;
  const { sorted, detailPrefix, filterFn } = store;
  const container = document.getElementById(gridId);
  const rest = sorted.filter(u => u.displayRank > 10);

  if (btn._expanded) {
    renderGridContent(container, sorted, detailPrefix, filterFn, false);
    btn.textContent = `전체보기 (${rest.length}명 더) ▼`;
    btn._expanded = false;
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    renderGridContent(container, sorted, detailPrefix, filterFn, true);
    btn.textContent = '접기 ▲';
    btn._expanded = true;
  }
}

// ── 닉네임 인라인 필터 ──
function filterGrid(gridId, storeKey, q) {
  const store = gridDataStore[storeKey];
  if (!store) return;
  const { sorted, detailPrefix, filterFn } = store;
  const keyword = q.trim().toLowerCase();
  const container = document.getElementById(gridId);

  if (!keyword) {
    // 검색어 없으면 원래 상태로 (top10 / 전체 중 현재 상태 유지)
    const moreBtnId = gridId.replace('Grid', 'MoreBtn');
    const btn = document.getElementById(moreBtnId);
    const isExpanded = btn && btn._expanded;
    renderGridContent(container, sorted, detailPrefix, filterFn, isExpanded);
    return;
  }

  // 매칭 유저만 표시 (등수는 전체 기준 유지)
  // 본캐 이름 또는 부캐 이름 어느 쪽으로 검색해도 매칭
  const matched = sorted.filter(u => {
    if (u.name.toLowerCase().includes(keyword)) return true;
    if (u.usedSubs && u.usedSubs.some(s => s.toLowerCase().includes(keyword))) return true;
    return false;
  });
  if (matched.length === 0) {
    container.innerHTML = `<div class="empty-state">"${q}"와 일치하는 유저가 없습니다.</div>`;
    return;
  }
  // 검색 결과는 전체 표시 (TOP10 + rest 구분 없이 top10-grid)
  const makeCard = (u, i) => {
    const fu = filterFn ? { ...u, pets: u.pets.filter(filterFn) } : u;
    return makeUserCard(fu, u.displayRank, `flt-${gridId}-${i}`, 'flt');
  };
  container.innerHTML = `<div style="font-size:12px;color:var(--t3);margin-bottom:10px;">"${q}" 검색결과 ${matched.length}명</div>
    <div class="top10-grid">${matched.map((u, i) => makeCard(u, i)).join('')}</div>`;
}

// ── 세 탭 모두 렌더 ──
function renderAllUserTabs(pets) {
  const userMap = buildUserStats(pets);

  // 점수 변화 추적: 이전 카리스마 → 캐시 → 새로 저장
  const prevScores = getPrevUserScores();
  window._prevScoresCache = prevScores;
  const newScores = {};
  Object.entries(userMap).forEach(([name, d]) => {
    newScores[name] = calcCharisma(d);
  });
  // 다음 비교를 위해 저장
  savePrevUserScores(newScores);

  // 전체 랭킹: total 많은순 → 동률시 first 많은순 → 동률시 top3 많은순
  const totalSorted = Object.entries(userMap)
    .map(([name, d]) => ({ name, ...d }))
    .sort((a, b) =>
      b.total !== a.total ? b.total - a.total :
      b.first !== a.first ? b.first - a.first :
      b.top3 - a.top3
    );
  // 등수 부여: [total, first, top3] 세 값이 모두 같을 때만 동률
  const totalRanked = denseRankMulti(totalSorted, u => [u.total, u.first, u.top3]);
  renderUserGrid(totalRanked, 'userGrid', 'userGrid', 'userMoreBtn', 'u', null);
  registerSlotData('userGrid', totalRanked);

  // 1등 펫 보유 랭킹: first 많은순 → 동률시 total 많은순 → top3 많은순
  const firstSorted = Object.entries(userMap)
    .map(([name, d]) => ({ name, ...d }))
    .filter(u => u.first > 0)
    .sort((a, b) =>
      b.first !== a.first ? b.first - a.first :
      b.total !== a.total ? b.total - a.total :
      b.top3 - a.top3
    );
  const firstRanked = denseRankMulti(firstSorted, u => [u.first, u.total, u.top3]);
  renderUserGrid(firstRanked, 'firstGrid', 'firstGrid', 'firstMoreBtn', 'f',
    p => p.rank === 1);
  registerSlotData('firstGrid', firstRanked);

  // TOP3 펫 보유 랭킹: top3 많은순 → 동률시 first 많은순 → total 많은순
  const top3Sorted = Object.entries(userMap)
    .map(([name, d]) => ({ name, ...d }))
    .filter(u => u.top3 > 0)
    .sort((a, b) =>
      b.top3 !== a.top3 ? b.top3 - a.top3 :
      b.first !== a.first ? b.first - a.first :
      b.total - a.total
    );
  const top3Ranked = denseRankMulti(top3Sorted, u => [u.top3, u.first, u.total]);
  renderUserGrid(top3Ranked, 'top3Grid', 'top3Grid', 'top3MoreBtn', 't',
    p => p.rank <= 3);
  registerSlotData('top3Grid', top3Ranked);

  // 1위 유저 첫 진입 시 폭죽
  if (!window._heroConfettiFired && totalRanked.length > 0) {
    window._heroConfettiFired = true;
    setTimeout(() => {
      // 1위 카드 위치 잡기
      const heroCard = document.querySelector('.user-card.rank-hero');
      if (heroCard) {
        const rect = heroCard.getBoundingClientRect();
        fireConfetti({
          count: 100,
          originX: rect.left + rect.width / 2,
          originY: rect.top + rect.height / 2,
          up: true,
        });
        // 1위 유저 도전과제 알림
        const topUser = totalRanked[0];
        if (topUser) {
          setTimeout(() => {
            showAchievement('👑', '오늘의 챔피언', `${topUser.name}님이 전체 1위 차지!`);
          }, 800);
        }
      }
    }, 600);
  }
}

// 다중 기준 dense rank (배열의 모든 값이 같아야 동률)
function denseRankMulti(arr, getScores) {
  if (!arr || arr.length === 0) return [];
  const result = [];
  let rank = 1;
  for (let i = 0; i < arr.length; i++) {
    if (i > 0) {
      const sa = getScores(arr[i]), sb = getScores(arr[i-1]);
      if (sa.some((v, j) => v !== sb[j])) rank++;
    }
    result.push({ ...arr[i], displayRank: rank });
  }
  return result;
}

// ── 펫별 랭킹 렌더 ──
function makeRankItemHTML(r) {
  const rClass = r.displayRank <= 3 ? `rank-${r.displayRank}` : '';
  return `<div class="ranking-item">
    <div class="rank-badge ${rClass}">${r.displayRank}</div>
    <div class="rank-info">
      <div class="rank-nick">${r.nickname}</div>
      <div class="rank-score">점수: ${r.score}</div>
      <div class="rank-stats">
        <span class="stat-chip stat-lv">Lv.${r.level}</span>
        <span class="stat-chip stat-exp">내구 ${r.exp}</span>
        <span class="stat-chip stat-atk">공격 ${r.attack}</span>
        <span class="stat-chip stat-def">방어 ${r.defense}</span>
        <span class="stat-chip stat-agi">순발 ${r.speed}</span>
      </div>
    </div>
  </div>`;
}

// ── 펫 데이터 캐시 (온디맨드 렌더용) ──
let _allPetsData = [];

function renderPetRanking(pets) {
  _allPetsData = pets; // 전역 캐시에만 저장, DOM 렌더링 없음
  // 검색 입력 이벤트 등록
  const si = document.getElementById('petSearch');
  if (si) {
    si.oninput = e => {
      const q = e.target.value.trim();
      if (q.length === 0) {
        showPetHint();
      } else {
        searchAndRenderPets(q);
      }
    };
  }
}

function showPetHint() {
  document.getElementById('petContainer').innerHTML = `
    <div class="pet-search-hint">
      🔍 펫 이름을 검색하거나<br>
      <strong>🎲 랜덤 펫</strong> 버튼을 눌러 랜덤으로 확인해 보세요!
    </div>`;
}

function makePetCardHTML(pet) {
  const general = denseRank(pet.general_ranking || [], r => parseFloat(r.score));
  const rebirth  = denseRank(pet.rebirth_ranking || [], r => parseFloat(r.score));
  const makeItems = (list, cid) => {
    const top10 = list.slice(0, 10), rest = list.slice(10);
    let h = top10.map(makeRankItemHTML).join('');
    if (rest.length > 0) {
      const eid = `extra-${cid}`, bid = `btn-${cid}`;
      h += `<div id="${eid}" style="display:none;flex-direction:column;gap:6px;">${rest.map(makeRankItemHTML).join('')}</div>
        <button class="view-more-btn" id="${bid}" onclick="togglePetExtra('${eid}','${bid}',${rest.length})">전체보기 (${rest.length}명 더) ▼</button>`;
    }
    return h;
  };
  const sid = pet.name.replace(/[^a-zA-Z0-9가-힣]/g,'_');
  const genHTML = general.length > 0 ? makeItems(general, `gen-${sid}`) : '<div class="empty-state">랭킹 데이터 없음</div>';
  const rebHTML = rebirth.length > 0 ? makeItems(rebirth, `reb-${sid}`) : '';
  return `<div class="pet-card" data-pet="${pet.name}">
    <div class="pet-card-header">
      <div class="pet-img-box">${getPetImg(pet.name)}</div>
      <div>
        <div class="pet-card-name">${pet.name}</div>
        <div class="pet-card-sub">일반 ${general.length}명 · 환생 ${rebirth.length}명</div>
      </div>
    </div>
    <div class="ranking-section">
      <div class="ranking-section-title">일반 랭킹</div>
      <div class="ranking-list">${genHTML}</div>
    </div>
    ${rebirth.length > 0 ? `<div class="ranking-section">
      <div class="ranking-section-title">환생 랭킹</div>
      <div class="ranking-list">${rebHTML}</div>
    </div>` : ''}
  </div>`;
}

let _sTimer = null;
function searchAndRenderPets(q) {
  if (_sTimer) clearTimeout(_sTimer);
  _sTimer = setTimeout(() => {
    const lower = q.toLowerCase();
    const matched = _allPetsData.filter(p => p.name.toLowerCase().includes(lower));
    const container = document.getElementById('petContainer');
    if (matched.length === 0) {
      container.innerHTML = `<div class="pet-search-hint">"${q}"와 일치하는 펫이 없습니다 🔍</div>`;
      return;
    }
    container.innerHTML = matched.map(makePetCardHTML).join('');
  }, 120);
}

function showRandomPet() {
  if (_allPetsData.length === 0) return;
  const btn = document.getElementById('randomBtn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 400);

  // 랭킹 데이터 있는 펫 중에서 랜덤
  const withData = _allPetsData.filter(p => (p.general_ranking||[]).length > 0 || (p.rebirth_ranking||[]).length > 0);
  const pet = withData[Math.floor(Math.random() * withData.length)];
  if (!pet) return;

  // 검색창에 이름 표시
  const si = document.getElementById('petSearch');
  if (si) si.value = pet.name;

  document.getElementById('petContainer').innerHTML = makePetCardHTML(pet);
}


function togglePetExtra(extraId, btnId, count) {
  const el = document.getElementById(extraId);
  const btn = document.getElementById(btnId);
  if (el.style.display === 'none') {
    el.style.display = 'flex';
    btn.textContent = '접기 ▲';
  } else {
    el.style.display = 'none';
    btn.textContent = `전체보기 (${count}명 더) ▼`;
  }
}

// ── Tab ──
function switchTab(id, btn) {
  sfxTab();
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// ── Dark Mode ──
function toggleDark(){
  const h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  localStorage.setItem('wind-dark', h.getAttribute('data-theme'));
}
(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('wind-dark') || 'light'); })();

// ── Init ──
// 사운드 토글 초기 상태
(function initSoundBtn() {
  const btn = document.getElementById('sound-toggle');
  if (btn) {
    btn.textContent = _soundOn ? '🔊' : '🔇';
    btn.classList.toggle('muted', !_soundOn);
  }
})();

(async () => {
  await loadPetImages();
  await loadAliases();      // 본캐/부캐 매핑 먼저 로드
  await loadData();
  // 15초마다 데이터 새로고침. aliases.txt도 같이 다시 읽어서 변경사항 반영
  setInterval(async () => {
    const aliasesChanged = await loadAliases();
    if (aliasesChanged) lastTimestamp = null; // 강제 리렌더
    await loadData();
  }, 15000);

  // 안전망: 5초 후에도 인트로 안 사라지면 강제
  setTimeout(() => {
    const splash = document.getElementById('intro-splash');
    if (splash) splash.classList.add('hide');
  }, 5000);
})();

// URL 파라미터로 특정 펫 바로 열기 (pokedex에서 넘어온 경우)
(function() {
  const params = new URLSearchParams(window.location.search);
  const petName = params.get('pet');
  if (petName) {
    // 데이터 로드 후 펫별 랭킹 탭으로 이동 + 검색어 설정
    const waitAndJump = setInterval(() => {
      const petCards = document.querySelectorAll('[data-pet]');
      if (petCards.length > 0) {
        clearInterval(waitAndJump);
        // 펫별 랭킹 탭으로 전환
        const petTabBtn = document.querySelector('.tab-btn:last-child');
        switchTab('pet-tab', petTabBtn);
        // 검색어 설정
        const searchInput = document.getElementById('petSearch');
        if (searchInput) {
          searchInput.value = petName;
          applySearch(petName);
        }
        // 해당 펫 카드로 스크롤
        setTimeout(() => {
          const target = document.querySelector(`[data-pet="${petName}"]`);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
      }
    }, 300);
  }
})();

</script>
