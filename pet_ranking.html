<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>WIND 펫 랭킹 🏆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#faf9ff; --bg2:#f3f0ff; --white:#ffffff;
      --s1:#f8f7ff; --s2:#f0eeff;
      --border:#e8e3ff; --border2:#d4cbff;
      --a1:#9b87f5; --a2:#f587b8; --a3:#87d4f5; --a4:#f5c887; --a5:#87f5c0;
      --t1:#3d3560; --t2:#7b72a8; --t3:#b0a8d4; --t4:#d4cff0;
      --ok:#6dd5a0; --err:#f57878;
      --shadow:0 4px 24px rgba(155,135,245,0.10);
      --shadow2:0 8px 32px rgba(155,135,245,0.18);
      --shadow3:0 20px 60px rgba(155,135,245,0.26);
    }
    [data-theme="dark"] {
      --bg:#13121f; --bg2:#1c1b2e; --white:#1f1e33;
      --s1:#27263e; --s2:#312f4c;
      --border:#3a3860; --border2:#4e4c7a;
      --a1:#a896ff; --a2:#ff8fc4; --a3:#7ed8ff; --a4:#ffd080; --a5:#80ffcc;
      --t1:#e4e2ff; --t2:#b0aedd; --t3:#7a78a8; --t4:#4e4c72;
      --ok:#6dd5a0; --err:#ff7070;
      --shadow:0 4px 24px rgba(0,0,0,0.5);
      --shadow2:0 8px 32px rgba(0,0,0,0.6);
      --shadow3:0 20px 60px rgba(0,0,0,0.7);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--t1); min-height:100vh;
      background-image:
        radial-gradient(ellipse at 20% 0%,rgba(155,135,245,0.10) 0%,transparent 50%),
        radial-gradient(ellipse at 80% 5%,rgba(245,135,184,0.08) 0%,transparent 45%),
        radial-gradient(ellipse at 50% 100%,rgba(135,212,245,0.06) 0%,transparent 50%);
    }

    /* Float Buttons */
    .float-btns { position:fixed; top:14px; right:14px; display:flex; flex-direction:column; align-items:center; gap:7px; z-index:9999; }
    .dark-toggle {
      width:38px; height:38px; border-radius:50%; border:2px solid var(--border2);
      background:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 10px rgba(155,135,245,.18); font-size:1.1rem;
      transition:transform .35s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s;
    }
    .dark-toggle:hover { transform:scale(1.18) rotate(22deg); border-color:var(--a1); box-shadow:0 4px 16px rgba(155,135,245,.4); }
    .dark-toggle:active { transform:scale(.88) rotate(-15deg); }
    [data-theme="dark"] .dark-toggle { background:#27263e; border-color:#4e4c7a; }
    [data-theme="dark"] .dark-toggle:hover { border-color:var(--a1); }
    [data-theme="dark"] .toggle-moon { display:inline!important; }
    [data-theme="dark"] .toggle-sun  { display:none!important; }
    [data-theme="light"] .toggle-moon { display:none!important; }
    [data-theme="light"] .toggle-sun  { display:inline!important; }
    .chat-float-btn {
      width:38px; height:38px; border-radius:50%; border:2px solid var(--border2);
      background:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 10px rgba(155,135,245,.18); font-size:1rem; text-decoration:none;
      transition:transform .35s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s;
    }
    .chat-float-btn:hover { transform:scale(1.18) rotate(-22deg); border-color:var(--a2); box-shadow:0 4px 16px rgba(245,135,184,.4); }
    .chat-float-btn:active { transform:scale(.88) rotate(15deg); }
    [data-theme="dark"] .chat-float-btn { background:#27263e; border-color:#4e4c7a; }
    [data-theme="dark"] .chat-float-btn:hover { border-color:var(--a2); }

    /* Header */
    .page-header { background:var(--white); border-bottom:1.5px solid var(--border); padding:0; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); }
    [data-theme="dark"] .page-header { background:#1a1930; border-color:#3a3860; }
    .header-inner { max-width:1280px; margin:0 auto; padding:14px 20px 12px; text-align:center; }
    .header-title-row {
      display:inline-flex; align-items:center; gap:8px; margin-bottom:10px;
      font-family:'Nunito',sans-serif; font-weight:900; font-size:22px;
      background:linear-gradient(135deg,var(--a1),var(--a2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .page-nav { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
    .pnav-tab {
      text-decoration:none; background:var(--s1); border:1.5px solid var(--border2);
      border-radius:99px; padding:6px 14px; font-size:12px; font-weight:700;
      color:var(--t2); transition:all .15s; font-family:'Noto Sans KR',sans-serif;
    }
    .pnav-tab:hover { background:var(--s2); color:var(--a1); border-color:var(--a1); }
    .pnav-active { background:linear-gradient(135deg,var(--s2),#ffeef6); color:var(--a1); border-color:var(--a1); font-weight:800; }
    [data-theme="dark"] .pnav-tab { background:#27263e; color:#b0aedd; border-color:#3a3860; }
    [data-theme="dark"] .pnav-tab:hover { color:var(--a1); border-color:var(--a1); background:#312f4c; }
    [data-theme="dark"] .pnav-active { background:linear-gradient(135deg,#312f4c,#3a2a50); color:var(--a1); border-color:var(--a1); }

    .main-wrap { max-width:1280px; margin:0 auto; padding:28px 16px 80px; }

    /* Hero */
    .page-hero { text-align:center; padding:20px 0 26px; }
    .hero-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:linear-gradient(135deg,#f0eeff,#ffeef6); border:1.5px solid var(--border2);
      border-radius:99px; padding:5px 16px; font-size:11px; font-weight:800;
      font-family:'Nunito',sans-serif; color:var(--a1); letter-spacing:1px;
      margin-bottom:14px; box-shadow:0 2px 12px rgba(155,135,245,0.12);
    }
    [data-theme="dark"] .hero-badge { background:linear-gradient(135deg,#27263e,#312f4c); border-color:#4e4c7a; }
    .hero-badge-dot { width:6px; height:6px; background:var(--a2); border-radius:50%; animation:pulse 2s infinite; }
    .hero-title {
      font-family:'Nunito',sans-serif; font-size:38px; font-weight:900; letter-spacing:-1px;
      background:linear-gradient(135deg,var(--a1) 0%,var(--a2) 50%,var(--a4) 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:8px;
    }
    .hero-sub { font-size:12px; color:var(--t3); font-family:'Nunito',sans-serif; font-weight:600; }
    .hero-deco { display:flex; justify-content:center; gap:6px; margin-top:14px; }
    .hero-deco-dot { width:7px; height:7px; border-radius:50%; animation:bounce-dot 1.6s ease-in-out infinite; }
    .hero-deco-dot:nth-child(2){animation-delay:.2s;} .hero-deco-dot:nth-child(3){animation-delay:.4s;}
    .hero-deco-dot:nth-child(4){animation-delay:.6s;} .hero-deco-dot:nth-child(5){animation-delay:.8s;}
    @keyframes bounce-dot { 0%,80%,100%{transform:scale(.85);opacity:.5} 40%{transform:scale(1.4);opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(2)} }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(24px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

    /* 그라데이션 흐름 애니메이션 (TOP10 카드용) */
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Update Notice */
    .update-notice {
      background:var(--white); border:1.5px solid var(--border); border-radius:14px;
      padding:12px 18px; font-size:12px; color:var(--t3); margin-bottom:22px;
      display:flex; align-items:center; gap:10px; box-shadow:var(--shadow);
    }
    [data-theme="dark"] .update-notice { background:#1f1e33; border-color:#3a3860; }
    .update-dot { width:8px; height:8px; background:var(--ok); border-radius:50%; flex-shrink:0; animation:pulse 2s infinite; }

    /* Tabs */
    .tabs-row { display:flex; gap:4px; margin-bottom:24px; border-bottom:2px solid var(--border); overflow-x:auto; padding-bottom:0; }
    [data-theme="dark"] .tabs-row { border-color:#3a3860; }
    .tab-btn {
      padding:10px 18px; border:none; background:transparent; color:var(--t2);
      font-weight:700; font-size:13px; font-family:'Noto Sans KR',sans-serif;
      cursor:pointer; transition:all .2s; white-space:nowrap;
      border-bottom:2.5px solid transparent; margin-bottom:-2px; border-radius:8px 8px 0 0;
    }
    .tab-btn:hover { color:var(--a1); background:var(--s1); }
    .tab-btn.active { color:var(--a1); border-bottom-color:var(--a1); background:var(--s1); font-weight:800; }
    [data-theme="dark"] .tab-btn { color:#7a78a8; }
    [data-theme="dark"] .tab-btn:hover { background:#27263e; color:var(--a1); }
    [data-theme="dark"] .tab-btn.active { background:#27263e; color:var(--a1); border-bottom-color:var(--a1); }
    .tab-content { display:none; }
    .tab-content.active { display:block; animation:fadeInUp .3s ease; }

    /* Nick / Pet Search */
    .nick-search-wrap, .search-wrap {
      display:flex; align-items:center; gap:8px; background:var(--white);
      border:1.5px solid var(--border2); border-radius:12px; padding:10px 16px;
      max-width:400px; margin-bottom:20px; box-shadow:var(--shadow);
      transition:border-color .2s, box-shadow .2s;
    }
    .nick-search-wrap:focus-within, .search-wrap:focus-within {
      border-color:var(--a1); box-shadow:0 0 0 3px rgba(155,135,245,.10);
    }
    .nick-search-wrap span, .search-wrap span { font-size:14px; color:var(--t3); flex-shrink:0; }
    .nick-search-wrap input, .search-wrap input {
      border:none; background:transparent; color:var(--t1);
      font-size:13px; font-family:'Noto Sans KR',sans-serif; flex:1; outline:none;
    }
    .nick-search-wrap input::placeholder, .search-wrap input::placeholder { color:var(--t4); }
    [data-theme="dark"] .nick-search-wrap,[data-theme="dark"] .search-wrap { background:#1f1e33; border-color:#3a3860; }
    [data-theme="dark"] .nick-search-wrap input,[data-theme="dark"] .search-wrap input { color:#e4e2ff; }

    /* ══════ TOP10 그리드 ══════ */
    .top10-grid {
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:16px; margin-bottom:20px;
    }
    @media(max-width:900px) { .top10-grid { grid-template-columns:repeat(2,1fr); } }
    @media(max-width:560px) { .top10-grid { grid-template-columns:1fr; } }

    /* 공통 카드 */
    .user-card {
      border-radius:20px; padding:22px;
      transition:transform .22s ease, box-shadow .22s ease;
      position:relative; overflow:hidden;
    }
    .user-card:hover { transform:translateY(-5px); box-shadow:var(--shadow3); }

    /* ── 1위: 금색 흐르는 그라데이션 ── */
    .user-card.rank-hero {
      grid-column:1 / -1;
      background:linear-gradient(270deg,#fff8d0,#fffbe8,#ffefc8,#fff8d0);
      background-size:400% 400%;
      animation:gradientShift 5s ease infinite;
      border:2px solid #d9a010;
      box-shadow:0 6px 28px rgba(217,160,16,0.22);
    }
    [data-theme="dark"] .user-card.rank-hero {
      background:linear-gradient(270deg,#2e2408,#3c2e0a,#281e06,#2e2408);
      background-size:400% 400%;
      animation:gradientShift 5s ease infinite;
      border-color:#a07818;
      box-shadow:0 6px 28px rgba(160,120,24,0.35);
    }

    /* ── 2위: 밝은 은색 ── */
    .user-card.rank-silver {
      background:linear-gradient(270deg,#eef0ff,#dde2f8,#e8ecff,#d8dff5);
      background-size:400% 400%;
      animation:gradientShift 6s ease infinite;
      border:2.5px solid #7080d0;
      box-shadow:0 6px 24px rgba(100,120,220,0.28);
    }
    [data-theme="dark"] .user-card.rank-silver {
      background:linear-gradient(270deg,#1e2248,#252c5a,#192040,#1e2248);
      background-size:400% 400%;
      animation:gradientShift 6s ease infinite;
      border-color:#6878d8;
      box-shadow:0 6px 28px rgba(100,120,220,0.5);
    }

    /* ── 3위: 차분한 브론즈 ── */
    .user-card.rank-bronze {
      background:linear-gradient(270deg,#fdf6f0,#f8ece0,#fdf2e8,#f5e8d8);
      background-size:400% 400%;
      animation:gradientShift 7s ease infinite;
      border:1.5px solid #c89060;
      box-shadow:0 3px 14px rgba(184,130,80,0.14);
    }
    [data-theme="dark"] .user-card.rank-bronze {
      background:linear-gradient(270deg,#221608,#2c1c08,#1c1206,#221608);
      background-size:400% 400%;
      animation:gradientShift 7s ease infinite;
      border-color:#7a5028;
      box-shadow:0 3px 16px rgba(120,80,40,0.28);
    }

    /* ── 4~10위: 은은한 보라 흐름 ── */
    .user-card.rank-top10 {
      background:linear-gradient(270deg,#faf9ff,#f4f2ff,#fdf9ff,#f0eeff);
      background-size:400% 400%;
      animation:gradientShift 8s ease infinite;
      border:1.5px solid var(--border2);
      box-shadow:var(--shadow);
    }
    [data-theme="dark"] .user-card.rank-top10 {
      background:linear-gradient(270deg,#1f1e33,#27263e,#1c1b2e,#27263e);
      background-size:400% 400%;
      animation:gradientShift 8s ease infinite;
      border-color:#4e4c7a;
    }

    /* 카드 꾸밈 - 오른쪽 위 별 + 도트 */
    .user-card::before {
      content:'✦';
      position:absolute; top:14px; right:16px;
      font-size:22px; opacity:.12; pointer-events:none;
      line-height:1;
    }
    .user-card::after {
      content:'·';
      position:absolute; top:34px; right:14px;
      font-size:28px; opacity:.10; pointer-events:none;
      line-height:1;
    }
    .user-card.rank-hero::before   { color:#d9a010; opacity:.22; font-size:28px; }
    .user-card.rank-hero::after    { color:#d9a010; opacity:.14; }
    .user-card.rank-silver::before { color:#4060c0; opacity:.22; }
    .user-card.rank-silver::after  { color:#4060c0; opacity:.12; }
    .user-card.rank-bronze::before { color:#b07040; opacity:.16; }
    .user-card.rank-bronze::after  { color:#b07040; opacity:.10; }

    /* 카드 내용 */
    .rank-label-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .rank-num-badge {
      font-family:'Nunito',sans-serif; font-weight:900; font-size:12px;
      padding:3px 10px; border-radius:99px; letter-spacing:.5px;
    }
    .rank-num-badge.gold   { background:rgba(217,160,16,.18); color:#a07010; border:1.5px solid rgba(217,160,16,.4); }
    .rank-num-badge.silver { background:rgba(100,120,220,.18); color:#4060c0; border:1.5px solid rgba(100,120,220,.45); }
    .rank-num-badge.bronze { background:rgba(184,112,48,.18);  color:#906020; border:1.5px solid rgba(184,112,48,.4); }
    .rank-num-badge.normal { background:var(--s2); color:var(--a1); border:1.5px solid var(--border2); }
    [data-theme="dark"] .rank-num-badge.gold   { background:rgba(217,160,16,.22); color:#d4a820; border-color:rgba(217,160,16,.45); }
    [data-theme="dark"] .rank-num-badge.silver { background:rgba(100,120,230,.28); color:#8cacff; border-color:rgba(100,120,230,.55); }
    [data-theme="dark"] .rank-num-badge.bronze { background:rgba(184,112,48,.22); color:#d08040; border-color:rgba(184,112,48,.45); }
    [data-theme="dark"] .rank-num-badge.normal { background:#312f4c; color:var(--a1); border-color:#4e4c7a; }
    .rank-emoji { font-size:20px; line-height:1; }
    .rank-comment {
      font-size:11px; font-weight:700; color:var(--t3);
      font-family:'Nunito',sans-serif; letter-spacing:.3px;
      margin-bottom:8px; margin-top:-2px;
    }
    .user-card.rank-hero .rank-comment   { color:#b08010; }
    .user-card.rank-silver .rank-comment { color:#4060b0; }
    .user-card.rank-bronze .rank-comment { color:#9a6840; }
    [data-theme="dark"] .user-card.rank-hero .rank-comment   { color:#d4a820; }
    [data-theme="dark"] .user-card.rank-silver .rank-comment { color:#8cacff; }
    [data-theme="dark"] .user-card.rank-bronze .rank-comment { color:#c08848; }
    .user-name { font-size:17px; font-weight:800; color:var(--t1); margin-bottom:8px; }
    .user-card.rank-hero .user-name { font-size:20px; }

    /* 통계 칩 */
    .user-stat-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .stat-chip-item {
      display:flex; align-items:center; gap:3px;
      padding:4px 10px; border-radius:8px;
      font-size:11px; font-weight:700; font-family:'Nunito',sans-serif;
    }
    .sci-total { background:#f0eeff; color:var(--a1); border:1px solid var(--border2); }
    .sci-first { background:#fff0f6; color:var(--a2); border:1px solid #f5c8de; }
    .sci-top3  { background:#f0fff8; color:#4abca0; border:1px solid #b0ead8; }
    [data-theme="dark"] .sci-total { background:rgba(168,150,255,.14); color:var(--a1); border-color:rgba(168,150,255,.3); }
    [data-theme="dark"] .sci-first { background:rgba(255,143,196,.12); color:var(--a2); border-color:rgba(255,143,196,.28); }
    [data-theme="dark"] .sci-top3  { background:rgba(80,255,190,.09); color:#60ddb0; border-color:rgba(80,255,190,.2); }

    /* 펫 뱃지 */
    .pet-badges { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; }
    .pet-badge {
      background:var(--s1); border:1px solid var(--border2);
      padding:3px 10px; border-radius:8px; font-size:11px; color:var(--t2); font-weight:600; transition:all .15s;
    }
    .pet-badge:hover { background:var(--a1); color:#fff; border-color:var(--a1); }
    [data-theme="dark"] .pet-badge { background:#27263e; border-color:#4e4c7a; color:#b0aedd; }
    [data-theme="dark"] .pet-badge:hover { background:var(--a1); color:#fff; border-color:var(--a1); }

    /* 상세보기 버튼 */
    .view-more-btn {
      width:100%; padding:10px; border-radius:12px;
      background:linear-gradient(135deg,var(--s2),#ffeef6);
      border:1.5px solid var(--border2); color:var(--a1);
      font-size:12px; font-weight:700; font-family:'Noto Sans KR',sans-serif;
      cursor:pointer; transition:all .2s;
    }
    .view-more-btn:hover {
      background:linear-gradient(135deg,var(--a1),var(--a2));
      color:#fff; border-color:transparent; transform:translateY(-1px);
      box-shadow:0 4px 16px rgba(155,135,245,.3);
    }
    [data-theme="dark"] .view-more-btn { background:linear-gradient(135deg,#312f4c,#3a2a4e); border-color:#4e4c7a; color:var(--a1); }
    [data-theme="dark"] .view-more-btn:hover { background:linear-gradient(135deg,var(--a1),var(--a2)); color:#fff; border-color:transparent; }

    /* 11위+ 리스트 */
    .rest-list { display:flex; flex-direction:column; gap:7px; margin-bottom:20px; }
    .rest-item {
      display:flex; align-items:center; gap:12px;
      background:var(--white); border:1.5px solid var(--border);
      border-radius:14px; padding:12px 16px; transition:all .18s;
    }
    .rest-item:hover { border-color:var(--a1); box-shadow:var(--shadow); transform:translateX(3px); }
    [data-theme="dark"] .rest-item { background:#1f1e33; border-color:#3a3860; }
    [data-theme="dark"] .rest-item:hover { border-color:var(--a1); }
    .rest-rank { font-family:'Nunito',sans-serif; font-weight:900; font-size:14px; color:var(--t3); min-width:40px; text-align:center; }
    .rest-name { font-size:14px; font-weight:700; color:var(--t1); }
    .rest-stats { font-size:11px; color:var(--t3); margin-top:2px; }
    .rest-detail-btn {
      padding:5px 13px; font-size:11px; font-weight:700;
      border:1.5px solid var(--border2); border-radius:99px;
      background:var(--s1); color:var(--a1); cursor:pointer; transition:all .15s; white-space:nowrap;
    }
    .rest-detail-btn:hover { background:var(--a1); color:#fff; border-color:var(--a1); }
    [data-theme="dark"] .rest-detail-btn { background:#27263e; border-color:#4e4c7a; color:var(--a1); }

    /* ══════ 펫별 랭킹 (검색 온디맨드) ══════ */
    .pet-search-area {

}

      throw new Error(`HTTP ${r.status} ${r.statusText}`);
    }
    const allData = await r.json();
    if (!allData || allData.length === 0) {
      throw new Error('JSON이 비어있음');
    }
      const newData = allData[allData.length - 1];
      // 새 데이터인지 확인
      const isNew = newData.timestamp !== lastTimestamp;
      if (!isNew) return; // 변경 없으면 스킵
      lastTimestamp = newData.timestamp;

      // deep copy + 프로돈 주입
      latestData = JSON.parse(JSON.stringify(newData));
      // 프로돈: JSON에 없거나, 있어도 일반랭킹이 비어있으면 하드코딩 사용
      const prodonIdx = latestData.pets.findIndex(p => p.name === "프로돈");
      if (prodonIdx === -1) {
        latestData.pets.push(PRODON_DATA);
      } else if (!latestData.pets[prodonIdx].general_ranking || latestData.pets[prodonIdx].general_ranking.length === 0) {
        latestData.pets[prodonIdx] = PRODON_DATA;
      }
      // 베노노크: JSON에 없거나, 있어도 일반랭킹이 비어있으면 하드코딩 사용
      const benonokIdx = latestData.pets.findIndex(p => p.name === "베노노크");
      if (benonokIdx === -1) {
        latestData.pets.push(BENONOK_DATA);
      } else if (!latestData.pets[benonokIdx].general_ranking || latestData.pets[benonokIdx].general_ranking.length === 0) {
        latestData.pets[benonokIdx] = BENONOK_DATA;
      }

      const dt = new Date(latestData.timestamp);
      document.getElementById('updateTime').textContent =
        `마지막 업데이트: ${dt.toLocaleString('ko-KR')}`;
      document.getElementById('updateNotice').textContent =
        `총 ${latestData.pets.length}마리 펫 랭킹 로드 완료`;

      renderAllUserTabs(latestData.pets);
      renderPetRanking(latestData.pets);
  } catch(e) {
    console.error('loadData 에러:', e);
    document.getElementById('updateTime').textContent = '데이터를 불러올 수 없습니다.';
    document.getElementById('updateNotice').textContent = '에러: ' + (e.message || e);
  }
}

// ── Dense 등수 계산 (1,1,2,2,3 방식) ──
// 동점이면 같은 등수, 그 다음은 +1 (건너뜀 없음)
function denseRank(arr, getScore) {
  if (!arr || arr.length === 0) return [];
  const result = [];
  let rank = 1;
  for (let i = 0; i < arr.length; i++) {
    if (i > 0 && getScore(arr[i]) !== getScore(arr[i-1])) rank++;
    result.push({ ...arr[i], displayRank: rank });
  }
  return result;
}

// ── 유저 집계 ──
function buildUserStats(pets) {
  const userMap = {};
  pets.forEach(pet => {
    // 일반/환생 각각 처리
    const sections = [
      { list: pet.general_ranking || [], type: 'general' },
      { list: pet.rebirth_ranking || [], type: 'rebirth' }
    ];
    sections.forEach(({ list, type }) => {
      // 이 펫에서의 등수 계산 (dense)
      const ranked = denseRank(list, r => parseFloat(r.score));
      ranked.forEach(r => {
        if (!r.nickname) return;
        if (!userMap[r.nickname]) userMap[r.nickname] = { total: 0, first: 0, top3: 0, pets: [] };
        userMap[r.nickname].total++;
        if (r.displayRank === 1) userMap[r.nickname].first++;
        if (r.displayRank <= 3) userMap[r.nickname].top3++;
        userMap[r.nickname].pets.push({
          petName: pet.name,
          type,
          rank: r.displayRank,
          score: r.score,
          level: r.level,
          attack: r.attack,
          defense: r.defense,
          speed: r.speed,
          exp: r.exp
        });
      });
    });
  });
  return userMap;
}

// ── 전체 데이터 저장소 ──
const gridDataStore = {};

// ── 그리드 렌더 공통 함수 ──
function renderGridContent(container, sorted, detailPrefix, filterFn, isExpanded) {
  const makeCard = (u, i, pfx) => {
    const fu = filterFn ? { ...u, pets: u.pets.filter(filterFn) } : u;
    return makeUserCard(fu, u.displayRank, `${pfx}-${i}`, pfx);
  };

  const top10 = sorted.filter(u => u.displayRank <= 10);
  const rest   = isExpanded ? sorted.filter(u => u.displayRank > 10) : [];

  // TOP10: 화려한 그리드
  let html = '<div class="top10-grid">' + top10.map((u, i) => makeCard(u, i, detailPrefix)).join('') + '</div>';

  // 11위+: 심플 리스트
  if (rest.length > 0) {
    html += '<div class="rest-list">' + rest.map((u, i) => makeCard(u, i, detailPrefix+'r')).join('') + '</div>';
  }

  container.innerHTML = html || '<div class="empty-state">데이터 없음</div>';
}

// ── 유저 그리드 렌더 (공통) ──
function renderUserGrid(sorted, gridId, storeKey, moreBtnId, detailPrefix, filterFn) {
  gridDataStore[storeKey] = { sorted, detailPrefix, filterFn };

  const container = document.getElementById(gridId);
  renderGridContent(container, sorted, detailPrefix, filterFn, false);

  const rest = sorted.filter(u => u.displayRank > 10);
  const moreBtn = document.getElementById(moreBtnId);
  if (rest.length > 0) {
    moreBtn.style.display = 'inline-block';
    moreBtn.textContent = `전체보기 (${rest.length}명 더) ▼`;
    moreBtn._expanded = false;
  } else {
    moreBtn.style.display = 'none';
  }
}

// ── 전체보기 펼치기 / 접기 ──
function expandGrid(gridId, storeKey, moreBtnId) {
  const btn = document.getElementById(moreBtnId);
  const store = gridDataStore[storeKey];
  if (!store) return;
  const { sorted, detailPrefix, filterFn } = store;
  const container = document.getElementById(gridId);
  const rest = sorted.filter(u => u.displayRank > 10);

  if (btn._expanded) {
    renderGridContent(container, sorted, detailPrefix, filterFn, false);
    btn.textContent = `전체보기 (${rest.length}명 더) ▼`;
    btn._expanded = false;
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    renderGridContent(container, sorted, detailPrefix, filterFn, true);
    btn.textContent = '접기 ▲';
    btn._expanded = true;
  }
}

// ── 닉네임 인라인 필터 ──
function filterGrid(gridId, storeKey, q) {
  const store = gridDataStore[storeKey];
  if (!store) return;
  const { sorted, detailPrefix, filterFn } = store;
  const keyword = q.trim().toLowerCase();
  const container = document.getElementById(gridId);

  if (!keyword) {
    // 검색어 없으면 원래 상태로 (top10 / 전체 중 현재 상태 유지)
    const moreBtnId = gridId.replace('Grid', 'MoreBtn');
    const btn = document.getElementById(moreBtnId);
    const isExpanded = btn && btn._expanded;
    renderGridContent(container, sorted, detailPrefix, filterFn, isExpanded);
    return;
  }

  // 매칭 유저만 표시 (등수는 전체 기준 유지)
  const matched = sorted.filter(u => u.name.toLowerCase().includes(keyword));
  if (matched.length === 0) {
    container.innerHTML = `<div class="empty-state">"${q}"와 일치하는 유저가 없습니다.</div>`;
    return;
  }
  // 검색 결과는 전체 표시 (TOP10 + rest 구분 없이 top10-grid)
  const makeCard = (u, i) => {
    const fu = filterFn ? { ...u, pets: u.pets.filter(filterFn) } : u;
    return makeUserCard(fu, u.displayRank, `flt-${gridId}-${i}`, 'flt');
  };
  container.innerHTML = `<div style="font-size:12px;color:var(--t3);margin-bottom:10px;">"${q}" 검색결과 ${matched.length}명</div>
    <div class="top10-grid">${matched.map((u, i) => makeCard(u, i)).join('')}</div>`;
}

// ── 세 탭 모두 렌더 ──
function renderAllUserTabs(pets) {
  const userMap = buildUserStats(pets);

  // 전체 랭킹: total 많은순 → 동률시 first 많은순 → 동률시 top3 많은순
  const totalSorted = Object.entries(userMap)
    .map(([name, d]) => ({ name, ...d }))
    .sort((a, b) =>
      b.total !== a.total ? b.total - a.total :
      b.first !== a.first ? b.first - a.first :
      b.top3 - a.top3
    );
  // 등수 부여: [total, first, top3] 세 값이 모두 같을 때만 동률
  const totalRanked = denseRankMulti(totalSorted, u => [u.total, u.first, u.top3]);
  renderUserGrid(totalRanked, 'userGrid', 'userGrid', 'userMoreBtn', 'u', null);

  // 1등 펫 보유 랭킹: first 많은순 → 동률시 total 많은순 → top3 많은순
  const firstSorted = Object.entries(userMap)
    .map(([name, d]) => ({ name, ...d }))
    .filter(u => u.first > 0)
    .sort((a, b) =>
      b.first !== a.first ? b.first - a.first :
      b.total !== a.total ? b.total - a.total :
      b.top3 - a.top3
    );
  const firstRanked = denseRankMulti(firstSorted, u => [u.first, u.total, u.top3]);
  renderUserGrid(firstRanked, 'firstGrid', 'firstGrid', 'firstMoreBtn', 'f',
    p => p.rank === 1);

  // TOP3 펫 보유 랭킹: top3 많은순 → 동률시 first 많은순 → total 많은순
  const top3Sorted = Object.entries(userMap)
    .map(([name, d]) => ({ name, ...d }))
    .filter(u => u.top3 > 0)
    .sort((a, b) =>
      b.top3 !== a.top3 ? b.top3 - a.top3 :
      b.first !== a.first ? b.first - a.first :
      b.total - a.total
    );
  const top3Ranked = denseRankMulti(top3Sorted, u => [u.top3, u.first, u.total]);
  renderUserGrid(top3Ranked, 'top3Grid', 'top3Grid', 'top3MoreBtn', 't',
    p => p.rank <= 3);
}

// 다중 기준 dense rank (배열의 모든 값이 같아야 동률)
function denseRankMulti(arr, getScores) {
  if (!arr || arr.length === 0) return [];
  const result = [];
  let rank = 1;
  for (let i = 0; i < arr.length; i++) {
    if (i > 0) {
      const sa = getScores(arr[i]), sb = getScores(arr[i-1]);
      if (sa.some((v, j) => v !== sb[j])) rank++;
    }
    result.push({ ...arr[i], displayRank: rank });
  }
  return result;
}

// ── 펫별 랭킹 렌더 ──
function makeRankItemHTML(r) {
  const rClass = r.displayRank <= 3 ? `rank-${r.displayRank}` : '';
  return `<div class="ranking-item">
    <div class="rank-badge ${rClass}">${r.displayRank}</div>
    <div class="rank-info">
      <div class="rank-nick">${r.nickname}</div>
      <div class="rank-score">점수: ${r.score}</div>
      <div class="rank-stats">
        <span class="stat-chip stat-lv">Lv.${r.level}</span>
        <span class="stat-chip stat-exp">내구 ${r.exp}</span>
        <span class="stat-chip stat-atk">공격 ${r.attack}</span>
        <span class="stat-chip stat-def">방어 ${r.defense}</span>
        <span class="stat-chip stat-agi">순발 ${r.speed}</span>
      </div>
    </div>
  </div>`;
}

// ── 펫 데이터 캐시 (온디맨드 렌더용) ──
let _allPetsData = [];

function renderPetRanking(pets) {
  _allPetsData = pets; // 전역 캐시에만 저장, DOM 렌더링 없음
  // 검색 입력 이벤트 등록
  const si = document.getElementById('petSearch');
  if (si) {
    si.oninput = e => {
      const q = e.target.value.trim();
      if (q.length === 0) {
        showPetHint();
      } else {
        searchAndRenderPets(q);
      }
    };
  }
}

function showPetHint() {
  document.getElementById('petContainer').innerHTML = `
    <div class="pet-search-hint">
      🔍 펫 이름을 검색하거나<br>
      <strong>🎲 랜덤 펫</strong> 버튼을 눌러 랜덤으로 확인해 보세요!
    </div>`;
}

function makePetCardHTML(pet) {
  const general = denseRank(pet.general_ranking || [], r => parseFloat(r.score));
  const rebirth  = denseRank(pet.rebirth_ranking || [], r => parseFloat(r.score));
  const makeItems = (list, cid) => {
    const top10 = list.slice(0, 10), rest = list.slice(10);
    let h = top10.map(makeRankItemHTML).join('');
    if (rest.length > 0) {
      const eid = `extra-${cid}`, bid = `btn-${cid}`;
      h += `<div id="${eid}" style="display:none;flex-direction:column;gap:6px;">${rest.map(makeRankItemHTML).join('')}</div>
        <button class="view-more-btn" id="${bid}" onclick="togglePetExtra('${eid}','${bid}',${rest.length})">전체보기 (${rest.length}명 더) ▼</button>`;
    }
    return h;
  };
  const sid = pet.name.replace(/[^a-zA-Z0-9가-힣]/g,'_');
  const genHTML = general.length > 0 ? makeItems(general, `gen-${sid}`) : '<div class="empty-state">랭킹 데이터 없음</div>';
  const rebHTML = rebirth.length > 0 ? makeItems(rebirth, `reb-${sid}`) : '';
  return `<div class="pet-card" data-pet="${pet.name}">
    <div class="pet-card-header">
      <div class="pet-img-box">${getPetImg(pet.name)}</div>
      <div>
        <div class="pet-card-name">${pet.name}</div>
        <div class="pet-card-sub">일반 ${general.length}명 · 환생 ${rebirth.length}명</div>
      </div>
    </div>
    <div class="ranking-section">
      <div class="ranking-section-title">일반 랭킹</div>
      <div class="ranking-list">${genHTML}</div>
    </div>
    ${rebirth.length > 0 ? `<div class="ranking-section">
      <div class="ranking-section-title">환생 랭킹</div>
      <div class="ranking-list">${rebHTML}</div>
    </div>` : ''}
  </div>`;
}

let _sTimer = null;
function searchAndRenderPets(q) {
  if (_sTimer) clearTimeout(_sTimer);
  _sTimer = setTimeout(() => {
    const lower = q.toLowerCase();
    const matched = _allPetsData.filter(p => p.name.toLowerCase().includes(lower));
    const container = document.getElementById('petContainer');
    if (matched.length === 0) {
      container.innerHTML = `<div class="pet-search-hint">"${q}"와 일치하는 펫이 없습니다 🔍</div>`;
      return;
    }
    container.innerHTML = matched.map(makePetCardHTML).join('');
  }, 120);
}

function showRandomPet() {
  if (_allPetsData.length === 0) return;
  const btn = document.getElementById('randomBtn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 400);

  // 랭킹 데이터 있는 펫 중에서 랜덤
  const withData = _allPetsData.filter(p => (p.general_ranking||[]).length > 0 || (p.rebirth_ranking||[]).length > 0);
  const pet = withData[Math.floor(Math.random() * withData.length)];
  if (!pet) return;

  // 검색창에 이름 표시
  const si = document.getElementById('petSearch');
  if (si) si.value = pet.name;

  document.getElementById('petContainer').innerHTML = makePetCardHTML(pet);
}


function togglePetExtra(extraId, btnId, count) {
  const el = document.getElementById(extraId);
  const btn = document.getElementById(btnId);
  if (el.style.display === 'none') {
    el.style.display = 'flex';
    btn.textContent = '접기 ▲';
  } else {
    el.style.display = 'none';
    btn.textContent = `전체보기 (${count}명 더) ▼`;
  }
}

// ── Tab ──
function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// ── Dark Mode ──
function toggleDark(){
  const h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  localStorage.setItem('wind-dark', h.getAttribute('data-theme'));
}
(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('wind-dark') || 'light'); })();

// ── Init ──
loadData();
setInterval(loadData, 15000);

// URL 파라미터로 특정 펫 바로 열기 (pokedex에서 넘어온 경우)
(function() {
  const params = new URLSearchParams(window.location.search);
  const petName = params.get('pet');
  if (petName) {
    // 데이터 로드 후 펫별 랭킹 탭으로 이동 + 검색어 설정
    const waitAndJump = setInterval(() => {
      const petCards = document.querySelectorAll('[data-pet]');
      if (petCards.length > 0) {
        clearInterval(waitAndJump);
        // 펫별 랭킹 탭으로 전환
        const petTabBtn = document.querySelector('.tab-btn:last-child');
        switchTab('pet-tab', petTabBtn);
        // 검색어 설정
        const searchInput = document.getElementById('petSearch');
        if (searchInput) {
          searchInput.value = petName;
          applySearch(petName);
        }
        // 해당 펫 카드로 스크롤
        setTimeout(() => {
          const target = document.querySelector(`[data-pet="${petName}"]`);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
      }
    }, 300);
  }
})();

</script>
