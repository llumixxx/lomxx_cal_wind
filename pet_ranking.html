<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>WIND 펫 랭킹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#faf9ff; --bg2:#f3f0ff; --white:#ffffff;
      --s1:#f8f7ff; --s2:#f0eeff;
      --border:#e8e3ff; --border2:#d4cbff;
      --a1:#9b87f5; --a2:#f587b8; --a3:#87d4f5; --a4:#f5c887; --a5:#87f5c0;
      --t1:#3d3560; --t2:#7b72a8; --t3:#b0a8d4; --t4:#d4cff0;
      --ok:#6dd5a0; --err:#f57878;
      --shadow:0 4px 24px rgba(155,135,245,0.12);
      --shadow2:0 8px 32px rgba(155,135,245,0.18);
    }
    [data-theme="dark"] {
      --bg:#0f0f1a; --bg2:#1a1a2e; --white:#252540;
      --s1:#2a2a45; --s2:#353555;
      --border:#404060; --border2:#505080;
      --a1:#9b87f5; --a2:#f587b8; --a3:#87d4f5; --a4:#f5c887; --a5:#87f5c0;
      --t1:#e8e8f0; --t2:#b0b0c8; --t3:#8080a0; --t4:#606080;
      --ok:#6dd5a0; --err:#f57878;
      --shadow:0 4px 24px rgba(0,0,0,0.4);
      --shadow2:0 8px 32px rgba(0,0,0,0.5);
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--t1); min-height:100vh;
      background-image:
        radial-gradient(circle at 15% 20%,rgba(155,135,245,0.08) 0%,transparent 50%),
        radial-gradient(circle at 85% 80%,rgba(245,135,184,0.07) 0%,transparent 50%);
    }

    .page-header {
      background:var(--white); border-bottom:1.5px solid var(--border);
      padding:16px 20px; position:sticky; top:0; z-index:100;
      box-shadow:var(--shadow);
    }
    .header-inner {
      max-width:1280px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .back-btn {
      display:flex; align-items:center; gap:5px;
      padding:7px 14px; border:1.5px solid var(--border2);
      border-radius:10px; background:var(--s1); color:var(--a1);
      font-size:12px; font-weight:700; font-family:'Noto Sans KR',sans-serif;
      cursor:pointer; text-decoration:none; transition:all .15s;
    }
    .back-btn:hover { background:var(--a1); color:#fff; border-color:var(--a1); }
    .header-title {
      font-family:'Nunito',sans-serif; font-weight:900; font-size:20px;
      background:linear-gradient(135deg,var(--a1),var(--a2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header-update {
      font-size:11px; color:var(--t3); font-weight:600;
    }

    .filter-bar {
      max-width:1280px; margin:16px auto 0; padding:0 16px; width:100%;
    }
    .filter-row {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; align-items:center; width:100%;
    }
    .search-input {
      flex:1; min-width:160px; max-width:260px;
      padding:6px 14px; border:1.5px solid var(--border);
      border-radius:99px; font-size:12px; color:var(--t1);
      font-family:'Noto Sans KR',sans-serif; background:var(--white);
      transition:border-color .15s;
    }
    .search-input:focus { outline:none; border-color:var(--a1); }

    .tab-bar {
      max-width:1280px; margin:0 auto; padding:12px 16px;
      border-bottom:1.5px solid var(--border);
      display:flex; gap:8px;
    }
    .tab-btn {
      padding:8px 16px; font-size:12px; font-weight:700;
      border:1.5px solid transparent; border-radius:8px;
      background:transparent; color:var(--t2);
      cursor:pointer; transition:all .15s;
      font-family:'Noto Sans KR',sans-serif;
    }
    .tab-btn:hover { color:var(--a1); }
    .tab-btn.active {
      background:var(--a1); color:#fff; border-color:var(--a1);
    }

    .content-wrap {
      max-width:1280px; margin:0 auto; padding:0 16px 40px;
    }

    .tab-content {
      display:none;
    }
    .tab-content.active {
      display:block;
    }

    /* User Cards Grid */
    .user-card-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:12px;
      margin-bottom:20px;
    }

    .user-card {
      background:var(--white); border:1.5px solid var(--border);
      border-radius:16px; padding:16px;
      box-shadow:var(--shadow);
      cursor:pointer;
      transition:all .15s;
    }
    .user-card:hover {
      border-color:var(--a1);
      box-shadow:var(--shadow2);
      transform:translateY(-2px);
    }

    .user-rank {
      font-size:28px; font-weight:900; color:var(--a1);
      font-family:'Nunito',sans-serif;
      margin-bottom:8px;
    }

    .user-name {
      font-size:16px; font-weight:700; color:var(--t1);
      margin-bottom:4px;
    }

    .user-count {
      font-size:13px; color:var(--t3);
      margin-bottom:12px;
    }

    .pet-mini-list {
      display:flex; gap:6px; flex-wrap:wrap;
    }

    .pet-tag {
      display:flex; align-items:center; gap:4px;
      padding:4px 8px; background:var(--s1); border-radius:6px;
      font-size:10px; border:1px solid var(--border);
    }

    .pet-tag img {
      width:16px; height:16px; object-fit:contain;
    }

    /* Pet Grid */
    .pet-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
      gap:12px;
      margin-bottom:20px;
    }

    .pet-card {
      background:var(--white); border:1.5px solid var(--border);
      border-radius:16px; padding:16px;
      box-shadow:var(--shadow);
      transition:all .15s;
    }
    .pet-card:hover {
      border-color:var(--a1);
      box-shadow:var(--shadow2);
      transform:translateY(-2px);
    }

    .pet-header {
      display:flex; align-items:center; gap:12px; margin-bottom:12px;
    }

    .pet-img-box {
      width:60px; height:60px; flex-shrink:0;
      background:var(--s1); border:1.5px solid var(--border);
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }

    .pet-img-box img {
      width:100%; height:100%; object-fit:contain;
    }

    .pet-name {
      font-size:16px; font-weight:700; color:var(--t1);
      font-family:'Nunito',sans-serif;
    }

    .ranking-section {
      margin-bottom:12px;
    }
    .ranking-section:last-child {
      margin-bottom:0;
    }

    .ranking-title {
      font-size:11px; font-weight:700; color:var(--a1);
      letter-spacing:1px; margin-bottom:8px;
      font-family:'Nunito',sans-serif;
      text-transform:uppercase;
    }

    .ranking-list {
      list-style:none; display:flex; flex-direction:column; gap:6px;
    }

    .ranking-item {
      display:flex; align-items:center; gap:6px;
      padding:6px; background:var(--s1); border-radius:6px;
      border-left:3px solid var(--a1);
      font-size:12px;
    }

    .rank-badge {
      display:flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:50%;
      background:var(--a1); color:#fff;
      font-weight:700; font-size:10px;
      flex-shrink:0;
      font-family:'Nunito',sans-serif;
    }

    .rank-badge.tie {
      background:var(--t3);
    }

    .ranking-info {
      flex:1;
    }

    .nick {
      font-size:11px; font-weight:700; color:var(--t1);
      margin-bottom:1px;
    }

    .score {
      color:var(--a2); font-weight:700; font-size:10px;
    }

    .view-more-btn {
      padding:6px 12px; margin-top:8px;
      background:var(--s1); border:1px solid var(--border);
      border-radius:6px; color:var(--a1); font-size:11px;
      font-weight:700; cursor:pointer; width:100%;
      transition:all .15s;
    }
    .view-more-btn:hover {
      background:var(--a1); color:#fff; border-color:var(--a1);
    }

    .empty {
      padding:12px; color:var(--t3); font-size:11px; text-align:center;
      font-style:italic;
    }

    .full-ranking-modal {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.5); z-index:1000;
      align-items:center; justify-content:center;
    }

    .full-ranking-modal.active {
      display:flex;
    }

    .modal-content {
      background:var(--white); border-radius:16px;
      max-width:600px; width:90%; max-height:80vh;
      overflow-y:auto; box-shadow:var(--shadow2);
    }

    .modal-header {
      padding:20px; border-bottom:1.5px solid var(--border);
      display:flex; justify-content:space-between; align-items:center;
    }

    .modal-title {
      font-size:18px; font-weight:700;
    }

    .modal-close {
      background:none; border:none; font-size:24px;
      color:var(--t3); cursor:pointer;
    }

    .modal-body {
      padding:20px;
    }

    .full-ranking-item {
      display:flex; align-items:center; gap:10px;
      padding:10px; border-bottom:1px solid var(--border);
    }

    .full-ranking-item:last-child {
      border-bottom:none;
    }

    @media(max-width:768px) {
      .pet-grid, .user-card-grid {
        grid-template-columns:1fr;
      }
      .header-inner {
        flex-direction:column; align-items:flex-start;
      }
      .search-input {
        min-width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="header-inner">
      <a href="index__3_.html" class="back-btn">← 돌아가기</a>
      <div class="header-title">🐾 펫 랭킹</div>
      <div class="header-update" id="updateTime"></div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-row">
      <input type="text" class="search-input" id="searchInput" placeholder="펫 이름으로 검색...">
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="user-ranking">🏆 유저 순위</button>
    <button class="tab-btn" data-tab="pet-ranking">🐾 펫별 랭킹</button>
  </div>

  <div class="content-wrap">
    <!-- 유저 순위 탭 -->
    <div id="user-ranking" class="tab-content active">
      <div class="user-card-grid" id="userGrid"></div>
    </div>

    <!-- 펫별 랭킹 탭 -->
    <div id="pet-ranking" class="tab-content">
      <div class="pet-grid" id="petGrid"></div>
    </div>
  </div>

  <!-- 전체 랭킹 보기 모달 -->
  <div class="full-ranking-modal" id="fullRankingModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    let allData = [];
    let latestData = null;
    let petImageMap = {};

    // 펫 이미지 데이터 (pokedex에서 추출)
    const petImages = {
      '우리': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/우리.png',
      '두리': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/두리.png',
      '얼룩우리': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/얼룩우리.png',
      '불그리': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/불그리.png',
      '실버우리': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/실버우리.png',
      '부비': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/부비.png',
      '부이': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/부이.png',
      '부이비': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/부이비.png',
      '쿠로로': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/쿠로로.png',
      '골드부비': 'https://llumixxx.github.io/lomxx_cal_wind/assets/pets/골드부비.png',
    };

    // JSON 데이터 로드
    async function loadData() {
      try {
        const response = await fetch('pet_ranking_data.json');
        allData = await response.json();
        
        if (allData.length > 0) {
          latestData = allData[allData.length - 1];
          
          // 마지막 업데이트 시간 표시
          const updateTime = new Date(latestData.timestamp);
          document.getElementById('updateTime').innerHTML = 
            `마지막 업데이트: ${updateTime.toLocaleString('ko-KR')}`;
          
          // 데이터 렌더링
          renderUserRanking(latestData.pets);
          renderPetRanking(latestData.pets);
        }
      } catch (error) {
        console.error('데이터 로드 실패:', error);
      }
    }

    // 동률 처리 함수
    function addRanksWithTies(rankings) {
      if (rankings.length === 0) return [];
      
      const result = [];
      let currentRank = 1;
      let prevScore = null;
      let count = 0;

      rankings.forEach((item, idx) => {
        const score = parseFloat(item.score);
        
        if (prevScore !== null && prevScore !== score) {
          currentRank = idx + 1;
        }
        
        result.push({
          ...item,
          displayRank: currentRank,
          isTie: prevScore === score
        });
        
        prevScore = score;
      });

      return result;
    }

    // 유저 순위 렌더링
    function renderUserRanking(pets) {
      const userStats = {};

      pets.forEach(pet => {
        const rankings = [
          ...pet.general_ranking,
          ...pet.rebirth_ranking
        ];

        rankings.forEach(rank => {
          if (!userStats[rank.nickname]) {
            userStats[rank.nickname] = { count: 0, petList: new Set() };
          }
          userStats[rank.nickname].count++;
          userStats[rank.nickname].petList.add(pet.name);
        });
      });

      const sortedUsers = Object.entries(userStats)
        .map(([name, data]) => ({ 
          name, 
          count: data.count,
          petList: Array.from(data.petList)
        }))
        .sort((a, b) => b.count - a.count);

      const grid = document.getElementById('userGrid');
      grid.innerHTML = sortedUsers.map((user, idx) => `
        <div class="user-card">
          <div class="user-rank">${getMedalEmoji(idx + 1)} ${idx + 1}위</div>
          <div class="user-name">${user.name}</div>
          <div class="user-count">보유 펫: ${user.count}마리</div>
          <div class="pet-mini-list">
            ${user.petList.slice(0, 5).map(petName => `
              <div class="pet-tag">
                <span>${petName}</span>
              </div>
            `).join('')}
            ${user.petList.length > 5 ? `<div class="pet-tag">+${user.petList.length - 5}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    // 펫별 랭킹 렌더링
    function renderPetRanking(pets) {
      const grid = document.getElementById('petGrid');
      grid.innerHTML = '';

      pets.forEach(pet => {
        const generalWithRanks = addRanksWithTies(pet.general_ranking);
        const rebirthWithRanks = addRanksWithTies(pet.rebirth_ranking);

        const petImg = petImages[pet.name] || '';
        
        const card = document.createElement('div');
        card.className = 'pet-card';
        card.dataset.petName = pet.name;
        
        card.innerHTML = `
          <div class="pet-header">
            ${petImg ? `<div class="pet-img-box"><img src="${petImg}" alt="${pet.name}" onerror="this.style.display='none'"></div>` : ''}
            <div class="pet-name">${pet.name}</div>
          </div>
          
          <div class="ranking-section">
            <div class="ranking-title">⭐ 일반 랭킹</div>
            <ul class="ranking-list">
              ${generalWithRanks.length > 0 
                ? generalWithRanks.slice(0, 10).map(rank => `
                    <li class="ranking-item">
                      <div class="rank-badge ${rank.isTie ? 'tie' : ''}">${rank.isTie ? '=' : '#' + rank.displayRank}</div>
                      <div class="ranking-info">
                        <div class="nick">${rank.nickname}</div>
                        <div class="score">점수: ${rank.score}</div>
                      </div>
                    </li>
                  `).join('')
                : '<li class="empty">데이터 없음</li>'
              }
            </ul>
            ${generalWithRanks.length > 10 ? `
              <button class="view-more-btn" onclick="showFullRanking('${pet.name}', 'general', ${JSON.stringify(generalWithRanks).replace(/'/g, '&#39;')})">
                전체보기 (${generalWithRanks.length}명)
              </button>
            ` : ''}
          </div>
          
          ${rebirthWithRanks.length > 0 ? `
            <div class="ranking-section">
              <div class="ranking-title">🔥 환생 랭킹</div>
              <ul class="ranking-list">
                ${rebirthWithRanks.slice(0, 10).map(rank => `
                  <li class="ranking-item">
                    <div class="rank-badge ${rank.isTie ? 'tie' : ''}">${rank.isTie ? '=' : '#' + rank.displayRank}</div>
                    <div class="ranking-info">
                      <div class="nick">${rank.nickname}</div>
                      <div class="score">점수: ${rank.score}</div>
                    </div>
                  </li>
                `).join('')}
              </ul>
              ${rebirthWithRanks.length > 10 ? `
                <button class="view-more-btn" onclick="showFullRanking('${pet.name}', 'rebirth', ${JSON.stringify(rebirthWithRanks).replace(/'/g, '&#39;')})">
                  전체보기 (${rebirthWithRanks.length}명)
                </button>
              ` : ''}
            </div>
          ` : ''}
        `;
        grid.appendChild(card);
      });

      setupSearch();
    }

    // 전체 랭킹 보기
    function showFullRanking(petName, type, rankings) {
      const modal = document.getElementById('fullRankingModal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');
      
      title.textContent = `${petName} - ${type === 'general' ? '일반' : '환생'} 랭킹`;
      
      body.innerHTML = rankings.map((rank, idx) => `
        <div class="full-ranking-item">
          <div class="rank-badge ${rank.isTie ? 'tie' : ''}" style="margin-right:10px;">
            ${rank.isTie ? '=' : '#' + rank.displayRank}
          </div>
          <div style="flex:1;">
            <div class="nick">${rank.nickname}</div>
            <div class="score">점수: ${rank.score}</div>
          </div>
        </div>
      `).join('');
      
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('fullRankingModal').classList.remove('active');
    }

    // 검색 기능
    function setupSearch() {
      document.getElementById('searchInput').addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase();
        const cards = document.querySelectorAll('.pet-card');

        cards.forEach(card => {
          const petName = card.dataset.petName.toLowerCase();
          if (petName.includes(keyword)) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });
      });
    }

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        btn.classList.add('active');
        const tabId = btn.dataset.tab;
        document.getElementById(tabId).classList.add('active');
      });
    });

    // 모달 외부 클릭 시 닫기
    document.getElementById('fullRankingModal').addEventListener('click', (e) => {
      if (e.target.id === 'fullRankingModal') {
        closeModal();
      }
    });

    // 페이지 로드
    loadData();
    setInterval(loadData, 10000);
  </script>
</body>
</html>
