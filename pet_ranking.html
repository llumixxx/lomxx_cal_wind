<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>WIND 펫 랭킹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#faf9ff; --bg2:#f3f0ff; --white:#ffffff;
      --s1:#f8f7ff; --s2:#f0eeff;
      --border:#e8e3ff; --border2:#d4cbff;
      --a1:#9b87f5; --a2:#f587b8; --a3:#87d4f5; --a4:#f5c887; --a5:#87f5c0;
      --t1:#3d3560; --t2:#7b72a8; --t3:#b0a8d4; --t4:#d4cff0;
      --ok:#6dd5a0; --err:#f57878;
      --shadow:0 4px 24px rgba(155,135,245,0.12);
      --shadow2:0 8px 32px rgba(155,135,245,0.18);
    }
    [data-theme="dark"] {
      --bg:#0f0f1a; --bg2:#1a1a2e; --white:#252540;
      --s1:#2a2a45; --s2:#353555;
      --border:#404060; --border2:#505080;
      --a1:#9b87f5; --a2:#f587b8; --a3:#87d4f5; --a4:#f5c887; --a5:#87f5c0;
      --t1:#e8e8f0; --t2:#b0b0c8; --t3:#8080a0; --t4:#606080;
      --ok:#6dd5a0; --err:#f57878;
      --shadow:0 4px 24px rgba(0,0,0,0.4);
      --shadow2:0 8px 32px rgba(0,0,0,0.5);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--t1); min-height:100vh;
      background-image:
        radial-gradient(circle at 15% 20%,rgba(155,135,245,0.08) 0%,transparent 50%),
        radial-gradient(circle at 85% 80%,rgba(245,135,184,0.07) 0%,transparent 50%),
        radial-gradient(circle at 50% 50%,rgba(135,212,245,0.05) 0%,transparent 60%);
    }

    /* ── Nav ── */
    .page-header {
      background:var(--white); border-bottom:1.5px solid var(--border);
      padding:0; position:sticky; top:0; z-index:100;
      box-shadow:var(--shadow);
    }
    .header-top {
      max-width:1280px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px; gap:12px; flex-wrap:wrap;
    }
    .header-title {
      font-family:'Nunito',sans-serif; font-weight:900; font-size:20px;
      background:linear-gradient(135deg,var(--a1),var(--a2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .dark-btn {
      width:36px; height:36px; border-radius:10px;
      background:var(--s1); border:1.5px solid var(--border2);
      color:var(--t2); font-size:16px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .15s;
    }
    .dark-btn:hover { background:var(--a1); color:#fff; border-color:var(--a1); }
    .page-nav {
      display:flex; justify-content:center; gap:6px;
      padding:8px 16px 10px; flex-wrap:wrap;
      border-top:1.5px solid var(--border);
    }
    .pnav-tab {
      text-decoration:none;
      background:var(--s1); border:1.5px solid var(--border2);
      border-radius:99px; padding:6px 14px;
      font-size:12px; font-weight:700;
      color:var(--t2); transition:all .15s;
      font-family:'Noto Sans KR',sans-serif;
    }
    .pnav-tab:hover { background:var(--s2); color:var(--a1); border-color:var(--a1); }
    .pnav-active { background:linear-gradient(135deg,var(--s2),#ffeef6); color:var(--a1); border-color:var(--a1); font-weight:800; }

    /* ── Main ── */
    .main-wrap { max-width:1280px; margin:0 auto; padding:24px 16px 60px; }

    /* ── Page Hero ── */
    .page-hero {
      text-align:center; padding:20px 0 24px;
    }
    .hero-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:linear-gradient(135deg,#f0eeff,#ffeef6);
      border:1.5px solid var(--border2); border-radius:99px;
      padding:4px 14px; font-size:11px; font-weight:800;
      font-family:'Nunito',sans-serif;
      color:var(--a1); letter-spacing:1px; margin-bottom:10px;
    }
    .hero-badge-dot { width:6px; height:6px; background:var(--a2); border-radius:50%; }
    .hero-title {
      font-family:'Nunito',sans-serif; font-size:32px; font-weight:900;
      background:linear-gradient(135deg,var(--a1) 0%,var(--a2) 60%,var(--a4) 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:6px;
    }
    .hero-sub { font-size:12px; color:var(--t3); font-family:'Nunito',sans-serif; font-weight:600; }

    /* ── Tabs ── */
    .tabs-row {
      display:flex; gap:6px; margin-bottom:20px;
      border-bottom:2px solid var(--border); padding-bottom:0;
      overflow-x:auto;
    }
    .tab-btn {
      padding:10px 20px; border:none; background:transparent;
      color:var(--t2); font-weight:700; font-size:13px;
      font-family:'Noto Sans KR',sans-serif;
      cursor:pointer; transition:all .2s; white-space:nowrap;
      border-bottom:2.5px solid transparent; margin-bottom:-2px;
      border-radius:8px 8px 0 0;
    }
    .tab-btn:hover { color:var(--a1); background:var(--s1); }
    .tab-btn.active { color:var(--a1); border-bottom-color:var(--a1); background:var(--s1); }

    /* ── Tab Content ── */
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* ── Search ── */
    .search-wrap {
      margin-bottom:16px;
      display:flex; align-items:center; gap:8px;
      background:var(--white); border:1.5px solid var(--border2);
      border-radius:99px; padding:8px 16px;
      max-width:360px;
      box-shadow:var(--shadow);
    }
    .search-wrap input {
      border:none; background:transparent; color:var(--t1);
      font-size:13px; font-family:'Noto Sans KR',sans-serif;
      flex:1; outline:none;
    }
    .search-wrap input::placeholder { color:var(--t4); }

    /* ── User Ranking Grid ── */
    .user-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:16px; margin-bottom:20px;
    }
    .user-card {
      background:var(--white); border:1.5px solid var(--border);
      border-radius:20px; padding:20px;
      box-shadow:var(--shadow); transition:all .2s; cursor:pointer;
    }
    .user-card:hover { border-color:var(--a1); box-shadow:var(--shadow2); transform:translateY(-3px); }
    .user-rank-num {
      font-family:'Nunito',sans-serif; font-weight:900; font-size:28px;
      color:var(--a1); margin-bottom:6px;
    }
    .user-rank-num.gold { color:#e8a020; }
    .user-rank-num.silver { color:#9b9b9b; }
    .user-rank-num.bronze { color:#c87941; }
    .user-rank-num.tie { color:var(--t3); font-size:22px; }
    .user-name {
      font-size:17px; font-weight:800; color:var(--t1); margin-bottom:4px;
    }
    .user-count {
      font-size:12px; color:var(--t2); margin-bottom:12px;
    }
    .user-count strong { color:var(--a1); font-family:'Nunito',sans-serif; font-weight:900; }
    .pet-badges { display:flex; gap:5px; flex-wrap:wrap; }
    .pet-badge {
      background:var(--s1); border:1px solid var(--border2);
      padding:3px 9px; border-radius:99px;
      font-size:11px; color:var(--a1); font-weight:700;
    }
    /* 유저 카드 내 펫 상세 */
    .user-pet-detail {
      margin-top:14px; border-top:1.5px solid var(--border); padding-top:12px;
      display:none;
    }
    .user-pet-detail.open { display:block; }
    .user-pet-row {
      display:flex; align-items:center; gap:8px;
      padding:6px 0; border-bottom:1px solid var(--border);
    }
    .user-pet-row:last-child { border-bottom:none; }
    .user-pet-img {
      width:32px; height:32px; flex-shrink:0;
      background:var(--s1); border:1px solid var(--border2);
      border-radius:8px; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
    }
    .user-pet-img img { width:28px; height:28px; object-fit:contain; image-rendering:pixelated; }
    .user-pet-name { font-size:12px; font-weight:700; color:var(--t1); flex:1; }
    .user-pet-type {
      font-size:10px; font-weight:700; padding:2px 6px;
      border-radius:5px; font-family:'Nunito',sans-serif;
    }
    .type-general { background:#f0eeff; color:var(--a1); border:1px solid var(--border2); }
    .type-rebirth { background:#fff0f6; color:var(--a2); border:1px solid #f5c8de; }
    .user-pet-rank-badge {
      font-size:11px; font-weight:800; min-width:22px; text-align:right;
      font-family:'Nunito',sans-serif; color:var(--t2);
    }

    /* ── Pet Cards ── */
    .pet-card {
      background:var(--white); border:1.5px solid var(--border);
      border-radius:20px; padding:20px; margin-bottom:16px;
      box-shadow:var(--shadow); transition:all .2s;
    }
    .pet-card:hover { border-color:var(--a1); box-shadow:var(--shadow2); }
    .pet-card-header {
      display:flex; align-items:center; gap:14px;
      margin-bottom:16px; padding-bottom:14px;
      border-bottom:1.5px solid var(--border);
    }
    .pet-img-box {
      width:72px; height:72px; flex-shrink:0;
      background:linear-gradient(135deg,var(--s1),var(--s2));
      border:1.5px solid var(--border2); border-radius:14px;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; box-shadow:0 2px 10px rgba(155,135,245,0.12);
    }
    .pet-img-box img { width:60px; height:60px; object-fit:contain; image-rendering:pixelated; }
    .pet-img-box .no-img { font-size:28px; }
    .pet-card-name {
      font-family:'Nunito',sans-serif; font-size:20px; font-weight:900; color:var(--t1);
    }
    .pet-card-sub { font-size:11px; color:var(--t3); margin-top:3px; }

    /* 랭킹 섹션 */
    .ranking-section { margin-bottom:20px; }
    .ranking-section:last-child { margin-bottom:0; }
    .ranking-section-title {
      font-size:10px; letter-spacing:2px; text-transform:uppercase;
      color:var(--t3); font-family:'Nunito',sans-serif; font-weight:800;
      margin-bottom:10px;
      display:flex; align-items:center; gap:6px;
    }
    .ranking-section-title::before {
      content:''; display:block; width:3px; height:12px;
      background:linear-gradient(135deg,var(--a1),var(--a2));
      border-radius:2px;
    }
    .ranking-list { display:flex; flex-direction:column; gap:6px; }
    .ranking-item {
      display:flex; align-items:flex-start; gap:10px;
      padding:10px 12px;
      background:var(--s1); border:1px solid var(--border);
      border-radius:12px; transition:all .15s;
    }
    .ranking-item:hover { border-color:var(--border2); background:var(--s2); }
    .rank-badge {
      min-width:28px; height:28px; border-radius:8px;
      background:var(--a1); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:900; flex-shrink:0;
      font-family:'Nunito',sans-serif;
    }
    .rank-badge.rank-1 { background:linear-gradient(135deg,#f5c842,#e8a020); }
    .rank-badge.rank-2 { background:linear-gradient(135deg,#c0c0c0,#9b9b9b); }
    .rank-badge.rank-3 { background:linear-gradient(135deg,#e0a060,#c87941); }
    .rank-badge.tie { background:var(--t3); }

    .rank-info { flex:1; min-width:0; }
    .rank-nick {
      font-size:13px; font-weight:700; color:var(--t1); margin-bottom:2px;
    }
    .rank-score {
      font-size:11px; color:var(--a1); font-weight:700;
      font-family:'Nunito',sans-serif;
    }
    /* 능력치 상세 */
    .rank-stats {
      display:flex; gap:6px; flex-wrap:wrap; margin-top:5px;
    }
    .stat-chip {
      font-size:10px; font-weight:700; padding:2px 7px;
      border-radius:6px; font-family:'Nunito',sans-serif;
    }
    .stat-lv  { background:#f0eeff; color:var(--a1); border:1px solid var(--border2); }
    .stat-atk { background:#fff0f6; color:var(--a2); border:1px solid #f5c8de; }
    .stat-def { background:#f0f9ff; color:#5ab5e0; border:1px solid #c5e8f7; }
    .stat-agi { background:#f0fff8; color:#5acba8; border:1px solid #b8edd8; }
    .stat-exp { background:#fffbf0; color:#d4943a; border:1px solid #f5deb0; }

    .view-more-btn {
      width:100%; margin-top:10px;
      padding:9px; background:var(--s2);
      border:1.5px solid var(--border2); border-radius:10px;
      color:var(--a1); font-size:12px; font-weight:700;
      font-family:'Noto Sans KR',sans-serif;
      cursor:pointer; transition:all .15s;
    }
    .view-more-btn:hover { background:var(--a1); color:#fff; border-color:var(--a1); }

    .empty-state {
      text-align:center; padding:24px; color:var(--t3); font-size:13px;
    }

    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0; z-index:500;
      background:rgba(61,53,96,0.45); backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center;
      padding:20px;
    }
    .modal-overlay.active { display:flex; animation:fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal-card {
      background:var(--white); border-radius:24px;
      box-shadow:0 20px 60px rgba(155,135,245,0.25);
      width:100%; max-width:520px; max-height:88vh;
      overflow-y:auto; animation:slideUp .25s ease;
      position:relative;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .modal-card::-webkit-scrollbar { width:4px; }
    .modal-card::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
    .modal-close {
      position:absolute; top:14px; right:14px;
      width:32px; height:32px; border-radius:50%;
      background:var(--s2); border:none; cursor:pointer;
      font-size:14px; color:var(--t2); transition:all .15s;
      display:flex; align-items:center; justify-content:center;
    }
    .modal-close:hover { background:var(--err); color:#fff; }
    .modal-hero {
      background:linear-gradient(135deg,var(--s1),var(--s2));
      border-radius:24px 24px 0 0;
      padding:24px 24px 18px;
      display:flex; align-items:center; gap:16px;
      border-bottom:1.5px solid var(--border);
    }
    .modal-pet-img {
      width:80px; height:80px; flex-shrink:0;
      background:var(--white); border:2px solid var(--border2);
      border-radius:16px; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 16px rgba(155,135,245,0.15);
    }
    .modal-pet-img img { width:68px; height:68px; object-fit:contain; image-rendering:pixelated; }
    .modal-pet-img .no-img { font-size:32px; }
    .modal-title-txt {
      font-family:'Nunito',sans-serif; font-size:22px; font-weight:900; color:var(--t1);
    }
    .modal-sub-txt { font-size:12px; color:var(--t3); margin-top:3px; }
    .modal-body-inner { padding:18px 20px 24px; }
    .modal-rank-item {
      display:flex; align-items:flex-start; gap:10px;
      padding:10px 0; border-bottom:1px solid var(--border);
    }
    .modal-rank-item:last-child { border-bottom:none; }

    /* ── Update info ── */
    .update-notice {
      background:var(--white); border:1.5px solid var(--border);
      border-radius:14px; padding:12px 18px;
      font-size:12px; color:var(--t3); margin-bottom:20px;
      display:flex; align-items:center; gap:8px;
      box-shadow:var(--shadow);
    }
    .update-dot {
      width:8px; height:8px; background:var(--ok);
      border-radius:50%; flex-shrink:0;
      animation:pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.8)} }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

    @media(max-width:768px) {
      .user-grid { grid-template-columns:1fr; }
      .header-top { padding:12px 14px; }
      .hero-title { font-size:26px; }
    }

    /* ── Dark mode ── */
    [data-theme="dark"] .page-header { background:#252540; border-color:#404060; }
    [data-theme="dark"] .user-card { background:#252540; border-color:#404060; }
    [data-theme="dark"] .pet-card { background:#252540; border-color:#404060; }
    [data-theme="dark"] .ranking-item { background:#2a2a45; border-color:#404060; }
    [data-theme="dark"] .ranking-item:hover { background:#353555; }
    [data-theme="dark"] .update-notice { background:#252540; border-color:#404060; }
    [data-theme="dark"] .search-wrap { background:#252540; border-color:#404060; }
    [data-theme="dark"] .search-wrap input { color:#e8e8f0; }
    [data-theme="dark"] .tab-btn { color:#b0b0c8; }
    [data-theme="dark"] .tab-btn:hover { background:#2a2a45; color:#9b87f5; }
    [data-theme="dark"] .tab-btn.active { background:#2a2a45; color:#9b87f5; }
    [data-theme="dark"] .modal-card { background:#252540; }
    [data-theme="dark"] .modal-hero { background:linear-gradient(135deg,#2a2a45,#353555); border-color:#404060; }
    [data-theme="dark"] .modal-rank-item { border-color:#404060; }
    [data-theme="dark"] .stat-lv { background:rgba(155,135,245,.15); color:#b8a8ff; border-color:rgba(155,135,245,.3); }
    [data-theme="dark"] .stat-atk { background:rgba(245,135,184,.15); color:#f5a8cc; border-color:rgba(245,135,184,.3); }
    [data-theme="dark"] .stat-def { background:rgba(135,212,245,.12); color:#7ec8e8; border-color:rgba(135,212,245,.25); }
    [data-theme="dark"] .stat-agi { background:rgba(87,245,192,.1); color:#6dd5a0; border-color:rgba(87,245,192,.2); }
    [data-theme="dark"] .stat-exp { background:rgba(245,200,135,.12); color:#d4b060; border-color:rgba(245,200,135,.25); }
    [data-theme="dark"] .pet-img-box { background:linear-gradient(135deg,#2a2a45,#353555); border-color:#505080; }
    [data-theme="dark"] .user-pet-img { background:#2a2a45; border-color:#404060; }
    [data-theme="dark"] .modal-pet-img { background:#252540; border-color:#505080; }
    [data-theme="dark"] .view-more-btn { background:#2a2a45; border-color:#505080; color:#9b87f5; }
    [data-theme="dark"] .view-more-btn:hover { background:#9b87f5; color:#fff; border-color:#9b87f5; }
    [data-theme="dark"] .pet-badge { background:#2a2a45; border-color:#505080; color:#9b87f5; }
    [data-theme="dark"] .user-pet-row { border-color:#404060; }
    [data-theme="dark"] .tabs-row { border-color:#404060; }
    [data-theme="dark"] .type-general { background:rgba(155,135,245,.15); color:#b8a8ff; border-color:rgba(155,135,245,.3); }
    [data-theme="dark"] .type-rebirth { background:rgba(245,135,184,.15); color:#f5a8cc; border-color:rgba(245,135,184,.3); }
  </style>
</head>
<body>

<!-- ── Header ── -->
<div class="page-header">
  <div class="header-top">
    <div class="header-title">🏆 WIND 펫 랭킹</div>
    <button class="dark-btn" onclick="toggleDark()" title="다크모드">🌙</button>
  </div>
  <div class="page-nav">
    <a href="index.html"       class="pnav-tab">🏠 환각 계산기</a>
    <a href="pokedex.html"     class="pnav-tab">🐾 펫 도감</a>
    <a href="card.html"        class="pnav-tab">🎲 큐브 시뮬레이터</a>
    <a href="raid.html"        class="pnav-tab">🏢 인력사무소</a>
    <a href="pet_ranking.html" class="pnav-tab pnav-active">🏆 펫 랭킹</a>
  </div>
</div>

<!-- ── Main ── -->
<div class="main-wrap">

  <!-- Hero -->
  <div class="page-hero">
    <div class="hero-badge"><div class="hero-badge-dot"></div> WIND RANKING</div>
    <div class="hero-title">펫 랭킹</div>
    <div class="hero-sub" id="updateTime">데이터 로드 중...</div>
  </div>

  <!-- Update notice -->
  <div class="update-notice">
    <div class="update-dot"></div>
    <span id="updateNotice">랭킹 데이터를 불러오는 중입니다...</span>
  </div>

  <!-- Tabs -->
  <div class="tabs-row">
    <button class="tab-btn active" onclick="switchTab('user-tab', this)">🏆 유저 순위</button>
    <button class="tab-btn" onclick="switchTab('pet-tab', this)">🐾 펫별 랭킹</button>
  </div>

  "킹북이":"https://pooyas.com/files/extravar_upload/109631/594/167/9eadedc741d98f83f47517689189fe31.gif",
};

function getPetImg(name) {
  const url = PET_IMAGES[name];
  if (!url) return `<span class="no-img">🐾</span>`;
  return `<img src="${url}" alt="${name}" onerror="this.parentElement.innerHTML='<span class=\\'no-img\\'>🐾</span>'">`;
}

// ── Data ──
let latestData = null;

async function loadData() {
  try {
    const r = await fetch('pet_ranking_data.json');
    const allData = await r.json();
    if (allData && allData.length > 0) {
      latestData = allData[allData.length - 1];
      const dt = new Date(latestData.timestamp);
      document.getElementById('updateTime').textContent =
        `마지막 업데이트: ${dt.toLocaleString('ko-KR')}`;
      document.getElementById('updateNotice').textContent =
        `총 ${latestData.total_pets}마리 펫 랭킹 데이터 로드 완료`;
      renderUserRanking(latestData.pets);
      renderPetRanking(latestData.pets);
    }
  } catch(e) {
    document.getElementById('updateTime').textContent = '데이터를 불러올 수 없습니다.';
    document.getElementById('updateNotice').textContent = 'pet_ranking_data.json 파일을 확인해 주세요.';
  }
}

// ── 동률 처리 ──
function assignRanks(arr) {
  if (!arr || arr.length === 0) return [];
  const result = [];
  let rank = 1;
  for (let i = 0; i < arr.length; i++) {
    const cur = parseFloat(arr[i].score);
    if (i > 0 && cur !== parseFloat(arr[i-1].score)) rank = i + 1;
    result.push({ ...arr[i], displayRank: rank, isTie: i > 0 && cur === parseFloat(arr[i-1].score) });
  }
  return result;
}

// ── 유저 순위 ──
function renderUserRanking(pets) {
  // 유저별 펫 집계: {nickname: {count, pets: [{petName, type, rank, score}]}}
  const userMap = {};
  pets.forEach(pet => {
    const all = [
      ...(pet.general_ranking||[]).map(r=>({...r, type:'general'})),
      ...(pet.rebirth_ranking||[]).map(r=>({...r, type:'rebirth'}))
    ];
    all.forEach(r => {
      if (!r.nickname) return;
      if (!userMap[r.nickname]) userMap[r.nickname] = { count:0, pets:[] };
      userMap[r.nickname].count++;
      userMap[r.nickname].pets.push({ petName:pet.name, type:r.type, rank:r.rank, score:r.score, level:r.level, attack:r.attack, defense:r.defense, speed:r.speed, exp:r.exp });
    });
  });

  // 정렬
  const sorted = Object.entries(userMap)
    .map(([name, d]) => ({ name, ...d }))
    .sort((a,b) => b.count - a.count);

  // 동률 등수
  let displayRank = 1;
  for (let i = 0; i < sorted.length; i++) {
    if (i > 0 && sorted[i].count !== sorted[i-1].count) displayRank = i + 1;
    sorted[i].displayRank = displayRank;
  }

  const grid = document.getElementById('userGrid');
  // 10위까지
  const visible = sorted.filter(u => u.displayRank <= 10);
  const rest = sorted.filter(u => u.displayRank > 10);

  grid.innerHTML = visible.map((user, i) => {
    const r = user.displayRank;
    let rankClass = '';
    let rankLabel = r;
    if (r === 1) { rankClass = 'gold'; rankLabel = '🥇 1위'; }
    else if (r === 2) { rankClass = 'silver'; rankLabel = '🥈 2위'; }
    else if (r === 3) { rankClass = 'bronze'; rankLabel = '🥉 3위'; }
    else rankLabel = `${r}위`;

    const isTie = i > 0 && user.count === sorted[i-1]?.count;

    const petRows = user.pets.map(p =>
      `<div class="user-pet-row">
        <div class="user-pet-img">${getPetImg(p.petName)}</div>
        <div class="user-pet-name">${p.petName}</div>
        <span class="user-pet-type ${p.type==='general'?'type-general':'type-rebirth'}">${p.type==='general'?'일반':'환생'}</span>
        <div class="user-pet-rank-badge">${p.rank}위</div>
      </div>`
    ).join('');

    return `<div class="user-card">
      <div class="user-rank-num ${rankClass}">${rankLabel}${isTie?' <span style="font-size:12px;font-family:Noto Sans KR;">동률</span>':''}</div>
      <div class="user-name">${user.name}</div>
      <div class="user-count">랭킹 보유: <strong>${user.count}마리</strong></div>
      <div class="pet-badges">
        ${[...new Set(user.pets.map(p=>p.petName))].slice(0,4).map(n=>`<span class="pet-badge">${n}</span>`).join('')}
        ${[...new Set(user.pets.map(p=>p.petName))].length > 4 ? `<span class="pet-badge">+${[...new Set(user.pets.map(p=>p.petName))].length - 4}</span>` : ''}
      </div>
      <div class="user-pet-detail" id="detail-${i}">
        ${petRows}
      </div>
      <button class="view-more-btn" style="margin-top:12px;" onclick="toggleUserDetail(${i}, this)">펫 상세 보기 ▼</button>
    </div>`;
  }).join('');

  if (rest.length > 0) {
    grid.innerHTML += `<div style="grid-column:1/-1; text-align:center;">
      <button class="view-more-btn" style="max-width:300px;margin:0 auto;" onclick="showAllUsers(${JSON.stringify(sorted.map(u=>({name:u.name,count:u.count,rank:u.displayRank,pets:u.pets}))).replace(/"/g,'&quot;')})">전체보기 (${sorted.length}명) ▼</button>
    </div>`;
  }
}

function toggleUserDetail(i, btn) {
  const el = document.getElementById('detail-' + i);
  if (el.classList.contains('open')) {
    el.classList.remove('open');
    btn.textContent = '펫 상세 보기 ▼';
  } else {
    el.classList.add('open');
    btn.textContent = '접기 ▲';
  }
}

function showAllUsers(users) {
  const imgEl = document.getElementById('modalImg');
  imgEl.innerHTML = '<span class="no-img">🏆</span>';
  document.getElementById('modalTitle').textContent = '유저 전체 순위';
  document.getElementById('modalSub').textContent = `총 ${users.length}명`;

  let html = '';
  users.forEach((user, i) => {
    const r = user.rank;
    let label = r===1?'🥇':r===2?'🥈':r===3?'🥉':'';
    const isTie = i > 0 && user.count === users[i-1]?.count;
    html += `<div class="modal-rank-item" style="flex-direction:column;align-items:flex-start;gap:4px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="rank-badge ${r<=3?'rank-'+r:''}" style="min-width:36px;height:28px;border-radius:8px;">${label||r+'위'}</div>
        <div>
          <div style="font-size:14px;font-weight:800;color:var(--t1);">${user.name}</div>
          <div style="font-size:11px;color:var(--t2);">랭킹 보유 ${user.count}마리${isTie?' · 동률':''}</div>
        </div>
      </div>
    </div>`;
  });

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('rankModal').classList.add('active');
}

// ── 펫별 랭킹 ──
function renderPetRanking(pets) {
  const container = document.getElementById('petContainer');

  container.innerHTML = pets.map(pet => {
    const general = assignRanks(pet.general_ranking || []);
    const rebirth = assignRanks(pet.rebirth_ranking || []);
    const imgHTML = getPetImg(pet.name);

    const makeItems = (list, limit) =>
      list.slice(0, limit).map(r => {
        const rClass = r.displayRank <= 3 ? `rank-${r.displayRank}` : r.isTie ? 'tie' : '';
        return `<div class="ranking-item">
          <div class="rank-badge ${rClass}">${r.isTie?'=':r.displayRank}</div>
          <div class="rank-info">
            <div class="rank-nick">${r.nickname}</div>
            <div class="rank-score">점수: ${r.score}</div>
            <div class="rank-stats">
              <span class="stat-chip stat-lv">Lv.${r.level}</span>
              <span class="stat-chip stat-exp">내구 ${r.exp}</span>
              <span class="stat-chip stat-atk">공격 ${r.attack}</span>
              <span class="stat-chip stat-def">방어 ${r.defense}</span>
              <span class="stat-chip stat-agi">순발 ${r.speed}</span>
            </div>
          </div>
        </div>`;
      }).join('');

    const genHTML = general.length > 0
      ? makeItems(general, 10) +
        (general.length > 10 ? `<button class="view-more-btn" onclick="openPetModal('${pet.name}','일반 랭킹',${JSON.stringify(general).replace(/"/g,'&quot;')})">전체보기 (${general.length}명) ▼</button>` : '')
      : '<div class="empty-state">랭킹 데이터 없음</div>';

    const rebHTML = rebirth.length > 0
      ? makeItems(rebirth, 10) +
        (rebirth.length > 10 ? `<button class="view-more-btn" onclick="openPetModal('${pet.name}','환생 랭킹',${JSON.stringify(rebirth).replace(/"/g,'&quot;')})">전체보기 (${rebirth.length}명) ▼</button>` : '')
      : '';

    return `<div class="pet-card" data-pet="${pet.name}">
      <div class="pet-card-header">
        <div class="pet-img-box">${imgHTML}</div>
        <div>
          <div class="pet-card-name">${pet.name}</div>
          <div class="pet-card-sub">일반 ${general.length}명 · 환생 ${rebirth.length}명</div>
        </div>
      </div>
      <div class="ranking-section">
        <div class="ranking-section-title">일반 랭킹</div>
        <div class="ranking-list">${genHTML}</div>
      </div>
      ${rebirth.length > 0 ? `<div class="ranking-section">
        <div class="ranking-section-title">환생 랭킹</div>
        <div class="ranking-list">${rebHTML}</div>
      </div>` : ''}
    </div>`;
  }).join('');

  // 검색
  document.getElementById('petSearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('[data-pet]').forEach(el => {
      el.style.display = el.dataset.pet.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

function openPetModal(petName, typeLabel, rankings) {
  const imgEl = document.getElementById('modalImg');
  const url = PET_IMAGES[petName];
  imgEl.innerHTML = url
    ? `<img src="${url}" alt="${petName}" onerror="this.parentElement.innerHTML='<span class=\\'no-img\\'>🐾</span>'">`
    : '<span class="no-img">🐾</span>';

  document.getElementById('modalTitle').textContent = petName;
  document.getElementById('modalSub').textContent = typeLabel + ' · 전체 ' + rankings.length + '명';

  document.getElementById('modalBody').innerHTML = rankings.map(r => {
    const rClass = r.displayRank<=3?`rank-${r.displayRank}`:r.isTie?'tie':'';
    return `<div class="modal-rank-item">
      <div class="rank-badge ${rClass}" style="flex-shrink:0;">${r.isTie?'=':r.displayRank}</div>
      <div class="rank-info">
        <div class="rank-nick">${r.nickname}</div>
        <div class="rank-score">점수: ${r.score}</div>
        <div class="rank-stats">
          <span class="stat-chip stat-lv">Lv.${r.level}</span>
          <span class="stat-chip stat-exp">내구 ${r.exp}</span>
          <span class="stat-chip stat-atk">공격 ${r.attack}</span>
          <span class="stat-chip stat-def">방어 ${r.defense}</span>
          <span class="stat-chip stat-agi">순발 ${r.speed}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('rankModal').classList.add('active');
}

// ── Tab & Modal ──
function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function closeModal() {
  document.getElementById('rankModal').classList.remove('active');
}

function handleModalClick(e) {
  if (e.target === document.getElementById('rankModal')) closeModal();
}

// ── Dark Mode ──
function toggleDark() {
  const h = document.documentElement;
  const next = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', next);
  localStorage.setItem('wind-dark', next);
}
(function() {
  document.documentElement.setAttribute('data-theme', localStorage.getItem('wind-dark') || 'light');
})();

// ── Init ──
loadData();
setInterval(loadData, 15000);
</script>
