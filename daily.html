/* ════════════════════════════════════════════════
   Yahoo Finance fetch
════════════════════════════════════════════════ */
async function fetchYahoo(symbol, range='1y', interval='1d') {
  try {
    const url = `https://corsproxy.io/?${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=${interval}&range=${range}`)}`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const data = await r.json();
    const result = data?.chart?.result?.[0];
    if (!result) return null;
    return result;
  } catch(e) { return null; }
}

async function fetchSummary(symbol) {
  const result = await fetchYahoo(symbol, '1y', '1d');
  if (!result) return null;
  const meta = result.meta;
  const close = meta.regularMarketPrice;
  const ts = result.timestamp || [];
  const closes = result.indicators?.quote?.[0]?.close || [];
  const points = [];
  for (let i = 0; i < closes.length; i++) {
    if (closes[i] != null) points.push({ t: ts[i] * 1000, c: closes[i] });
  }
  if (points.length === 0) return null;

  const last = points[points.length - 1];
  const idxAt = (daysBack) => {
    const targetTs = last.t - daysBack * 86400000;
    let best = points[0];
    for (const p of points) {
      if (p.t <= targetTs) best = p;
      else break;
    }
    return best;
  };
  const yesterday = points.length >= 2 ? points[points.length - 2] : null;
  const wAgo = idxAt(7);
  const mAgo = idxAt(30);
  const m3Ago = idxAt(90);
  const yAgo = idxAt(365);
  const calcPct = (then) => then ? ((close - then.c) / then.c) * 100 : null;

  // 변동성 (표준편차) 최근 30일
  const recent30 = points.slice(-30).map(p => p.c);
  let volatility = 0;
  if (recent30.length > 1) {
    const mean = recent30.reduce((a,b)=>a+b, 0) / recent30.length;
    const variance = recent30.reduce((a,b) => a + (b-mean)**2, 0) / recent30.length;
    volatility = Math.sqrt(variance) / mean * 100; // 변동률 %
  }

  // 추세 (단순 이동평균 비교: 5일 vs 20일)
  const ma5 = recent30.slice(-5).reduce((a,b)=>a+b, 0) / 5;
  const ma20 = recent30.length >= 20 ? recent30.slice(-20).reduce((a,b)=>a+b, 0) / 20 : ma5;
  const maTrend = ((ma5 - ma20) / ma20) * 100; // 5일선이 20일선 대비 얼마나

  // 52주 최고/최저 위치
  const yearHigh = meta.fiftyTwoWeekHigh || Math.max(...points.map(p=>p.c));
  const yearLow = meta.fiftyTwoWeekLow || Math.min(...points.map(p=>p.c));
  const yearPos = ((close - yearLow) / (yearHigh - yearLow)) * 100; // 0~100%

  return {
    close,
    yesterday: yesterday ? yesterday.c : null,
    pctDay:  calcPct(yesterday),
    pctWeek: calcPct(wAgo),
    pctMonth: calcPct(mAgo),
    pct3Month: calcPct(m3Ago),
    pctYear: calcPct(yAgo),
    volatility,
    maTrend,
    yearHigh,
    yearLow,
    yearPos,
    currency: meta.currency,
  };
}

  if (summary.pctDay > 5) reasons.push(`오늘 <strong>${summary.pctDay.toFixed(2)}% 급등</strong>으로 강한 매수세 유입`);
  else if (summary.pctDay > 2) reasons.push(`오늘 <strong>${summary.pctDay.toFixed(2)}% 상승</strong>하며 양호한 흐름`);
  else if (summary.pctDay > 0) reasons.push(`오늘 ${summary.pctDay.toFixed(2)}% 소폭 상승`);

  if (summary.pctWeek > 10) reasons.push(`최근 1주간 <strong>+${summary.pctWeek.toFixed(1)}%</strong>로 강한 단기 모멘텀 형성`);
  else if (summary.pctWeek > 3) reasons.push(`주간 +${summary.pctWeek.toFixed(1)}% 상승세 유지 중`);

  if (summary.pctMonth > 15) reasons.push(`월간 <strong>+${summary.pctMonth.toFixed(1)}%</strong>로 중기 추세 매우 강함`);
  else if (summary.pctMonth > 5) reasons.push(`월간 +${summary.pctMonth.toFixed(1)}% 안정적 상승`);

  if (summary.pctYear > 30) reasons.push(`연간 <strong>+${summary.pctYear.toFixed(0)}%</strong>의 장기 우상향 추세`);
  else if (summary.pctYear > 10) reasons.push(`연간 +${summary.pctYear.toFixed(0)}% 상승으로 장기 성장 종목`);

  if (summary.maTrend > 3) reasons.push(`5일선이 20일선 위에서 정배열, <strong>골든크로스 추세</strong>`);

  if (summary.yearPos > 80) reasons.push(`52주 최고가 근처 (${summary.yearPos.toFixed(0)}% 지점)에서 강력한 상승 모멘텀`);
  else if (summary.yearPos > 60) reasons.push(`52주 고점권 진입 (${summary.yearPos.toFixed(0)}%)`);

  // === 전망 ===
  const outlook = [];
  if (summary.pctMonth > 0 && summary.pctWeek > 0 && summary.pctDay > 0) {
    outlook.push(`<strong>단기/중기 모두 우상향</strong>. 현재 흐름이 지속될 가능성 있음`);
  } else if (summary.pctMonth > 0 && summary.pctWeek < 0) {
    outlook.push(`중기 상승 추세는 유효하나, 최근 1주 단기 조정 진행 중. 조정 끝나면 재상승 가능`);
  } else if (summary.pctMonth < 0 && summary.pctWeek > 0) {
    outlook.push(`중기 하락 후 단기 반등 시도. 추세 전환 여부 주시 필요`);
  }
  if (summary.maTrend > 5) outlook.push(`이동평균선 정배열 강세, <strong>추가 상승 여력</strong> 있어 보임`);
  else if (summary.maTrend < -5) outlook.push(`이동평균선 역배열, 단기적으로 반등은 어려울 수 있음`);
  if (t.sector === 'AI/반도체' || t.sector === '빅테크') {
    outlook.push(`AI/반도체 섹터 전반 상승 흐름과 동행, 섹터 호황 수혜 가능성`);
  }
  if (t.sector === '바이오') {
    outlook.push(`바이오 섹터는 임상 결과/FDA 승인 등 이벤트에 변동성 큼`);
  }
  if (t.sector === '배터리') {
    outlook.push(`전기차 수요 회복 시 배터리 수혜, 다만 중국 경쟁 변수 존재`);
  }
  if (outlook.length === 0) {
    outlook.push(`현재 데이터로는 뚜렷한 방향성 제시 어려움. 시장 분위기 따라 판단 필요`);
  }

  // === 불안 요소 ===
  const risks = [];
  if (summary.pctDay < -3) risks.push(`<strong>오늘 ${summary.pctDay.toFixed(2)}% 급락</strong>, 추가 하락 가능성 주시`);
  if (summary.pctWeek < -5) risks.push(`주간 ${summary.pctWeek.toFixed(1)}% 하락으로 단기 약세`);
  if (summary.pctMonth < -10) risks.push(`<strong>월간 ${summary.pctMonth.toFixed(1)}% 하락</strong>, 중기 추세 훼손`);
  if (summary.volatility > 5) risks.push(`최근 30일 변동성 ${summary.volatility.toFixed(1)}%로 <strong>높은 편</strong>, 손절 라인 설정 권장`);
  if (summary.yearPos < 30) risks.push(`52주 저가권(${summary.yearPos.toFixed(0)}%)에서 거래, <strong>바닥 확인 전 진입 위험</strong>`);
  if (summary.maTrend < -3) risks.push(`이동평균선 데드크로스 상태, 추가 약세 가능성`);
  if (summary.pctYear < -20) risks.push(`연간 ${summary.pctYear.toFixed(0)}% 하락 종목, <strong>장기 추세 약함</strong>`);
  if (t.sector === '전기차' && summary.pctMonth < 0) risks.push(`전기차 시장 경쟁 심화, 마진 압박 우려`);
  if (t.sector === '코인' || t.sector === '핀테크') risks.push(`암호화폐 시세 변동에 따른 영향 큼`);
  if (t.sector === '미디어' || t.sector === '엔터') risks.push(`구독자 추이/콘텐츠 성과 따라 변동성 큰 섹터`);

  if (risks.length === 0) {
    risks.push(`현재 뚜렷한 약점은 보이지 않으나, 일반적 시장 리스크는 항상 존재`);
    risks.push(`개별 종목은 거시 경제 변화(금리, 환율 등) 영향 받음`);
  }

  return {
    reasons: reasons.length > 0 ? reasons : ['종합 분석 결과 안정적인 흐름'],
    outlook,
    risks,
  };
}

/* 펫 코멘트 (간단) */
function petComment(pct) {
  if (pct > 5) return randPick(['🔥 활활 타오르네!', '오늘 대박이야!', '이거 뜨겁다!']);
  if (pct > 1) return randPick(['오 상승세 좋아!', '🎉 축하해 주주들!', '기분 좋은 그린!']);
  if (pct > 0) return randPick(['살짝 올랐어~', '소소하게 상승!']);
  if (pct > -1) return randPick(['보합권이네', '큰 변화 없음']);
  if (pct > -5) return randPick(['음 하락세 ㅠ', '오늘은 빨간날']);
  return randPick(['😱 폭락이야!!', '존버 모드 ON', '진정해...']);
}

/* ════════════════════════════════════════════════
   카드 렌더
════════════════════════════════════════════════ */
function periodItem(label, pct) {
  if (pct === null || pct === undefined || isNaN(pct)) {
    return `<div class="rc-period-item"><div class="rc-period-label">${label}</div><div class="rc-period-value neutral">-</div></div>`;
  }
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'neutral';
  const sign = pct >= 0 ? '+' : '';
  return `<div class="rc-period-item"><div class="rc-period-label">${label}</div><div class="rc-period-value ${cls}">${sign}${pct.toFixed(2)}%</div></div>`;
}

function renderRecCard(t, summary, type) {
  const isKR = isKRSym(t.sym);
  const pct = summary.pctDay;
  const upDown = pct > 0 ? 'up' : pct < 0 ? 'down' : 'neutral';
  const pet = randomPet();
  const priceStr = isKR ? fmtPrice(summary.close, true) + '원' : '$' + fmtPrice(summary.close, false);
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '─';
  const diff = summary.close - (summary.yesterday || summary.close);
  const diffStr = (diff >= 0 ? '+' : '') + fmtPrice(Math.abs(diff), isKR);

  const tagClass = type;
  const tagText = type === 'buy' ? '🔥 강력 추천 매수'
                : type === 'watch' ? '👀 관심 종목'
                : '⚠️ 주의 / 매수 자제';

  const analysis = generateAnalysis(t, summary);
  const reasonsHtml = analysis.reasons.map(r => `<li>${r}</li>`).join('');
  const outlookHtml = analysis.outlook.map(r => `<li>${r}</li>`).join('');
  const risksHtml = analysis.risks.map(r => `<li>${r}</li>`).join('');

  return `
    <div class="rec-card ${type}">
      <div class="rc-header">
        <div class="rc-info">
          <span class="rc-emoji">${t.emoji}</span>
          <div class="rc-name-block">
            <div class="rc-name">${escapeHtml(t.name)}</div>
            <div class="rc-sub">${t.sym.replace('.KS','').replace('.KQ','').replace('^','')} · ${t.country} · ${t.sector}</div>
            <span class="rc-tag ${tagClass}">${tagText}</span>
          </div>
        </div>
        <div class="rc-price">
          <div class="rc-price-now ${upDown}">${priceStr}</div>
          <div class="rc-change ${upDown}">${arrow} ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% (${diffStr})</div>
        </div>
      </div>

      <div class="rc-period-compare">
        ${periodItem('전일', summary.pctDay)}
        ${periodItem('1주', summary.pctWeek)}
        ${periodItem('1개월', summary.pctMonth)}
        ${periodItem('3개월', summary.pct3Month)}
        ${periodItem('1년', summary.pctYear)}
      </div>

      <div class="rc-analysis">
        <div class="analysis-block reason">
          <div class="analysis-label">💡 추천 이유</div>
          <div class="analysis-content"><ul style="margin:0;padding-left:18px;">${reasonsHtml}</ul></div>
        </div>
        <div class="analysis-block outlook">
          <div class="analysis-label">🔭 앞으로 전망</div>
          <div class="analysis-content"><ul style="margin:0;padding-left:18px;">${outlookHtml}</ul></div>
        </div>
        <div class="analysis-block risk">
          <div class="analysis-label">⚠️ 불안 요소 / 리스크</div>
          <div class="analysis-content"><ul style="margin:0;padding-left:18px;">${risksHtml}</ul></div>
        </div>
      </div>

      <div class="rc-pet-row">
        ${pet ? `<img class="rc-pet-img" src="${pet.image}" alt="" onerror="this.style.visibility='hidden'">` : ''}
        <div class="rc-pet-comment">${escapeHtml(petComment(pct))}</div>
      </div>
    </div>
  `;
}

/* ════════════════════════════════════════════════
   시장 요약 (지수)
════════════════════════════════════════════════ */
async function renderMarketSummary() {
  const wrap = $('market-summary');
  wrap.className = 'market-summary';
  wrap.innerHTML = '<div class="ms-item"><div class="ms-label">시장 데이터 로딩 중...</div></div>';
  const items = [];
  for (const idx of INDICES) {
    const s = await fetchSummary(idx.sym);
    if (s) items.push({ ...idx, ...s });
  }
  if (items.length === 0) {
    wrap.innerHTML = '<div class="ms-item"><div class="ms-label">시장 데이터 가져오기 실패</div></div>';
    return;
  }
  wrap.innerHTML = items.map(i => {
    const cls = i.pctDay > 0 ? 'up' : i.pctDay < 0 ? 'down' : 'neutral';
    const arrow = i.pctDay > 0 ? '▲' : i.pctDay < 0 ? '▼' : '─';
    return `
      <div class="ms-item">
        <div class="ms-label">${i.emoji} ${i.name}</div>
        <div class="ms-value ${cls}">${arrow} ${(i.pctDay||0).toFixed(2)}%</div>
        <div class="ms-label">${i.close.toLocaleString('en-US', { maximumFractionDigits: 2 })}</div>
      </div>
    `;
  }).join('');
}

/* ════════════════════════════════════════════════
   메인
════════════════════════════════════════════════ */
async function renderMain() {
  const cont = $('main-container');
  cont.innerHTML = '<div class="loading">시장 분석 중 (약 30~60초 소요)</div>';

  const results = [];
  for (const t of TARGETS) {
    const summary = await fetchSummary(t.sym);
    if (!summary || summary.pctDay === null) continue;
    results.push({ ...t, summary });
  }

  if (results.length === 0) {
    cont.innerHTML = `
      <div class="loading">
        시장 데이터를 가져올 수 없습니다 ㅠㅠ<br>
        <small>장 마감 후 또는 API 일시 차단일 수 있어요. 잠시 후 다시 시도해보세요.</small>
      </div>
    `;
    return;
  }

  // 정렬
  const sorted = [...results].sort((a, b) => b.summary.pctDay - a.summary.pctDay);
  const topGainers = sorted.slice(0, 5);
  const topLosers = sorted.slice(-5).reverse();

  let html = `
    <div class="section-h recommend">🔥 오늘의 추천 종목 TOP 5</div>
    <div class="rec-grid">
  `;
  topGainers.forEach((t, idx) => {
    const type = t.summary.pctDay > 5 ? 'buy' : t.summary.pctDay > 0 ? 'watch' : 'watch';
    html += renderRecCard(t, t.summary, type);
  });
  html += '</div>';

  html += `
    <div class="section-h warning">⚠️ 주의 종목 TOP 5 (매수 자제 권장)</div>
    <div class="rec-grid">
  `;
  topLosers.forEach((t, idx) => {
    html += renderRecCard(t, t.summary, 'caution');
  });
  html += '</div>';

  cont.innerHTML = html;
}

/* ════════════════════════════════════════════════
   이벤트
════════════════════════════════════════════════ */
$('refresh-btn').addEventListener('click', () => {
  updateDate();
  renderMarketSummary();
  renderMain();
});

/* ════════════════════════════════════════════════
   초기화
════════════════════════════════════════════════ */
(async () => {
  updateDate();
  await loadPets();
  renderMarketSummary();
  renderMain();
  setInterval(updateDate, 60000);
})();
</script>
