<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 데일리 윈드 - wind01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --panel: #1a2332;
    --panel2: #232b3a;
    --border: #2a3344;
    --border-hi: #3d4858;
    --text: #e8ecf2;
    --text-muted: #8a96a8;
    --accent: #5acba8;
    --pink: #ff9ec7;
    --gold: #ffc640;
    --red: #ff5050;
    --green: #00d97e;
    --blue: #4da6ff;
    --purple: #c9a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
  }

  /* 헤더 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 16px;
    border-bottom: 1.5px solid var(--border);
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    margin: 0;
    background: linear-gradient(135deg, var(--pink), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .date {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .header .refresh-btn {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
  }
  .header .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 카테고리 탭 */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .tab {
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    transition: all .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--pink), var(--gold));
    color: #1a1f29;
    border-color: transparent;
  }

  /* 검색바 (주식 탭 전용) */
  .search-bar {
    display: none;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 16px;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-bar.active { display: flex; }
  .search-bar .search-label {
    font-size: 13px;
    color: var(--text);
    font-weight: 800;
    flex-shrink: 0;
  }
  .search-bar input {
    flex: 1;
    min-width: 140px;
    background: var(--bg2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 18px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
  }
  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-bar button {
    background: var(--accent);
    border: none;
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
  }
  .search-bar button:hover { background: #4ab098; }
  .search-bar .hint {
    font-size: 11px;
    color: var(--text-muted);
    width: 100%;
    margin-top: 4px;
  }
  .search-bar .quick-add {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .quick-chip {
    background: var(--bg2);
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
  }
  .quick-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* 추가된 종목 표시 */
  .my-stocks {
    display: none;
    margin-bottom: 14px;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .my-stocks.active { display: flex; }
  .my-stocks .label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .my-stock-chip {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 3px 10px 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .my-stock-chip .x {
    color: var(--red);
    cursor: pointer;
    font-weight: 800;
    margin-left: 2px;
  }

  /* ════════════════════════════════════════
     주식 카드 (전문가 스타일)
  ════════════════════════════════════════ */
  .stock-card {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .stock-card.recommend {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(255,198,64,0.2);
  }
  .stock-card.warning {
    border-color: var(--red);
    box-shadow: 0 0 0 1px rgba(255,80,80,0.2);
  }

  /* 카드 상단: 회사명 + 가격 */
  .sc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 20px 8px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .sc-info {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }
  .sc-emoji {
    font-size: 36px;
    line-height: 1;
  }
  .sc-name-block { min-width: 0; }
  .sc-name {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: var(--text);
    font-weight: 800;
    line-height: 1.2;
  }
  .sc-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 700;
  }
  .sc-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 800;
    margin-top: 4px;
    margin-right: 4px;
  }
  .sc-tag.buy {
    background: rgba(0,217,126,0.2);
    color: var(--green);
    border: 1px solid var(--green);
  }
  .sc-tag.watch {
    background: rgba(255,198,64,0.2);
    color: var(--gold);
    border: 1px solid var(--gold);
  }
  .sc-tag.caution {
    background: rgba(255,80,80,0.2);
    color: var(--red);
    border: 1px solid var(--red);
  }

  .sc-price {
    text-align: right;
  }
  .sc-price-now {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.1;
  }
  .sc-price-now.up { color: var(--green); }
  .sc-price-now.down { color: var(--red); }
  .sc-price-now.neutral { color: var(--text); }
  .sc-change {
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    font-weight: 700;
    margin-top: 2px;
  }
  .sc-change.up { color: var(--green); }
  .sc-change.down { color: var(--red); }

  /* 시간대 비교 (전일/1주/1개월/등) */
  .sc-period-compare {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
    gap: 1px;
    background: var(--border);
    margin: 0;
    padding: 1px;
  }
  .sc-period-item {
    background: var(--panel);
    padding: 8px 10px;
    text-align: center;
  }
  .sc-period-label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .sc-period-value {
    font-family: 'Jua', sans-serif;
    font-size: 13px;
    font-weight: 800;
  }
  .sc-period-value.up { color: var(--green); }
  .sc-period-value.down { color: var(--red); }
  .sc-period-value.neutral { color: var(--text); }

  /* 차트 영역 */
  .sc-chart-wrap {
    padding: 16px 20px 12px;
    background: var(--bg2);
  }
  .sc-chart-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .sc-chart-tab {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    padding: 4px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    transition: all .15s;
  }
  .sc-chart-tab:hover { color: var(--text); }
  .sc-chart-tab.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .sc-chart {
    width: 100%;
    height: 160px;
    display: block;
  }
  .sc-chart-loading {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 0;
    font-size: 12px;
  }

  /* OHLC 통계 */
  .sc-stats {
    padding: 10px 20px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 10px;
    background: var(--bg2);
  }
  .sc-stat {
    text-align: left;
  }
  .sc-stat-label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .sc-stat-val {
    font-family: 'Jua', sans-serif;
    font-size: 13px;
    color: var(--text);
    margin-top: 1px;
    font-weight: 800;
  }
  .sc-stat-val.up { color: var(--green); }
  .sc-stat-val.down { color: var(--red); }

  /* 펫 코멘트 (카드 하단) */
  .sc-pet-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 20px 14px;
    background: var(--panel);
    border-top: 1.5px solid var(--border);
  }
  .sc-pet-img {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(2px 3px 5px rgba(0,0,0,0.4));
    animation: petBob 3s ease-in-out infinite;
  }
  @keyframes petBob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-3px) rotate(3deg); }
  }
  .sc-pet-comment {
    flex: 1;
    min-width: 0;
    background: var(--panel2);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
    color: var(--text);
    font-weight: 700;
  }
  .sc-pet-comment::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 12px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 6px solid var(--panel2);
  }
  .sc-recommend-reason {
    padding: 0 20px 12px;
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
    line-height: 1.5;
  }

  /* ════════════════════════════════════════
     비주식 카드 (코인/뉴스/날씨/환율) - 작게
  ════════════════════════════════════════ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }
  .mini-card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg2) 100%);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    position: relative;
    overflow: hidden;
    transition: all .2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 180px;
  }
  .mini-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }

  /* 펫 + 코멘트 (작은 카드) */
  .pet-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 6px 0;
    margin-top: auto;
  }
  .pet-img {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(2px 3px 5px rgba(0,0,0,0.4));
    animation: petBob 3s ease-in-out infinite;
  }
  .pet-comment {
    flex: 1;
    min-width: 0;
    background: var(--panel2);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    font-weight: 700;
  }
  .card-title {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.4;
    color: var(--text);
  }
  .card-title a:hover { color: var(--accent); }
  .card-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .big-value {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    font-weight: 800;
    margin: 4px 0;
  }
  .big-value.up { color: var(--green); }
  .big-value.down { color: var(--red); }
  .big-value.neutral { color: var(--text); }
  .change {
    font-family: 'Jua', sans-serif;
    font-size: 13px;
    font-weight: 800;
  }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .symbol {
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    color: var(--accent);
    font-weight: 800;
  }
  .weather-icon {
    font-size: 42px;
    text-align: center;
    margin: 4px 0;
  }
  .weather-temp {
    font-family: 'Jua', sans-serif;
    font-size: 32px;
    text-align: center;
    color: var(--gold);
    font-weight: 800;
  }
  .weather-detail {
    display: flex;
    justify-content: space-around;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 700;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .footer {
    margin-top: 30px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.7;
    padding: 20px;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 22px; }
    .sc-header { padding: 14px; }
    .sc-name { font-size: 18px; }
    .sc-price-now { font-size: 22px; }
  }
</style>
<script src="nav.js"></script>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <h1>📊 데일리 윈드</h1>
      <div class="date" id="today-date"></div>
    </div>
    <button class="refresh-btn" id="refresh-btn">🔄 새로고침</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="us-stock">📈 미국주식</button>
    <button class="tab" data-cat="kr-stock">📊 한국주식</button>
    <button class="tab" data-cat="recommend">⭐ 추천종목</button>
    <button class="tab" data-cat="k-news">📰 한국경제</button>
    <button class="tab" data-cat="news">📰 해외경제</button>
    <button class="tab" data-cat="crypto">🪙 코인</button>
    <button class="tab" data-cat="fx">💱 환율</button>
    <button class="tab" data-cat="weather">🌤 날씨</button>
  </div>

  <!-- 검색바 (주식 탭 전용) -->
  <div class="search-bar" id="search-bar">
    <span class="search-label">🔍 종목 검색</span>
    <input type="text" id="stock-search" placeholder="회사명 또는 티커 (예: AAPL, 카카오, 005930)">
    <button id="stock-search-btn">추가</button>
    <div class="quick-add" id="quick-add"></div>
    <div class="hint">💡 한국 종목은 6자리 코드 또는 회사명으로, 미국은 티커(AAPL 등)로 검색</div>
  </div>

  <!-- 내가 추가한 종목들 표시 -->
  <div class="my-stocks" id="my-stocks"></div>

  <!-- 메인 컨테이너 -->
  <div id="main-container">
    <div class="loading">데이터 불러오는 중...</div>
  </div>

  <div class="footer">
    데이터: Yahoo Finance, CoinGecko, ExchangeRate-API, Open-Meteo, BBC, Google News<br>
    펫 마스코트가 시세에 따라 코멘트 합니다 🐾
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   상태
════════════════════════════════════════════════ */
const state = {
  petData: [],
  currentCat: 'us-stock',
  // 추가한 종목 (localStorage 동기화)
  myUSStocks: JSON.parse(localStorage.getItem('myUS') || '[]'),
  myKRStocks: JSON.parse(localStorage.getItem('myKR') || '[]'),
  // 미니카드용 캐시 (코인/환율/뉴스/날씨)
  miniCards: {},
  // 주식 데이터 캐시
  stockCache: {},
  // 차트 시간대 선택 (sym -> '1d'|'1w'|'1m'|'3m'|'1y')
  chartRange: {},
};

const $ = id => document.getElementById(id);

/* ════════════════════════════════════════════════
   기본 종목 (대표 3개씩)
════════════════════════════════════════════════ */
const DEFAULT_US = [
  { sym: 'AAPL',  name: '애플',     emoji: '🍎' },
  { sym: 'TSLA',  name: '테슬라',   emoji: '🚗' },
  { sym: 'NVDA',  name: '엔비디아', emoji: '🟢' },
];
const DEFAULT_KR = [
  { sym: '005930.KS', name: '삼성전자',    emoji: '📱' },
  { sym: '000660.KS', name: 'SK하이닉스',   emoji: '💾' },
  { sym: '035420.KS', name: '네이버',      emoji: '🔎' },
];

/* 검색용 한국 종목 매핑 (회사명 ↔ 티커) */
const KR_STOCK_DB = [
  { sym: '005930.KS', name: '삼성전자',    emoji: '📱', aliases: ['삼성', 'samsung'] },
  { sym: '000660.KS', name: 'SK하이닉스',   emoji: '💾', aliases: ['하이닉스', 'sk하이닉스'] },
  { sym: '035420.KS', name: '네이버',      emoji: '🔎', aliases: ['naver'] },
  { sym: '035720.KS', name: '카카오',      emoji: '💛', aliases: ['kakao'] },
  { sym: '005380.KS', name: '현대차',      emoji: '🚙', aliases: ['현대자동차', 'hyundai'] },
  { sym: '051910.KS', name: 'LG화학',      emoji: '🧪', aliases: ['엘지화학', 'lg chem'] },
  { sym: '006400.KS', name: '삼성SDI',     emoji: '🔋', aliases: ['삼성에스디아이'] },
  { sym: '207940.KS', name: '삼성바이오',   emoji: '💊', aliases: ['삼성바이오로직스'] },
  { sym: '003670.KS', name: '포스코홀딩스', emoji: '🏗', aliases: ['포스코', 'posco'] },
  { sym: '068270.KS', name: '셀트리온',    emoji: '🧬', aliases: ['celltrion'] },

async function loadPets() {
  try {
    const r = await fetch('pet_info_data.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data)) state.petData = data;
    }
  } catch(e) { console.warn('펫 로드 실패', e); }
}
function randomPet(filter) {
  let pool = state.petData;
  if (filter) pool = pool.filter(filter);
  if (pool.length === 0) pool = state.petData;
  return pool[Math.floor(Math.random() * pool.length)];
}
function petByAttr(attr) {
  return randomPet(p => (p.attr || {})[attr] >= 5);
}

function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function fmtVolume(v) {
  if (!v || isNaN(v)) return '-';
  if (v >= 1e9) return (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return v.toLocaleString();
}
function fmtPrice(v, isKR, isIndex) {
  if (v === undefined || v === null || isNaN(v)) return '-';
  if (isKR && !isIndex) return v.toLocaleString('ko-KR');
  if (isKR) return v.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
  if (isIndex) return v.toLocaleString('en-US', { maximumFractionDigits: 2 });
  return v.toFixed(2);
}
function isKRSym(sym) {
  return sym.endsWith('.KS') || sym.endsWith('.KQ') || sym.startsWith('^KS') || sym.startsWith('^KQ');
}

/* ════════════════════════════════════════════════
   주식 데이터 fetch (시간대별 차트 같이)
════════════════════════════════════════════════ */
const RANGE_MAP = {
  '1d': { range: '1d',  interval: '5m'  },
  '5d': { range: '5d',  interval: '15m' },
  '1m': { range: '1mo', interval: '1d'  },
  '3m': { range: '3mo', interval: '1d'  },
  '6m': { range: '6mo', interval: '1d'  },
  '1y': { range: '1y',  interval: '1d'  },
  '5y': { range: '5y',  interval: '1wk' },
};

async function fetchStockChart(symbol, range = '1m') {
  const r = RANGE_MAP[range] || RANGE_MAP['1m'];
  const key = symbol + '_' + range;
  if (state.stockCache[key]) return state.stockCache[key];
  try {
    const url = `https://corsproxy.io/?${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=${r.interval}&range=${r.range}`)}`;
    const resp = await fetch(url);
    if (!resp.ok) return null;
    const data = await resp.json();
    const result = data?.chart?.result?.[0];
    if (!result) return null;
    const meta = result.meta;
    const quotes = result.indicators?.quote?.[0] || {};
    const ts = result.timestamp || [];
    const closes = quotes.close || [];
    // null 필터링하면서 timestamp도 같이 정렬
    const points = [];
    for (let i = 0; i < closes.length; i++) {
      if (closes[i] !== null && closes[i] !== undefined) {
        points.push({ t: ts[i] * 1000, c: closes[i] });
      }
    }
    const cached = {
      meta,
      points,
      highs: (quotes.high || []).filter(v => v !== null),
      lows:  (quotes.low  || []).filter(v => v !== null),
      opens: (quotes.open || []).filter(v => v !== null),
      volumes: (quotes.volume || []).filter(v => v !== null),
    };
    state.stockCache[key] = cached;
    return cached;
  } catch(e) {
    console.warn('chart fetch fail', e);
    return null;
  }
}

/* 가격 변동률 (전일/주/월/3개월/연) */
async function fetchStockSummary(symbol) {
  // 1년치 가져와서 다양한 시점 비교
  const y = await fetchStockChart(symbol, '1y');
  if (!y || y.points.length === 0) return null;
  const points = y.points;
  const last = points[points.length - 1];
  const close = last.c;
  // 거꾸로 인덱싱
  const idxAt = (daysBack) => {
    if (points.length === 0) return null;
    const targetTs = last.t - daysBack * 86400000;
    let best = points[0];
    for (const p of points) {
      if (p.t <= targetTs) best = p;
      else break;
    }
    return best;
  };
  const yesterday = points.length >= 2 ? points[points.length - 2] : null;
  const wAgo = idxAt(7);
  const mAgo = idxAt(30);
  const m3Ago = idxAt(90);
  const yAgo = idxAt(365);
  const calcPct = (then) => then ? ((close - then.c) / then.c) * 100 : null;
  return {
    meta: y.meta,
    close,
    yesterday: yesterday ? yesterday.c : null,
    wAgo: wAgo ? wAgo.c : null,
    mAgo: mAgo ? mAgo.c : null,
    m3Ago: m3Ago ? m3Ago.c : null,
    yAgo: yAgo ? yAgo.c : null,
    pctDay:  calcPct(yesterday),
    pctWeek: calcPct(wAgo),
    pctMonth: calcPct(mAgo),
    pct3Month: calcPct(m3Ago),
    pctYear: calcPct(yAgo),
    open: y.opens[y.opens.length - 1],
    high: y.highs[y.highs.length - 1],
    low: y.lows[y.lows.length - 1],
    volume: y.volumes[y.volumes.length - 1],
    yearHigh: y.meta.fiftyTwoWeekHigh,
    yearLow: y.meta.fiftyTwoWeekLow,
  };
}

/* ════════════════════════════════════════════════
   차트 렌더링 (큰 SVG, 가격 라벨 포함)
════════════════════════════════════════════════ */
function renderChart(points, isUp, container, w, h) {
  if (!points || points.length < 2) {
    return '<div class="sc-chart-loading">차트 데이터 없음</div>';
  }
  const padding = { top: 10, right: 50, bottom: 20, left: 6 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;
  const closes = points.map(p => p.c);
  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const range = max - min || 1;
  const step = chartW / (points.length - 1);
  const xy = points.map((p, i) => ({
    x: padding.left + i * step,
    y: padding.top + chartH - ((p.c - min) / range) * chartH,
    c: p.c,
    t: p.t,
  }));
  const linePath = xy.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${xy[xy.length-1].x.toFixed(1)},${padding.top + chartH} L${xy[0].x.toFixed(1)},${padding.top + chartH} Z`;
  const color = isUp ? '#00d97e' : '#ff5050';
  const fillId = 'fillG_' + Math.random().toString(36).slice(2,8);

  // 가격 격자 (5단계)
  const yLabels = [];
  for (let i = 0; i <= 4; i++) {
    const v = max - (range * i / 4);
    const y = padding.top + (chartH * i / 4);
    yLabels.push({ v, y });
  }
  const gridLines = yLabels.map(l =>
    `<line x1="${padding.left}" y1="${l.y}" x2="${padding.left + chartW}" y2="${l.y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`
  ).join('');
  const yLabelsHtml = yLabels.map(l =>
    `<text x="${w - padding.right + 4}" y="${l.y + 3}" fill="#8a96a8" font-size="9" text-anchor="start">${fmtPrice(l.v, false, false)}</text>`
  ).join('');

  // X축 시간 라벨 (시작/중간/끝)
  const xLabels = [];
  if (xy.length > 0) {
    const first = xy[0];
    const last = xy[xy.length - 1];
    const mid = xy[Math.floor(xy.length / 2)];
    [first, mid, last].forEach((p, i) => {
      const d = new Date(p.t);
      const lbl = `${d.getMonth()+1}/${d.getDate()}`;
      const anchor = i === 0 ? 'start' : i === 2 ? 'end' : 'middle';
      xLabels.push(`<text x="${p.x}" y="${h - 4}" fill="#8a96a8" font-size="9" text-anchor="${anchor}">${lbl}</text>`);
    });
  }

  return `
    <svg class="sc-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#${fillId})"/>
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      ${yLabelsHtml}
      ${xLabels.join('')}
    </svg>
  `;
}

/* ════════════════════════════════════════════════
   주식 카드 렌더 (전문가 스타일)

function renderStockCard(t, summary, options = {}) {

  const isIndex = t.isIndex || false;
  const pct = summary.pctDay;
  const upDown = pct > 0 ? 'up' : pct < 0 ? 'down' : 'neutral';
  const pet = randomPet();
  const comment = options.comment || commentForChange(pct, 'stock');

  const priceStr = isIndex
    ? fmtPrice(summary.close, isKR, true)
    : (isKR ? fmtPrice(summary.close, isKR, false) + '원' : '$' + fmtPrice(summary.close, false, false));
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '─';
  const diff = summary.close - (summary.yesterday || summary.close);
  const diffStr = (diff >= 0 ? '+' : '') + fmtPrice(Math.abs(diff), isKR, isIndex);

  // 시간대 비교
  const periodCompare = `
    <div class="sc-period-compare">
      ${periodItem('전일', summary.pctDay)}
      ${periodItem('1주', summary.pctWeek)}
      ${periodItem('1개월', summary.pctMonth)}
      ${periodItem('3개월', summary.pct3Month)}
      ${periodItem('1년', summary.pctYear)}
    </div>
  `;

  // 차트 시간대
  const range = state.chartRange[t.sym] || '1m';
  const rangeBtns = ['1d','5d','1m','3m','6m','1y','5y'].map(r =>
    `<button class="sc-chart-tab ${r === range ? 'active' : ''}" data-sym="${t.sym}" data-range="${r}">${rangeLabel(r)}</button>`
  ).join('');

  // 추천 태그
  let tagHtml = '';
  if (options.tag) {
    const tagClass = options.tag === 'buy' ? 'buy' : options.tag === 'caution' ? 'caution' : 'watch';
    const tagText = options.tag === 'buy' ? '🔥 강력 추천'
                   : options.tag === 'caution' ? '⚠️ 주의'
                   : '👀 관심 종목';
    tagHtml = `<span class="sc-tag ${tagClass}">${tagText}</span>`;
  }

  let extraClass = '';
  if (options.tag === 'buy' || options.tag === 'watch') extraClass = ' recommend';
  else if (options.tag === 'caution') extraClass = ' warning';

  return `
    <div class="stock-card${extraClass}" data-sym="${t.sym}">
      <div class="sc-header">
        <div class="sc-info">
          <span class="sc-emoji">${t.emoji}</span>
          <div class="sc-name-block">
            <div class="sc-name">${escapeHtml(t.name)}</div>
            <div class="sc-sub">${t.sym.replace('.KS','').replace('.KQ','').replace('^','')} ${isIndex ? '· 지수' : ''}</div>
            ${tagHtml}
          </div>
        </div>
        <div class="sc-price">
          <div class="sc-price-now ${upDown}">${priceStr}</div>
          <div class="sc-change ${upDown}">${arrow} ${pct >= 0 ? '+' : ''}${(pct||0).toFixed(2)}% (${diffStr})</div>
        </div>
      </div>

      ${periodCompare}

      <div class="sc-chart-wrap">
        <div class="sc-chart-tabs">${rangeBtns}</div>
        <div class="sc-chart-container" data-sym="${t.sym}">
          <div class="sc-chart-loading">차트 로딩 중...</div>
        </div>
      </div>

      ${summary.open ? `
      <div class="sc-stats">
        <div class="sc-stat"><div class="sc-stat-label">시가</div><div class="sc-stat-val">${fmtPrice(summary.open, isKR, isIndex)}</div></div>
        <div class="sc-stat"><div class="sc-stat-label">고가</div><div class="sc-stat-val up">${fmtPrice(summary.high, isKR, isIndex)}</div></div>
        <div class="sc-stat"><div class="sc-stat-label">저가</div><div class="sc-stat-val down">${fmtPrice(summary.low, isKR, isIndex)}</div></div>
        ${summary.volume ? `<div class="sc-stat"><div class="sc-stat-label">거래량</div><div class="sc-stat-val">${fmtVolume(summary.volume)}</div></div>` : ''}
        ${summary.yearHigh ? `<div class="sc-stat"><div class="sc-stat-label">52주 고</div><div class="sc-stat-val">${fmtPrice(summary.yearHigh, isKR, isIndex)}</div></div>` : ''}
        ${summary.yearLow ? `<div class="sc-stat"><div class="sc-stat-label">52주 저</div><div class="sc-stat-val">${fmtPrice(summary.yearLow, isKR, isIndex)}</div></div>` : ''}
      </div>
      ` : ''}

      ${options.reason ? `<div class="sc-recommend-reason">💡 ${escapeHtml(options.reason)}</div>` : ''}

      <div class="sc-pet-row">
        ${pet ? `<img class="sc-pet-img" src="${pet.image}" alt="" onerror="this.style.visibility='hidden'">` : ''}
        <div class="sc-pet-comment">${escapeHtml(comment)}</div>
      </div>
    </div>
  `;
}

function periodItem(label, pct) {
  if (pct === null || pct === undefined || isNaN(pct)) {
    return `<div class="sc-period-item"><div class="sc-period-label">${label}</div><div class="sc-period-value neutral">-</div></div>`;
  }
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'neutral';
  const sign = pct >= 0 ? '+' : '';
  return `<div class="sc-period-item"><div class="sc-period-label">${label}</div><div class="sc-period-value ${cls}">${sign}${pct.toFixed(2)}%</div></div>`;
}

function rangeLabel(r) {
  return { '1d':'1일', '5d':'5일', '1m':'1개월', '3m':'3개월', '6m':'6개월', '1y':'1년', '5y':'5년' }[r] || r;
}

/* 카드의 차트 부분만 다시 그리기 */
async function refreshChart(sym) {
  const range = state.chartRange[sym] || '1m';
  const container = document.querySelector(`.sc-chart-container[data-sym="${sym}"]`);
  if (!container) return;
  container.innerHTML = '<div class="sc-chart-loading">차트 로딩 중...</div>';
  const data = await fetchStockChart(sym, range);
  if (!data || data.points.length === 0) {
    container.innerHTML = '<div class="sc-chart-loading">차트 데이터 없음</div>';
    return;
  }
  const isUp = data.points[data.points.length - 1].c >= data.points[0].c;
  container.innerHTML = renderChart(data.points, isUp, container.clientWidth || 600, 160);
}

/* ════════════════════════════════════════════════
   탭별 콘텐츠 렌더
════════════════════════════════════════════════ */
async function renderTab() {
  const cat = state.currentCat;
  const cont = $('main-container');

  // 검색바 표시 여부
  const showSearch = (cat === 'us-stock' || cat === 'kr-stock');
  $('search-bar').classList.toggle('active', showSearch);
  $('my-stocks').classList.toggle('active', showSearch);
  if (showSearch) updateSearchUI();

  if (cat === 'us-stock') {
    await renderStocks(cont, 'us');
  } else if (cat === 'kr-stock') {
    await renderStocks(cont, 'kr');
  } else if (cat === 'recommend') {
    await renderRecommendations(cont);
  } else if (cat === 'k-news') {
    cont.innerHTML = '<div class="loading">불러오는 중...</div>';
    const items = await fetchKoreanNews();
    cont.innerHTML = `<div class="grid">${items.map(renderMiniCard).join('')}</div>` || '<div class="loading">데이터 없음</div>';
  } else if (cat === 'news') {
    cont.innerHTML = '<div class="loading">번역 중...</div>';
    const items = await fetchWorldNews();
    cont.innerHTML = `<div class="grid">${items.map(renderMiniCard).join('')}</div>` || '<div class="loading">데이터 없음</div>';
  } else if (cat === 'crypto') {
    cont.innerHTML = '<div class="loading">코인 시세 가져오는 중...</div>';
    const items = await fetchCrypto();
    cont.innerHTML = `<div class="grid">${items.map(renderMiniCard).join('')}</div>` || '<div class="loading">데이터 없음</div>';
  } else if (cat === 'fx') {
    cont.innerHTML = '<div class="loading">환율 가져오는 중...</div>';
    const items = await fetchFx();
    cont.innerHTML = `<div class="grid">${items.map(renderMiniCard).join('')}</div>` || '<div class="loading">데이터 없음</div>';
  } else if (cat === 'weather') {
    cont.innerHTML = '<div class="loading">날씨 가져오는 중...</div>';
    const items = await fetchWeather();
    cont.innerHTML = `<div class="grid">${items.map(renderMiniCard).join('')}</div>` || '<div class="loading">데이터 없음</div>';
  }
}

function renderMiniCard(c) {
  const pet = c.pet;
  const petImg = pet ? `<img class="pet-img" src="${pet.image}" alt="" onerror="this.style.visibility='hidden'">` : '';
  return `
    <div class="mini-card">
      ${c.body}
      <div class="pet-row">
        ${petImg}
        <div class="pet-comment">${escapeHtml(c.comment)}</div>
      </div>
    </div>
  `;
}

/* ────────────────────────────────────────
   주식 탭 렌더
──────────────────────────────────────── */
async function renderStocks(cont, market) {
  cont.innerHTML = '<div class="loading">주식 데이터 가져오는 중...</div>';
  const defaults = market === 'us' ? DEFAULT_US : DEFAULT_KR;
  const myList = market === 'us' ? state.myUSStocks : state.myKRStocks;
  const db = market === 'us' ? US_STOCK_DB : KR_STOCK_DB;

  // 표시할 종목 = 기본 + 추가된 (중복 제거)
  const allSyms = [...new Set([...defaults.map(d => d.sym), ...myList])];
  const tickers = allSyms.map(sym => {
    const def = defaults.find(d => d.sym === sym);
    if (def) return def;
    const found = db.find(d => d.sym === sym);
    if (found) return found;
    return { sym, name: sym, emoji: '📊' };
  });

  // 카드 셸 먼저 그리고 비동기로 채움
  const html = tickers.map(t => `<div id="card_${cssEscape(t.sym)}" class="stock-card-placeholder loading">${t.emoji} ${t.name} 데이터 가져오는 중...</div>`).join('');
  cont.innerHTML = html || '<div class="loading">종목 없음</div>';

  // 병렬로 fetch
  for (const t of tickers) {
    const summary = await fetchStockSummary(t.sym);
    const slot = document.getElementById('card_' + cssId(t.sym));
    if (!slot) continue;
    if (!summary) {
      slot.outerHTML = `<div class="stock-card"><div class="sc-header"><div class="sc-info"><span class="sc-emoji">${t.emoji}</span><div><div class="sc-name">${t.name}</div><div class="sc-sub">데이터 가져오기 실패 (장 마감 또는 인식 불가)</div></div></div></div></div>`;
      continue;
    }
    slot.outerHTML = renderStockCard(t, summary);
    // 초기 차트 렌더 (1m 기본)
    if (!state.chartRange[t.sym]) state.chartRange[t.sym] = '1m';
    refreshChart(t.sym);
  }
}

function cssId(s) { return s.replace(/[^a-zA-Z0-9_-]/g, '_'); }
function cssEscape(s) { return cssId(s); }

/* ────────────────────────────────────────
   추천 탭 - 더 많은 추천 종목
──────────────────────────────────────── */
async function renderRecommendations(cont) {
  cont.innerHTML = '<div class="loading">시장 분석 중...</div>';

  // 미국, 한국 모든 주요 종목 fetch
  const usSyms = US_STOCK_DB.slice(0, 20).map(d => d.sym);
  const krSyms = KR_STOCK_DB.slice(0, 20).map(d => d.sym);
  const allSyms = [...usSyms, ...krSyms];

  const all = [];
  for (const sym of allSyms) {
    const summary = await fetchStockSummary(sym);
    if (!summary || summary.pctDay === null) continue;
    const meta = [...US_STOCK_DB, ...KR_STOCK_DB].find(d => d.sym === sym);
    all.push({ ...meta, summary });
  }

  // 정렬: 일간 변동률 기준
  const sortedDesc = [...all].sort((a, b) => b.summary.pctDay - a.summary.pctDay);

  // TOP 5 상승 / TOP 5 하락
  const topGainers = sortedDesc.slice(0, 5);
  const topLosers = sortedDesc.slice(-5).reverse();

  let html = '<h2 style="font-family:Jua;color:#00d97e;margin:10px 0;">🔥 오늘의 강력 추천 종목 (상승 TOP 5)</h2>';
  topGainers.forEach((t, idx) => {
    const tag = t.summary.pctDay > 5 ? 'buy' : 'watch';
    const reason = t.summary.pctDay > 5
      ? `🔥 오늘 ${t.summary.pctDay.toFixed(1)}% 상승! 강력한 모멘텀.`
      : `👀 오늘 ${t.summary.pctDay.toFixed(1)}% 상승. 추가 상승 기대.`;
    html += renderStockCard(t, t.summary, { tag, reason });
  });

  html += '<h2 style="font-family:Jua;color:#ff5050;margin:30px 0 10px;">⚠️ 주의 종목 (하락 TOP 5)</h2>';
  topLosers.forEach((t, idx) => {
    const reason = t.summary.pctDay < -5
      ? `⚠️ 오늘 ${t.summary.pctDay.toFixed(1)}% 하락. 추가 하락 가능성 주의.`
      : `📉 오늘 ${t.summary.pctDay.toFixed(1)}% 하락. 매수 시점 신중히.`;
    html += renderStockCard(t, t.summary, { tag: 'caution', reason });
  });

  cont.innerHTML = html;

  // 차트 비동기 렌더
  for (const t of [...topGainers, ...topLosers]) {
    if (!state.chartRange[t.sym]) state.chartRange[t.sym] = '1m';
    refreshChart(t.sym);
  }
}

/* ════════════════════════════════════════════════
   검색 + 종목 추가
════════════════════════════════════════════════ */
function searchStock(query) {
  query = query.trim().toLowerCase();
  if (!query) return null;
  // 한국 종목 (6자리)
  if (/^\d{6}$/.test(query)) {
    const ksFound = KR_STOCK_DB.find(d => d.sym.startsWith(query));
    if (ksFound) return { ...ksFound, market: 'kr' };
    // DB에 없어도 .KS로 시도
    return { sym: query + '.KS', name: query, emoji: '📊', market: 'kr' };
  }
  // 미국 티커 (대문자만)
  if (/^[A-Z]{1,5}$/.test(query.toUpperCase())) {
    const found = US_STOCK_DB.find(d => d.sym === query.toUpperCase());
    if (found) return { ...found, market: 'us' };
    return { sym: query.toUpperCase(), name: query.toUpperCase(), emoji: '📊', market: 'us' };
  }
  // 회사명 검색
  for (const db of [KR_STOCK_DB, US_STOCK_DB]) {
    const found = db.find(d => {
      if (d.name.toLowerCase().includes(query)) return true;
      if ((d.aliases || []).some(a => a.toLowerCase().includes(query))) return true;
      return false;
    });
    if (found) return { ...found, market: db === KR_STOCK_DB ? 'kr' : 'us' };
  }
  return null;
}

function addStock(sym, market) {
  if (market === 'us') {
    if (!state.myUSStocks.includes(sym)) {
      state.myUSStocks.push(sym);
      localStorage.setItem('myUS', JSON.stringify(state.myUSStocks));
    }
  } else {
    if (!state.myKRStocks.includes(sym)) {
      state.myKRStocks.push(sym);
      localStorage.setItem('myKR', JSON.stringify(state.myKRStocks));
    }
  }
  // 해당 탭으로 전환
  state.currentCat = market === 'us' ? 'us-stock' : 'kr-stock';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === state.currentCat));
  renderTab();
}

function removeStock(sym) {
  state.myUSStocks = state.myUSStocks.filter(s => s !== sym);
  state.myKRStocks = state.myKRStocks.filter(s => s !== sym);
  localStorage.setItem('myUS', JSON.stringify(state.myUSStocks));
  localStorage.setItem('myKR', JSON.stringify(state.myKRStocks));
  renderTab();
}

function updateSearchUI() {
  const isUS = state.currentCat === 'us-stock';
  const myList = isUS ? state.myUSStocks : state.myKRStocks;
  const db = isUS ? US_STOCK_DB : KR_STOCK_DB;
  const quickList = isUS ? QUICK_ADD_US : QUICK_ADD_KR;
  const myAdded = new Set(myList);

  // 빠른 추가
  $('quick-add').innerHTML = quickList.filter(s => !myAdded.has(s)).map(sym => {
    const meta = db.find(d => d.sym === sym);
    if (!meta) return '';
    return `<button class="quick-chip" onclick="addStock('${sym}', '${isUS ? 'us' : 'kr'}')">+ ${meta.emoji} ${meta.name}</button>`;
  }).join('');

  // 내 종목 칩
  if (myList.length > 0) {
    $('my-stocks').innerHTML = '<span class="label">내 종목:</span>' + myList.map(sym => {
      const meta = db.find(d => d.sym === sym);
      const name = meta ? meta.name : sym;
      const emoji = meta ? meta.emoji : '📊';
      return `<span class="my-stock-chip">${emoji} ${name}<span class="x" onclick="removeStock('${sym}')">×</span></span>`;
    }).join('');
  } else {
    $('my-stocks').innerHTML = '';
  }
}

window.addStock = addStock;
window.removeStock = removeStock;

/* ════════════════════════════════════════════════
   비주식 데이터 fetch
════════════════════════════════════════════════ */
async function fetchKoreanNews() {
  try {
    const rss = encodeURIComponent('https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko');
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${rss}`;
    const r = await fetch(url);
    const data = await r.json();
    const items = (data.items || []).slice(0, 12);
    return items.map(it => {
      const pet = petByAttr('화') || randomPet();
      const ts = it.pubDate ? new Date(it.pubDate) : null;
      const tsStr = ts ? `${ts.getMonth()+1}/${ts.getDate()} ${ts.getHours()}:${String(ts.getMinutes()).padStart(2,'0')}` : '';
      return {
        pet,
        comment: commentForNews(it.title),
        body: `
          <div class="card-title">
            <a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
          </div>
          <div class="card-meta">${escapeHtml((it.author||'').slice(0,30))} · ${tsStr}</div>
        `,
      };
    });
  } catch(e) { return []; }
}

async function translateToKr(text) {
  if (!text) return '';
  try {
    const trimmed = text.length > 500 ? text.slice(0, 500) : text;
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(trimmed)}&langpair=en|ko`;
    const r = await fetch(url);
    const data = await r.json();
    if (data.responseData && data.responseData.translatedText) {
      return data.responseData.translatedText;
    }
  } catch(e) {}
  return text;
}

async function fetchWorldNews() {
  try {
    const rss = encodeURIComponent('http://feeds.bbci.co.uk/news/business/rss.xml');
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${rss}`;
    const r = await fetch(url);
    const data = await r.json();
    const items = (data.items || []).slice(0, 12);
    const translations = await Promise.all(items.map(it => translateToKr(it.title)));
    return items.map((it, idx) => {
      const pet = petByAttr('풍') || randomPet();
      const ts = it.pubDate ? new Date(it.pubDate) : null;
      const tsStr = ts ? `${ts.getMonth()+1}/${ts.getDate()} ${ts.getHours()}:${String(ts.getMinutes()).padStart(2,'0')}` : '';
      const koTitle = translations[idx];
      const showOriginal = koTitle !== it.title;
      return {
        pet,
        comment: commentForNews(it.title + ' ' + koTitle),
        body: `
          <div class="card-title">
            <a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(koTitle)}</a>
          </div>
          ${showOriginal ? `<div class="card-meta" style="font-style:italic; opacity:0.7;">📰 ${escapeHtml(it.title)}</div>` : ''}
          <div class="card-meta">BBC Business · ${tsStr}</div>
        `,
      };
    });
  } catch(e) { return []; }
}

          <div class="label-row"><span class="symbol">${m.emoji} ${m.sym}</span><span class="card-meta">${m.name}</span></div>
          <div class="big-value ${upDown}">$${price.toLocaleString('en-US', { maximumFractionDigits: price > 1 ? 2 : 4 })}</div>
          <div class="change ${upDown}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% (24h)</div>
        `,
      };
    });
  } catch(e) { return []; }
}

      { name: '원/유로',   sym: 'EUR/KRW', val: krw / data.rates.EUR,      emoji: '🇪🇺' },
      { name: '원/위안',   sym: 'CNY/KRW', val: krw / data.rates.CNY,      emoji: '🇨🇳' },
      { name: '원/파운드', sym: 'GBP/KRW', val: krw / data.rates.GBP,      emoji: '🇬🇧' },
      { name: '원/호달러', sym: 'AUD/KRW', val: krw / data.rates.AUD,      emoji: '🇦🇺' },
      { name: '원/캐달러', sym: 'CAD/KRW', val: krw / data.rates.CAD,      emoji: '🇨🇦' },
      { name: '원/스프랑', sym: 'CHF/KRW', val: krw / data.rates.CHF,      emoji: '🇨🇭' },
    ];
    return fxList.map(f => ({

    }));
  } catch(e) { return []; }
}

const WEATHER_CITIES = [
  { name: '서울', lat: 37.5665, lon: 126.9780, emoji: '🏙' },
  { name: '인천', lat: 37.4563, lon: 126.7052, emoji: '🛫' },
  { name: '대전', lat: 36.3504, lon: 127.3845, emoji: '🌳' },
  { name: '대구', lat: 35.8714, lon: 128.6014, emoji: '🍎' },
  { name: '광주', lat: 35.1595, lon: 126.8526, emoji: '🌸' },
  { name: '부산', lat: 35.1796, lon: 129.0756, emoji: '🌊' },
  { name: '울산', lat: 35.5384, lon: 129.3114, emoji: '🏭' },
  { name: '제주', lat: 33.4996, lon: 126.5312, emoji: '🌴' },
  { name: '강릉', lat: 37.7519, lon: 128.8761, emoji: '🌅' },
  { name: '춘천', lat: 37.8813, lon: 127.7300, emoji: '🏞' },
];

async function fetchWeather() {
  const items = [];
  for (const c of WEATHER_CITIES) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto`;
      const r = await fetch(url);
      const d = await r.json();
      const cur = d.current;
      if (!cur) continue;
      const code = cur.weather_code;
      const icon = weatherIconFromCode(code);
      const desc = weatherDescFromCode(code);
      const pet = petByAttr('풍') || randomPet();
      items.push({
        pet,
        comment: commentForWeather(cur.temperature_2m),
        body: `
          <div class="label-row"><span class="symbol">${c.emoji} ${c.name}</span><span class="card-meta">${desc}</span></div>
          <div class="weather-icon">${icon}</div>
          <div class="weather-temp">${Math.round(cur.temperature_2m)}°C</div>
          <div class="weather-detail"><span>💨 ${Math.round(cur.wind_speed_10m)}km/h</span><span>💧 ${Math.round(cur.relative_humidity_2m)}%</span></div>
        `,
      });
    } catch(e) {}
  }
  return items;
}

function weatherIconFromCode(c) {
  if (c === 0) return '☀️';
  if (c <= 3) return '⛅';
  if (c <= 48) return '🌫';
  if (c <= 57) return '🌦';
  if (c <= 67) return '🌧';
  if (c <= 77) return '❄️';
  if (c <= 82) return '🌧';
  if (c <= 86) return '🌨';
  if (c <= 99) return '⛈';
  return '🌤';
}
function weatherDescFromCode(c) {
  if (c === 0) return '맑음';
  if (c <= 3) return '구름조금';
  if (c <= 48) return '안개';
  if (c <= 57) return '이슬비';
  if (c <= 67) return '비';
  if (c <= 77) return '눈';
  if (c <= 82) return '소나기';
  if (c <= 86) return '눈보라';
  if (c <= 99) return '뇌우';
  return '날씨';
}

$('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  state.currentCat = tab.dataset.cat;
  renderTab();
});

$('refresh-btn').addEventListener('click', () => {
  updateDate();
  state.stockCache = {};
  renderTab();
});

$('stock-search-btn').addEventListener('click', () => {
  const q = $('stock-search').value.trim();
  if (!q) return;
  const found = searchStock(q);
  if (!found) {
    alert('종목을 찾을 수 없습니다. 회사명이나 티커를 정확히 입력해주세요.');
    return;
  }
  addStock(found.sym, found.market);
  $('stock-search').value = '';
});
$('stock-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('stock-search-btn').click();
});

// 차트 시간대 탭 클릭 (이벤트 위임)
document.addEventListener('click', e => {
  const tab = e.target.closest('.sc-chart-tab');
  if (!tab) return;
  const sym = tab.dataset.sym;
  const range = tab.dataset.range;
  state.chartRange[sym] = range;
  // 같은 카드의 다른 tabs 갱신
  document.querySelectorAll(`.sc-chart-tab[data-sym="${sym}"]`).forEach(t => {
    t.classList.toggle('active', t.dataset.range === range);
  });
  refreshChart(sym);
});

   초기화
════════════════════════════════════════════════ */
(async () => {
  updateDate();
  await loadPets();
  await renderTab();
  setInterval(updateDate, 60000);
})();
