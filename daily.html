<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 데일리 윈드 - wind01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --panel: #1a2332;
    --panel2: #232b3a;
    --border: #2a3344;
    --text: #e8ecf2;
    --text-muted: #8a96a8;
    --accent: #5acba8;
    --pink: #ff9ec7;
    --gold: #ffc640;
    --red: #ff5050;
    --green: #00d97e;
    --blue: #4da6ff;
    --purple: #c9a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
  }

  /* 헤더 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 16px;
    border-bottom: 1.5px solid var(--border);
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header h1 {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    margin: 0;
    background: linear-gradient(135deg, var(--pink), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .date {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .header .refresh-btn {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
  }
  .header .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 카테고리 탭 */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .tab {
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    transition: all .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--pink), var(--gold));
    color: #1a1f29;
    border-color: transparent;
  }

  /* 섹션 헤더 */
  .section-h {
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    margin: 24px 0 12px;
    padding-left: 12px;
    border-left: 4px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .section-h.recommend { border-left-color: var(--gold); }
  .section-h.warning { border-left-color: var(--red); }

  /* TradingView 위젯 컨테이너 */
  .tv-container {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .tv-container.full-chart {
    height: 500px;
  }
  .tv-container.market-overview {
    height: 600px;
  }
  .tv-container.ticker-tape {
    height: 50px;
  }
  .tv-container.market-movers {
    height: 500px;
  }
  .tv-container.symbol-info {
    height: 200px;
  }

  /* 외부 링크 버튼 */
  .ext-link-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .ext-link {
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  .ext-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* 차트 검색 박스 */
  .chart-search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .chart-search-box select {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .chart-search-box select:focus { outline: none; border-color: var(--accent); }
  .chart-search-box label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 700;
  }

  /* ════════════════════════════════════════
     추천 종목 카드 (우리가 직접)
  ════════════════════════════════════════ */
  .stock-card {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .stock-card.recommend {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(255,198,64,0.2);
  }
  .stock-card.warning {
    border-color: var(--red);
    box-shadow: 0 0 0 1px rgba(255,80,80,0.2);
  }

  .sc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 16px 20px 8px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .sc-info {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }
  .sc-emoji {
    font-size: 36px;
    line-height: 1;
  }
  .sc-name-block { min-width: 0; }
  .sc-name {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: var(--text);
    font-weight: 800;
    line-height: 1.2;
  }
  .sc-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 700;
  }
  .sc-tag {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 800;
    margin-top: 4px;
    margin-right: 4px;
  }
  .sc-tag.buy {
    background: rgba(0,217,126,0.2);
    color: var(--green);
    border: 1px solid var(--green);
  }
  .sc-tag.watch {
    background: rgba(255,198,64,0.2);
    color: var(--gold);
    border: 1px solid var(--gold);
  }
  .sc-tag.caution {
    background: rgba(255,80,80,0.2);
    color: var(--red);
    border: 1px solid var(--red);
  }
  .sc-price {
    text-align: right;
  }
  .sc-price-now {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.1;
  }
  .sc-price-now.up { color: var(--green); }
  .sc-price-now.down { color: var(--red); }
  .sc-price-now.neutral { color: var(--text); }
  .sc-change {
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    font-weight: 700;
    margin-top: 2px;
  }
  .sc-change.up { color: var(--green); }
  .sc-change.down { color: var(--red); }

  .sc-period-compare {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
    gap: 1px;
    background: var(--border);
    margin: 0;
    padding: 1px;
  }
  .sc-period-item {
    background: var(--panel);
    padding: 8px 10px;
    text-align: center;
  }
  .sc-period-label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .sc-period-value {
    font-family: 'Jua', sans-serif;
    font-size: 13px;
    font-weight: 800;
  }
  .sc-period-value.up { color: var(--green); }
  .sc-period-value.down { color: var(--red); }
  .sc-period-value.neutral { color: var(--text); }

  .sc-recommend-reason {
    padding: 12px 20px;
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
    line-height: 1.5;
    background: var(--bg2);
  }
  .sc-warning-reason {
    color: var(--red);
  }

  .sc-pet-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 20px 14px;
    background: var(--panel);
    border-top: 1.5px solid var(--border);
  }
  .sc-pet-img {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(2px 3px 5px rgba(0,0,0,0.4));
    animation: petBob 3s ease-in-out infinite;
  }
  @keyframes petBob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-3px) rotate(3deg); }
  }
  .sc-pet-comment {
    flex: 1;
    min-width: 0;
    background: var(--panel2);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
    color: var(--text);
    font-weight: 700;
  }
  .sc-pet-comment::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 12px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 6px solid var(--panel2);
  }

  /* 추천 종목 그리드 */
  .recommend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 14px;
  }

  /* ════════════════════════════════════════
     비주식 카드
  ════════════════════════════════════════ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }
  .mini-card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg2) 100%);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    position: relative;
    overflow: hidden;
    transition: all .2s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 180px;
  }
  .mini-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .pet-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 6px 0;
    margin-top: auto;
  }
  .pet-img {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(2px 3px 5px rgba(0,0,0,0.4));
    animation: petBob 3s ease-in-out infinite;
  }
  .pet-comment {
    flex: 1;
    min-width: 0;
    background: var(--panel2);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
    font-weight: 700;
  }
  .card-title {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.4;
    color: var(--text);
  }
  .card-title a:hover { color: var(--accent); }
  .card-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .big-value {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    font-weight: 800;
    margin: 4px 0;
  }
  .big-value.up { color: var(--green); }
  .big-value.down { color: var(--red); }
  .big-value.neutral { color: var(--text); }
  .change {
    font-family: 'Jua', sans-serif;
    font-size: 13px;
    font-weight: 800;
  }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .symbol {
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    color: var(--accent);
    font-weight: 800;
  }
  .weather-icon {
    font-size: 42px;
    text-align: center;
    margin: 4px 0;
  }
  .weather-temp {
    font-family: 'Jua', sans-serif;
    font-size: 32px;
    text-align: center;
    color: var(--gold);
    font-weight: 800;
  }
  .weather-detail {
    display: flex;
    justify-content: space-around;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 700;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .footer {
    margin-top: 30px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.7;
    padding: 20px;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .recommend-grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 22px; }
    .tv-container.full-chart { height: 400px; }
    .tv-container.market-overview { height: 500px; }
    .tv-container.market-movers { height: 400px; }
  }
</style>
<script src="nav.js"></script>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <h1>📊 데일리 윈드</h1>
      <div class="date" id="today-date"></div>
    </div>
    <button class="refresh-btn" id="refresh-btn">🔄 새로고침</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="us-stock">📈 미국주식</button>
    <button class="tab" data-cat="kr-stock">📊 한국주식</button>
    <button class="tab" data-cat="recommend">⭐ 추천종목</button>
    <button class="tab" data-cat="k-news">📰 한국경제</button>
    <button class="tab" data-cat="news">📰 해외경제</button>
    <button class="tab" data-cat="crypto">🪙 코인</button>
    <button class="tab" data-cat="fx">💱 환율</button>
    <button class="tab" data-cat="weather">🌤 날씨</button>
  </div>

  <!-- 메인 컨테이너 -->
  <div id="main-container">
    <div class="loading">불러오는 중...</div>
  </div>

  <div class="footer">
    차트: TradingView · 추천종목 분석: Yahoo Finance · 코인: CoinGecko · 환율: ExchangeRate-API · 날씨: Open-Meteo · 뉴스: BBC, Google News<br>
    펫 마스코트가 시세에 따라 코멘트 합니다 🐾
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   상태
════════════════════════════════════════════════ */
const state = {
  petData: [],
  currentCat: 'us-stock',
};

const $ = id => document.getElementById(id);

/* ════════════════════════════════════════════════
   날짜
════════════════════════════════════════════════ */
function updateDate() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  $('today-date').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]}) ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')} 기준`;
}

/* ════════════════════════════════════════════════
   펫 데이터
════════════════════════════════════════════════ */
async function loadPets() {
  try {
    const r = await fetch('pet_info_data.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data)) state.petData = data;
    }
  } catch(e) {}
}
function randomPet(filter) {
  let pool = state.petData;
  if (filter) pool = pool.filter(filter);
  if (pool.length === 0) pool = state.petData;
  return pool[Math.floor(Math.random() * pool.length)];
}
function petByAttr(attr) {
  return randomPet(p => (p.attr || {})[attr] >= 5);
}

/* ════════════════════════════════════════════════
   유틸
════════════════════════════════════════════════ */
function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function commentForChange(pct, type) {
  if (pct === null || pct === undefined || isNaN(pct)) {
    return randPick(['오늘은 어떨까~?', '두근두근...']);
  }
  if (type === 'fx') {
    if (pct > 1) return randPick(['헉 환율 많이 올랐어 😱', '달러 비싸지고 있어!']);
    if (pct < -1) return randPick(['환율 뚝! 😎', '원화 강세!']);
    return randPick(['평온~ 😌', '오늘은 무난해']);
  }
  if (type === 'crypto') {
    if (pct > 10) return randPick(['🚀🚀🚀 떡상이다!!', '와우 폭등!!']);
    if (pct > 3) return randPick(['오 좋아 좋아 📈', '오늘 좋네!']);
    if (pct > 0) return randPick(['살짝 상승 중~']);
    if (pct > -3) return randPick(['살짝 빠졌어']);
    if (pct > -10) return randPick(['음... 떨어지고 있어']);
    return randPick(['💀 폭락이다!!']);
  }
  if (type === 'stock') {
    if (pct > 5) return randPick(['🔥 활활 타오르네!', '주가 떡상!', '오늘 대박!']);
    if (pct > 1) return randPick(['오 상승세 좋아!', '주주분들 축하~ 🎉']);
    if (pct > 0) return randPick(['살짝 올랐어', '소소하게 상승~']);
    if (pct > -1) return randPick(['보합권이네']);
    if (pct > -5) return randPick(['음 하락세 ㅠ', '오늘은 빨간날']);
    return randPick(['😱 폭락이야!!', '존버모드 ON']);
  }
  return '음...';
}

function commentForNews(title) {
  const t = (title || '').toLowerCase();
  const keywords = [
    { keys: ['금리', '인플레', 'rate', 'fed', '연준'], comments: ['💸 돈 얘기다~', '경제 어려워 ㅠ'] },
    { keys: ['ai', '인공지능', 'gpt'], comments: ['🤖 또 AI 얘기?!', 'AI 시대 빠르다'] },
    { keys: ['삼성', 'samsung', 'apple', 'tesla', '테슬라'], comments: ['📱 기업 소식이야', '주목!'] },
    { keys: ['주가', '주식', 'stock', 'market'], comments: ['📊 시장 얘기다', '체크!'] },
    { keys: ['반도체', 'chip', 'semiconductor'], comments: ['💾 반도체 시장!', 'K-반도체 화이팅'] },
    { keys: ['실적', 'earnings'], comments: ['📈 실적 발표!', '결과 어떨까?'] },
    { keys: ['전쟁', 'war'], comments: ['🥺 무서운 소식', '평화가 빨리 왔으면'] },
  ];
  for (const k of keywords) {
    if (k.keys.some(kw => t.includes(kw))) return randPick(k.comments);
  }
  return randPick(['📰 오늘의 경제 소식!', '한 번 읽어봐!', '체크!']);
}

function commentForWeather(temp) {
  const t = Math.round(temp);
  if (t >= 30) return randPick(['🥵 너무 더워!', '에어컨 가즈아']);
  if (t >= 25) return randPick(['살짝 더운 날씨', '얇게 입자!']);
  if (t >= 20) return randPick(['딱 좋은 날씨~', '산책하기 좋아']);
  if (t >= 15) return randPick(['살짝 쌀쌀해', '얇은 겉옷 추천']);
  if (t >= 10) return randPick(['🍁 가을느낌', '겉옷 챙겨!']);
  if (t >= 5) return randPick(['🥶 춥다 추워']);
  if (t >= 0) return randPick(['❄️ 본격 겨울']);
  return randPick(['🥶 한파야 한파!']);
}

function fmtPrice(v, isKR, isIndex) {
  if (v === undefined || v === null || isNaN(v)) return '-';
  if (isKR && !isIndex) return v.toLocaleString('ko-KR');
  if (isKR) return v.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
  if (isIndex) return v.toLocaleString('en-US', { maximumFractionDigits: 2 });
  return v.toFixed(2);
}
function isKRSym(sym) {
  return sym.endsWith('.KS') || sym.endsWith('.KQ');
}

async function fetchStockSummary(symbol) {
  try {
    const url = `https://corsproxy.io/?${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1y`)}`;
    const r = await fetch(url);
    if (!r.ok) return null;
    const data = await r.json();
    const result = data?.chart?.result?.[0];
    if (!result) return null;
    const meta = result.meta;
    const close = meta.regularMarketPrice;
    const prevClose = meta.chartPreviousClose;
    const ts = result.timestamp || [];
    const closes = result.indicators?.quote?.[0]?.close || [];
    const points = [];
    for (let i = 0; i < closes.length; i++) {
      if (closes[i] != null) points.push({ t: ts[i] * 1000, c: closes[i] });
    }
    if (points.length === 0) return null;
    const last = points[points.length - 1];
    const idxAt = (daysBack) => {
      const targetTs = last.t - daysBack * 86400000;
      let best = points[0];
      for (const p of points) {
        if (p.t <= targetTs) best = p;
        else break;
      }
      return best;
    };
    const yesterday = points.length >= 2 ? points[points.length - 2] : null;
    const wAgo = idxAt(7);
    const mAgo = idxAt(30);
    const m3Ago = idxAt(90);
    const yAgo = idxAt(365);
    const calcPct = (then) => then ? ((close - then.c) / then.c) * 100 : null;
    return {
      close,
      yesterday: yesterday ? yesterday.c : null,
      pctDay:  calcPct(yesterday),
      pctWeek: calcPct(wAgo),
      pctMonth: calcPct(mAgo),
      pct3Month: calcPct(m3Ago),
      pctYear: calcPct(yAgo),
    };
  } catch(e) { return null; }
}

async function renderRecommendations(cont) {
  cont.innerHTML = '<div class="loading">시장 분석 중... (1분 소요)</div>';

  const results = [];
  for (const t of RECOMMEND_TARGETS) {
    const summary = await fetchStockSummary(t.sym);
    if (!summary || summary.pctDay === null) continue;
    results.push({ ...t, ...summary });
  }

  if (results.length === 0) {
    cont.innerHTML = `
      <div class="loading">
        시장 데이터를 가져올 수 없습니다 ㅠㅠ<br>
        <small>장 마감 후 또는 API 일시 차단일 수 있어요. 잠시 후 다시 시도해보세요.</small>
      </div>
    `;
    return;
  }

  const sortedDesc = [...results].sort((a, b) => b.pctDay - a.pctDay);
  const topGainers = sortedDesc.slice(0, 5);
  const topLosers = sortedDesc.slice(-5).reverse();

  let html = `
    <div class="section-h recommend">🔥 오늘의 강력 추천 종목 (상승 TOP 5)</div>
    <div class="recommend-grid">
  `;
  topGainers.forEach(t => {
    const tag = t.pctDay > 5 ? 'buy' : 'watch';
    const reason = t.pctDay > 5
      ? `🔥 오늘 ${t.pctDay.toFixed(2)}% 상승! 강력한 모멘텀이 보여요.`
      : `👀 오늘 ${t.pctDay.toFixed(2)}% 상승. 추가 상승 가능성 있음.`;
    html += renderRecommendCard(t, { tag, reason });

  html += '</div>';

  topLosers.forEach(t => {

                : options.tag === 'caution' ? '⚠️ 주의'
                : '👀 관심 종목';
  const cardClass = (options.tag === 'buy' || options.tag === 'watch') ? 'recommend' : 'warning';

  return `
    <div class="stock-card ${cardClass}">
      <div class="sc-header">
        <div class="sc-info">
          <span class="sc-emoji">${t.emoji}</span>
          <div class="sc-name-block">
            <div class="sc-name">${escapeHtml(t.name)}</div>
            <div class="sc-sub">${t.sym.replace('.KS','').replace('.KQ','')} · ${t.market === 'us' ? '미국' : '한국'}</div>
            <span class="sc-tag ${tagClass}">${tagText}</span>
          </div>
        </div>
        <div class="sc-price">
          <div class="sc-price-now ${upDown}">${priceStr}</div>
          <div class="sc-change ${upDown}">${arrow} ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% (${diffStr})</div>
        </div>
      </div>

      <div class="sc-period-compare">
        ${periodItem('전일', t.pctDay)}
        ${periodItem('1주', t.pctWeek)}
        ${periodItem('1개월', t.pctMonth)}
        ${periodItem('3개월', t.pct3Month)}
        ${periodItem('1년', t.pctYear)}
      </div>

      <div class="sc-recommend-reason ${cardClass === 'warning' ? 'sc-warning-reason' : ''}">${escapeHtml(options.reason)}</div>

      <div class="sc-pet-row">
        ${pet ? `<img class="sc-pet-img" src="${pet.image}" alt="" onerror="this.style.visibility='hidden'">` : ''}
        <div class="sc-pet-comment">${escapeHtml(comment)}</div>
      </div>
    </div>
  `;
}

function periodItem(label, pct) {
  if (pct === null || pct === undefined || isNaN(pct)) {
    return `<div class="sc-period-item"><div class="sc-period-label">${label}</div><div class="sc-period-value neutral">-</div></div>`;
  }
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'neutral';
  const sign = pct >= 0 ? '+' : '';
  return `<div class="sc-period-item"><div class="sc-period-label">${label}</div><div class="sc-period-value ${cls}">${sign}${pct.toFixed(2)}%</div></div>`;
}

/* ════════════════════════════════════════════════

════════════════════════════════════════════════ */
function renderMiniCard(c) {
  const pet = c.pet;
  const petImg = pet ? `<img class="pet-img" src="${pet.image}" alt="" onerror="this.style.visibility='hidden'">` : '';
  return `
    <div class="mini-card">
      ${c.body}
      <div class="pet-row">
        ${petImg}
        <div class="pet-comment">${escapeHtml(c.comment)}</div>
      </div>
    </div>
  `;
}

async function renderKNews(cont) {
  cont.innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const rss = encodeURIComponent('https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko');
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${rss}`;
    const r = await fetch(url);
    const data = await r.json();
    const items = (data.items || []).slice(0, 16);
    const html = items.map(it => {
      const pet = petByAttr('화') || randomPet();
      const ts = it.pubDate ? new Date(it.pubDate) : null;
      const tsStr = ts ? `${ts.getMonth()+1}/${ts.getDate()} ${ts.getHours()}:${String(ts.getMinutes()).padStart(2,'0')}` : '';
      return renderMiniCard({
        pet,
        comment: commentForNews(it.title),
        body: `
          <div class="card-title"><a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a></div>
          <div class="card-meta">${escapeHtml((it.author||'').slice(0,30))} · ${tsStr}</div>
        `,
      });
    }).join('');
    cont.innerHTML = `<div class="grid">${html}</div>`;
  } catch(e) {
    cont.innerHTML = '<div class="loading">뉴스를 불러올 수 없습니다.</div>';
  }
}

async function translateToKr(text) {
  if (!text) return '';
  try {
    const trimmed = text.length > 500 ? text.slice(0, 500) : text;
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(trimmed)}&langpair=en|ko`;
    const r = await fetch(url);
    const data = await r.json();
    if (data.responseData && data.responseData.translatedText) {
      return data.responseData.translatedText;
    }
  } catch(e) {}
  return text;
}

async function renderWorldNews(cont) {
  cont.innerHTML = '<div class="loading">번역 중...</div>';
  try {
    const rss = encodeURIComponent('http://feeds.bbci.co.uk/news/business/rss.xml');
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${rss}`;
    const r = await fetch(url);
    const data = await r.json();
    const items = (data.items || []).slice(0, 16);
    const translations = await Promise.all(items.map(it => translateToKr(it.title)));
    const html = items.map((it, idx) => {
      const pet = petByAttr('풍') || randomPet();
      const ts = it.pubDate ? new Date(it.pubDate) : null;
      const tsStr = ts ? `${ts.getMonth()+1}/${ts.getDate()} ${ts.getHours()}:${String(ts.getMinutes()).padStart(2,'0')}` : '';
      const koTitle = translations[idx];
      const showOriginal = koTitle !== it.title;
      return renderMiniCard({
        pet,
        comment: commentForNews(it.title + ' ' + koTitle),
        body: `
          <div class="card-title"><a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(koTitle)}</a></div>
          ${showOriginal ? `<div class="card-meta" style="font-style:italic; opacity:0.7;">📰 ${escapeHtml(it.title)}</div>` : ''}
          <div class="card-meta">BBC Business · ${tsStr}</div>
        `,
      });
    }).join('');
    cont.innerHTML = `<div class="grid">${html}</div>`;
  } catch(e) {
    cont.innerHTML = '<div class="loading">뉴스를 불러올 수 없습니다.</div>';
  }
}

function weatherIconFromCode(c) {
  if (c === 0) return '☀️';
  if (c <= 3) return '⛅';
  if (c <= 48) return '🌫';
  if (c <= 57) return '🌦';
  if (c <= 67) return '🌧';
  if (c <= 77) return '❄️';
  if (c <= 82) return '🌧';
  if (c <= 86) return '🌨';
  if (c <= 99) return '⛈';
  return '🌤';
}
function weatherDescFromCode(c) {
  if (c === 0) return '맑음';
  if (c <= 3) return '구름조금';
  if (c <= 48) return '안개';
  if (c <= 57) return '이슬비';
  if (c <= 67) return '비';
  if (c <= 77) return '눈';
  if (c <= 82) return '소나기';
  if (c <= 86) return '눈보라';
  if (c <= 99) return '뇌우';
  return '날씨';
}

async function renderWeather(cont) {
  cont.innerHTML = '<div class="loading">날씨 가져오는 중...</div>';
  const items = [];
  for (const c of WEATHER_CITIES) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto`;
      const r = await fetch(url);
      const d = await r.json();
      const cur = d.current;
      if (!cur) continue;
      const code = cur.weather_code;
      const icon = weatherIconFromCode(code);
      const desc = weatherDescFromCode(code);
      const pet = petByAttr('풍') || randomPet();
      items.push(renderMiniCard({
        pet,
        comment: commentForWeather(cur.temperature_2m),
        body: `
          <div class="label-row"><span class="symbol">${c.emoji} ${c.name}</span><span class="card-meta">${desc}</span></div>
          <div class="weather-icon">${icon}</div>
          <div class="weather-temp">${Math.round(cur.temperature_2m)}°C</div>
          <div class="weather-detail"><span>💨 ${Math.round(cur.wind_speed_10m)}km/h</span><span>💧 ${Math.round(cur.relative_humidity_2m)}%</span></div>
        `,
      }));
    } catch(e) {}
  }
  cont.innerHTML = items.length ? `<div class="grid">${items.join('')}</div>` : '<div class="loading">날씨 정보 없음</div>';
}

  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  state.currentCat = tab.dataset.cat;
  renderTab();
});
